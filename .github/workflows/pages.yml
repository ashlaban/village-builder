name: Pages
# Publishes the game and its documents (VB-449). The page is built from src/ here, so the site does not depend on an index.html kept
# in the repository; the Markdown documents are rendered by the same Jekyll build that "Deploy from a branch" ran, so BACKLOG.html
# and QUESTIONS.html keep their addresses. docs/roadmap.html is made here by tools/roadmap.js from the backlog and its git history,
# so the checkout fetches the whole history. Needs Settings, Pages, Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The roadmap page, from the backlog and its history
        run: node tools/roadmap.js
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: The built page is in the site
        run: cmp index.html _site/index.html
      - name: The roadmap page is in the site
        run: cmp docs/roadmap.html _site/docs/roadmap.html
      - name: Check the rendered backlog and its filter
        run: node tests/backlog-page.js
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
