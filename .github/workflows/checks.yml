# The checks of a pull request, run apart from the session that wrote it (VB-266; docs/gates.md, rows 29 and 30).
# The `verify` job gates: `npm run verify` fails it on a hard check only (the build, lint, ownership, dependencies, backlog, determinism,
# golden file, saves, invariants, fixtures loading, the page's functional tests). Targets (cost, balance, demography, timing) print a
# `TARGET` line and never set an exit code; the ones out are written to the job summary. The `late-game` job makes the small late
# fixtures and runs tests/history.js: it reports and never fails.
name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # verify makes the small late fixtures it loads (a local cache keyed by the sources, VB-272); `shell: bash` sets pipefail,
      # which keeps verify's exit code through the tee.
      - run: node tests/run.js verify --verbose 2>&1 | tee verify.log
        shell: bash
      - name: Targets out
        if: always()
        run: |
          {
            echo '## Targets out'
            echo
            echo 'Targets report; they never fail the job (docs/gates.md). Name, measured, target, residual.'
            echo
            echo '```'
            grep '^TARGET .* out$' verify.log || echo 'none'
            echo '```'
            tail -n 1 verify.log
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
  late-game:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Reports, never fails: every step may fail without failing the job, and the summary lists the targets out.
      - run: node tools/fixtures.js make-missing small-y5 small-y40
        continue-on-error: true
      - run: node tools/fixtures.js status
        continue-on-error: true
      - run: node tests/fixtures.js 2>&1 | tee late.log
        shell: bash
        continue-on-error: true
      - run: node tests/history.js 2>&1 | tee -a late.log
        shell: bash
        continue-on-error: true
      - name: Late-game targets
        if: always()
        run: |
          {
            echo '## Late game (reported, never failing)'
            echo
            echo '```'
            grep '^TARGET ' late.log || echo 'no targets recorded'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
