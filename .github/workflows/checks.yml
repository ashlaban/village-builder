name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  verify:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The fast job already ran FAST. Local npm run verify includes both tiers. No browser: the page's checks run nightly.
      - run: node tests/run.js integration --verbose 2>&1 | tee verify.log
        shell: bash
      - name: Results and advisory targets
        if: always()
        run: |
          {
            echo '## Integration results'
            echo '```'
            tail -n 2 verify.log
            grep '^TARGET .* out$' verify.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
