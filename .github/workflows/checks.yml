# The checks of a pull request, run apart from the session that wrote it: `npm run verify`, which makes the two small late fixtures
# it loads (VB-272: a local cache keyed by the sources; about 2 minutes, beside the other scripts).
name: Checks
# Kim, 10 November 2026: no hard gates in this phase of development. The workflow no longer runs on pull requests or on main; it runs
# when started by hand (Actions, Checks, Run workflow), and its results are read as targets and their residuals, not as a gate.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/run.js verify --list
