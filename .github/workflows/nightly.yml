name: Extended checks
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false
jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run nightly 2>&1 | tee nightly.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-results
          path: |
            nightly.log
            docs/bench/*.jsonl
            docs/bench/*.md
