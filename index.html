<script>
// @sys sim/farmclaims: claims on empty farms (VB-033): the old family's birthright, who may claim a farm in the order of the village's
// "Claims on empty farms" custom, the claim at the moving round, the restoration, and the claimants moving in
VB['sim/farmclaims'] = (() => {
  const issue = (st, cmd) => VB['sim/commands'].issue(st, cmd); // sim/commands loads after this module
  const { YEAR, CLAIMS } = VB['sim/rules'];
  const { hexSteps } = VB['sim/hex'];
  const { spouseOf, childrenOf, isHolder, kinDegree, practice, settlementIdOf, log, fullName, personEvent, atFarm,
    atHousehold, wishOf } = VB['sim/records'];
  const CL = VB['sim/claims'];
  const { dailyNeed } = VB['sim/hunger'], { reserved } = VB['sim/stores'];
  const { hasPlot, awaitsCottage } = VB['sim/expansion'];
  // @state farmstead.claim: {by (pawn id), since (game hours), hours (to restore, by the condition when claimed), done (hours worked)} or
  //   null: an empty farm a landless adult has claimed and is restoring; the claimant's unrealised claim (`why` 'farm') stands on its house
  // ---- the birthright (bördsrätt; Kim, 1 Nov): when a farm empties, its last holder's family keeps a realised claim on its house ----
  const PAWN = (id) => ({ type: 'pawn', id });
  // Farm f has emptied (at `since`, game hours) after `holder` held it: a realised birthright claim by that pawn on its house, until
  // CLAIMS.birthrightYears after; none once that has passed (a scenario's farm empty longer).
  function birthright(st, f, holder, since = st.t) {
    const until = since + CLAIMS.birthrightYears * YEAR;
    if (holder === null || holder === undefined || until <= st.t) return null;
    return CL.addClaim(st, f.house, PAWN(holder), 'birthright', { state: 'realised', until });
  }
  // The birthright standing on farm f, or null.
  const birthrightOn = (st, f) => CL.claimsOn(st, f.house).find((c) => c.why === 'birthright') || null;
  // ---- restoration (Kim, 30 Oct): hours along straight lines through 0 h at condition 1, 20 h at 0.4, 60 h at 0.15 and 120 h at 0 ----
  const CURVE = [[1, 0], [0.4, 20], [0.15, 60], [0, 120]];
  function restoreHours(c) {
    c = Math.max(0, Math.min(1, c));
    for (let k = 1; k < CURVE.length; k++) {
      const [c0, h0] = CURVE[k - 1], [c1, h1] = CURVE[k];
      if (c >= c1) return h0 + ((h1 - h0) * (c0 - c)) / (c0 - c1);
    }
    return CURVE[CURVE.length - 1][1];
  }
  // A farm that may be claimed: empty, and derelict rather than a ruin (below 15%; left out until the full rebuild, Kim 1 Nov), with no claim
  // under way.
  const claimable = (f) => f.household === null && f.state === 'derelict' && !f.claim;
  // ---- who may claim, and in what order ----
  const landed = (st, id) => { const sp = spouseOf(st, id); return isHolder(st, id) || (sp !== null && isHolder(st, sp)); };
  const guardian = (st, id) => st.liveHouseholds.some((hid) => st.households[hid].guardian === id);
  // A pawn of `ids` (st.demand: landless adults who want out) who may claim a farm at all: alive and grown, with no farm, no claim under way,
  // no plot coming (sim/expansion) and no ward to keep.
  // barred says which of these stands in the way, or null.
  const barred = (st, id) => {
    const p = st.pawns[id];
    return !p.alive || p.age < 18 ? 'under 18' : p.household === null ? 'has no home' : landed(st, id) ? 'holds a farm, or is married to its holder'
      : claimOf(st, id) ? 'restoring a farm it claimed' : hasPlot(st, id) || awaitsCottage(st, id) ? 'has a plot coming' : guardian(st, id) ? 'keeps a ward'
        : null;
  };
  const free = (st, id) => barred(st, id) === null;
  // The farm whose claim pawn id, or their spouse, has under way, or null.
  function claimOf(st, id) {
    const sp = spouseOf(st, id);
    return st.farmsteads.find((f) => f.claim && (f.claim.by === id || (sp !== null && f.claim.by === sp))) || null;
  }
  // The claimants of farm f among `ids`, best first, under its village's `claims` practice (a key of the custom):
  //   kin       while the old family's birthright stands, its kin first (any village within CLAIMS.farmReach), closest degree first; then the
  //             farm's own villagers; once it lapses, the villagers only
  //   villagers the farm's villagers, then those of villages within reach
  //   anyone    any landless adult of a village within reach
  //   assembly  the meeting assigns it to one of its own: most voice-weighted support through ties first (sim/claims, support)
  // Then married couples before singles, then the oldest. One of a married couple stands for both (the first of them).
  // Which farm a pawn would take is its own wish, any it may, and the player's stands in (st.player.wishes.claim, VB-212); the order is a rule.
  function claimants(st, f, ids = st.demand, rule = practice(st, f.village).claims) {
    const vid = f.village, centre = st.villages[vid].center, right = rule === 'kin' ? birthrightOn(st, f) : null;
    const home = (id) => settlementIdOf(st, st.pawns[id]);
    const near = (id) => home(id) === vid || hexSteps(st.w, st.villages[home(id)].center, centre) <= CLAIMS.farmReach;
    const degree = new Map();
    if (right) for (const id of ids) { const d = kinDegree(st, id, right.by.id); if (Number.isFinite(d)) degree.set(id, d); }
    const keep = (id) => {
      if (!free(st, id)) return false;
      const wish = wishOf(st, id, 'claim'); if (wish !== null && wish !== f.id) return false; // the player's: no farm, or only the one it names
      if (rule === 'kin') return home(id) === vid || (degree.has(id) && near(id));
      if (rule === 'assembly') return home(id) === vid;
      return near(id);
    };
    let list = ids.filter(keep);
    const cls = (id) => (rule === 'kin' ? (degree.has(id) ? 0 : 1) : rule === 'villagers' ? (home(id) === vid ? 0 : 1) : 0);
    const key = new Map();
    if (rule === 'kin') for (const id of list) key.set(id, degree.has(id) ? degree.get(id) : 0);
    if (rule === 'assembly') {
      const sup = CL.support(st, list.map((id) => ({ by: PAWN(id) })), vid);
      list.forEach((id, k) => key.set(id, -sup[k]));
    }
    const couple = (id) => { const sp = spouseOf(st, id); return sp !== null && st.pawns[sp].alive ? 0 : 1; };
    list.sort((a, b) => cls(a) - cls(b) || (key.get(a) || 0) - (key.get(b) || 0) || couple(a) - couple(b) || st.pawns[a].born - st.pawns[b].born
      || a - b);
    const seen = new Set();
    list = list.filter((id) => { const sp = spouseOf(st, id); if (seen.has(id)) return false; seen.add(id); if (sp !== null) seen.add(sp); return true; });
    return list;
  }
  // ---- the claim, at the moving round ----
  const HH = (id) => ({ type: 'household', id });
  // The claimant of farm f may still take it: alive, in a household, with no farm of their own meanwhile.
  const valid = (st, f) => { const p = st.pawns[f.claim.by]; return p.alive && p.household !== null && !landed(st, p.id) && f.household === null; };
  // Pawn id claims farm f: the claim, the claimant's unrealised claim on the house, renewed by the restoration (`worked`); no longer waiting
  // for land (st.demand; sim/heirs' wantsOut leaves claimants out).
  function startClaim(st, f, id) {
    const p = st.pawns[id], sp = spouseOf(st, id), right = birthrightOn(st, f), v = st.villages[f.village];
    f.claim = { by: id, since: st.t, hours: restoreHours(f.condition), done: 0 };
    CL.addClaim(st, f.house, PAWN(id), 'farm', { state: 'unrealised', until: null }); // the last holder's own birthright is taken up by it
    st.demand = st.demand.filter((q) => q !== id && q !== sp);
    const kin = right && Number.isFinite(kinDegree(st, id, right.by.id)) && practice(st, f.village).claims === 'kin';
    personEvent(st, id, 'claim', `Claimed the empty farm ${f.name} in ${v.name}${kin ? ' by birthright' : ''}`, false); // recorded below
    log(st, `${fullName(p)} claims the empty farm ${f.name} in ${v.name}${kin ? ', by the old family\'s birthright,' : ''} and sets about `
      + `mending it (${Math.round(f.claim.hours)} hours).`, { kind: 'claim', pawn: id, ...atFarm(f) });
  }
  // The claim ends unfulfilled (the claimant died or took land, or the claim lapsed): the farm stands empty, claimable again.
  function endClaim(st, f, text) {
    CL.dropClaim(st, f.house, PAWN(f.claim.by));
    f.claim = null;
    if (text) log(st, text, { kind: 'claimEnded', ...atFarm(f) });
  }
  const ended = (st, f) => {
    const p = st.pawns[f.claim.by];
    endClaim(st, f, p.alive ? `${fullName(p)} gives up the claim on ${f.name}, having land now.` : `The claim on ${f.name} died with ${fullName(p)}.`);
  };
  // At the moving round, after st.demand is counted and before plots are started (sim/expansion): each farm that may be claimed, in id order,
  // goes to its first claimant (claimants) who has not claimed another this round. Claims whose claimant died or took land end first.
  function claimFarms(st) {
    for (const f of st.farmsteads) if (f.claim && !valid(st, f)) ended(st, f);
    for (const f of st.farmsteads) {
      if (!claimable(f)) continue;
      const pick = claimants(st, f)[0];
      if (pick !== undefined) issue(st, { actor: pick, verb: 'claim', target: f.id, source: 'round' });
    }
  }
  // The farm pawn id may claim now, or null (sim/expansion clears a plot only for those with none).
  const claimableFarm = (st, id) => st.farmsteads.find((f) => claimable(f) && claimants(st, f, [id]).length > 0) || null;
  // ---- the restoration: one job, owned by the claimant's household; progress kept on the claim ----
  // The restoration jobs to post: [key, kind, owner, site, extra]. A claim no longer valid ends here. The key names the household, so a
  // claimant who moves house goes on with the hours done (kept on f.claim at each posting).
  function claimJobs(st) {
    const out = [];
    for (const f of st.farmsteads) {
      if (!f.claim) continue;
      if (!valid(st, f)) { ended(st, f); continue; }
      const c = f.claim, hid = st.pawns[c.by].household, key = `restore:f${f.id}.h${hid}`, live = st.jobs.get(key);
      if (live) c.done = live.done;
      out.push([key, 'restore', HH(hid), f.house, { farm: f, claim: { by: c.by, since: c.since }, done: c.done, hours: c.hours }]);
    }
    return out;
  }
  // Role priority (0..10) for a restoration job: the claimant and spouse CLAIMS.claimantPrio, the other grown members of the household
  // CLAIMS.helperPrio (Kim, 1 Nov; as for a plot).
  function claimPrio(st, p, j) {
    const by = j.claim.by;
    return p.id === by || p.id === spouseOf(st, by) ? CLAIMS.claimantPrio : p.role === 'child' ? 0 : CLAIMS.helperPrio;
  }
  // The job is still that claim's (it did not end meanwhile).
  const ofClaim = (j) => !!j.farm.claim && j.farm.claim.by === j.claim.by && j.farm.claim.since === j.claim.since;
  const workClaim = (st, j) => { if (ofClaim(j)) CL.renewClaim(st, j.farm.house, PAWN(j.claim.by)); };
  const restored = (st, j) => { if (ofClaim(j)) moveIn(st, j.farm); };
  // Once a day, after sim/claims' lapseClaims: a claim on a farm unworked for CLAIMS.years has lapsed; the farm is claimable again.
  function lapsedFarmClaims(st, dropped) {
    for (const [tile, c] of dropped) {
      if (c.why !== 'farm') continue;
      const f = st.farmsteads.find((x) => x.house === tile && x.claim && x.claim.by === c.by.id);
      if (f) { f.claim = null; log(st, `The claim on ${f.name} has lapsed: nobody mended it for ${CLAIMS.years} years.`, { kind: 'claimEnded', ...atFarm(f) });
        }
    }
  }
  // ---- moving in (the roof mended): a new household, as a new plot's (Kim, 1 Nov) ----
  const Stores = VB['sim/stores'];
  const rationsOf = (st, ids) => ids.reduce((s, id) => s + (st.pawns[id].age >= 14 ? st.ECON.ration.adult : st.ECON.ration.child), 0);
  // The claimants' grain: their stakes, made up to seed for the farm's fields and CLAIMS.farmFood days of their food from their old households'
  // grain above the seed and food (the holder's buffer) of those who stay, as far as it goes.
  function provisions(st, f, members) {
    const need = Math.ceil(CLAIMS.farmFood * rationsOf(st, members)) + f.fields.length * st.ECON.seedPerField;
    let have = members.reduce((s, id) => s + (st.pawns[id].stake || 0), 0);
    for (const h of new Set(members.map((id) => st.pawns[id].household))) {
      if (have >= need) break;
      const hh = st.households[h], stay = hh.members.filter((m) => !members.includes(m));
      const keep = reserved(st, hh, 'grain') + st.pawns[hh.holder].buffer * rationsOf(st, stay);
      const give = Math.min(need - have, Math.max(0, Math.floor(hh.grain - keep)));
      if (give > 0) { Stores.take(st, hh, 'grain', give, 'provisions'); have += give; }
    }
    for (const id of members) Stores.take(st, st.pawns[id], 'grain', st.pawns[id].stake || 0, 'provisions');
    return have;
  }
  // The claimant, their spouse and their minor children living with either move in: a new household holds the farm, its house, fields and
  // meadows, with the grain of `provisions`, the firewood and two days of cooked food of a founders household. The claim on the house and the
  // old family's birthright are spent.
  function moveIn(st, f) {
    if (!valid(st, f)) { ended(st, f); return; }
    const holder = st.pawns[f.claim.by], sp = spouseOf(st, holder.id), v = st.villages[f.village];
    const members = [holder.id];
    if (sp !== null && st.pawns[sp].alive) members.push(sp);
    const from = new Set(members.map((id) => st.pawns[id].household));
    for (const id of [...members]) for (const c of childrenOf(st, id)) {
      const q = st.pawns[c];
      if (q.alive && q.age < 18 && from.has(q.household) && !members.includes(c) && !isHolder(st, c)) members.push(c);
    }
    const years = Math.round((st.t - f.emptySince) / YEAR), grain = provisions(st, f, members);
    issue(st, { actor: holder.id, verb: 'foundHousehold', target: f.id, args: { members, grain }, source: 'restoration' });
    const hh = st.households[f.household];
    Stores.put(st, hh, 'meals', 2 * dailyNeed(st, hh), 'provisions');
    f.claim = null; f.condition = 1; f.emptySince = null;
    CL.clearClaims(st, f.house);
    st.demand = st.demand.filter((id) => !members.includes(id));
    personEvent(st, holder.id, 'moved', `Moved into ${f.name}, mended after ${years} years empty`, false); // recorded below
    log(st, `${fullName(holder)} moves into ${f.name} in ${v.name}, empty for ${years} years, with ${Math.round(grain)} rations of grain.`, {
      kind: 'moved', pawn: holder.id, ...atHousehold(st, hh) });
  }
  return { birthright, birthrightOn, restoreHours, claimable, startClaim, claimOf, claimants, claimFarms, claimableFarm, claimJobs, claimPrio, workClaim,
    restored,
    lapsedFarmClaims, moveIn, barred };
})();

<script>
// @sys sim/kinds: job kinds, one record each: hours, type of work, labels, where to stand, urgency, and what finishing and delivering do
VB['sim/kinds'] = (() => {
  const Stores = VB['sim/stores'];
  const { ROLES, WORK, cal } = VB['sim/rules'];
  const { log, atFarm } = VB['sim/records'];
  const { fellTree } = VB['sim/forest'];
  const { dailyNeed } = VB['sim/hunger'], { reserved } = Stores;
  const { finishClear, finishBreak, manureWanted, manureDone, hoed, sown, reaped, hauled, reclaimed, weeded } = VB['sim/fields'];
  const { finishMeadow, hayDay, hayWanted, meadowJobs, mowDone, hayIn } = VB['sim/meadows'];
  const { slaughterDone, saltDone, milkDone, fodderDone, byreJobs } = VB['sim/byre'];
  const { finishBoothStage, plotJobs, boothJob } = VB['sim/expansion'];
  const { renewClaim } = VB['sim/claims'];
  const { workClaim, restored, claimJobs } = VB['sim/farmclaims'];
  // A kind's fields:
  //   verb, go, back: what the pawn panel says while working, walking there and carrying home; name: the job in the settlers panel;
  //   label: the job in the line that says why a pawn is idle; anim: the page's work animation; hours: work hours to finish;
  //   hands: how many pawns may work one job at once (VB-102: field, land and threshing work takes the whole household);
  //   type: the type of work, which roles rank (ROLES in sim/rules); field: worked row by row across the tile, at `pace` map units an hour;
  //   inside: worked in the house; carry: what is carried home when the work is done, to the cottage door, the woodpile or the barn (`to`);
  //   spot(st, a, j): where on the site the pawn stands; urgency(st, j, c, U): the job's weight in a bid (U is MATCH.urgency; 1 without it);
  //   done(st, j, hh, c): what finishing the work does; deliver(st, j, hh, f): what arriving home with the load does;
  //   worked(st, j): what each step of work does besides the progress; project: true for a stage of a land project, whose job ends with
  //   the project (sim/jobs drops it, its hands freed, once it is no longer posted);
  //   available(st, holder, at, c, post, f): where the kind could be done now (VB-208); it calls post(key, site, extra) for each job it
  //   would post. holder is the household (or the village), at the field, farm or village asked about, f the household's farm. sim/jobs'
  //   refreshJobs asks the rules in the order of ASK, below. A rule shared by the kinds a module posts together names each job's kind,
  //   post(key, site, extra, kind), and the owner of a job not the household's, post(key, site, extra, kind, owner). A kind posted by two
  //   rules names its household's: clear and break, also a plot's steps, and the cottage's stages, also a plot's (plotWork).
  //   stages: a field kind's, the field stages at which it can be available; refreshJobs asks it only at a field in one of them.
  // The woodpile's goal this season, and the level under which a second hand cuts: the household's standing plan's targets (sim/plans).
  const woodTargets = (st, hh) => st.plans.households.get(hh.id).targets;
  const rowAngle = (j) => (j.farm ? j.farm.rowAngle : 0);
  // Several hands on one field start on different rows: the nth worker on row -12 + 6n, five rows across the tile.
  const firstRow = (j, a) => -12 + 6 * (Math.max(0, j.claims.indexOf(a.id)) % 5);
  // The start of the pawn's first row on a field tile.
  function onField(st, a, j) {
    const w = st.w, th = rowAngle(j), row = firstRow(j, a);
    return [w.hx[j.site] - Math.cos(th) * 13 - Math.sin(th) * row, w.hy[j.site] - Math.sin(th) * 13 + Math.cos(th) * row];
  }

  const onProject = (j) => !!j.farm.project && j.farm.project.tile === j.site && j.farm.project.stage === j.kind;
  // Work on a land project renews the household's stake on its tile (sim/stakes).
  const workStake = (st, j) => { renewClaim(st, j.site, j.owner); };
  // By the byre door, left of the cottage (the page draws the byre there).
  const byreSpot = (st, a, j) => [st.w.hx[j.farm.house] - 20 + a.ox * 0.3, st.w.hy[j.farm.house] + 5 + a.oy * 0.2];
  const RECLAIM = { fallow: 10, scrub: 20 }; // hours to clear a field gone to grass or to scrub (Kim, 30 Oct)

  const sowing = (E, c) => c.season === 0 && c.sday >= E.sowWindow[0] && c.sday <= E.sowWindow[1];
  const fieldKey = (f, fd) => `f${f.id}.${fd.id}`;
  // The household has fewer meals than the coming meal needs, and grain to cook it from.
  const cookWanted = (st, hh, c) => hh.cookDay !== c.day && hh.meals < dailyNeed(st, hh) && hh.grain - reserved(st, hh, 'grain') > 0;
  // ---- the rules shared by the kinds a module posts together; each names its jobs' kinds ----
  // A meadow is raked in early spring and mown in the haymaking window while the household wants hay; its hay is carried in once dry
  // (sim/meadows). Asked at the farm: whether hay is wanted is the household's, once for all its meadows.
  function meadowWork(st, hh, f, c, post) {
    // whether hay is wanted, asked once, and only when a meadow could be raked or mown now (VB-227)
    let hayW = null;
    const want = () => (hayW === null ? (hayW = hayWanted(st, f, hh)) : hayW);
    for (const m of f.meadows) for (const [key, kind] of meadowJobs(f, m, c, want)) post(key, m.tile, { meadow: m, farm: f }, kind);
  }
  // The byre's work at the cottage, for a household with herds or meat in its larder: fodder, slaughter, salting, milking (sim/byre).
  function byreWork(st, hh, f, c, post) {
    if (hh.herds.length || hh.larder.length) for (const [key, kind, extra] of byreJobs(st, hh, c)) post(key, f.house, { farm: f, ...extra }, kind);
  }
  // The farm's land project, a new field or meadow, at its present stage (clear, break, meadow) on its tile (sim/fields, sim/meadows).
  function landProject(st, hh, f, c, post) {
    if (f.project) post(`${f.project.stage}:f${f.id}`, f.project.tile, { farm: f, hours: f.project.hours }, f.project.stage);

  function boothWork(st, hh, f, c, post) {
    const bj = boothJob(st, f); if (bj) post(bj[0], f.house, bj[2], bj[1]);

  // Asked once for the island, not per village: the open step of each tile of every active plot, then each building plot's cottage stage,
  // owned by the plot's village (sim/expansion).
  function plotWork(st, holder, at, c, post) {
    for (const [key, kind, site, extra] of plotJobs(st)) post(key, site, extra, kind, { type: 'village', id: extra.plot.village });

  function claimWork(st, holder, at, c, post) {

  const inWindow = (st, j, c, U) => U.field + c.sday / U.fieldPerDay;
  const KINDS = {

      hands: 1, type: 'household', carry: 'buckets', to: 'door',
      spot: (st, a, j) => {

        return st.villages[j.farm.village].well ? [w.hx[j.site] - 10 + a.ox * 0.2, w.hy[j.site] + 8] : [w.hx[j.site] - 1, w.hy[j.site] + 4];

      deliver: (st, j, hh) => { hh.waterDay = cal(st.t).day; },
      // once a day, from the hour before work until its end, at the village well if it has one, else by the house
      available: (st, hh, f, c, post) => {

    cook: {
      verb: 'Cooking at the hearth', go: 'Going home to cook', name: 'Cook', label: 'Cook', anim: null, hours: 2, hands: 1, type: 'household',
      inside: true,
      urgency: (st, j, c, U) => (c.hour >= U.cookEveningHour ? U.cookEvening : U.cook),

      done: (st, j, hh, c) => {

      available: (st, hh, f, c, post) => {

      // a growing field whose weeding is open (sim/fields)

        for (const s of at.fence) if (s.cond < E.fenceMendBelow) post(`mend:v${at.id}.${s.id}`, s.tile, { stretch: s }, 'mend', { type: 'village', id: at.id });
      },
    },
  };
  // A job is open while it has work left and fewer workers than hands; a carried job whose work is done waits for its carrier.
  const isOpen = (j) => j.claims.length < KINDS[j.kind].hands && j.done < (j.hours ?? KINDS[j.kind].hours);
  // Each role's rank of every kind: its exception for the kind, else its rank of the kind's type of work, else 0.
  for (const r of Object.values(ROLES)) r.prio = Object.fromEntries(Object.entries(KINDS).map(([k, K]) => [k, r.except[k] ?? r.work[K.type] ?? 0]));
  // Where refreshJobs (sim/jobs) asks, in this order: for each occupied farm in turn, at each of its fields (field), at the farm (farm),
  // and at the farm again after the household's plans for land (farmAfterPlans); then at each village (village), then once for the island
  // (island). An entry is [kind, rule]: a kind's own rule posts that kind; a shared rule (kind null) names its jobs' kinds. A job's id is its
  // posting order and matching visits jobs by id, so this order is part of the behaviour: two jobs new in the same hour keep their order.
  // fieldAt: the field's rules by the field's stage (each kind's `stages`), in the order of `field`; refreshJobs asks only those.
  const rule = (k) => (typeof k === 'string' ? [k, KINDS[k].available] : [null, k]);
  const ASK = {
    field: ['plow', 'sow', 'weed', 'reap', 'haul', 'reclaim'].map(rule),
    farm: [meadowWork, 'manure', byreWork].map(rule),
    farmAfterPlans: [landProject, boothWork, 'wood', 'thresh', 'water', 'cook', 'mend'].map(rule),
    village: ['mend'].map(rule),
    island: [plotWork, claimWork].map(rule),
    fieldAt: {},
  };
  for (const e of ASK.field) for (const g of KINDS[e[0]].stages) (ASK.fieldAt[g] ||= []).push(e);
  return { KINDS, ASK, cookWanted, rowAngle, firstRow, isOpen };
})();

    serve: {
      check: (st, c) => living(st, c.actor) || (!home(st, c.target) ? `there is no household ${c.target}`
        : st.pawns[c.actor].household === c.target ? `pawn ${c.actor} lives there already` : null),
      run: (st, c) => later('sim/service').enterService(st, c.actor, c.target),
    },
    // claim(target): the actor claims the empty farm `target` and sets about restoring it
    claim: {
      check: (st, c) => living(st, c.actor) || (!st.farmsteads[c.target] ? `there is no farm ${c.target}`
        : !later('sim/farmclaims').claimable(st.farmsteads[c.target]) ? `farm ${c.target} cannot be claimed` : null),
      run: (st, c) => later('sim/farmclaims').startClaim(st, st.farmsteads[c.target], c.actor),
    },
    // leave({from, party: {all, followers}, house, field, village | wood}): the actor's party leaves village `from` to settle at `house` with
    // its first `field`: in the small village `village` if given, else founding a new one with woodlot `wood`; provisions as the round reckons them
    leave: {
      check: (st, c) => {
        const a = c.args || {}, S = later('sim/settle');
        if (!st.villages[a.from]) return `there is no village ${a.from}`;
        if (!a.party || !Array.isArray(a.party.all) || a.party.all[0] !== c.actor) return 'the party must be led by the actor';
        for (const id of a.party.all) { const dead = living(st, id); if (dead) return dead; }
        if (![a.house, a.field].every((t) => Number.isInteger(t) && t >= 0 && t < st.w.N)) return 'the house and field must be tiles';
        if (a.village !== undefined && !st.villages[a.village]) return `there is no village ${a.village}`;
        return S.provisions(st, a.party.all) ? null : 'the family cannot spare the grain';
      },
      run: (st, c) => {
        const a = c.args, S = later('sim/settle'), home = st.villages[a.from], party = { all: a.party.all, followers: a.party.followers || [] };
        const prov = S.provisions(st, party.all);
        if (a.village !== undefined) S.settleFarm(st, st.villages[a.village], home, party, a.house, a.field, prov);
        else S.found(st, home, st.pawns[c.actor], party, { house: a.house, field: a.field, wood: a.wood }, prov);
      },
    },
    // A restored farm gains its household; construction keeps plot/farm-specific steps in their owners.
    foundHousehold: {
      check: (st, c) => {
        const f = st.farmsteads[c.target], a = c.args || {};
        if (!f || f.household !== null) return 'there is no empty farm';
        if (!Array.isArray(a.members) || !a.members.includes(c.actor) || new Set(a.members).size !== a.members.length) {
          return 'the household must include its holder and unique members';
        }
        for (const id of a.members) { const dead = living(st, id); if (dead) return dead; }
        return Number.isFinite(a.grain) && a.grain >= 0 ? null : 'invalid provisions';
      },
      run: (st, c) => later('sim/membership').foundHousehold(st, st.farmsteads[c.target], c.args.members, c.actor, { grain: c.args.grain }),
    },
    finishCottage: {
      check: (st, c) => {
        const v = st.villages[c.args && c.args.village], plot = v && v.plots[c.target];
        return plot && plot.cottage && plot.cottage.i >= 3 && !plot.built ? null : 'there is no finished cottage';
      },
      run: (st, c) => later('sim/cottage').finishCottage(st, st.villages[c.args.village].plots[c.target]),
    },
    // ---- debug actions (source 'debug') ----
    kill: { check: (st, c) => living(st, c.actor), run: (st, c) => later('sim/lifecycle').killPawn(st, c.actor, 'killed') },
    // retire: a holder hands the farm to the first heir
    retire: {
      check: (st, c) => {
        const dead = living(st, c.actor); if (dead) return dead;
        const hh = holdingOf(st, c.actor);
        return !hh || hh.dissolved ? `pawn ${c.actor} holds no farm` : !later('sim/heirs').heirRanking(st, hh).length ? 'the farm has no heir' : null;
      },
      run: (st, c) => later('sim/lifecycle').retireHolder(st, holdingOf(st, c.actor).id),
    },
    // argue({dim, option}): the pawn takes up the cause for ten years (the debug's, and the player's for its pawn: VB-211); it replaces any cause held
    argue: {
      check: (st, c) => living(st, c.actor) || option(c),
      run: (st, c) => {
        const d = Culture.DIMS[c.args.dim];
        Culture.advocate(st.pawns[c.actor], c.args.dim, c.args.option, st.cenv.t + 10);
        personEvent(st, c.actor, 'cause', `Took up the cause: ${d.label.toLowerCase()}, ${d.opts[c.args.option][1].toLowerCase()}`);
      },
    },
    // dropCause: the pawn lays down the cause it argues
    dropCause: {
      check: (st, c) => living(st, c.actor) || (st.pawns[c.actor].advocate ? null : 'the pawn argues no cause'),
      run: (st, c) => {
        const p = st.pawns[c.actor], d = Culture.DIMS[p.advocate.dim];
        Culture.advocate(p, null);
        personEvent(st, c.actor, 'cause', `Dropped the cause: ${d.label.toLowerCase()}`);
      },
    },
    // rally({dim, option}): a fifth of the settlement's voices, the most esteemed first, take up the cause
    rally: {
      check: (st, c) => settlement(st, c) || option(c),
      run: (st, c) => {
        const s = st.cenv.settlements[c.actor.settlement];
        const voiced = membersOf(st, s.id).filter((q) => voiceOf(st, q, s) > 0).sort((x, y) => y.prestige - x.prestige);
        const want = Math.max(1, Math.ceil(voiced.length * 0.2));
        for (const q of voiced.slice(0, want)) Culture.advocate(q, c.args.dim, c.args.option, st.cenv.t + 10);
      },
    },
    // skip({hours}): the world goes on for that long (no actor), whole 6-minute steps (VB-244)
    skip: {
      check: (st, c) => {
        const h = c.args && c.args.hours;
        if (!(h > 0 && Number.isFinite(h))) return `cannot skip ${h} hours`;
        const x = h * TICKS;
        return Math.abs(x - Math.round(x)) < 1e-6 ? null : `cannot skip ${h} hours: not a whole number of 6-minute steps`;
      },
      run: (st, c) => later('sim/clock').advance(st, c.args.hours),
    },
  };
  // Carries out cmd, or changes nothing: true, or the reason it was refused.
  function issue(st, cmd) {
    const V = VERBS[cmd.verb];
    if (!V) return `there is no verb ${cmd.verb}`;
    const why = V.check(st, cmd);
    if (why) return why;
    V.run(st, cmd);
    return true;
  }
  // ---- the player (VB-169): one source, `player`, with one pawn at a time, whose queued commands go before the pawn's own logic ----
  // @state st.player: null, or {pawn (the inhabited pawn's id), auto (boolean: left to itself, the pawn does what its role's automatic
  //   behaviour chooses), queue[] (at most QUEUE_MAX commands {actor: pawn, verb, target, args, source: 'player', begun}, in turn; `begun` is
  //   null until the command is issued, then the game time: only the head is ever begun, and it stays the head while its act lasts),
  //   refused (null, or {verb, why, t}: the last command refused when its turn came), since (game hours), wishes ({out, claim, serve}: what
  //   the player wishes for its pawn at the moving round, each null for "as the pawn would"; out true (move out, though heir to a farm) or
  //   false (stay); claim a farm id (only that farm) or false (none); serve true (as the pawn would) or false (decline). Set by wish, kept
  //   across rounds until changed, read through sim/records' wishOf where the round asks what a pawn wants), left (null while the pawn
  //   lives; from its death {t, held (the household it held, or null), spouse (pawn id or null), ties[] (at most TIES_MAX {id, why}: those
  //   it thought friends, best first)}: what a death erases and the player's succession needs, VB-213)}; plain data, saved with the run
  const QUEUE_MAX = 8, TIES_MAX = 12;
  // A command begun lasts while its act does: work while the pawn holds that job, a walk until it arrives, going home until it is indoors,
  // idling until its time is up. Any other verb is done at once.
  const LASTS = {
    work: (st, a, c) => !!a.job && a.job.key === c.target,
    walkTo: (st, a) => !!a.path,
    goHome: (st, a) => !a.inside && !!a.path,
    idle: (st, a, c) => st.t < c.args.until,
  };
  // The planner's sites ask these two (docs/review-life.md, section 2). commanded: a command of the player's is queued or under way for the
  // pawn, so nothing else moves it. unplanned: that, or the player has turned its automatic behaviour off, so the planner gives it no work.
  const commanded = (st, id) => { const pl = st.player; return !!pl && pl.pawn === id && pl.queue.length > 0; };
  const unplanned = (st, id) => { const pl = st.player; return !!pl && pl.pawn === id && (pl.queue.length > 0 || !pl.auto); };
  function inhabit(st, id) {
    const dead = living(st, id); if (dead) return dead;
    if (st.player) uninhabit(st);
    st.player = { pawn: id, auto: true, queue: [], refused: null, since: st.t, wishes: { out: null, claim: null, serve: null }, left: null };
    personEvent(st, id, 'player', 'Played by the player');
    return true;
  }
  function uninhabit(st) {
    if (!st.player) return 'no pawn is played';
    personEvent(st, st.player.pawn, 'player', 'No longer played by the player');
    st.player = null;
    return true;
  }
  // The played pawn dies (sim/lifecycle, before the death ends its marriage and drops its ties): the player keeps it, with an empty queue,
  // until it goes on as another (VB-213), and what the death erases is noted: the farm it held, its spouse, those it thought friends.
  function playerDied(st, id) {
    const pl = st.player;
    if (!pl || pl.pawn !== id) return;
    const held = holdingOf(st, id), friends = relationsOf(st, id).filter((r) => r.opinion >= SOCIAL.friend);
    friends.sort((x, y) => y.opinion - x.opinion || x.id - y.id);
    pl.queue = [];
    pl.left = { t: st.t, held: held ? held.id : null, spouse: spouseOf(st, id),
      ties: friends.slice(0, TIES_MAX).map((r) => ({ id: r.id, why: opinionWord(r.opinion) })) };
  }
  // The player goes on as pawn id after its pawn's death: `text` is written to the dead pawn's events, and id is played from now, with
  // nothing queued and no wishes. sim/opportunities' succeed checks who may be chosen; true, or why not.
  function goOnAs(st, id, text) {
    const pl = st.player;
    if (!pl || !pl.left) return 'the played pawn has not died';
    const dead = living(st, id); if (dead) return dead;
    personEvent(st, pl.pawn, 'player', text);
    st.player = null;
    return inhabit(st, id);
  }
  // Needs go on: with nothing left to do after the end of work, the player's pawn goes home, as everyone did at dark.
  function homeAtDark(st, pl) {
    const a = st.agents[pl.pawn], h = cal(st.t).hour;
    if ((h >= WORK[1] || h < WORK[0]) && !a.inside && a.phase === null) issue(st, { actor: pl.pawn, verb: 'goHome', source: 'planner' });
  }
  // The command joins the queue, to be checked when its turn comes; true, or why it does not: the queue is full, there is no such verb,
  // or its actor is not the player's pawn. `skip` is the world's, not a pawn's (it would advance time from within a step).
  function queue(st, cmd) {
    const pl = st.player;
    if (!pl) return 'no pawn is played';
    if (!cmd || !VERBS[cmd.verb] || cmd.verb === 'skip') return `there is no verb ${cmd && cmd.verb} to queue`;
    if (cmd.actor !== pl.pawn) return `pawn ${cmd.actor} is not the player's pawn`;
    if (pl.queue.length >= QUEUE_MAX) return `the queue is full (${QUEUE_MAX} commands)`;
    const copy = (v) => (v === undefined ? null : JSON.parse(JSON.stringify(v))); // the queue keeps its own plain data
    pl.queue.push({ actor: pl.pawn, verb: cmd.verb, target: copy(cmd.target), args: copy(cmd.args), source: 'player', begun: null });
    return true;
  }
  // Takes command i off the queue. The head, once begun, only stops being the player's: the pawn goes on with the act as its own.
  function unqueue(st, i) {
    const pl = st.player;
    if (!pl) return 'no pawn is played';
    if (!(Number.isInteger(i) && i >= 0 && i < pl.queue.length)) return `the queue has no command ${i}`;
    pl.queue.splice(i, 1);
    if (!pl.queue.length && !living(st, pl.pawn)) homeAtDark(st, pl);
    return true;
  }
  function setAuto(st, on) {
    if (!st.player) return 'no pawn is played';
    st.player.auto = !!on;
    return true;
  }
  // The player's wish for its pawn at the moving round (VB-212): it stands in where the round asks what the pawn itself wants, and the round
  // decides by its rules, so a wish is not checked against them here; it stays until changed. True, or why it is not a wish.
  function wish(st, kind, value) {
    const pl = st.player;
    if (!pl) return 'no pawn is played';
    if (kind !== 'out' && kind !== 'claim' && kind !== 'serve') return `there is no wish ${kind}`;
    const farm = kind === 'claim' && Number.isInteger(value);
    if (farm ? !st.farmsteads[value] : !(value === null || value === false || (value === true && kind !== 'claim'))) {
      return farm ? `there is no farm ${value}` : `${kind} cannot be wished ${JSON.stringify(value)}`;
    }
    pl.wishes[kind] = value;
    return true;
  }
  // Each six-minute step (sim/clock), before the agents move: a begun head whose act has ended leaves the queue, and the next command is
  // issued; one refused then is dropped, its reason kept in `refused`. A load being carried home is delivered first, as at the end of work.
  function playerStep(st) {
    const pl = st.player;
    if (!pl || !pl.queue.length) return;
    const a = st.agents[pl.pawn], q = pl.queue;
    if (q[0].begun !== null) {
      const lasts = LASTS[q[0].verb];
      if (lasts && !living(st, pl.pawn) && lasts(st, a, q[0])) return;
      q.shift();
    }
    while (q.length) {
      if (a.phase === 'back') return;
      // told to walk, go home or idle, the pawn leaves the job in hand, which keeps its progress (work leaves it itself): only if it may
      const cmd = q[0], leaves = !!a.job && cmd.verb !== 'work' && !!LASTS[cmd.verb], barred = leaves ? VERBS[cmd.verb].check(st, cmd) : null;
      if (leaves && !barred) release(st, a);
      const why = barred || issue(st, cmd);
      if (why === true) { cmd.begun = st.t; return; }
      q.shift(); pl.refused = { verb: cmd.verb, why, t: st.t };
    }
    if (!living(st, pl.pawn)) homeAtDark(st, pl);
  }
  // The played pawn answers the open marriage offer offerId (VB-272; the first question asked through Decisions.answer, which slice 5's
  // Decisions module takes over): true, or why not.
  function answer(st, offerId, yes) {
    if (!st.player) return 'no pawn is played';
    return issue(st, { actor: st.player.pawn, verb: 'answer', target: offerId, args: { yes }, source: 'player' });
  }
  return {
    issue, VERBS, QUEUE_MAX, commanded, unplanned, inhabit, uninhabit, queue, unqueue, setAuto, wish, answer, playerStep, playerDied, goOnAs, TIES_MAX,
  };
})();

// @sys sim/plans: holders' plans (design.md section 7; VB-258, VB-248): a standing plan per live household and village; targets, land step, seed
VB['sim/plans'] = (() => {
  const { WORK, DAY, TICKS, HERD } = VB['sim/rules'];
  const Stores = VB['sim/stores'];
  const { seedNeed } = VB['sim/hunger'];
  const { fieldsWanted, fieldsWorkable, startProject } = VB['sim/fields'];
  const { startMeadow } = VB['sim/meadows'];
  // @state st.plans: {households: Map of household id to plan, villages: Map of village id to plan}; a plan is
  //   {holder: {type: 'household' | 'village', id}, kind: 'standing', nextReview (game hours), reserved, reasons (sim/stores' reservations)}, and a
  //   household's also {targets, tiles, counted}. One standing plan per undissolved household and per village; a dissolved household's plan
  //   is dropped with it, so the maps hold only live holders (Rules for cost, 1). Its review is the hourly pass that asks each kind where it
  //   is available (refreshJobs, sim/jobs).
  // @state plan.targets (a household's; VB-248): {wood: [the woodpile's goal by season], woodSecond (a second hand cuts below it), hayWinters
  //   (hay is made while the barn holds less than this many winters' need), fields, workable (the fields wanted and those its hands can
  //   till, written at the day's first work review, which takes the land step)}. Read by wood (sim/kinds), hayWanted (sim/meadows), the land step.
  // @state plan.tiles: {field, meadow}: the tile the plan names for its next field or meadow in place of the holder's choice, -1 for none
  //   (nothing names one yet: VB-253's verb). plan.counted: the year its herds were last counted for the cull (sim/byre), or null.
  // The template of the year, one for every culture until foresight (VB-254): the woodpile is laid in for winter from summer on, so its
  // goal is higher in summer and autumn; hay for two winters.
  const HAY_WINTERS = 2;
  function template(st, T) {
    const E = st.ECON;
    T.wood[0] = E.woodTarget; T.wood[1] = E.woodWinter; T.wood[2] = E.woodWinter; T.wood[3] = E.woodTarget;
    T.woodSecond = E.woodTarget * 0.4; T.hayWinters = HAY_WINTERS;
  }
  // The hours a standing plan is reviewed: every hour from one before work starts to the end of work (sim/clock calls refreshJobs then).
  const reviewHour = (h) => h >= WORK[0] - 1 && h <= WORK[1];
  // The first review hour after the hour of time t.
  function reviewAfter(t) {
    const day = Math.floor(t / DAY), h = Math.floor(t - day * DAY) + 1;
    if (h < WORK[0] - 1) return day * DAY + WORK[0] - 1;
    if (h > WORK[1]) return (day + 1) * DAY + WORK[0] - 1;
    return day * DAY + h;
  }
  const mapOf = (st, type) => (type === 'household' ? st.plans.households : st.plans.villages);
  // A household's targets, tiles, cull record and reservation of seed, at its plan's making and at the load of a save without them.
  function household(st, plan) {
    const hh = st.households[plan.holder.id];
    plan.targets = { wood: [0, 0, 0, 0], woodSecond: 0, hayWinters: 0, fields: 0, workable: 0 };
    template(st, plan.targets);
    if (hh.farmstead !== null) { plan.targets.workable = fieldsWorkable(st, hh); plan.targets.fields = fieldsWanted(st, hh, plan.targets.workable); }
    plan.tiles = { field: -1, meadow: -1 };
    plan.counted = null;
    Stores.reserve(st, hh, plan, 'grain', hh.farmstead !== null ? seedNeed(st, hh) : 0, 'seed');
  }
  // A holder's standing plan, made when the household is founded or the village is (and for every holder at seed and load).
  function makePlan(st, type, id) {
    const plan = { holder: { type, id }, kind: 'standing', nextReview: reviewAfter(Math.floor(st.tick / TICKS) - 1), reserved: {}, reasons: {} };
    mapOf(st, type).set(id, plan);
    if (type === 'household') household(st, plan);
    return plan;
  }
  // A dissolved household's plan goes with it, and its reservations with the plan.
  function dropPlan(st, type, id) { mapOf(st, type).delete(id); }
  const planOf = (st, type, id) => mapOf(st, type).get(id);
  // The plans of every live holder, at seed, and at the load of a save made before plans (VB-258).
  function seedPlans(st) {
    st.plans = { households: new Map(), villages: new Map() };
    for (const id of st.liveHouseholds) makePlan(st, 'household', id);
    for (const v of st.villages) makePlan(st, 'village', v.id);
  }
  // A save made before the plans' targets and reservations (VB-248): its plans get them as made now.
  function fillPlans(st) {
    for (const plan of [...st.plans.households.values(), ...st.plans.villages.values()]) if (!plan.reserved) {
      plan.reserved = {}; plan.reasons = {}; // lint-allow: owner a save made before reservations gets empty ones (sim/stores writes them)
      if (plan.holder.type === 'household') household(st, plan);
    }
  }
  // A plan reviewed now: its next review is the next review hour. A household's plan writes its targets with today's values (the fields
  // only at the day's first work review, the one the land step reads them at), notes the year's count of its herds, and reserves the seed
  // its unsown fields and its land project need (sim/stores counts it again when read).
  function reviewed(st, plan, c) {
    VB.count.planReview++; plan.nextReview = reviewAfter(Math.floor(st.tick / TICKS));
    if (plan.holder.type !== 'household') return;
    const hh = st.households[plan.holder.id], T = plan.targets;
    template(st, T);
    if (c.hour === WORK[0]) { T.workable = fieldsWorkable(st, hh); T.fields = fieldsWanted(st, hh, T.workable); }
    if (c.doy === HERD.countDay && hh.herds.length) plan.counted = c.year;
    Stores.reserve(st, hh, plan, 'grain', seedNeed(st, hh), 'seed');
  }
  // The land step (once a day at the start of work, from the review): a new field while the household has fewer than the plan's target,
  // else a hay meadow while it is short of one; the tile is the holder's choice (chooseTile, chooseMeadow) unless the plan names one.
  // `built`: the houses and greens, once for every farm's look (sim/fields, builtTiles).
  function landStep(st, plan, f, hh, built) {
    startProject(st, f, hh, built, plan.targets.fields, plan.tiles.field);
    startMeadow(st, f, hh, built, plan.tiles.meadow);
    Stores.reserve(st, hh, plan, 'grain', seedNeed(st, hh), 'seed'); // a project begun holds its seed from now
  }
  return { reviewHour, makePlan, dropPlan, planOf, seedPlans, fillPlans, reviewed, landStep };
})();
</script>

// @sys sim/jobs: job board: posting, ownership checks, urgency, bidding, and leaving a job for a more urgent one
VB['sim/jobs'] = (() => {
  const { next: rnd } = VB['sim/rng'];
  const { WORK, ROLES, CHILD, PLOT_PRIO, MATCH, cal } = VB['sim/rules'];
  const { hexSteps } = VB['sim/hex'];
  const { villageOf, age } = VB['sim/records'];
  const { freeHands, ownerKey, dropJob, rateOf, tileAt } = VB['sim/agents'];
  const { companyFor } = VB['sim/relations'];
  const { issue, unplanned } = VB['sim/commands'];
  const { KINDS, ASK, cookWanted, isOpen } = VB['sim/kinds'];
  const { builtTiles } = VB['sim/fields'];
  const { claimPrio } = VB['sim/farmclaims'];
  const { planOf, reviewed, landStep } = VB['sim/plans'];
  // Sources (fields, households, village fences) post jobs; each job names an owner. A pawn may take a job
  // owned by its own household, or by its village if it lives there. Servants count as household members.
  function post(st, key, kind, owner, site, extra) {
    let j = st.jobs.get(key);
    if (!j) { j = { id: ++st.jobSeq, key, kind, owner, site, done: 0, claims: [], posted: st.t, ...extra }; st.jobs.set(key, j);
      const ok = ownerKey(owner); if (!st.jobsBy.has(ok)) st.jobsBy.set(ok, new Set());
      st.jobsBy.get(ok).add(j); }
    j.live = true;
    return j;
  }
  // From 14:00 a household short of meals calls its best cook off other work, unless that cook is idle (then matching sends them home).
  // The job it leaves is kept as it stands, with its progress.
  function callCooks(st, c) {
    VB.count.cookFarm += st.farmsteads.length;
    for (const f of st.farmsteads) {
      const hh = f.household === null ? null : st.households[f.household];
      const j = hh && st.jobs.get(`cook:h${hh.id}:${c.day}`);
      if (!j || j.claims.length || !cookWanted(st, hh, c)) continue;
      let best = null, top = 0;
      for (const id of hh.members) {
        const p = st.pawns[id], pr = ROLES[p.role].prio.cook || 0;

    return from.dissolved || from.members.length < 2 ? -1 : hands(st, from) - (q.age >= 14 && q.age < 60 ? 1 : 0);
  }
  function takeServants(st) {
    const lone = st.liveHouseholds.map((id) => st.households[id]).filter((h) => !h.dissolved && h.members.length === 1 && adult(st.pawns[h.holder]));
    if (!lone.length) return;
    const village = (hh) => farmOf(st, hh).village;
    // Service changes residence only: marriage, holdings, guardians and plots stay fixed during this pass.
    // Keep demand order for ties, but evaluate those eligibility rules once rather than for every lone holder.
    // Whether it would serve is the pawn's own wish (anyone who wants out would), and the player's stands in: false declines (VB-212).
    const available = st.demand.filter((id) => unfit(st, st.pawns[id]) === null && wishOf(st, id, 'serve') !== false);
    for (const hh of lone) {
      if (hh.members.length !== 1) continue;
      const v = st.villages[village(hh)], holder = st.pawns[hh.holder];
      let best = null, bs = null;
      for (const id of available) {
        const q = st.pawns[id];
        const from = st.households[q.household], left = handsLeft(st, q); if (left < SERVICE.keepHands) continue;
        const u = st.villages[village(from)], d = u.id === v.id ? 0 : hexSteps(st.w, u.center, v.center);
        if (d > SERVICE.reach) continue;
        const s = [d, -left, q.born];
        if (!bs || before(s, bs)) { best = q; bs = s; }
      }
      if (!best) continue;
      issue(st, { actor: best.id, verb: 'serve', target: hh.id, source: 'round' });
    }
    refreshRoles(st); st.visualDirty = true;
  }
  return { careForOrphans, takeServants, enterService, hands, unfit, handsLeft };
})();

// @sys sim/opportunities: what a pawn may do here, for whom and on what basis, computed when asked and never stored; the actor view (VB-209);
// whom the player may go on as after its pawn's death (VB-213)
VB['sim/opportunities'] = (() => {
  const Culture = VB['culture'];
  const { cal, SERVICE } = VB['sim/rules'];
  const { walkable } = VB['sim/routes'];
  const { villageOf, settlementIdOf, fullName, spouseOf, childrenOf, holdingOf } = VB['sim/records'];
  const { ASK } = VB['sim/kinds'];
  const { claimable, barred: claimBar } = VB['sim/farmclaims'];
  const { VERBS, goOnAs } = VB['sim/commands'];
  const { relationsOf, opinionWord } = VB['sim/relations'];
  const { SOCIAL } = VB['sim/rules'];
  const { mayTake, fit, jobsFor } = VB['sim/jobs'];
  const { staysWhy, heirRanking } = VB['sim/heirs'];
  const { unfit, handsLeft } = VB['sim/service'];
  // What pawn `id` may read of the state. It filters nothing for now: every pawn knows everything (design.md, What a pawn knows). It is
  // the seam: forPawn reads the world only through its view, so what a pawn has not heard can later be left out here.
  const actorView = (st) => st;
  // An opportunity is a command the pawn could be given, with who it would be for and why it may not be taken now:
  //   {verb, target, args, holder ({type: 'household' | 'village', id}, or null for its own acts), basis ('member', 'servant', 'villager'
  //   or 'self'), fit (the planner's noise-free bid for work, else null), why (null when the command would be accepted now), kind (a job's
  //   kind, for work), when ('now', or 'round': an act the moving round carries out, by its rules, for a pawn that wishes it)}.
  const item = (verb, target, args, why, more = {}) => ({ verb, target, args, holder: null, basis: 'self', fit: null, why, kind: null, when: 'now', ...more });
  // What the verb's own check says of the command, for pawn id.
  const check = (view, id, verb, target, args) => VERBS[verb].check(view, { actor: id, verb, target, args, source: 'player' });

  // ---- work: where each kind is available for its household and its village, matched to the posted job, with the planner's fit ----
  function work(view, p, c, out) {
    const hh = view.households[p.household], f = view.farmsteads[hh.farmstead], vid = villageOf(view, p), a = view.agents[p.id];
    const owners = [{ type: 'household', id: hh.id }, { type: 'village', id: vid }], seen = new Set(), list = [];
    const add = (key, kind, owner, j) => {
      if (seen.has(key) || !mayTake(view, p, { owner })) return;
      seen.add(key);
      const basis = owner.type === 'village' ? 'villager' : p.servant ? 'servant' : 'member';
      const row = j ? fit(view, p, j, c) : { bid: null, reason: 'not given out yet: work is given out in working hours' };
      const why = j && a.job === j ? 'doing it now' : row.reason || check(view, p.id, 'work', key, null);
      list.push(item('work', key, null, why, { holder: owner, basis, fit: row.bid, kind }));
    };
    // as refreshJobs asks the kinds (sim/jobs), for this farm and this village only; `put` posts nothing
    let kind = null, own = owners[0];
    const put = (key, site, extra, k = kind, owner = own) => add(key, k, owner, view.jobs.get(key) || null);
    const ask = (rules, holder, at, farm) => { for (let i = 0; i < rules.length; i++) { kind = rules[i][0]; rules[i][1](view, holder, at, c, put, farm); } };
    for (const fd of f.fields) { const rules = ASK.fieldAt[fd.stage]; if (rules) ask(rules, hh, fd, f); }
    ask(ASK.farm, hh, f, f); ask(ASK.farmAfterPlans, hh, f, f);
    own = owners[1]; ask(ASK.village, view.villages[vid], view.villages[vid]);
    // and the posted jobs of the two that are asked island-wide (a plot's steps, a claimed farm's restoration) or are still being worked
    for (const j of jobsFor(view, p)) add(j.key, j.kind, j.owner, j);
    // those it may take first, best fit first; then the rest, in the order asked
    list.sort((x, y) => (x.why === null ? 0 : 1) - (y.why === null ? 0 : 1) || (y.fit ?? -Infinity) - (x.fit ?? -Infinity));
    for (const o of list) out.push(o);
  }

  // ---- its own acts: go home, idle, and walk to the tile asked about, if the walking rule opens it ----
  function own(view, p, near, out) {
    out.push(item('goHome', null, null, view.agents[p.id].inside ? 'at home already' : check(view, p.id, 'goHome', null, null)));
    const until = view.t + 1;
    out.push(item('idle', null, { until }, check(view, p.id, 'idle', null, { until })));
    if (near === null || near === undefined) return;
    const open = Number.isInteger(near) && near >= 0 && near < view.w.N && walkable(view.w)(near);
    out.push(item('walkTo', near, null, open ? check(view, p.id, 'walkTo', near, null) : 'no one can walk there'));
  }

  // ---- a cause: each custom's options other than its village's practice, and dropping the cause it has ----
  function causes(view, p, out) {
    if (!view.cenv) return;
    const s = view.cenv.settlements[settlementIdOf(view, p)], adv = p.advocate || null;
    if (!s) return;
    for (let dim = 0; dim < Culture.DIMS.length; dim++) for (let option = 0; option < Culture.NOPT[dim]; option++) {
      if (s.practice[dim] === option) continue;
      const args = { dim, option }, mine = adv && adv.dim === dim && adv.opt === option;
      out.push(item('argue', null, args, mine ? 'argues for it already' : check(view, p.id, 'argue', null, args)));

  // ---- the moving round's acts: the pawn's wish stands in at the round, which decides by its rules (VB-212) ----
  function round(view, p, out) {
    const vid = villageOf(view, p), v = view.villages[vid], atRound = { when: 'round' };
    // Heir to a farm? One the round last counted as wanting out (st.demand) was not, and is not asked again: ranking a village's heirs is
    // the costly part (0.6 ms at small-y40). Else the first heirs of its own village's farms are ranked, once, and only if the cheaper
    // bars all pass; an heir to a farm elsewhere is found at the round, which ranks every household.
    let ranked = null;
    const firsts = () => {
      ranked = new Set();
      for (const k of v.farmsteads) {
        const f = view.farmsteads[k], hh = f.household === null ? null : view.households[f.household];
        if (hh && !hh.dissolved) { const first = heirRanking(view, hh)[0]; if (first !== undefined) ranked.add(first); }
      }

    const heirs = { has: (id) => !view.demand.includes(id) && (ranked || firsts()).has(id) };
    // The player's wishes stand in for the pawn's own (st.player.wishes): each act's `why` is as the round would decide with them, and for
    // the played pawn `own` says what the pawn itself would do about moving out, whatever the player wishes.
    const pl = view.player, wishes = pl && pl.pawn === p.id ? pl.wishes : null;
    const stays = staysWhy(view, p, heirs);
    out.push(item('leave', null, null, stays, wishes ? { ...atRound, own: staysWhy(view, p, heirs, null, null, null) } : atRound));
    // an empty farm of its village: the round gives it to the first claimant among those who want out
    const bar = stays || claimBar(view, p.id) || (wishes && wishes.claim === false ? 'its player wishes it to claim no farm' : null);
    const other = (f) => (wishes && wishes.claim !== null && wishes.claim !== f.id ? 'its player wishes for another farm' : null);
    for (const k of v.farmsteads) {
      const f = view.farmsteads[k];
      if (f.household !== null) continue;
      const why = f.claim ? `${fullName(view.pawns[f.claim.by])} is restoring it` : !claimable(f) ? 'a ruin, past mending' : bar || other(f);
      out.push(item('claim', f.id, null, why || check(view, p.id, 'claim', f.id, null), atRound));
    }
    // service with a holder of its village who lives alone
    const spare = stays || unfit(view, p) || (handsLeft(view, p) < SERVICE.keepHands ? 'its household cannot spare its hands' : null)
      || (wishes && wishes.serve === false ? 'its player wishes it to take no service' : null);
    let lone = 0;
    for (const k of v.farmsteads) {
      const f = view.farmsteads[k], hh = f.household === null ? null : view.households[f.household];
      if (!hh || hh.dissolved || hh.members.length !== 1 || hh.id === p.household || view.pawns[hh.holder].age < 18) continue;
      lone++;
      out.push(item('serve', hh.id, null, spare || check(view, p.id, 'serve', hh.id, null), { ...atRound, holder: { type: 'household', id: hh.id } }));
    }
    if (!lone) out.push(item('serve', null, null, spare || 'no holder of the village lives alone', atRound));
  }

  // What pawn `id` may do here (and at tile `near`, if given): its work, its own acts, a cause, and the round's acts; nothing for marriage
  // (Decided, 8 Nov). Read-only: it writes nothing and draws no random number. `view` is actorView's; every read of the world goes through it.
  function forPawn(st, view, id, near = null) {
    const p = view.pawns[id], out = [];
    if (!p || p.died !== null || !view.agents[id]) return out;
    const housed = p.household !== null && view.households[p.household] && !view.households[p.household].dissolved;
    if (housed) work(view, p, cal(view.t), out);
    own(view, p, near, out);
    causes(view, p, out);
    if (housed) round(view, p, out);
    return out;
  }

  const KIN = { reach: 4, bySpouse: 2, spouses: 2 }, SUCCESSORS_MAX = 40;
  const KIN_WORDS = { '0:1': ['son', 'daughter'], '0:2': ['grandson', 'granddaughter'], '1:0': ['father', 'mother'], '2:0': ['grandfather', 'grandmother'],

  const sexed = (st, id, pair) => pair[st.pawns[id].sex === 'f' ? 1 : 0];
  // The blood kin of pawn id within civil degree `reach`, living or dead: Map of pawn id -> {deg, word}. Up to its ancestors and down from
  // each of them, so the walk is bounded by the family, not by the island.
  function bloodKin(st, id, reach) {
    const out = new Map(), ups = new Map([[id, 0]]);

      const next = [];

      gen = next;
    }
    const note = (q, up, down) => {
      if (q === id) return false;
      const was = out.get(q);
      if (was && was.deg <= up + down) return false;

      return true;

      if (up) note(a, up, 0);

        gen = next;
      }

  }
  // The living the player may go on as after pawn id, in order and without repeats, each {id, why}: the heirs of the farm it held (who
  // holds it now, then heirRanking); its kin by blood (to first cousins) or marriage (its spouse, the spouse's kin to degree KIN.bySpouse,
  // the spouses of its own kin to degree KIN.spouses), nearest first, of any age; its household; those it thought friends. At most
  // SUCCESSORS_MAX. For the player's dead pawn the farm, the spouse and the friends are those noted at its death (st.player.left); for
  // any other pawn they are read now. Read-only; it walks the pawn's family and household, never the island's pawns or records.
  function successors(st, id) {
    const p = st.pawns[id], out = [], seen = new Set([id]);
    if (!p) return out;
    const left = st.player && st.player.pawn === id ? st.player.left : null;
    const add = (q, why) => { if (!seen.has(q) && st.pawns[q].alive) { seen.add(q); out.push({ id: q, why }); } };
    const holding = left ? null : holdingOf(st, id), held = left ? left.held : holding ? holding.id : null;
    if (held !== null && !st.households[held].dissolved) {
      const hh = st.households[held];
      if (hh.holder !== null) add(hh.holder, 'heir');
      for (const q of heirRanking(st, hh)) add(q, 'heir');
    }

    for (const [q, k] of mine) {
      kin.push({ id: q, deg: k.deg, blood: 0, why: k.word });
      const qs = k.deg <= KIN.spouses ? spouseOf(st, q) : null;
      if (qs !== null && qs !== id && !mine.has(qs)) kin.push({ id: qs, deg: k.deg, blood: 1, why: `${k.word}'s ${sexed(st, qs, ['husband', 'wife'])}` });
    }
    if (sp !== null) {
      const spouse = sexed(st, sp, ['husband', 'wife']);
      kin.push({ id: sp, deg: 0, blood: 1, why: spouse });
      for (const [q, k] of bloodKin(st, sp, KIN.bySpouse)) if (!mine.has(q)) kin.push({ id: q, deg: k.deg, blood: 1, why: `${spouse}'s ${k.word}` });
    }
    kin.sort((x, y) => x.deg - y.deg || x.blood - y.blood || st.pawns[x.id].born - st.pawns[y.id].born || x.id - y.id);

    if (home && !home.dissolved) for (const q of home.members) add(q, 'household');

      .sort((x, y) => y.opinion - x.opinion || x.id - y.id).map((r) => ({ id: r.id, why: opinionWord(r.opinion) }));
    for (const t of ties) add(t.id, t.why);

  }

  // is a break in the line. Either is written to the dead pawn's events. True, or why not.
  function succeed(st, id) {
    const pl = st.player;
    if (!pl || !pl.left) return 'the played pawn has not died';
    const q = st.pawns[id], list = successors(st, pl.pawn), pick = list.find((s) => s.id === id);
    if (!q || !q.alive) return `pawn ${id} is not a living pawn`;
    if (list.length && !pick) return `${fullName(q)} is not among those ${fullName(st.pawns[pl.pawn])} leaves`;
    if (!list.length && q.age < 18) return 'only an adult begins a new line';
    const link = !pick ? null : pick.why === 'heir' ? 'the heir' : pick.why === 'household' ? 'one of its household' : `its ${pick.why}`;
    return goOnAs(st, id, pick ? `The player went on as ${link}, ${fullName(q)}` : `A break in the line: the player went on as ${fullName(q)}`);
  }
  return { actorView, forPawn, successors, succeed };
})();

// @sys sim/cottage: a finished cottage becomes a farmstead and a household (start in life from shares); owed shares are paid down
VB['sim/cottage'] = (() => {
  const { personEvent, log, fullName, spouseOf, childrenOf, isHolder, atHousehold } = VB['sim/records'];
  const { makeFarmstead } = VB['sim/layout'];
  const { SHARES, SOIL } = VB['sim/rules'];
  const { foundHousehold } = VB['sim/membership'];
  const Stores = VB['sim/stores'];
  const names = VB['sim/names'];
  // A new farm's name (VB-026): by the generators the village's culture prefers (compass, landmark, owner), not one another farm of the
  // village has; owner is its first holder. Drawn from the house tile's own stream, not st.rng.
  const farmName = (st, v, f, owner = null) => names.farmName({ w: st.w, f, village: v, owner },
    new Set(v.farmsteads.filter((id) => id !== f.id).map((id) => st.farmsteads[id].name)), names.tileRand(f.house), names.prefsOf(st, v.id).farm);
  // The roof is on: the plot's holder and spouse (and their minor children) move into a new farmstead of the plot's house and field.
  // Their stakes (shares already paid out, VB-032) become the household's grain; shares still owed stay a debt of the farm they came from.
  function finishCottage(st, plot) {
    const v = st.villages[plot.village], holder = st.pawns[plot.holder], sp = spouseOf(st, holder.id);
    // the holder died, or took another farm or married onto one (VB-153) meanwhile: the roof stands, nobody is to live there
    if (!holder.alive || isHolder(st, holder.id) || (sp !== null && st.pawns[sp].alive && isHolder(st, sp))) {
      plot.holder = null; log(st, `The new cottage in ${v.name} stands empty.`, { kind: 'empty', village: v.id }); return;
    }
    plot.built = true;
    const house = plot.tiles.find((t) => t.kind === 'house').tile, field = plot.tiles.find((t) => t.kind === 'field').tile;
    const f = makeFarmstead(st.w, st.farmsteads.length, house, [field], v, st.used);
    if (plot.tiles.find((t) => t.kind === 'field').fresh) f.fields[0].soil = SOIL.fresh; // broken on ground never farmed (VB-149)
    f.name = farmName(st, v, f, holder); f.woodlot = v.commonsWood; f.state = 'occupied'; f.condition = 1; f.emptySince = null; f.fence = null;
    st.farmsteads.push(f); v.farmsteads.push(f.id); plot.farmstead = f.id;
    const members = [holder.id];
    if (sp !== null && st.pawns[sp].alive) members.push(sp);
    const from = new Set(members.map((id) => st.pawns[id].household));
    for (const id of [...members]) {
      for (const c of childrenOf(st, id)) {
        const q = st.pawns[c];
        if (q.alive && q.age < 18 && from.has(q.household) && !members.includes(c) && !isHolder(st, c)) members.push(c);
      }
    }
    const hh = foundHousehold(st, f, members, holder.id, { stakes: true, unhomed: true });
    personEvent(st, holder.id, 'moved', `Moved into the new farmstead ${f.name}`, false); // recorded below
    log(st, `${fullName(holder)} moves into the new farmstead ${f.name} in ${v.name}.`, { kind: 'cottage', pawn: holder.id, ...atHousehold(st, hh) });
  }
  // At the moving round: shares still owed are paid from the debtor farm's grain above its reserve (the seed and the winter's food).
  // The payment goes to the pawn's household, or to its stake while it has none.
  function payOwed(st) {
    for (const liveId of st.living) {
      const p = st.pawns[liveId];
      if (!p.alive || !(p.owed > 0) || p.owedFrom === undefined || p.owedFrom === null) continue;
      const hh = st.households[p.owedFrom]; if (!hh || hh.dissolved) continue;
      const reserve = SHARES.reserveBase + hh.members.length * SHARES.reservePerMember;
      const pay = Math.min(p.owed, Math.max(0, Math.floor(hh.grain - reserve)));
      if (pay <= 0) continue;
      p.owed -= pay;
      const to = p.household !== null && p.household !== hh.id ? st.households[p.household] : p;
      Stores.move(st, hh, to, 'grain', pay, { kind: 'share', pawn: p.id });
      personEvent(st, p.id, 'share', `Was paid ${pay} rations of the share owed${p.owed ? `, ${p.owed} still owed` : ''}`, { n: pay, ...atHousehold(st, hh) });
    }
  }
  return { farmName, finishCottage, payOwed };
})();

// @sys sim/society: Culture wiring: settlements, ties, prestige and interests of pawns
VB['sim/society'] = (() => {
  const { next: rnd, drawer } = VB['sim/rng'];
  const { issue } = VB['sim/commands'];
  const Culture = VB['culture'];
  const { initRelations, raiseTie } = VB['sim/relations'];
  const { YEAR } = VB['sim/rules'];
  const { stepsTo, hexSteps } = VB['sim/hex'];
  const { walkable } = VB['sim/routes'];
  const { log, age, spouseOf, childrenOf, siblingsOf, kinNear, settlementIdOf, isHolder, membersOf, voiceOf } = VB['sim/records'];
  const { heirRanking, ownFirstOf } = VB['sim/heirs'];
  // The lookups Culture's functions take (VB-073): built from st on each call, so nothing in st.cenv is a function.
  function hooks(st) {
    const env = st.cenv;
    return {
      living: st.living,
      byId: (id) => st.pawns[id],
      settlementOf: (p) => { const s = settlementIdOf(st, p); return s === null ? null : env.settlements[s]; },
      voiceOf: (p, s) => voiceOf(st, p, s),
      decide: (s, dim, option) => issue(st, { actor: { settlement: s.id }, verb: 'decide', args: { dim, option }, source: 'meeting' }) === true,
      membersOf: (s) => membersOf(st, s.id),
      nameCulture: (s) => `${s.name.replace(/(by|sta|vik|nes|inge|berga|tuna|säter)$/, '') || s.name}folk`,
      onSplit: (nc, from) => log(st, `${nc.name}: the people of ${env.settlements[nc.centres[0]].name} now keep their own customs, apart from ${from.name}.`,
        { kind: 'split', village: nc.centres[0] }),
    };
  }
  function initCulture(st, leanBySettlement, overrides = {}) {
    const env = st.cenv = { t: st.t / YEAR, cultures: [], settlements: [], people: st.pawns, driftMul: 1 };
    const customs = Culture.fromArchetype('oldNordic');
    for (const [key, opt] of Object.entries(overrides)) customs[Culture.IDX[key]] = Culture.optIndex(key, opt);
    const c = Culture.makeCulture(env, 'Nordic', customs, 0);
    for (const v of st.villages) addSettlement(st, v, c.id, customs, v.id === 0 ? 1 : 0.5);
    for (const p of st.pawns) {

    const free = names.filter((n) => !taken.has(n)), pool = free.length ? free : names, given = pool[(rnd(st.rng.people) * pool.length) | 0];

// @sys sim/people: the household generators of the founders and populous scenarios
VB['sim/people'] = (() => {
  const { person, marry, makeHousehold, joinHousehold } = VB['sim/records'];

  // Founders: a young couple on every farm, and two servants who join two of the households.
  function foundersHouseholds(R, farmsteads) {
    const rand = R.rand, households = [];
    farmsteads.forEach((f) => {
      const hAge = 23 + ((rand() * 11) | 0), wAge = Math.max(19, hAge - 1 - ((rand() * 6) | 0));
      const man = person(R, { sex: 'm', age: hAge }), wife = person(R, { sex: 'f', age: wAge });
      households.push(makeHousehold(R, households.length, f, [man, wife], man));
      marry(R, man, wife, 1 + ((rand() * 4) | 0));
    });
    const order = households.map((h) => h.id).sort(() => rand() - 0.5);
    const hand = person(R, { sex: 'm', age: 16 + ((rand() * 4) | 0), servant: true }),
      maid = person(R, { sex: 'f', age: 16 + ((rand() * 4) | 0), servant: true });
    joinHousehold(R, households[order[0]], hand); joinHousehold(R, households[order[1 % order.length]], maid);
    return households;
  }

  // Household sizes 4 to 9, about 6 on average.
  const SIZES = [[4, 0.15], [5, 0.2], [6, 0.25], [7, 0.2], [8, 0.12], [9, 0.08]];
  function drawSize(rand) {
    let u = rand();
    for (const [n, p] of SIZES) { if (u < p) return n; u -= p; }
    return 6;
  }

  // Populous: a couple, their children (two or three years apart) and sometimes a servant. Two generations only: the parents have no
  // recorded parents, so there are no grandparents, living or on record. In a third of the households the eldest child is 18 to 26.
  function populousHouseholds(R, farmsteads, sizes) {
    const rand = R.rand, households = [];
    for (const f of farmsteads) {
      const size = sizes[f.id], servant = size >= 6 && rand() < 0.25 ? 1 : 0, kids = size - 2 - servant;
      const ages = [0];
      for (let k = 1; k < kids; k++) ages.push(ages[k - 1] + 2 + ((rand() * 2) | 0));
      const span = ages[kids - 1], grown = rand() < 1 / 3;
      const youngest = grown ? Math.max(0, 18 + ((rand() * 9) | 0) - span) : (rand() * 3) | 0, eldest = youngest + span;
      const wAge = Math.max(25 + ((rand() * 14) | 0), eldest + 19), hAge = wAge + ((rand() * 6) | 0) - 1;
      const man = person(R, { sex: 'm', age: hAge }), wife = person(R, { sex: 'f', age: wAge });
      const members = [man, wife];
      marry(R, man, wife, eldest + 1 + ((rand() * 3) | 0));
      for (let k = 0; k < kids; k++) members.push(person(R, { sex: rand() < 0.5 ? 'm' : 'f', age: youngest + ages[k], father: man, mother: wife }));
      const hh = makeHousehold(R, households.length, f, members, man);
      if (servant) joinHousehold(R, hh, person(R, { sex: rand() < 0.5 ? 'm' : 'f', age: 15 + ((rand() * 6) | 0), servant: true }));
      households.push(hh);
    }

  return { foundersHouseholds, drawSize, populousHouseholds };
})();
