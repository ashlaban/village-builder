    const g5m = dead('m', 62, 30), g5f = dead('f', 64, 26); marry(R, g5m, g5f, 50, 30);
    const ragnhild = dead('f', 58, 2, { given: 'Ragnhild', father: g5m, mother: g5f }); marry(R, anders, ragnhild, 36, 4);
    const hakan = P({ given: 'Håkan', sex: 'm', age: 33, father: anders, mother: ragnhild }),
      signe = P({ given: 'Signe', sex: 'f', age: 30 }); marry(R, hakan, signe, 10);
    const margit = P({ given: 'Margit', sex: 'f', age: 8, father: hakan, mother: signe }),
      smaOlof = P({ given: 'Olof', sex: 'm', age: 5, father: hakan, mother: signe });
    // --- A3: died out six years ago, a couple and their baby ---
    const g6m = dead('m', 65, 30), g6f = dead('f', 63, 22); marry(R, g6m, g6f, 48, 30);
    const ivar = dead('m', 36, 6, { given: 'Ivar', father: g6m, mother: g6f }), gertrud = dead('f', 34, 6, { given: 'Gertrud' }); marry(R, ivar, gertrud, 9, 6);
    dead('m', 1, 6, { father: ivar, mother: gertrud });

    const households = [];
    households.push(makeHousehold(R, 0, A1, [lars, kerstin, jon, brita, gunnar], lars)); A1.line = lars;
    households.push(makeHousehold(R, 1, A2, [marta, karin], marta)); A2.line = nils2; // a widow holding for life
    households.push(makeHousehold(R, 2, A4, [hakan, signe, margit, smaOlof], hakan));
    households.push(makeHousehold(R, 3, B1, [erik, ingrid, sigrid, nils, per, elin], erik)); B1.line = ingrid;
    households.push(makeHousehold(R, 4, B3, [olof], olof));
    for (const [f, years, line, stage, state] of [[A3, 6, ivar, 'fallow', 'derelict'], [B2, 15, b2m, 'scrub', 'ruin']]) {
      f.household = null; f.state = state; f.emptySince = -years * YEAR; f.line = line; f.condition = Math.max(0.08, 1 - years * 0.075);
      for (const fd of f.fields) fd.stage = stage;
    }
    const st = makeState(w, S, R, households, farmsteads, villages, used, 'heirs');
    // village B grew up apart and leans its own way on some customs
    initCulture(st, { 1: { heirSex: { any: 0.35 }, handover: { death: 0.3 }, claims: { anyone: 0.25 }, voice: { heads: 0.2 } } }); countDemand(st);
    // herds by household: [household, cows, heifers, bull and oxen, ewes (and a ram with the bull)]
    heirsHerds(st, [[0, 3, 0, true, 6], [1, 1, 0, false, 3], [2, 2, 1, false, 0], [3, 3, 0, true, 6], [4, 1, 0, false, 0]]);
    placeMeadows(st); seedOutland(st, true);
    for (const f of [A3, B2]) birthright(st, f, f.line, f.emptySince); // the old families' birthright, from when the farms emptied (VB-033)
    log(st, `Debug scenario: ${vA.name} and ${vB.name}, with heirs, younger siblings and two empty farms.`, { kind: 'settled', n: R.pawns.length });
    splitStreams(st, seedNum); return st;
  }
  function makeState(w, S, R, households, farmsteads, villages, used, scenario) {
    seal();
    const rand = drawer(S); // the scenario's one seeding stream
    for (const p of R.pawns) p.events = p.events || [];
    // @state st.t: number; game time in hours since the start of year 1 (negative before it): st.tick / TICKS (sim/clock)
    // @state st.rng: {work, fields, weather, fences, births, deaths, culture, people, society, talk, herds, settle}: one random stream per
    //   system, each {s} as plain data (sim/rng); every call site names its system's. While seeding they are all one stream, also `seed`.
    // @state st.w: the world (see w.*). st.ECON: the economy table
    // @state st.scenario: string; 'founders', 'heirs' or 'populous'. st.weather: number; harvest weather factor, redrawn each year, about 0.75..1.2
    // (pawn.events: the positions of its events in st.record, in the order they were written; sim/records, VB-199)
    // @state st.pawns[]: {id, given, sex, born, died, father, mother, patronym, household, role, servant, retired, look, events[], alive, age,
    //   pregnantUntil, pregnantBy, nursingUntil (game hours or null; sim/births), hunger (0..1), hungerLog[] (last 12 daily shortfalls; sim/hunger),
    //   buffer (days of food a holder keeps before giving, 20..60; sim/help),
    //   health (0..100, float; drained by hunger, 0 is death by starvation; sim/hunger),
    //   kinPush ({to: kinLimit option key, w} or null; the marriage limit pull of the last moving round; sim/lifecycle),
    //   landWait (moving rounds waited for land in a crowded village, 0 otherwise; unset before the first round; sim/settle), ...}
    //   id = index; born and died in game hours (died null while living); father, mother, household are ids or null; culture fields att, anc,
    //   ties, tieT, homeHours; rel (sim/relations)
    // @state st.unions[]: {id, a, b, start, end, kind}; pawn ids a and b, game hours (end null while it lasts), kind 'marriage'
    // @state st.households[]: {id, farmstead, members[], holder, grain (rations), meals (rations of cooked food, ready to eat; sim/hunger),
    //   unthreshed[] (rations still in sheaf, one per field's crop), guardian (pawn id or null; set while a minor heir has not come of age;
    //   sim/heirs) and ward (the minor's id),
    //   wood (loads), stone (loads),
    //   ledger[] ({t, kind, n, good, pawn?, stake?}; sim/stores; signed movements by good; 'harvest', 'gift', 'meat', 'milk', 'butter' (rations made;
    //   sim/byre)); kinds not in Stores.ROUTINE only (VB-204), kept three years and emptied when the household dissolves,
    //   totals[] ({year, kind, good, n, count}; sim/stores; the routine kinds summed per calendar year, kind and good, n signed; three years),
    //   hungryDays, seedSeason (the season the seed was last eaten in and told; sim/hunger), hunger (mean of members'), waterDay, cookDay, dissolved,
    //   herds[] (ids into st.herds), hay (units in the barn), haySpoilt (hay lost in store since the start; sim/byre),
    //   larder[] ({kind 'meat'|'salt meat'|'milk'|'butter' (rules FOODS), n (rations), until}: stored food lots;
    //   sim/hunger), fodderDay (the last day the animals were fed in the byre; sim/byre), milkDay (the last day the cows were milked; VB-135),
    //   manure (loads on the heap by the byre; VB-137), spoilt (rations of grain lost in store since the start; sim/hunger)}
    // @state st.farmsteads[]: {id, house, fields[], village, household, name, rowAngle, fence, woodlot, line, state, condition, emptySince}
    //   house is a tile index; project {tile, stage 'clear'|'break'|'meadow', hours} or null (the field or meadow in the making, its tile
    //   staked by the household until it is made; sim/fields, sim/meadows, sim/stakes); claim (an empty farm being restored by its claimant;
    //   sim/farmclaims); meadows[] {id, tile, stage 'grass'|'mown'|'aftermath',
    //   fert, raked, mown (day), held} (hay meadows; sim/meadows);
    //   fields[] {id, tile, stage, sown, reaped, held, fert, soil (0.75..1.4: worn by harvests, raised by manure to 1.15; a field
    //   broken on ground never farmed starts at 1.4; VB-137, VB-149), weedOpen,
    //   weedPosted (day), weedMiss (jobs missed)};
    //   state 'occupied', 'derelict' or 'ruin'; condition 0..1;
    //   booth {i (cottage stages done of foundation, walls, roof), done (hours on the open stage)} or null: settlers live in a booth until
    //   their cottage is built (sim/settle, sim/expansion)
    // @state st.villages[]: {id, name, center, farmsteads[], fence, commonsWood, grain, ledger[], totals[] (as a household's), green, well};
    //   center is a tile index, farmsteads are ids;
    //   grain: the village store, in rations (sim/help); green, well: booleans; a one-farm village has neither
    //   plots[] (sim/expansion): {id, village, intended (pawn id), hours {pawn id: hours worked}, done (cleared), holder (pawn id or null),
    //   started, cottage {i (stages done of foundation, walls, roof), done (hours on the open stage)} once cleared, built (the roof is on;
    //   farmstead is then its id; sim/cottage),
    //   tiles[] {tile, kind 'house'|'field', steps[] of 'fell'|'grub'|'clear'|'break', i (steps done), fresh (a field broken on ground never
    //   farmed; VB-149)}}; a plot is cleared for those who want out
    //   crowded: adults of the village waiting for land with no room for a plot, at the last moving round (0 when not crowded; sim/settle);
    //   founded {t, from (village id), by (pawn id)} for a village founded in play by settlers, else null (sim/settle)
    // @state st.owner: Int32Array of tile owners (see sim/ownership). st.claims, st.claimSeq, st.landDirty: see sim/claims
    // @state st.cairns: Map of tile to {a (village that won it), b (village that lost it), t (game hours)}: the marks of settled borders (sim/territory)
    // @state st.makeFields: boolean; households start projects for new fields and meadows (every scenario since the balance review, 1 Nov 2026;
    //   tests may turn it off; see sim/fields, sim/meadows)
    // @state st.used: Set of tile indexes taken by houses and fields
    // @state st.jobs: Map of job key to open job; st.jobSeq: number; counter for job ids. A job: {id, key, kind, owner, site, done (work hours),
    //   claims[] (ids of the pawns working it, at most KINDS[kind].hands; VB-102), posted, live, and its source's fields (field, farm, plot, ...)}
    // @state st.jobsBy: Map of owner ('household:<id>' or 'village:<id>') to the Set of its open jobs (by id);
    //   kept with st.jobs by post and dropJob
    // @state st.meetingLog[]: {year, text}; newest first. (The village log is a view of st.record: sim/notable, villageLog.)
    // @state st.record[]: {t, kind, pawn, other, household, farm, village, n, text, self}; every event, append-only (sim/records, VB-075);
    //   seeding writes the history before the start (births, deaths, marriages), in time order, and who holds each farm at the start.
    //   A routine event's slot becomes, once folded, the index of its count in st.recordYears (VB-199); slots are never removed.
    // @state st.pathCache: Map of route key (from * w.N + to) to path (tiles, both ends included; sim/routes), LRU oldest first, at most ROUTE.cacheMax.
    // @state st.routeFallbacks: number; routes not found within ROUTE.reach, walked straight
    // @state st.routeDirty: Set of tile indexes whose walking cost changed today; the cached routes they touch are dropped at the end of the day
    // @state st.talks: number; talks since the start (sim/relations)
    // @state st.driftMul: number; multiplier on attitude drift, set by the page. st.naturalDeaths: boolean; set by the page
    // @state st.player: null, or the pawn the player inhabits and its queue of commands (see sim/commands)
    // @state st.offers, st.offerSeq: the open marriage offers and the next offer's id (see sim/lifecycle)
    // @state st.demand: array of pawn ids who want to move out. recomputed by countDemand(st) (sim/heirs)
    // @state st.agents[]: {id, x, y, path, seg, phase, job, inside, anim, carry, face, stride, ox, oy, work, idleUntil, talk (sim/relations)};
    //   one per pawn, map units
    // @state st.visualDirty: boolean; set when the map must be redrawn. st.rigDirty: Set; marks changed farms or people for the page to rebuild
    // @state st.regrow: Set of tile indexes with some but not all trees, which grow back daily (see sim/forest)
    // @state st.pathDirty: Set of tile indexes whose worn-path stage (w.worn) changed; the page repaints them and clears it
    // @state st.treeDirty,biomeDirty: Set of tile indexes whose tree density stage changed, or that turned to meadow; the page repaints them
    // @state st.cenv: {t, cultures[], settlements[], people[], driftMul, ...}; the Culture environment (see culture.js), plain data;
    //   its lookups are hooks(st) (sim/society)
    // @state culture.namePrefs: {farm: [generator names of sim/names, preferred first]}; each culture's order of preference among farm names (VB-026)
    const st = {
      t: 6, tick: 6 * TICKS, tickPart: 0, rng: seeding(S), w, ECON, pawns: R.pawns, unions: R.unions, households, farmsteads, villages, used, scenario,
      makeFields: true, jobs: new Map(), jobsBy: new Map(), jobSeq: 0, weather: 0.85 + rand() * 0.3, record: [],
      recordYears: [], recordFold: { shortAt: 0, longAt: 0, pass: null },
      pathCache: new Map(), routeFallbacks: 0, routeDirty: new Set(),
      talks: 0, driftMul: 1, naturalDeaths: true, player: null, demand: [], meetingLog: [], herds: [], headSeq: 0,
      agents: R.pawns.map((p) => ({
        id: p.id, x: 0, y: 0, path: null, seg: 0, phase: null, job: null, inside: true, anim: 'idle', carry: null, face: 1, stride: rand() * 6,
        ox: (rand() - 0.5) * 12, oy: (rand() - 0.5) * 8, work: null, idleUntil: 0, talk: null,
      })),
      visualDirty: false, rigDirty: new Set(), regrow: new Set(), treeDirty: new Set(), biomeDirty: new Set(), pathDirty: new Set(),
      claims: new Map(), claimSeq: 0, landDirty: new Set(), cairns: new Map(), offers: [], offerSeq: 0,
    };
    rebuildLiving(st);
    seedPlans(st);
    for (const v of villages) { v.plots = []; v.crowded = 0; v.founded = null; }
    seedOwners(st);
    refreshRoles(st);
    for (const hh of st.households) hh.meals = 2 * dailyNeed(st, hh); // two days of meals to start with
    for (const a of st.agents) if (!st.pawns[a.id].died) placeAtHome(st, a);
    // the record's history before the start: births, deaths and marriages of the people on record, in time order
    const before = [];
    for (const p of st.pawns) {
      const hh = p.household !== null && p.household !== undefined ? atHousehold(st, st.households[p.household]) : {};
      before.push([p.born, { kind: 'born', pawn: p.id, other: p.mother, ...(p.died === null ? hh : {}) }]);
      if (p.died !== null) before.push([p.died, { kind: 'died', pawn: p.id, text: 'before the record' }]);
    }
    for (const u of st.unions) before.push([u.start, { kind: 'married', pawn: u.a, other: u.b }]);
    // and who holds each farm at the start, so a farm's history names every holder it has had (VB-099)
    for (const hh of st.households) if (hh.holder !== null && !hh.dissolved) before.push([st.t, { kind: 'holds', pawn: hh.holder, ...atHousehold(st, hh) }]);
    before.map((e, i) => [...e, i]).sort((a, b) => a[0] - b[0] || a[2] - b[2]).forEach(([t, ev]) => record(st, ev, t));
    // a living pawn's events begin with its birth (VB-199: positions in the record)
    st.record.forEach((e, i) => { if (e.kind === 'born' && st.pawns[e.pawn].died === null) st.pawns[e.pawn].events.unshift(i); });
    return st;
  }

  function seed(w, seedNum, scenario = 'founders') {
    return scenario === 'heirs' ? seedHeirs(w, seedNum) : scenario === 'populous' ? seedPopulous(w, seedNum) : seedFounders(w, seedNum);
  }
  return { seedFounders, seedHeirs, seedPopulous, makeState, seed };
})();

<script>
// @sys sim/clock: the hourly step, end of day, new year and Sim.advance
VB['sim/clock'] = (() => {
  const { next: rnd } = VB['sim/rng'];
  const { DAY, YEAR_DAYS, YEAR, TICKS, cal, WORK, dark, SOCIAL } = VB['sim/rules'];
  const { log, foldHistory } = VB['sim/records'];
  const { growTrees } = VB['sim/forest'];
  const { fieldsDay } = VB['sim/fields'];
  const { refreshRoutes, costChanged } = VB['sim/routes'];
  const { fadeWear } = VB['sim/paths'];
  const { feedHousehold, spoilGrain } = VB['sim/hunger'];
  const Stores = VB['sim/stores'];
  const { reviewHour } = VB['sim/plans'];
  const { shareFood } = VB['sim/help'];
  const { placeByDoor, release, stepAgents } = VB['sim/agents'];
  const { refreshJobs, callCooks, lookUp, planRound, idleAbout } = VB['sim/jobs'];
  const { issue, commanded, unplanned, playerStep } = VB['sim/commands'];
  const { talkHour } = VB['sim/relations'];
  const { outdoors } = VB['sim/society'];
  const { meetingStage, MEETING_STAGES, roundPhase, ROUND_PHASES, dailyLife, nightCulture, dueOffers } = VB['sim/lifecycle'];
  const { dailyBirths } = VB['sim/births'];
  const { herdsDay } = VB['sim/herds'];
  const { meadowsDay } = VB['sim/meadows'];
  const { byreDay } = VB['sim/byre'];
  const { lapseClaims } = VB['sim/claims'];
  const { lapsedStakes } = VB['sim/stakes'];
  const { lapsedFarmClaims } = VB['sim/farmclaims'];
  function onHour(st, h, c) {
    if (st.cenv && h >= SOCIAL.talk.from && h < SOCIAL.talk.to) talkHour(st, h, outdoors(st)); // talk, and the hours at home (sim/relations)
    if (h === Math.ceil(dark(c)[1])) { // the dark ends: everyone indoors is by their door
      for (const id of st.living) {
        const a = st.agents[id];
        if (a.inside && !a.job) placeByDoor(st, a);
      }
    }
    if (reviewHour(h)) refreshJobs(st, c); // the review of the standing plans (sim/plans)
    if (h >= 14 && h < WORK[1]) callCooks(st, c);
    if (h >= WORK[0] && h < WORK[1]) lookUp(st, c); // more urgent work interrupts a job (VB-107)
    if (h === WORK[1]) for (const liveId of st.living) {
      const a = st.agents[liveId];
      if (st.pawns[a.id].died) continue;
      if (a.phase === 'back') continue; // finish the delivery first
      if (commanded(st, a.id)) continue; // the player's command says otherwise (VB-169)
      release(st, a);
      if (!a.inside) issue(st, { actor: a.id, verb: 'goHome', source: 'planner' });
    }
    if (h === 0) {
      endOfDay(st, c); herdsDay(st, c); meadowsDay(st, c); byreDay(st, c); // the animals (sim/herds, sim/meadows, sim/byre)
      if (st.cenv) { dailyLife(st, c); dailyBirths(st); dueOffers(st); } // marriage offers due close (sim/lifecycle, VB-272)
      if (c.doy === 0) newYear(st, c);
      foldHistory(st, c); // the record's routine events, folded over the year's first days (sim/records, VB-199)
    }
  }
  function endOfDay(st, c) {
    const E = st.ECON;
    shareFood(st);
    for (const liveId of st.liveHouseholds) {
      const hh = st.households[liveId];
      if (hh.dissolved) continue;
      feedHousehold(st, hh); spoilGrain(st, hh);
      hh.wood = Math.max(0, hh.wood - E.woodUse[c.season]);
    }
    Stores.villageDay(st); // it spoils too (balance review)
    growTrees(st);
    const lapsed = lapseClaims(st); // unworked claims fade out after 3 years (sim/claims)
    lapsedStakes(st, lapsed); lapsedFarmClaims(st, lapsed); // a lapsed stake ends its project, a lapsed claim on an empty farm the claim
    fadeWear(st, (tile) => costChanged(st, tile)); // a path that changes stage changes the cost of walking it
    refreshRoutes(st);
    fieldsDay(st, c);
    const decay = E.fenceDecay[c.season];
    const all = [...st.villages.flatMap((v) => v.fence), ...st.farmsteads.flatMap((f) => f.fence || [])];
    // Empty buildings lose about 8% a year; not while a claimant mends the farm (VB-033).
    for (const f of st.farmsteads) if (f.household === null && !f.claim) {
      f.condition = Math.max(0, (f.condition ?? 1) - 0.08 / YEAR_DAYS);
      if (f.state === 'derelict' && f.condition < 0.15) { f.state = 'ruin'; st.visualDirty = true; }
    }
    for (const s of all) {
      const before = s.cond; s.cond = Math.max(0, s.cond - decay * (0.5 + rnd(st.rng.fences))); if ((before >= 0.45) !== (s.cond >= 0.45)) s.dirty = true;
    }
  }
  function newYear(st, c) {
    st.weather = 0.75 + rnd(st.rng.weather) * 0.45;
    const word = st.weather > 1.05 ? 'promises a good year' : st.weather < 0.88 ? 'looks poor' : 'looks ordinary';
    log(st, `Year ${c.year} begins. The weather ${word}.`, { kind: 'year', n: c.year });
    // Historical ledgers of dissolved households still expire at the new year.
    Stores.prune(st);
  }
  // ---- the clock (VB-235) ----
  // @state st.tick: integer >= 0; the 6-minute steps done since hour 0, the clock's source of truth: an hour begins when st.tick % TICKS
  //   is 0, and the hour, the day and the year the clock is working through are read from it (Math.floor(st.tick / TICKS) is the hour).
  // @state st.tickPart: 0 always. VB-235's part of a step went back to the page (VB-244); the field stays only so the golden file is
  //   unchanged (dropping it re-records that file's tickPart key alone), and a save that carries a part loads at its last whole step.
  // @state st.t is st.tick / TICKS, written here only.
  const STEPS_A_DAY = DAY * TICKS, mod = (x, m) => ((x % m) + m) % m;
  // Each 6-minute step that ends here: the hour it begins (onHour), then the steps of the day (sim/lifecycle): the night's culture, a
  // settlement a step after midnight (VB-201); from noon of autumn day 10, the meetings' stages (customs, then the outland; VB-206); from
  // noon of day 11, the moving round's phases (VB-201). The step of the day says what is due, so a save between two of them goes on.
  function stepEnds(st) {
    const k = st.tick, hour = Math.floor(k / TICKS);
    if (k % TICKS === 0) onHour(st, mod(hour, DAY), cal(hour));
    if (!st.cenv) return;
    const n = mod(k, STEPS_A_DAY), r = n - 12 * TICKS;
    nightCulture(st, n);
    if (r >= 0 && r < Math.max(MEETING_STAGES, ROUND_PHASES)) {
      const kc = cal(hour);
      if (kc.season === 2 && kc.sday === 9 && r < MEETING_STAGES) meetingStage(st, r);
      else if (kc.season === 2 && kc.sday === 10 && r < ROUND_PHASES) roundPhase(st, r);
    }
  }
  // The clock's arithmetic: moves st by `hours`, which must be whole 6-minute steps, a step at a time, calling each(st) after each. The
  // page keeps the part of a step its frames have asked for and draws the pawns between steps (VB-244), so a seed is the same run in the
  // page at any frame rate as headless. hours * TICKS is a float (0.7 * 10 is 7.000000000000001): it is taken as the whole number it is
  // meant to be, so a run is the same by any chunks of whole steps. Any other number of hours, or a negative one, is refused with an
  // error, not rounded (the orchestrator's choice for Kim, VB-244).
  function stepsIn(hours) {
    const x = hours * TICKS, n = Math.round(x);
    if (!(Math.abs(x - n) < 1e-6) || n < 0) throw new Error(`advance: ${hours} hours is not a whole number of 6-minute steps`);
    return n;
  }
  function ticking(st, hours, each) {
    for (let n = stepsIn(hours); n > 0; n--) { st.tick++; st.t = st.tick / TICKS; each(st); }
  }
  function step(st) {
    stepEnds(st);
    playerStep(st); // the player's queue goes before the pawn's own logic (VB-169)
    const c = cal(st.t), all = stepAgents(st, c), idle = st.player ? all.filter((a) => !unplanned(st, a.id)) : all;
    if (idle.length) { const got = planRound(st, idle, c); for (const a of idle) if (!got.has(a)) idleAbout(st, a); }
  }
  const advance = (st, hours) => ticking(st, hours, step);
  return { onHour, endOfDay, newYear, advance, ticking, stepsIn };
})();
</script>
<script>
// @sys sim/saves: saving and loading a run (VB-074): the state as JSON-compatible data, with shared objects, Maps, Sets and typed arrays kept
VB['sim/saves'] = (() => {
  const { setBiome } = VB['gen'];
  const { seal } = VB['sim/registry'];
  const { trimRoutes } = VB['sim/routes'];
  const { rebuildLiving, indexEvents } = VB['sim/records'];

    let d;
    try {
      const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
      d = JSON.parse(head[0] === 0x1f && head[1] === 0x8b ? await gunzip(blob) : await blob.text());
    } catch (e) { return { refused: 'This is not a save of the game.' }; }
    if (!d || !(d.save || (d.format && d.state))) return { refused: 'This is not a save of the game.' };
    if (d.build !== BUILD) return { refused: 'Made by another build of the game; it cannot be loaded.', otherBuild: true };
    return { save: d.save };
  }
  // Goes on from a save read from a slot or a file; a file's run takes no slot until it is saved (Kim, 10 Nov).
  async function loadBlob(blob) {
    const r = blob ? await readSave(blob) : { refused: 'That save is gone.' };
    if (r.save && !building) { openPanel(null); await build(r.save.seed, r.save.scenario, sizeKey(r.save.cols, r.save.rows), r.save); }
    return r;
  }
  const loadStored = async (key) => { const rec = await saveTx('readonly', (m, b) => b.get(key)); return loadBlob(rec && rec.blob); };
  async function saveToFile() {
    if (!st || building) return;
    const s = st, p = await packSave(s), a = document.createElement('a'), url = URL.createObjectURL(p.blob);
    a.href = url; a.download = `${s.w.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${s.scenario}-${s.w.seed}-year${Sim.cal(s.t).year}.json.gz`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  // ---- the Saves overlay (Kim, 10 Nov), opened from the menu and from the generation screen: the open archipelago first, with its four
  // slots to save to, then each other archipelago's saves, newest first. Continue and Delete a save, or delete an archipelago's saves at
  // once. A save of another build cannot be loaded: it offers Delete it, and Start a new game on the same archipelago. ----
  const savedWhen = (ms) => new Date(ms).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  const OTHER_BUILD = 'Made by another build of the game; it cannot be loaded.';
  const slotName = (slot) => (slot === 'auto' ? 'Auto' : `Slot ${slot}`);
  const saveBtn = (act, value, text) => `<button type="button" data-${act}="${esc(value)}">${text}</button>`;
  function slotRow(slot, l, open) {
    const what = !l ? '<small>empty</small>' : `${esc(l.label.split('): ')[1] || l.label)}<small>${savedWhen(l.savedAt)}, ${
      (l.bytes / 1048576).toFixed(2)} MB</small>${l.build !== BUILD ? `<small class="save-other">${OTHER_BUILD}</small>` : ''}`;
    const acts = (open && slot !== 'auto' ? saveBtn('save', slot, l ? 'Overwrite' : 'Save') : '') + (!l ? ''
      : l.build === BUILD ? saveBtn('load', l.key, 'Continue') + saveBtn('del', l.key, 'Delete')
        : saveBtn('del', l.key, 'Delete it') + saveBtn('new', l.key, 'Start a new game'));
    return `<div class="save-slot"><b>${slotName(slot)}</b><span>${what}</span><div class="save-acts">${acts}</div></div>`;
  }
  let saveMsg = '', saveLines = [];
  async function drawSaves() {
    const box = $('savesBody');
    try { saveLines = await listSaves(); } catch (e) { box.innerHTML = '<p class="save-msg">Saves are not available in this browser.</p>'; return; }
    const archs = new Map(), open = st ? archOf(st) : null;
    for (const l of saveLines) { if (!archs.has(l.arch)) archs.set(l.arch, []); archs.get(l.arch).push(l); }
    const newest = (ls) => Math.max(...ls.map((l) => l.savedAt));
    const section = (arch, head, ls, isOpen) => `<section class="save-arch"><h3>${esc(head)}${
      ls.length ? saveBtn('delarch', arch, 'Delete archipelago') : ''}</h3>${
      SAVE_SLOTS.map((s) => [s, ls.find((l) => l.slot === s)]).filter((x) => isOpen || x[1]).map(([s, l]) => slotRow(s, l, isOpen)).join('')}</section>`;
    const others = [...archs].filter(([a]) => a !== open).sort((a, b) => newest(b[1]) - newest(a[1]));
    box.innerHTML = (st ? section(open, saveLabel(st).split('): ')[0] + '), the game open now', archs.get(open) || [], true) : '')
      + others.map(([a, ls]) => section(a, ls[0].label.split('): ')[0] + ')', ls, false)).join('')
      + (st || others.length ? '' : '<p class="save-msg">No saved games yet.</p>')
      + `<div class="save-acts save-files">${st ? saveBtn('file', 'save', 'Save to file') : ''}${saveBtn('file', 'load', 'Load file')}</div>`
      + (saveMsg ? `<p class="save-msg" role="status">${esc(saveMsg)}</p>` : '');
  }
  function showSaves(on) {
    $('savesScreen').hidden = !on;
    if (on) { saveMsg = ''; openPanel(null); drawSaves(); $('savesClose').focus(); }
  }
  const saveFile = document.createElement('input');
  saveFile.type = 'file'; saveFile.accept = '.gz,.json,application/gzip,application/json'; saveFile.hidden = true; document.body.appendChild(saveFile);
  // Goes on from a slot or a file, and closes the overlay; a refusal is said in it.
  async function loadFrom(blobOf) {
    if (building) return;
    $('savesScreen').hidden = true;
    const r = await blobOf();
    if (r.refused) { showSaves(true); saveMsg = r.refused; drawSaves(); }
  }
  saveFile.addEventListener('change', () => { const f = saveFile.files[0]; saveFile.value = ''; if (f) loadFrom(() => loadBlob(f)); });
  $('savesBody').addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b || building || skipping) return;
    const d = b.dataset;
    try {
      if (d.save) { const l = await storeSave(d.save); saveMsg = l ? `Saved to ${slotName(l.slot).toLowerCase()}.` : ''; }
      else if (d.load) { loadFrom(() => loadStored(d.load)); return; }
      else if (d.del) { await deleteSaves([d.del]); saveMsg = ''; }
      else if (d.delarch) { await deleteSaves(saveLines.filter((l) => l.arch === d.delarch).map((l) => l.key)); saveMsg = ''; }
      else if (d.new) { const l = saveLines.find((x) => x.key === d.new); if (l) { showSaves(false); build(l.seed, l.scenario, l.size); } return; }
      else if (d.file === 'save') { await saveToFile(); saveMsg = 'Saved to a file.'; }
      else if (d.file === 'load') { saveFile.click(); return; }
    } catch (err) { console.warn('save failed', err); saveMsg = 'The save could not be written.'; }
    drawSaves();
  });
  $('savesBtn').addEventListener('click', () => { if (!building && !skipping) showSaves(true); });
  $('savesClose').addEventListener('click', () => showSaves(false));
  $('savesScreen').addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); showSaves(false); } });
  // When the page is hidden the run is saved to its auto slot, unless nothing has passed since the last one.
  let autoAt = -1, autoOf = null;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden' || !st || building || skipping || (autoOf === st && autoAt === st.t)) return;
    autoOf = st; autoAt = st.t;
    storeSave('auto').catch((err) => console.warn('autosave failed', err));
  });
  // ---- frame loop ----
  let time = 0;
  const lodEl = $('lod');
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  let frameErrAt = -1e9;
  const onFrame = (tk) => {
    if (!w) return;
    const dt = Math.min(0.05, tk.deltaMS / 1000);
    time += dt; frameNo++;
    if (intro) {
      intro.t += dt;
      const k = ease(clamp(intro.t / intro.d, 0, 1));
      cam.x = intro.x0 + (intro.x1 - intro.x0) * k; cam.y = intro.y0 + (intro.y1 - intro.y0) * k;
      cam.z = Math.exp(Math.log(intro.z0) + (Math.log(intro.z1) - Math.log(intro.z0)) * k); zt = cam.z;
      if (intro.t >= intro.d) intro = null;
    }
    if (Math.abs(zt - cam.z) > 1e-4) zoomAt(anchor.x, anchor.y, (cam.z + (zt - cam.z) * Math.min(1, dt * 14)) / cam.z);
    if (!drag && !pinch) {
      cam.x += vel.x * dt; cam.y += vel.y * dt;
      const decay = Math.exp(-dt * 4.5); vel.x *= decay; vel.y *= decay;
    }
    if (keys.size) {
      const sp = 700 / cam.z;
      if (keys.has('arrowleft') || keys.has('a')) cam.x -= sp * dt;
      if (keys.has('arrowright') || keys.has('d')) cam.x += sp * dt;
      if (keys.has('arrowup') || keys.has('w')) cam.y -= sp * dt;
      if (keys.has('arrowdown') || keys.has('s')) cam.y += sp * dt;
    }
    if (followPlayed && st && !intro && !drag && !pinch) followCamera();
    clampCam();
    world.scale.set(cam.z);
    world.position.set(app.screen.width / 2 - cam.x * cam.z, app.screen.height / 2 - cam.y * cam.z);

    T = levelFor(cam.z, T);
    // paint in bigger slices while the view is still; keep frames smooth while it moves
    const busy = intro || drag || pinch || keys.size || Math.abs(vel.x) + Math.abs(vel.y) > 2 || Math.abs(zt - cam.z) > 1e-3;
    if (!building) schedule(intro ? 14 : busy ? 9 : 22);
    display();
    lodEl.hidden = pending === 0;
    if (pending) lodEl.textContent = `Painting detail, ${pending} ${pending === 1 ? 'area' : 'areas'} left`;

    // sea: the rows of wave scrolls only once they are big enough not to shimmer
    const wa = clamp((cam.z - 0.14) / 0.3, 0, 1);
    L.waves.visible = wa > 0.01;
    if (!reduceMotion) waves[0].tilePosition.x += 5 * dt;
    waves[0].alpha = (0.42 + (reduceMotion ? 0 : 0.06 * Math.sin(time * 0.8))) * wa;
    // clouds: visible on the overview, thinning out as you descend
    const zm = zMin(), fade = clamp((zm * 2.3 - cam.z) / (zm * 1.3), 0, 1);
    L.clouds.visible = L.shadows.visible = fade > 0.01;
    L.clouds.alpha = 0.85 * fade; L.shadows.alpha = 0.16 * fade;
    for (const c of clouds) {
      if (!reduceMotion) { c.spr.x += c.vx * dt; c.spr.y += c.vy * dt; }
      const hw = c.spr.width / 2;
      if (c.spr.x - hw > w.W + 200 * w.KS) c.spr.x = -hw - 200 * w.KS;
      c.sh.x = c.spr.x + 120 * w.KS; c.sh.y = c.spr.y + 90 * w.KS;
    }
    updateGrid();
    updateSettlement(dt);
    L.regions.alpha = clamp(1.25 - cam.z, 0.35, 1);
    if (hoverDirty || sel >= 0) { drawHover(); hoverDirty = false; }
    drawMinimapView();
  };
  // Pixi stops its ticker for good when a frame throws; catch it, say so, and keep the game running.
  app.ticker.add((tk) => {
    try { onFrame(tk); }
    catch (e) {
      console.error(e);
      if (performance.now() - frameErrAt > 5000) {
        frameErrAt = performance.now(); lodEl.hidden = false; lodEl.textContent = `Something went wrong in a frame: ${e.message}`; }
    }
  });

  // The page opens on the generation screen. A hash skips it: #<scenario><size><seed>, scenario s (founders), h (heirs) or p (populous),
  // size t, s, m or l (medium if left out); e.g. #s123, #h123, #pt123 (populous, tiny). #123 is founders on a medium map.
  const hm = location.hash.match(/^#([shp]?)([tsml]?)(\d{1,9})$/);
  if (hm) build(+hm[3], { s: 'founders', h: 'heirs', p: 'populous', '': 'founders' }[hm[1]], hm[2] || 'm');
  else showLanding();
})();
</script>
</body>
</html>
