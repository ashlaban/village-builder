<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archipelago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@1,500;1,700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --sea: #16395f;
  --panel: rgba(238, 245, 242, 0.88);
  --ink: #17313a;
  --muted: #526d75;
  --edge: rgba(23, 49, 58, 0.14);
  --accent: #23685a;
  --on-accent: #f2f8f6;
  --node: #fbfdfc;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(11, 27, 34, 0.86);
    --ink: #e1ebe7;
    --muted: #93adae;
    --edge: rgba(225, 235, 231, 0.14);
    --accent: #84c9b5;
    --on-accent: #0c1f25;
    --node: #17323b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(11, 27, 34, 0.86);
  --ink: #e1ebe7;
  --muted: #93adae;
  --edge: rgba(225, 235, 231, 0.14);
  --accent: #84c9b5;
  --on-accent: #0c1f25;
  --node: #17323b;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; background: var(--sea); scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; overflow: hidden; background: var(--sea); color: var(--ink);
  font-family: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#stage canvas { display: block; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(5, 18, 30, 0.38) 100%); }
.hud { position: fixed; left: 0; right: 0; display: flex; justify-content: space-between; gap: 12px; padding: 14px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud.top { top: 0; align-items: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
.hud.bottom { bottom: 0; align-items: flex-end; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
.panel {
  background: var(--panel); color: var(--ink); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(3, 16, 26, 0.28);
}
.chart { border-radius: 18px; padding: 12px 16px 14px; max-width: 330px; }
.chart h1 { font-family: 'Alegreya', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700; font-size: 32px; line-height: 1.05; margin: 0; }
.chart .meta { margin: 3px 0 0; color: var(--muted); font-size: 15px; }
.chart .hint { margin: 2px 0 12px; color: var(--muted); font-size: 14px; line-height: 1.35; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.lod { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); font-size: 13px; color: rgba(235, 244, 241, 0.85); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); pointer-events: none; }
.hud.top { flex-wrap: wrap; }
.clock { border-radius: 14px; padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 12px; }
.clock strong { display: block; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 19px; line-height: 1.1; }
.clock span { display: block; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.speed { display: flex; gap: 4px; }
.speed button { padding: 5px 10px; font-size: 14px; }
.speed button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.settlers { margin-top: 12px; max-height: min(50vh, 440px); overflow-y: auto; border-top: 1px solid var(--edge); padding: 2px 4px 0 0; }
.settlers h2 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 19px; line-height: 1.2; margin: 12px 0 2px; }
.settlers h2 span { font-family: 'Alegreya Sans', system-ui, sans-serif; font-style: normal; font-weight: 400; font-size: 14px; color: var(--muted); }
.settlers p { margin: 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
.settlers ul { list-style: none; margin: 4px 0 0; padding: 0; }
.settlers li { font-size: 14px; line-height: 1.55; color: var(--muted); }
.settlers li button { border: 0; border-radius: 3px; padding: 0; background: none; font-size: 15px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; }
.settlers .log p { margin-top: 3px; }
.settlers .jobs { color: var(--ink); opacity: 0.85; }
.settlers .doing { font-size: 13px; font-style: italic; }
.tree { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(6, 18, 26, 0.55); padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.tree[hidden] { display: none; }
.tree-card { width: min(1120px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; }
.tree-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 14px 18px; border-bottom: 1px solid var(--edge); }
.tree-head h2 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0; }
.tree-head p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; min-width: 12ch; }
.tree-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; flex: 1; }
.tree-scroll { overflow: auto; padding: 10px; min-height: 220px; }
.tree-info { border-left: 1px solid var(--edge); padding: 14px 18px 18px; overflow: auto; }
.tree-info h3 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 22px; margin: 0 0 6px; }
.tree-info p { margin: 0 0 6px; font-size: 15px; line-height: 1.45; }
.tree-info .hint { color: var(--muted); }
.tree-info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 12px 0 16px; font-size: 15px; line-height: 1.4; }
.tree-info dt { color: var(--muted); }
.tree-info dd { margin: 0; }
.tree-info dd button { border: 0; padding: 0; background: none; font-size: 15px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; border-radius: 3px; }
#treeSvg text.n { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 15px; fill: var(--ink); }
#treeSvg text.s { font-family: 'Alegreya Sans', system-ui, sans-serif; font-size: 12.5px; fill: var(--muted); }
#treeSvg .tn { cursor: pointer; }
#treeSvg .tn rect { fill: var(--node); stroke: var(--edge); stroke-width: 1; }
#treeSvg .tn.sel rect { stroke: var(--accent); stroke-width: 2.5; }
#treeSvg .tn:focus { outline: none; }
#treeSvg .tn:focus-visible rect { stroke: var(--accent); stroke-width: 3; }
#treeSvg .marriage, #treeSvg .descent { fill: none; stroke: var(--muted); stroke-width: 1.5; }
#treeSvg .ring { fill: none; stroke: var(--accent); stroke-width: 1.5; }
#treeSvg .marriage.ended { stroke-dasharray: 4 3; }
#treeSvg .tn.dead rect { opacity: 0.55; }
#treeSvg .tn.dead text { opacity: 0.7; }
#treeSvg .heir { fill: #c9a24a; }
.tree-info .evs { margin: 0 0 14px; padding-left: 18px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.actions select { font: inherit; font-size: 15px; color: var(--ink); background: var(--node); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 10px; max-width: 100%; }
.drawer { position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 86px); width: min(420px, calc(100vw - 28px)); max-height: calc(100vh - 230px); overflow: auto; border-radius: 16px; padding: 12px 14px 16px; z-index: 6; }
.drawer[hidden] { display: none; }
.drawer .dclose { position: sticky; top: 0; float: right; }
.drawer .dh { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 22px; margin: 2px 0 6px; }
.drawer .dh3 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 18px; margin: 14px 0 4px; }
.drawer .dm { margin: 0 0 6px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.drawer .dm strong { color: var(--ink); font-weight: 600; }
.cust { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0 6px; }
.cust th, .cust td { text-align: left; vertical-align: top; padding: 6px 4px; border-top: 1px solid var(--edge); }
.cust thead th { font-weight: 600; border-top: 0; }
.cust tbody th { font-weight: 500; }
.cust td.dev { background: rgba(201, 162, 74, 0.16); }
.sbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; background: var(--edge); }
.sbar i { display: block; height: 100%; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 3px 0 6px; vertical-align: -1px; }
.mall { color: var(--muted); letter-spacing: 1px; font-size: 11px; }
.dbg-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.dbg-row button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.drawer select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); max-width: 100%; }
.dchk { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 8px 0; }
@media (max-width: 640px) { .drawer { left: 8px; right: 8px; width: auto; top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); max-height: 62vh; } }
@media (max-width: 760px) { .tree { padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px calc(env(safe-area-inset-bottom, 0px) + 8px); } .tree-body { grid-template-columns: 1fr; } .tree-info { border-left: 0; border-top: 1px solid var(--edge); max-height: 46vh; } .tree-head h2 { font-size: 21px; } }
@media (max-width: 640px) { .lod { display: none; } }
button {
  font: inherit; font-size: 15px; font-weight: 500; line-height: 1.2; color: var(--ink);
  background: transparent; border: 1px solid var(--edge); border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button[aria-pressed="false"] { color: var(--muted); }
button:disabled { opacity: 0.55; cursor: progress; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile { border-radius: 14px; padding: 10px 14px; min-width: 170px; transition: opacity 0.2s; }
.tile[hidden] { display: block; opacity: 0; pointer-events: none; }
.tile strong { display: block; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 21px; line-height: 1.1; }
.tile span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.minimap { position: relative; width: 200px; border-radius: 10px; overflow: hidden; cursor: crosshair; touch-action: none; padding: 0; }
.minimap canvas { display: block; width: 100%; height: auto; }
.minimap #mmView { position: absolute; inset: 0; height: 100%; }
.loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--sea); color: #e3eeea; transition: opacity 0.7s; }
.loader.done { opacity: 0; pointer-events: none; }
.loader p { margin: 0; text-align: center; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-size: 22px; }
.loader .bar { width: min(280px, 70vw); height: 3px; margin-top: 14px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, 0.16); }
.loader .bar i { display: block; height: 100%; width: 0; background: #9fd6c6; }
.err { max-width: 34ch; font-family: 'Alegreya Sans', system-ui, sans-serif !important; font-style: normal !important; font-size: 16px !important; line-height: 1.4; }
@media (max-width: 640px) {
  .hud { padding: 10px; }
  .clock strong { font-size: 16px; }
  .speed button { padding: 5px 8px; }
  .hud.top { padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
  .hud.bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
  .chart { max-width: 64vw; padding: 10px 12px 12px; border-radius: 14px; }
  .chart h1 { font-size: 25px; }
  .chart .hint { font-size: 13px; margin-bottom: 9px; }
  button { font-size: 14px; padding: 6px 11px; }
  .minimap { width: 128px; }
  .tile { min-width: 0; padding: 8px 11px; }
  .tile strong { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { .loader, .tile { transition: none; } }
</style>
</head>
<body>
<div id="stage" aria-label="Map of the archipelago"></div>
<div class="vignette"></div>

<div class="hud top">
  <header class="chart panel">
    <h1 id="name">Archipelago</h1>
    <p class="meta" id="meta"></p>
    <p class="hint" id="hint"></p>
    <div class="actions">
      <button class="primary" id="regen" type="button">New archipelago</button>
      <select id="scenarioSel" aria-label="Starting scenario"><option value="founders">Founders</option><option value="heirs">Heirs and empty farms (debug)</option></select>
      <button id="gridBtn" type="button" aria-pressed="true">Grid</button>
      <button id="regionBtn" type="button" aria-pressed="false">Regions</button>
      <button id="settlersBtn" type="button" aria-pressed="false">Settlers</button>
      <button id="treeBtn" type="button">Family tree</button>
      <button id="customsBtn" type="button" aria-pressed="false">Customs</button>
      <button id="debugBtn" type="button" aria-pressed="false">Debug</button>
    </div>
    <section class="settlers" id="settlers" hidden aria-label="Settlers and their farms"></section>
  </header>
  <div class="clock panel" id="clock">
    <div><strong id="clockDate">Spring, day 1</strong><span id="clockYear">Year 1, 06:00</span></div>
    <div class="speed" role="group" aria-label="Game speed">
      <button type="button" data-speed="0" aria-pressed="false">Pause</button>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="3" aria-pressed="false">3×</button>
      <button type="button" data-speed="10" aria-pressed="false">10×</button>
    </div>
  </div>
</div>
<div class="lod" id="lod" hidden></div>
<aside class="drawer panel" id="drawer" hidden aria-label="Customs and debug tools">
  <button class="dclose" id="drawerClose" type="button">Close</button>
  <div id="drawerBody"></div>
</aside>

<div class="hud bottom">
  <aside class="tile panel" id="tile" hidden aria-live="polite">
    <strong id="tileName"></strong>
    <span id="tileElev"></span>
    <span id="tileCoord"></span>
    <span id="tileExtra" hidden></span>
    <span id="tileMore" hidden></span>
  </aside>
  <div class="minimap panel" id="minimap" aria-label="Overview map, tap to jump">
    <canvas id="mmBase"></canvas>
    <canvas id="mmView"></canvas>
  </div>
</div>

<div class="tree" id="tree" hidden role="dialog" aria-modal="true" aria-labelledby="treeTitle">
  <div class="tree-card panel">
    <header class="tree-head"><h2 id="treeTitle">Family records</h2><p id="treeSub"></p><button id="treeClose" type="button">Close</button></header>
    <div class="tree-body">
      <div class="tree-scroll"><svg id="treeSvg" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Family tree"></svg></div>
      <aside class="tree-info" id="treeInfo" aria-live="polite"></aside>
    </div>
  </div>
</div>

<div class="loader" id="loader">
  <div>
    <p id="loadText">Raising the land</p>
    <div class="bar"><i id="loadBar"></i></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.14.3/dist/pixi.min.js"></script>
<script>
// @sys vb: module namespace and the convention for registering modules
// ===== Module namespace =====
// src/<path>.js registers as VB['<path>'] (e.g. src/sim/hex.js is VB['sim/hex']):
//   VB['sim/hex'] = (() => { ...; return { ... }; })();
// and reads what it needs at the top of its IIFE: const { bfs } = VB['sim/hex'];
// A module reads only modules listed before it in src/manifest.json. Grep a key to find the module and its users.
var VB = globalThis.VB = globalThis.VB || {};
</script>
<script>
// @sys gen: seeded terrain, hex tiles, regions and the painterly chunk bake
// ===== Archipelago generator: seeded terrain, hex tiles, regions, chunked painterly bake =====
const ArchGen = (() => {
  const SQ3 = Math.sqrt(3);

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeSimplex(rand) {
    const p = new Uint8Array(256), perm = new Uint8Array(512);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) { const j = (rand() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
    const GX = [1, -1, 1, -1, 1, -1, 0, 0], GY = [1, 1, -1, -1, 0, 0, 1, -1];
    const F2 = 0.5 * (SQ3 - 1), G2 = (3 - SQ3) / 6;
    return function (x, y) {
      const s = (x + y) * F2, i = Math.floor(x + s), j = Math.floor(y + s);
      const t = (i + j) * G2, x0 = x - (i - t), y0 = y - (j - t);
      const i1 = x0 > y0 ? 1 : 0, j1 = 1 - i1;
      const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2, x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
      const ii = i & 255, jj = j & 255;
      let n = 0, tt, g;
      tt = 0.5 - x0 * x0 - y0 * y0;
      if (tt > 0) { g = perm[ii + perm[jj]] & 7; tt *= tt; n += tt * tt * (GX[g] * x0 + GY[g] * y0); }
      tt = 0.5 - x1 * x1 - y1 * y1;
      if (tt > 0) { g = perm[ii + i1 + perm[jj + j1]] & 7; tt *= tt; n += tt * tt * (GX[g] * x1 + GY[g] * y1); }
      tt = 0.5 - x2 * x2 - y2 * y2;
      if (tt > 0) { g = perm[ii + 1 + perm[jj + 1]] & 7; tt *= tt; n += tt * tt * (GX[g] * x2 + GY[g] * y2); }
      return 70 * n;
    };
  }

  function fbm(n, x, y, oct) {
    let s = 0, a = 1, f = 1, t = 0;
    for (let o = 0; o < oct; o++) { s += a * n(x * f, y * f); t += a; a *= 0.5; f *= 2.03; }
    return s / t;
  }
  function ridged(n, x, y, oct) {
    let s = 0, a = 1, f = 1, t = 0, w = 1;
    for (let o = 0; o < oct; o++) {
      let r = 1 - Math.abs(n(x * f, y * f)); r *= r; r *= w; w = Math.min(1, r * 1.6);
      s += a * r; t += a; a *= 0.5; f *= 2.1;
    }
    return s / t;
  }
  const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // Periodic multi-octave value noise, 0..1, used for brush texture lookups.
  function makeTile(rand, size, cells0, oct) {
    const out = new Float32Array(size * size);
    let amp = 1, cells = cells0;
    for (let o = 0; o < oct; o++) {
      const lat = new Float32Array(cells * cells);
      for (let k = 0; k < lat.length; k++) lat[k] = rand();
      for (let y = 0; y < size; y++) {
        const fy = (y / size) * cells, y0 = fy | 0, ty0 = fy - y0, ty = ty0 * ty0 * (3 - 2 * ty0), y1 = (y0 + 1) % cells;
        for (let x = 0; x < size; x++) {
          const fx = (x / size) * cells, x0 = fx | 0, tx0 = fx - x0, tx = tx0 * tx0 * (3 - 2 * tx0), x1 = (x0 + 1) % cells;
          const a = lat[y0 * cells + x0], b = lat[y0 * cells + x1], c = lat[y1 * cells + x0], d = lat[y1 * cells + x1];
          out[y * size + x] += amp * (a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty);
        }
      }
      amp *= 0.5; cells *= 2;
    }
    let mn = Infinity, mx = -Infinity;
    for (const v of out) { if (v < mn) mn = v; if (v > mx) mx = v; }
    for (let k = 0; k < out.length; k++) out[k] = (out[k] - mn) / (mx - mn);
    return out;
  }

  // ---- Biomes ----
  const B = { DEEP: 0, SEA: 1, SHALLOW: 2, LAKE: 3, BEACH: 4, MEADOW: 5, HEATH: 6, FOREST: 7, PINE: 8, MARSH: 9, HILLS: 10, MOUNTAIN: 11, SNOW: 12 };
  const BIOMES = [
    { key: 'deep', name: 'Open sea', water: 1 },
    { key: 'sea', name: 'Sea', water: 1 },
    { key: 'shallow', name: 'Shallows', water: 1 },
    { key: 'lake', name: 'Lake', water: 1 },
    { key: 'beach', name: 'Sandy shore', c: [226, 210, 166], c2: [210, 190, 146], shade: 0.4, bevel: 0.7 },

    if (!$('dbgWhen')) return;
    const c = Sim.cal(st.t), days = nextMeeting();
    $('dbgWhen').textContent = skipping ? $('dbgWhen').textContent : `Year ${c.year}, ${Sim.SEASONS[c.season]} day ${c.sday + 1}. Next meetings in ${days} ${days === 1 ? 'day' : 'days'}.`;
    const id = selected(), p = id >= 0 ? st.pawns[id] : null;
    $('dbgSel').textContent = p ? `${Sim.fullName(p)}${p.died !== null ? ' (dead)' : `, ${p.age}, ${roleLine(p)}`}${p.advocate ? `; argues for “${optLabel(p.advocate.dim, p.advocate.opt).toLowerCase()}”` : ''}` : 'Select someone on the map, in the settlers list or in the family tree.';
    const out = st.demand.filter((q) => st.pawns[q].alive);
    $('dbgOut').textContent = out.length ? out.map((q) => `${Sim.fullName(st.pawns[q])} (${st.pawns[q].age}, ${st.villages[Sim.settlementIdOf(st, st.pawns[q])].name})`).join(', ') : 'Nobody right now.';
  }
  const dmsg = (t) => { const m = $('dbgMsg'); if (m) m.textContent = t; };
  async function skipYears(n) {
    if (skipping) return;
    skipping = true;
    const days = n * Sim.YEAR_DAYS;
    for (let d = 0; d < days; d++) {
      Sim.advance(st, Sim.DAY);
      if (d % 4 === 3) { $('dbgWhen').textContent = `Skipping: day ${d + 1} of ${days}…`; await frame(); }
    }
    skipping = false; st.visualDirty = true; settlersHTML = ''; dmsg(`Skipped ${n} ${n === 1 ? 'year' : 'years'}.`); updateDebug();
  }
  drawer.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b || !st || skipping) return;
    const id = selected(), p = id >= 0 ? st.pawns[id] : null;
    if (b.dataset.drift) { st.driftMul = +b.dataset.drift; drawer.querySelectorAll('[data-drift]').forEach((x) => x.setAttribute('aria-pressed', String(+x.dataset.drift === st.driftMul))); return; }
    switch (b.dataset.act) {
      case 'skip1': skipYears(1); break;
      case 'skip10': skipYears(10); break;
      case 'meet': Sim.holdMeetings(st); dmsg(st.meetingLog[0] ? st.meetingLog[0].text : ''); break;
      case 'move': Sim.movingRound(st); dmsg(`Moving round done; ${st.demand.length} want to move out.`); break;
      case 'kill': if (p && p.died === null) { Sim.killPawn(st, id, 'by the debug panel'); dmsg(`${Sim.fullName(p)} has died.`); if (selPawn === id) { selPawn = -1; $('tile').hidden = true; } } else dmsg('Select a living person first.'); break;
      case 'retire': { const hh = p ? Sim.holdingOf(st, id) : null; if (hh && Sim.retireHolder(st, hh.id)) dmsg(`${Sim.fullName(p)} hands over ${st.farmsteads[hh.farmstead].name}.`); else dmsg('Select someone who holds a farm and has an heir.'); break; }
      case 'advP': case 'advV': {
        if (!p || p.died !== null) { dmsg('Select a living person first.'); break; }
        const dim = +$('advDim').value, opt = +$('advOpt').value, until = st.cenv.t + 10;
        if (b.dataset.act === 'advP') { p.advocate = { dim, opt, until }; dmsg(`${Sim.fullName(p)} now argues for “${optLabel(dim, opt).toLowerCase()}”.`); }
        else {
          const s = st.cenv.settlements[Sim.settlementIdOf(st, p)], voiced = s.members().filter((q) => st.cenv.voiceOf(q, s) > 0).sort((x, y) => y.prestige - x.prestige);
          const want = Math.max(1, Math.ceil(voiced.length * 0.2)); let n = 0;
          for (const q of voiced) { if (n >= want) break; q.advocate = { dim, opt, until }; n++; }
          dmsg(`${n} of ${voiced.length} voices in ${s.name} now argue for “${optLabel(dim, opt).toLowerCase()}”.`);
        }
        break;
      }
    }
    settlersHTML = ''; updateDebug();
  });

  // ---- frame loop ----
  let time = 0;
  const lodEl = $('lod');
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  let frameErrAt = -1e9;
  const onFrame = (tk) => {
    if (!w) return;
    const dt = Math.min(0.05, tk.deltaMS / 1000);
    time += dt; frameNo++;
    if (intro) {
      intro.t += dt;
      const k = ease(clamp(intro.t / intro.d, 0, 1));
      cam.x = intro.x0 + (intro.x1 - intro.x0) * k; cam.y = intro.y0 + (intro.y1 - intro.y0) * k;
      cam.z = Math.exp(Math.log(intro.z0) + (Math.log(intro.z1) - Math.log(intro.z0)) * k); zt = cam.z;
      if (intro.t >= intro.d) intro = null;
    }
    if (Math.abs(zt - cam.z) > 1e-4) zoomAt(anchor.x, anchor.y, (cam.z + (zt - cam.z) * Math.min(1, dt * 14)) / cam.z);
    if (!drag && !pinch) {
      cam.x += vel.x * dt; cam.y += vel.y * dt;
      const decay = Math.exp(-dt * 4.5); vel.x *= decay; vel.y *= decay;
    }
    if (keys.size) {
      const sp = 700 / cam.z;
      if (keys.has('arrowleft') || keys.has('a')) cam.x -= sp * dt;
      if (keys.has('arrowright') || keys.has('d')) cam.x += sp * dt;
      if (keys.has('arrowup') || keys.has('w')) cam.y -= sp * dt;
      if (keys.has('arrowdown') || keys.has('s')) cam.y += sp * dt;
    }
    clampCam();
    world.scale.set(cam.z);
    world.position.set(app.screen.width / 2 - cam.x * cam.z, app.screen.height / 2 - cam.y * cam.z);

    T = levelFor(cam.z, T);
    // paint in bigger slices while the view is still; keep frames smooth while it moves
    const busy = intro || drag || pinch || keys.size || Math.abs(vel.x) + Math.abs(vel.y) > 2 || Math.abs(zt - cam.z) > 1e-3;
    if (!building) schedule(intro ? 14 : busy ? 9 : 22);
    display();
    lodEl.hidden = pending === 0;
    if (pending) lodEl.textContent = `Painting detail, ${pending} ${pending === 1 ? 'area' : 'areas'} left`;

    // sea: wave crests only once they are big enough not to shimmer
    const wa = clamp((cam.z - 0.14) / 0.3, 0, 1);
    L.waves.visible = wa > 0.01;
    if (!reduceMotion) {
      waves[0].tilePosition.x += 6 * dt; waves[0].tilePosition.y += 2.5 * dt;
      waves[1].tilePosition.x -= 4 * dt; waves[1].tilePosition.y += 3.5 * dt;
    }
    waves[0].alpha = (0.2 + (reduceMotion ? 0 : 0.05 * Math.sin(time * 0.8))) * wa;
    waves[1].alpha = (0.12 + (reduceMotion ? 0 : 0.04 * Math.sin(time * 0.55 + 1.3))) * wa;
    // clouds: visible on the overview, thinning out as you descend
    const zm = zMin(), fade = clamp((zm * 2.3 - cam.z) / (zm * 1.3), 0, 1);
    L.clouds.visible = L.shadows.visible = fade > 0.01;
    L.clouds.alpha = 0.85 * fade; L.shadows.alpha = 0.16 * fade;
    for (const c of clouds) {
      if (!reduceMotion) { c.spr.x += c.vx * dt; c.spr.y += c.vy * dt; }
      const hw = c.spr.width / 2;
      if (c.spr.x - hw > w.W + 200 * w.KS) c.spr.x = -hw - 200 * w.KS;
      c.sh.x = c.spr.x + 120 * w.KS; c.sh.y = c.spr.y + 90 * w.KS;
    }
    updateGrid();
    updateSettlement(dt);
    L.regions.alpha = clamp(1.25 - cam.z, 0.35, 1);
    if (hoverDirty || sel >= 0) { drawHover(); hoverDirty = false; }
    drawMinimapView();
  };
  // Pixi stops its ticker for good when a frame throws; catch it, say so, and keep the game running.
  app.ticker.add((tk) => {
    try { onFrame(tk); }
    catch (e) {
      console.error(e);
      if (performance.now() - frameErrAt > 5000) { frameErrAt = performance.now(); lodEl.hidden = false; lodEl.textContent = `Something went wrong in a frame: ${e.message}`; }
    }
  });

  // #s123 opens seed 123 with the founders; #h123 opens it with the heirs debug scenario
  const hm = location.hash.match(/^#([sh]?)(\d{1,9})$/);
  build(hm ? +hm[2] : (Math.random() * 1e6) | 0, hm && hm[1] === 'h' ? 'heirs' : 'founders');
})();
</script>
</body>
</html>
