<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archipelago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@1,500;1,700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --sea: #16395f;
  --panel: rgba(238, 245, 242, 0.88);
  --ink: #17313a;
  --muted: #526d75;
  --edge: rgba(23, 49, 58, 0.14);
  --accent: #23685a;
  --on-accent: #f2f8f6;
  --node: #fbfdfc;
  --good: #2f7a4b;
  --bad: #a8432f;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(11, 27, 34, 0.86);
    --ink: #e1ebe7;
    --muted: #93adae;
    --edge: rgba(225, 235, 231, 0.14);
    --accent: #84c9b5;
    --on-accent: #0c1f25;
    --node: #17323b;
    --good: #8fd0a2;
    --bad: #f0a08c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(11, 27, 34, 0.86);
  --ink: #e1ebe7;
  --muted: #93adae;
  --edge: rgba(225, 235, 231, 0.14);
  --accent: #84c9b5;
  --on-accent: #0c1f25;
  --node: #17323b;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; background: var(--sea); scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; overflow: hidden; background: var(--sea); color: var(--ink);
  font-family: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#stage canvas { display: block; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(5, 18, 30, 0.38) 100%); }
.hud { position: fixed; left: 0; right: 0; display: flex; justify-content: space-between; gap: 12px; padding: 14px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud.top { top: 0; align-items: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
.hud.bottom { bottom: 0; align-items: flex-end; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
.panel {
  background: var(--panel); color: var(--ink); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(3, 16, 26, 0.28);
}
.chart { border-radius: 18px; padding: 12px 16px 14px; max-width: 330px; }
.chart h1 { font-family: 'Alegreya', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700; font-size: 32px; line-height: 1.05; margin: 0; }
.chart .meta { margin: 3px 0 0; color: var(--muted); font-size: 15px; }
.chart .hint { margin: 2px 0 12px; color: var(--muted); font-size: 14px; line-height: 1.35; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.lod { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); font-size: 13px; color: rgba(235, 244, 241, 0.85); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); pointer-events: none; }
.hud.top { flex-wrap: wrap; }
.clock { border-radius: 14px; padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 12px; }
.clock strong { display: block; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 19px; line-height: 1.1; }
.clock span { display: block; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.speed { display: flex; gap: 4px; }
.speed button { padding: 5px 10px; font-size: 14px; }
.speed button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.settlers { margin-top: 12px; max-height: min(50vh, 440px); overflow-y: auto; border-top: 1px solid var(--edge); padding: 2px 4px 0 0; }
.settlers h2 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 19px; line-height: 1.2; margin: 12px 0 2px; }
.settlers h2 span { font-family: 'Alegreya Sans', system-ui, sans-serif; font-style: normal; font-weight: 400; font-size: 14px; color: var(--muted); }
.settlers p { margin: 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
.settlers ul { list-style: none; margin: 4px 0 0; padding: 0; }
.settlers li { font-size: 14px; line-height: 1.55; color: var(--muted); }
.settlers li button { border: 0; border-radius: 3px; padding: 0; background: none; font-size: 15px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; }
.settlers .log p { margin-top: 3px; }
.settlers .jobs { color: var(--ink); opacity: 0.85; }
.settlers .doing { font-size: 13px; font-style: italic; }
.tree { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(6, 18, 26, 0.55); padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.tree[hidden] { display: none; }
.tree-card { width: min(1120px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; }
.tree-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 14px 18px; border-bottom: 1px solid var(--edge); }
.tree-head h2 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0; }
.tree-head p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; min-width: 12ch; }
.tree-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; flex: 1; }
.tree-scroll { overflow: auto; padding: 10px; min-height: 220px; }
.tree-info { border-left: 1px solid var(--edge); padding: 14px 18px 18px; overflow: auto; }
.tree-info h3 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 22px; margin: 0 0 6px; }
.tree-info p { margin: 0 0 6px; font-size: 15px; line-height: 1.45; }
.tree-info .hint { color: var(--muted); }
.tree-info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 12px 0 16px; font-size: 15px; line-height: 1.4; }
.tree-info dt { color: var(--muted); }
.tree-info dd { margin: 0; }
.tree-info dd button { border: 0; padding: 0; background: none; font-size: 15px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; border-radius: 3px; }
#treeSvg text.n { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 15px; fill: var(--ink); }
#treeSvg text.s { font-family: 'Alegreya Sans', system-ui, sans-serif; font-size: 12.5px; fill: var(--muted); }
#treeSvg .tn { cursor: pointer; }
#treeSvg .tn rect { fill: var(--node); stroke: var(--edge); stroke-width: 1; }
#treeSvg .tn.sel rect { stroke: var(--accent); stroke-width: 2.5; }
#treeSvg .tn:focus { outline: none; }
#treeSvg .tn:focus-visible rect { stroke: var(--accent); stroke-width: 3; }
#treeSvg .marriage, #treeSvg .descent { fill: none; stroke: var(--muted); stroke-width: 1.5; }
#treeSvg .ring { fill: none; stroke: var(--accent); stroke-width: 1.5; }
#treeSvg .marriage.ended { stroke-dasharray: 4 3; }
#treeSvg .tn.dead rect { opacity: 0.55; }
#treeSvg .tn.dead text { opacity: 0.7; }
#treeSvg .heir { fill: #c9a24a; }
.tree-info .evs { margin: 0 0 14px; padding-left: 18px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.actions select { font: inherit; font-size: 15px; color: var(--ink); background: var(--node); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 10px; max-width: 100%; }
.drawer { position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 86px); width: min(420px, calc(100vw - 28px)); max-height: calc(100vh - 230px); overflow: auto; border-radius: 16px; padding: 12px 14px 16px; z-index: 6; }
.drawer[hidden] { display: none; }
.drawer .dclose { position: sticky; top: 0; float: right; }
.drawer .dh { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 22px; margin: 2px 0 6px; }
.drawer .dh3 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 18px; margin: 14px 0 4px; }
.drawer .dm { margin: 0 0 6px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.drawer .dm strong { color: var(--ink); font-weight: 600; }
.cust { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0 6px; }
.cust th, .cust td { text-align: left; vertical-align: top; padding: 6px 4px; border-top: 1px solid var(--edge); }
.cust thead th { font-weight: 600; border-top: 0; }
.cust tbody th { font-weight: 500; }
.cust td.dev { background: rgba(201, 162, 74, 0.16); }
.sbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; background: var(--edge); }
.sbar i { display: block; height: 100%; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 3px 0 6px; vertical-align: -1px; }
.mall { color: var(--muted); letter-spacing: 1px; font-size: 11px; }
.dbg-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.dbg-row button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.drawer select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); max-width: 100%; }
.dchk { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 8px 0; }
@media (max-width: 640px) { .drawer { left: 8px; right: 8px; width: auto; top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); max-height: 62vh; } }
@media (max-width: 760px) { .tree { padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px calc(env(safe-area-inset-bottom, 0px) + 8px); } .tree-body { grid-template-columns: 1fr; } .tree-info { border-left: 0; border-top: 1px solid var(--edge); max-height: 46vh; } .tree-head h2 { font-size: 21px; } }
@media (max-width: 640px) { .lod { display: none; } }
button {
  font: inherit; font-size: 15px; font-weight: 500; line-height: 1.2; color: var(--ink);
  background: transparent; border: 1px solid var(--edge); border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button[aria-pressed="false"] { color: var(--muted); }
button:disabled { opacity: 0.55; cursor: progress; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile { border-radius: 14px; padding: 10px 14px; min-width: 170px; transition: opacity 0.2s; }
.tile[hidden] { display: block; opacity: 0; pointer-events: none; }
.tile strong { display: block; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 21px; line-height: 1.1; }
.tile span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.tile .rel { margin-top: 7px; padding-top: 5px; border-top: 1px solid var(--edge); }
.tile .rel h3 { margin: 0 0 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tile .rel button { display: flex; gap: 8px; width: 100%; padding: 1px 0; border: 0; background: none; font: inherit; font-size: 13px; color: var(--ink);
  text-align: left; cursor: pointer; }
.tile .rel button i { flex: 1; font-style: normal; color: var(--muted); }
.tile .rel button b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .rel .pos { color: var(--good); }
.tile .rel .neg { color: var(--bad); }
.minimap { position: relative; width: 200px; border-radius: 10px; overflow: hidden; cursor: crosshair; touch-action: none; padding: 0; }
.minimap canvas { display: block; width: 100%; height: auto; }
.minimap #mmView { position: absolute; inset: 0; height: 100%; }
.genscreen { position: fixed; inset: 0; z-index: 11; display: grid; place-items: center; padding: 16px; background: var(--sea); }
.genscreen[hidden] { display: none; }
.genscreen form { display: grid; gap: 14px; width: min(360px, 100%); padding: 20px 22px; border-radius: 16px; }
.genscreen h1 { margin: 0; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-size: 30px; }
.genscreen label { display: grid; gap: 4px; color: var(--muted); font-size: 14px; }
.genscreen input, .genscreen select { font: inherit; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); }
.genscreen .err { margin: 0; color: #b4382c; font-size: 14px !important; }
.loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--sea); color: #e3eeea; transition: opacity 0.7s; }
.loader.done { opacity: 0; pointer-events: none; }
.loader p { margin: 0; text-align: center; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-size: 22px; }
.loader .bar { width: min(280px, 70vw); height: 3px; margin-top: 14px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, 0.16); }
.loader .bar i { display: block; height: 100%; width: 0; background: #9fd6c6; }
.err { max-width: 34ch; font-family: 'Alegreya Sans', system-ui, sans-serif !important; font-style: normal !important; font-size: 16px !important; line-height: 1.4; }
@media (max-width: 640px) {
  .hud { padding: 10px; }
  .clock strong { font-size: 16px; }
  .speed button { padding: 5px 8px; }
  .hud.top { padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
  .hud.bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
  .chart { max-width: 64vw; padding: 10px 12px 12px; border-radius: 14px; }
  .chart h1 { font-size: 25px; }
  .chart .hint { font-size: 13px; margin-bottom: 9px; }
  button { font-size: 14px; padding: 6px 11px; }
  .minimap { width: 128px; }
  .tile { min-width: 0; padding: 8px 11px; }
  .tile strong { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { .loader, .tile { transition: none; } }
</style>
</head>
<body>
<div id="stage" aria-label="Map of the archipelago"></div>
<div class="vignette"></div>

<div class="hud top">
  <header class="chart panel">
    <h1 id="name">Archipelago</h1>
    <p class="meta" id="meta"></p>
    <p class="hint" id="hint"></p>
    <div class="actions">
      <button class="primary" id="regen" type="button">New archipelago</button>
      <button id="gridBtn" type="button" aria-pressed="true">Grid</button>
      <button id="regionBtn" type="button" aria-pressed="false">Regions</button>
      <button id="settlersBtn" type="button" aria-pressed="false">Settlers</button>
      <button id="treeBtn" type="button">Family tree</button>
      <button id="customsBtn" type="button" aria-pressed="false">Customs</button>
      <button id="debugBtn" type="button" aria-pressed="false">Debug</button>
    </div>
    <section class="settlers" id="settlers" hidden aria-label="Settlers and their farms"></section>
  </header>
  <div class="clock panel" id="clock">
    <div><strong id="clockDate">Spring, day 1</strong><span id="clockYear">Year 1, 06:00</span></div>
    <div class="speed" role="group" aria-label="Game speed">
      <button type="button" data-speed="0" aria-pressed="false">Pause</button>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="3" aria-pressed="false">3×</button>
      <button type="button" data-speed="10" aria-pressed="false">10×</button>
    </div>
  </div>
</div>
<div class="lod" id="lod" hidden></div>
<aside class="drawer panel" id="drawer" hidden aria-label="Customs and debug tools">
  <button class="dclose" id="drawerClose" type="button">Close</button>
  <div id="drawerBody"></div>
</aside>

<div class="hud bottom">
  <aside class="tile panel" id="tile" hidden aria-live="polite">
    <strong id="tileName"></strong>
    <span id="tileElev"></span>
    <span id="tileCoord"></span>
    <span id="tileExtra" hidden></span>
    <span id="tileMore" hidden></span>
    <div class="rel" id="tileRel" hidden></div>
  </aside>
  <div class="minimap panel" id="minimap" aria-label="Overview map, tap to jump">
    <canvas id="mmBase"></canvas>
    <canvas id="mmView"></canvas>
  </div>
</div>

<div class="tree" id="tree" hidden role="dialog" aria-modal="true" aria-labelledby="treeTitle">
  <div class="tree-card panel">
    <header class="tree-head"><h2 id="treeTitle">Family records</h2><p id="treeSub"></p><button id="treeClose" type="button">Close</button></header>
    <div class="tree-body">
      <div class="tree-scroll"><svg id="treeSvg" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Family tree"></svg></div>
      <aside class="tree-info" id="treeInfo" aria-live="polite"></aside>
    </div>
  </div>
</div>

<div class="genscreen" id="genScreen" hidden>
  <form class="panel" id="genForm" autocomplete="off">
    <h1>New archipelago</h1>
    <label>Map size
      <select id="genSize">
        <option value="t">Tiny (120 × 85)</option><option value="s">Small (180 × 130)</option>
        <option value="m" selected>Medium (280 × 200)</option><option value="l">Large (380 × 270)</option>
      </select>
    </label>
    <label>Seed
      <input id="genSeed" type="text" inputmode="numeric" maxlength="9" pattern="[0-9]{1,9}" required>
    </label>
    <label>Starting scenario
      <select id="genScenario">
        <option value="founders">Founders</option><option value="heirs">Heirs and empty farms</option>
        <option value="populous">Populous Villages</option>
      </select>
    </label>
    <p class="err" id="genMsg" role="alert" hidden></p>
    <button class="primary" id="genGo" type="submit">Generate</button>
  </form>
</div>

<div class="loader" id="loader">
  <div>
    <p id="loadText">Raising the land</p>
    <div class="bar"><i id="loadBar"></i></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.14.3/dist/pixi.min.js"></script>
<script>
// @sys vb: module namespace and the convention for registering modules
// ===== Module namespace =====
// src/<path>.js registers as VB['<path>'] (e.g. src/sim/hex.js is VB['sim/hex']):
//   VB['sim/hex'] = (() => { ...; return { ... }; })();
// and reads what it needs at the top of its IIFE: const { bfs } = VB['sim/hex'];
// A module reads only modules listed before it in src/manifest.json. Grep a key to find the module and its users.
var VB = globalThis.VB = globalThis.VB || {};
</script>
<script>
// @sys gen/paths: how worn paths look: a trail through each worn tile towards its worn neighbours, painted into the map chunks
// ===== Worn paths on the map (VB-094). The simulation counts and fades the wear (sim/paths); this module only reads w.worn. =====
// Listed before gen/rivers.js and gen.js: the chunk bake keeps trees and stones off paths and lanes through `thin`.
VB['gen/paths'] = (() => {
  // By stage (0 none, 1 trodden ground, 2 path, 3 lane): the trail's width in map units, the colours of its flattened edge and bare core,
  // and the coarsest level of detail (ArchGen.LV index) that still shows it: trodden ground only up close, paths and lanes at the middle
  // level too. The overview shows none, so a path that changes stage never repaints it (a full overview chunk takes about 60 ms).
  const LOOK = {
    width: [0, 5, 7, 10],
    edge: [null, 'rgba(124,128,70,0.22)', 'rgba(122,112,70,0.34)', 'rgba(114,98,62,0.46)'],
    core: [null, 'rgba(176,164,110,0.34)', 'rgba(170,146,100,0.72)', 'rgba(166,138,94,0.88)'],
    level: [-1, 0, 1, 1],
  };
  // Where the trail bends in tile i: a fixed offset by tile, up to 0.22 R from the centre, so trails wander a little.
  function bend(w, i) {
    const h = Math.imul(i ^ 0x2c1b3c6d, 2246822519) >>> 0, a = ((h & 1023) / 1024) * 2 * Math.PI, d = (((h >>> 10) & 1023) / 1024) * 0.22 * w.R;
    return [w.hx[i] + Math.cos(a) * d, w.hy[i] + Math.sin(a) * d];
  }
  // A worn tile that draws its own trail: worn land that is not a house, field, green or river.
  const trail = (w, i) => i >= 0 && w.worn[i] > 0 && !w.dev[i] && !w.water[i] && !w.river[i];
  // What a trail runs on to: another trail, a worn ford, or a house, field or green (the end of the way, drawn by the settlement layer).
  const leadsTo = (w, j) => j >= 0 && !w.water[j] && (trail(w, j) || (w.river[j] ? w.crossing[j] > 0 && w.worn[j] > 0 : w.dev[j] === 1));
  // The trail of tile i as curves [x0, y0, cx, cy, x1, y1, width, stage] (quadratic, cx, cy the control point). Each way out of the tile
  // ends at its joint with the neighbour it leads to, halfway to that neighbour's bend (its centre if it draws no trail). A tile with two
  // ways out runs one smooth curve from joint to joint, bent towards its own bend, so a trail through many tiles flows; a lone end or a
  // fork runs straight from the bend to each joint. Both sides of a joint have the same width, the mean of the two tiles' widths.
  function segments(w, i) {
    if (!trail(w, i)) return [];
    const s = w.worn[i], [bx, by] = bend(w, i), ends = [];
    for (let k = 0; k < 6; k++) {
      const j = w.nb[i * 6 + k];

// @sys sim/forest: felling, regrowth and clearing of forest tiles
VB['sim/forest'] = (() => {
  const { B, treeStage, setBiome } = VB['gen'];

  function stageChanged(st, tile, was) { if (treeStage(st.w, tile) !== was) st.treeDirty.add(tile); }

  // A tile with no trees left becomes meadow for good; farms and villages that used it as a woodlot pick the nearest forest.
  function clearTile(st, tile) {
    const w = st.w;
    w.trees[tile] = 0; w.treesMax[tile] = 0; st.regrow.delete(tile);

  function fellTree(st, farm) {

// @sys sim/hunger: the daily meal shared out by custom, each pawn's hunger level and health
VB['sim/hunger'] = (() => {

  function seedReserve(st, hh) {

  }

  function dailyNeed(st, hh) {

  }
  // Feeds a household for the day: what grain there is goes by the household's feedOrder, in groups served one after the other.
  function feedHousehold(st, hh) {
    const E = st.ECON, mem = hh.members.map((id) => st.pawns[id]).filter((p) => p.died === null);
    const need = new Map(mem.map((p) => [p, age(st, p) >= 14 ? E.ration.adult : E.ration.child])), total = [...need.values()].reduce((s, n) => s + n, 0);
    const eaten = new Map(mem.map((p) => [p, need.get(p)]));

      const first = order === 'children' ? (p) => age(st, p) < 14 : order === 'workers' ? worker : null;
      let left = avail;
      for (const group of first ? [mem.filter(first), mem.filter((p) => !first(p))] : [mem]) {
        const gneed = group.reduce((s, p) => s + need.get(p), 0), give = Math.min(left, gneed);
        for (const p of group) eaten.set(p, gneed > 0 ? need.get(p) * give / gneed : 0);

// @sys sim/deaths: causes of death, with their texts, and the daily death roll
VB['sim/deaths'] = (() => {
  const { YEAR, YEAR_DAYS, hazard, HUNGER, HEALTH } = VB['sim/rules'];
  // Cause keys: the base hazard by age (infancy, childhood, illness, oldAge), the share added by hunger, and the causes set elsewhere.
  // `event` is the text of the pawn's life event, `log` the text of the village log ("<name> of <farm> <log>, aged <n>").
  const CAUSES = {
    infancy: { event: 'Died in infancy', log: 'died in infancy' },
    childhood: { event: 'Died of a childhood illness', log: 'died of a childhood illness' },
    illness: { event: 'Died of illness', log: 'died of illness' },
    oldAge: { event: 'Died of old age', log: 'died of old age' },
    hunger: { event: 'Died of hunger', log: 'died of hunger' },
    starvation: { event: 'Died of starvation', log: 'starved to death' },
    childbirth: { event: 'Died in childbirth', log: 'died in childbirth' },
    killed: { event: 'Killed', log: 'was killed' },

  const baseCause = (a) => (a < 1 ? 'infancy' : a < 15 ? 'childhood' : a < 60 ? 'illness' : 'oldAge');

  function deathRoll(st, p) {

  return { CAUSES, deathRoll };
})();

// @sys sim/fields: making new fields: how many a household wants, choosing a meadow tile, clearing it and breaking the ground
VB['sim/fields'] = (() => {

  const { walkable } = VB['sim/routes'];

  // few stones, near, and 1 better when it touches one of the farm's fields, so the fields grow as one block (VB-109). -1 when there is none.
  function chooseTile(st, f) {

    let best = -1, bs = -Infinity;

})();

  const { walkable } = VB['sim/routes'];

  const { setOwner } = VB['sim/ownership'];
  const { clearTile } = VB['sim/forest'];
  const { BREAK_HOURS, clearHours, builtTiles } = VB['sim/fields'];

  const MAX_PLOTS = 2, REACH = 6, FELL_HOURS = 10, GRUB_HOURS = 6;

  const { person, marry, makeHousehold, joinHousehold } = VB['sim/records'];

  function foundersHouseholds(R, farmsteads) {
    const rand = R.rand, households = [];
    farmsteads.forEach((f) => {
      const hAge = 23 + ((rand() * 11) | 0), wAge = Math.max(19, hAge - 1 - ((rand() * 6) | 0));
      const man = person(R, { sex: 'm', age: hAge }), wife = person(R, { sex: 'f', age: wAge });
      households.push(makeHousehold(R, households.length, f, [man, wife], man));
      marry(R, man, wife, 1 + ((rand() * 4) | 0));
    });
    const order = households.map((h) => h.id).sort(() => rand() - 0.5);
    const hand = person(R, { sex: 'm', age: 16 + ((rand() * 4) | 0), servant: true }),
      maid = person(R, { sex: 'f', age: 16 + ((rand() * 4) | 0), servant: true });
    joinHousehold(R, households[order[0]], hand); joinHousehold(R, households[order[1 % order.length]], maid);
    return households;
  }

  const SIZES = [[4, 0.15], [5, 0.2], [6, 0.25], [7, 0.2], [8, 0.12], [9, 0.08]];
  function drawSize(rand) {
    let u = rand();
    for (const [n, p] of SIZES) { if (u < p) return n; u -= p; }
    return 6;
  }

  // Populous: a couple, their children (two or three years apart) and sometimes a servant. Two generations only: the parents have no
  // recorded parents, so there are no grandparents, living or on record. In a third of the households the eldest child is 18 to 26.
  function populousHouseholds(R, farmsteads, sizes) {
    const rand = R.rand, households = [];
    for (const f of farmsteads) {
      const size = sizes[f.id], servant = size >= 6 && rand() < 0.25 ? 1 : 0, kids = size - 2 - servant;
      const ages = [0];
      for (let k = 1; k < kids; k++) ages.push(ages[k - 1] + 2 + ((rand() * 2) | 0));
      const span = ages[kids - 1], grown = rand() < 1 / 3;

    //   kinPush ({to: kinLimit option key, w} or null; the marriage limit pull of the last moving round; sim/lifecycle), ...}
    //   id = index; born and died in game hours (died null while living); father, mother, household are ids or null; culture fields att, anc,
    //   ties; rel (sim/relations)
    // @state st.unions[]: {id, a, b, start, end, kind}; pawn ids a and b, game hours (end null while it lasts), kind 'marriage'
    // @state st.households[]: {id, farmstead, members[], holder, grain (rations), rations (cooked, ready to eat; sim/hunger),
    //   unthreshed[] (rations still in sheaf, one per field's crop), guardian (pawn id or null; set while a minor heir has not come of age;
    //   sim/heirs) and ward (the minor's id),
    //   wood (loads), stone (loads),
    //   ledger[], hungryDays, hunger (mean of members'), waterDay, cookDay, dissolved}
    // @state st.farmsteads[]: {id, house, fields[], village, household, name, rowAngle, fence, woodlot, line, state, condition, emptySince}
    //   house is a tile index; project {tile, stage 'clear'|'break', hours} or null (the field in the making; sim/fields);
    //   fields[] {id, tile, stage, sown, reaped, held, fert, weedOpen, weedPosted (day), weedMiss (jobs missed)};
    //   state 'occupied', 'derelict' or 'ruin'; condition 0..1
    // @state st.villages[]: {id, name, center, farmsteads[], fence, commonsWood, green, well}; center is a tile index, farmsteads are ids;
    //   green, well: booleans; a one-farm village has neither
    //   plots[] (sim/expansion): {id, village, intended (pawn id), hours {pawn id: hours worked}, done, holder (pawn id or null), started,
    //   tiles[] {tile, kind 'house'|'field', steps[] of 'fell'|'grub'|'clear'|'break', i (steps done)}}; a plot is cleared for those who want out

    // @state st.makeFields: boolean; households start projects for new fields (founders scenario only; see sim/fields)
    // @state st.used: Set of tile indexes taken by houses and fields
    // @state st.jobs: Map of job key to open job; st.jobSeq: number; counter for job ids. A job: {id, key, kind, owner, site, done (work hours),
    //   claims[] (ids of the pawns working it, at most KINDS[kind].hands; VB-102), posted, live, and its source's fields (field, farm, plot, ...)}
    // @state st.jobsBy: Map of owner ('household:<id>' or 'village:<id>') to the Set of its open jobs (by id);
    //   kept with st.jobs by post and dropJob
    // @state st.events[]: {t, text}; newest first. st.meetingLog[]: {year, text}; newest first
    // @state st.pathCache: Map of route key (from * w.N + to) to path (tiles, both ends included; sim/routes).
    // @state st.routeFallbacks: number; routes not found within ROUTE.reach, walked straight
    // @state st.routeDirty: Set of tile indexes whose walking cost changed today; the cached routes they touch are dropped at the end of the day
    // @state st.talks: number; talks since the start (sim/relations)
    // @state st.contacts: Map of pawn pair (pairKey in sim/society: i * 2^21 + j, i < j) to hours spent together since the last drift step
    // @state st.driftMul: number; multiplier on attitude drift, set by the page. st.naturalDeaths: boolean; set by the page
    // @state st.demand: array of pawn ids who want to move out. st.countDemand: function; recomputes st.demand
    // @state st.agents[]: {id, x, y, path, seg, phase, job, inside, anim, carry, face, stride, ox, oy, work, idleUntil, talk (sim/relations)};
    //   one per pawn, map units
    // @state st.visualDirty: boolean; set when the map must be redrawn. st.rigDirty: Set; marks changed farms or people for the page to rebuild
    // @state st.regrow: Set of tile indexes with some but not all trees, which grow back daily (see sim/forest)
    // @state st.pathDirty: Set of tile indexes whose worn-path stage (w.worn) changed; the page repaints them and clears it
    // @state st.treeDirty,biomeDirty: Set of tile indexes whose tree density stage changed, or that turned to meadow; the page repaints them
    // @state st.cenv: {t, cultures[], settlements[], people[], driftMul, ...}; the Culture environment (see culture.js)
    const st = {
      t: 6, rand, w, ECON, pawns: R.pawns, unions: R.unions, households, farmsteads, villages, used, scenario,
      makeFields: false, jobs: new Map(), jobsBy: new Map(), jobSeq: 0, weather: 0.85 + rand() * 0.3, events: [],
      pathCache: new Map(), routeFallbacks: 0, routeDirty: new Set(),
      contacts: new Map(), talks: 0, driftMul: 1, naturalDeaths: true, demand: [], meetingLog: [],
      agents: R.pawns.map((p) => ({
        id: p.id, x: 0, y: 0, path: null, seg: 0, phase: null, job: null, inside: true, anim: 'idle', carry: null, face: 1, stride: rand() * 6,
        ox: (rand() - 0.5) * 12, oy: (rand() - 0.5) * 8, work: null, idleUntil: 0, talk: null,
      })),
      visualDirty: false, rigDirty: new Set(), regrow: new Set(), treeDirty: new Set(), biomeDirty: new Set(), pathDirty: new Set(),

    seedOwners(st);

    for (const hh of st.households) hh.rations = 2 * dailyNeed(st, hh); // two days of cooked food to start with
    for (const a of st.agents) if (!st.pawns[a.id].died) placeAtHome(st, a);
    st.countDemand = () => { const heirs = firstHeirs(st); st.demand = st.pawns.filter((p) => p.alive && wantsOut(st, p, heirs)).map((p) => p.id); };
    return st;
  }

  function seed(w, seedNum, scenario = 'founders') {
    return scenario === 'heirs' ? seedHeirs(w, seedNum) : scenario === 'populous' ? seedPopulous(w, seedNum) : seedFounders(w, seedNum);
  }
  return { seedFounders, seedHeirs, seedPopulous, makeState, seed };
})();

// @sys sim/clock: the hourly step, end of day, new year and Sim.advance
VB['sim/clock'] = (() => {
  const { DAY, SEASON_DAYS, YEAR_DAYS, YEAR, cal, WORK, dark } = VB['sim/rules'];
  const { log, age } = VB['sim/records'];
  const { growTrees } = VB['sim/forest'];
  const { B } = VB['gen'];
  const { bfs } = VB['sim/hex'];
  const { refreshRoutes, costChanged } = VB['sim/routes'];
  const { fadeWear } = VB['sim/paths'];
  const { feedHousehold } = VB['sim/hunger'];
  const { homeSpot, release, wantsWork, idleAbout, goHome, stepWork, moveAgent } = VB['sim/agents'];
  const { refreshJobs, callCooks, lookUp, planRound } = VB['sim/jobs'];
  const { noteContacts } = VB['sim/society'];
  const { talkHour } = VB['sim/relations'];
  const { holdMeetings, movingRound, dailyLife } = VB['sim/lifecycle'];
  const { dailyBirths } = VB['sim/births'];
  // Scrub is the first step of forest spread, so it only comes to fields with woodland within 2 steps.
  function nearForest(w, tile) {
    for (const j of bfs(w, tile, 2, () => true).dist.keys()) if (w.biome[j] === B.FOREST || w.biome[j] === B.PINE) return true;
    return false;
  }
  function onHour(st, h, c) {
    if (st.cenv) talkHour(st, h, noteContacts(st));
    if (st.cenv && c.season === 2 && c.sday === 9 && h === 12) holdMeetings(st);
    if (st.cenv && c.season === 2 && c.sday === 10 && h === 12) movingRound(st);
    if (h === Math.ceil(dark(c)[1])) { // the dark ends: everyone indoors is by their door
      for (const a of st.agents) if (a.inside && !a.job && st.pawns[a.id].alive) { const [x, y] = homeSpot(st, a); a.x = x; a.y = y; }
    }
    if (h >= WORK[0] - 1 && h <= WORK[1]) refreshJobs(st, c);
    if (h >= 14 && h < WORK[1]) callCooks(st, c);
    if (h >= WORK[0] && h < WORK[1]) lookUp(st, c); // more urgent work interrupts a job (VB-107)
    if (h === WORK[1]) for (const a of st.agents) {
      if (st.pawns[a.id].died) continue;
      if (a.phase === 'back') continue; // finish the delivery first
      release(st, a);
      if (!a.inside) { goHome(st, a); a.phase = 'home'; }
    }
    if (h === 0) { endOfDay(st, c); if (st.cenv) { dailyLife(st, c); dailyBirths(st); } if (c.doy === 0) newYear(st, c); }
  }
  function endOfDay(st, c) {
    const E = st.ECON;
    for (const hh of st.households) {
      if (hh.dissolved) continue;
      feedHousehold(st, hh);
      hh.wood = Math.max(0, hh.wood - E.woodUse[c.season]);
    }
    growTrees(st);
    fadeWear(st, (tile) => costChanged(st, tile)); // a path that changes stage changes the cost of walking it
    refreshRoutes(st);
    const day = Math.floor(st.t / DAY);
    for (const f of st.farmsteads) for (const fd of f.fields) {
      if (f.household === null || fd.sown === null || fd.stage === 'stooks') continue;
      const g = day - fd.sown;
      if (g >= E.ripeAfterDays) fd.stage = 'ripe';
      else if (g >= 3 && fd.stage === 'sown') fd.stage = 'growing';
    }
    // upkeep: a growing field wants weeding every E.weedEvery days; a job still open when the next falls due counts as missed
    for (const f of st.farmsteads) for (const fd of f.fields) {
      if (f.household === null || fd.stage !== 'growing') continue;
      if (fd.weedPosted !== null && day - fd.weedPosted < E.weedEvery) continue;
      if (fd.weedOpen) fd.weedMiss++;
      fd.weedOpen = true; fd.weedPosted = day;
    }
    if (c.season === 2 && c.sday === SEASON_DAYS - 1) for (const f of st.farmsteads) for (const fd of f.fields) {
      if (f.household !== null && ['ripe', 'growing', 'stooks'].includes(fd.stage)) {
        fd.stage = 'stubble'; fd.sown = null; fd.held = 0; log(st, `A crop at ${f.name} was lost to frost.`);
      }
    }
    const decay = E.fenceDecay[c.season];
    const all = [...st.villages.flatMap((v) => v.fence), ...st.farmsteads.flatMap((f) => f.fence || [])];
    // empty farms decay: buildings lose about 8% a year, untended fields go to grass and then scrub
    for (const f of st.farmsteads) if (f.household === null) {
      f.condition = Math.max(0, (f.condition ?? 1) - 0.08 / YEAR_DAYS);
      const yrs = (st.t - f.emptySince) / YEAR;
      if (f.state === 'derelict' && f.condition < 0.15) { f.state = 'ruin'; st.visualDirty = true; }
      for (const fd of f.fields) {
        const want = yrs > 8 && nearForest(st.w, fd.tile) || fd.stage === 'scrub' ? 'scrub' : yrs > 1 ? 'fallow' : fd.stage;
        if (fd.stage !== want) { fd.stage = want; st.visualDirty = true; }
      }
    }
    for (const s of all) {
      const before = s.cond; s.cond = Math.max(0, s.cond - decay * (0.5 + st.rand())); if ((before >= 0.45) !== (s.cond >= 0.45)) s.dirty = true;
    }
  }
  function newYear(st, c) {
    st.weather = 0.75 + st.rand() * 0.45;
    const word = st.weather > 1.05 ? 'promises a good year' : st.weather < 0.88 ? 'looks poor' : 'looks ordinary';
    log(st, `Year ${c.year} begins. The weather ${word}.`);
    for (const hh of st.households) hh.ledger = hh.ledger.filter((e) => st.t - e.t < YEAR * 3);
  }
  function advance(st, hours) {
    let left = hours;
    while (left > 1e-9) {
      const step = Math.min(left, 0.1);
      const before = Math.floor(st.t + 1e-9);
      st.t += step; left -= step;
      const after = Math.floor(st.t + 1e-9);
      for (let hh = before + 1; hh <= after; hh++) onHour(st, ((hh % DAY) + DAY) % DAY, cal(hh));
      const c = cal(st.t), idle = [];
      for (const a of st.agents) {
        if (st.pawns[a.id].died) continue;
        if (a.path) moveAgent(st, a, step);
        else if (a.phase === 'work') stepWork(st, a, step);
        else if (wantsWork(st, a, c)) idle.push(a);
      }
      if (idle.length) { const got = planRound(st, idle, c); for (const a of idle) if (!got.has(a)) idleAbout(st, a); }
    }
  }
  return { onHour, endOfDay, newYear, advance };
})();

      <div class="dbg-row" role="group" aria-label="Drift speed">${[1, 10, 100].map((m) => `<button type="button" data-drift="${m}" aria-pressed="${st.driftMul === m}">×${m}</button>`).join('')}</div>
      <label class="dchk"><input type="checkbox" id="dbgDeaths" ${st.naturalDeaths ? 'checked' : ''}> Natural deaths</label>
      <h3 class="dh3">Selected person</h3>
      <p class="dm" id="dbgSel"></p>
      <div class="dbg-row"><button type="button" data-act="kill">Kill</button><button type="button" data-act="retire">Retire and hand over</button></div>
      <div class="dbg-row"><select id="advDim" aria-label="Custom">${dims}</select><select id="advOpt" aria-label="Option"></select></div>
      <div class="dbg-row"><button type="button" data-act="advP">Make them argue for it</button><button type="button" data-act="advV">Rally a fifth of the village</button></div>
      <h3 class="dh3">Wants to move out</h3><p class="dm" id="dbgOut"></p>
      <p class="dm" id="dbgMsg" aria-live="polite"></p>`;
    const fillOpts = () => { const k = +$('advDim').value; $('advOpt').innerHTML = Culture.DIMS[k].opts.map((o, j) => `<option value="${j}">${esc(o[1])}</option>`).join(''); };
    $('advDim').addEventListener('change', fillOpts); fillOpts();
    $('dbgDeaths').addEventListener('change', (e) => { st.naturalDeaths = e.target.checked; });
    updateDebug();
  }
  const selected = () => (selPawn >= 0 ? selPawn : treeSel >= 0 ? treeSel : -1);
  function updateDebug() {
    if (!$('dbgWhen')) return;
    const c = Sim.cal(st.t), days = nextMeeting();
    $('dbgWhen').textContent = skipping ? $('dbgWhen').textContent : `Year ${c.year}, ${Sim.SEASONS[c.season]} day ${c.sday + 1}. Next meetings in ${days} ${days === 1 ? 'day' : 'days'}.`;
    const id = selected(), p = id >= 0 ? st.pawns[id] : null;
    $('dbgSel').textContent = p ? `${Sim.fullName(p)}${p.died !== null ? ' (dead)' : `, ${p.age}, ${roleLine(p)}`}${p.advocate ? `; argues for “${optLabel(p.advocate.dim, p.advocate.opt).toLowerCase()}”` : ''}` : 'Select someone on the map, in the settlers list or in the family tree.';
    const out = st.demand.filter((q) => st.pawns[q].alive);
    $('dbgOut').textContent = out.length ? out.map((q) => `${Sim.fullName(st.pawns[q])} (${st.pawns[q].age}, ${st.villages[Sim.settlementIdOf(st, st.pawns[q])].name})`).join(', ') : 'Nobody right now.';
  }
  const dmsg = (t) => { const m = $('dbgMsg'); if (m) m.textContent = t; };
  async function skipYears(n) {
    if (skipping) return;
    skipping = true;
    const days = n * Sim.YEAR_DAYS;
    for (let d = 0; d < days; d++) {
      Sim.advance(st, Sim.DAY);
      if (d % 4 === 3) { $('dbgWhen').textContent = `Skipping: day ${d + 1} of ${days}…`; await frame(); }
    }
    skipping = false; st.visualDirty = true; settlersHTML = ''; dmsg(`Skipped ${n} ${n === 1 ? 'year' : 'years'}.`); updateDebug();
  }
  drawer.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b || !st || skipping) return;
    const id = selected(), p = id >= 0 ? st.pawns[id] : null;
    if (b.dataset.drift) { st.driftMul = +b.dataset.drift; drawer.querySelectorAll('[data-drift]').forEach((x) => x.setAttribute('aria-pressed', String(+x.dataset.drift === st.driftMul))); return; }
    switch (b.dataset.act) {
      case 'skip1': skipYears(1); break;
      case 'skip10': skipYears(10); break;
      case 'meet': Sim.holdMeetings(st); dmsg(st.meetingLog[0] ? st.meetingLog[0].text : ''); break;
      case 'move': Sim.movingRound(st); dmsg(`Moving round done; ${st.demand.length} want to move out.`); break;
      case 'kill': if (p && p.died === null) { Sim.killPawn(st, id, 'killed'); dmsg(`${Sim.fullName(p)} has died.`); if (selPawn === id) { selPawn = -1; $('tile').hidden = true; } } else dmsg('Select a living person first.'); break;
      case 'retire': { const hh = p ? Sim.holdingOf(st, id) : null; if (hh && Sim.retireHolder(st, hh.id)) dmsg(`${Sim.fullName(p)} hands over ${st.farmsteads[hh.farmstead].name}.`); else dmsg('Select someone who holds a farm and has an heir.'); break; }
      case 'advP': case 'advV': {
        if (!p || p.died !== null) { dmsg('Select a living person first.'); break; }
        const dim = +$('advDim').value, opt = +$('advOpt').value, until = st.cenv.t + 10;
        if (b.dataset.act === 'advP') { p.advocate = { dim, opt, until }; dmsg(`${Sim.fullName(p)} now argues for “${optLabel(dim, opt).toLowerCase()}”.`); }
        else {
          const s = st.cenv.settlements[Sim.settlementIdOf(st, p)], voiced = s.members().filter((q) => st.cenv.voiceOf(q, s) > 0).sort((x, y) => y.prestige - x.prestige);
          const want = Math.max(1, Math.ceil(voiced.length * 0.2)); let n = 0;
          for (const q of voiced) { if (n >= want) break; q.advocate = { dim, opt, until }; n++; }
          dmsg(`${n} of ${voiced.length} voices in ${s.name} now argue for “${optLabel(dim, opt).toLowerCase()}”.`);
        }
        break;
      }
    }
    settlersHTML = ''; updateDebug();
  });

  // ---- frame loop ----
  let time = 0;
  const lodEl = $('lod');
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  let frameErrAt = -1e9;
  const onFrame = (tk) => {
    if (!w) return;
    const dt = Math.min(0.05, tk.deltaMS / 1000);
    time += dt; frameNo++;
    if (intro) {
      intro.t += dt;
      const k = ease(clamp(intro.t / intro.d, 0, 1));
      cam.x = intro.x0 + (intro.x1 - intro.x0) * k; cam.y = intro.y0 + (intro.y1 - intro.y0) * k;
      cam.z = Math.exp(Math.log(intro.z0) + (Math.log(intro.z1) - Math.log(intro.z0)) * k); zt = cam.z;
      if (intro.t >= intro.d) intro = null;
    }
    if (Math.abs(zt - cam.z) > 1e-4) zoomAt(anchor.x, anchor.y, (cam.z + (zt - cam.z) * Math.min(1, dt * 14)) / cam.z);
    if (!drag && !pinch) {
      cam.x += vel.x * dt; cam.y += vel.y * dt;
      const decay = Math.exp(-dt * 4.5); vel.x *= decay; vel.y *= decay;
    }
    if (keys.size) {
      const sp = 700 / cam.z;
      if (keys.has('arrowleft') || keys.has('a')) cam.x -= sp * dt;
      if (keys.has('arrowright') || keys.has('d')) cam.x += sp * dt;
      if (keys.has('arrowup') || keys.has('w')) cam.y -= sp * dt;
      if (keys.has('arrowdown') || keys.has('s')) cam.y += sp * dt;
    }
    clampCam();
    world.scale.set(cam.z);
    world.position.set(app.screen.width / 2 - cam.x * cam.z, app.screen.height / 2 - cam.y * cam.z);

    T = levelFor(cam.z, T);
    // paint in bigger slices while the view is still; keep frames smooth while it moves
    const busy = intro || drag || pinch || keys.size || Math.abs(vel.x) + Math.abs(vel.y) > 2 || Math.abs(zt - cam.z) > 1e-3;
    if (!building) schedule(intro ? 14 : busy ? 9 : 22);
    display();
    lodEl.hidden = pending === 0;
    if (pending) lodEl.textContent = `Painting detail, ${pending} ${pending === 1 ? 'area' : 'areas'} left`;

    // sea: wave crests only once they are big enough not to shimmer
    const wa = clamp((cam.z - 0.14) / 0.3, 0, 1);
    L.waves.visible = wa > 0.01;
    if (!reduceMotion) {
      waves[0].tilePosition.x += 6 * dt; waves[0].tilePosition.y += 2.5 * dt;
      waves[1].tilePosition.x -= 4 * dt; waves[1].tilePosition.y += 3.5 * dt;
    }
    waves[0].alpha = (0.2 + (reduceMotion ? 0 : 0.05 * Math.sin(time * 0.8))) * wa;
    waves[1].alpha = (0.12 + (reduceMotion ? 0 : 0.04 * Math.sin(time * 0.55 + 1.3))) * wa;
    // clouds: visible on the overview, thinning out as you descend
    const zm = zMin(), fade = clamp((zm * 2.3 - cam.z) / (zm * 1.3), 0, 1);
    L.clouds.visible = L.shadows.visible = fade > 0.01;
    L.clouds.alpha = 0.85 * fade; L.shadows.alpha = 0.16 * fade;
    for (const c of clouds) {
      if (!reduceMotion) { c.spr.x += c.vx * dt; c.spr.y += c.vy * dt; }
      const hw = c.spr.width / 2;
      if (c.spr.x - hw > w.W + 200 * w.KS) c.spr.x = -hw - 200 * w.KS;
      c.sh.x = c.spr.x + 120 * w.KS; c.sh.y = c.spr.y + 90 * w.KS;
    }
    updateGrid();
    updateSettlement(dt);
    L.regions.alpha = clamp(1.25 - cam.z, 0.35, 1);
    if (hoverDirty || sel >= 0) { drawHover(); hoverDirty = false; }
    drawMinimapView();
  };
  // Pixi stops its ticker for good when a frame throws; catch it, say so, and keep the game running.
  app.ticker.add((tk) => {
    try { onFrame(tk); }
    catch (e) {
      console.error(e);
      if (performance.now() - frameErrAt > 5000) { frameErrAt = performance.now(); lodEl.hidden = false; lodEl.textContent = `Something went wrong in a frame: ${e.message}`; }
    }
  });

  // The page opens on the generation screen. A hash skips it: #<scenario><size><seed>, scenario s (founders), h (heirs) or p (populous),
  // size t, s, m or l (medium if left out); e.g. #s123, #h123, #pt123 (populous, tiny). #123 is founders on a medium map.
  const hm = location.hash.match(/^#([shp]?)([tsml]?)(\d{1,9})$/);
  if (hm) build(+hm[3], { s: 'founders', h: 'heirs', p: 'populous', '': 'founders' }[hm[1]], hm[2] || 'm');
  else showGenScreen();
})();
</script>
</body>
</html>
