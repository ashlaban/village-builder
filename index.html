<style>
:root {
  --sea: #16395f;

  --node: #fbfdfc;

  --bad: #a8432f;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(11, 27, 34, 0.86);
    --ink: #e1ebe7;
    --muted: #93adae;
    --edge: rgba(225, 235, 231, 0.14);
    --accent: #84c9b5;
    --on-accent: #0c1f25;
    --node: #17323b;
    --good: #8fd0a2;
    --bad: #f0a08c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(11, 27, 34, 0.86);
  --ink: #e1ebe7;
  --muted: #93adae;
  --edge: rgba(225, 235, 231, 0.14);

*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; background: var(--sea); scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; overflow: hidden; background: var(--sea); color: var(--ink);

}

.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(5, 18, 30, 0.38) 100%); }

}
.chart { border-radius: 18px; padding: 12px 16px 14px; max-width: 330px; }

.chart .meta { margin: 3px 0 0; color: var(--muted); font-size: 15px; }
.chart .hint { margin: 2px 0 12px; color: var(--muted); font-size: 14px; line-height: 1.35; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.hud.top { flex-wrap: wrap; }
.clock { border-radius: 14px; padding: 8px 10px 8px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; max-width: 570px; }

.speed { display: flex; flex-wrap: wrap; gap: 4px; }

.background-run { flex-basis: 100%; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }

#skipBtn { padding: 5px 10px; font-size: 14px; }

.settlers { margin-top: 12px; max-height: min(50vh, 440px); overflow-y: auto; border-top: 1px solid var(--edge); padding: 2px 4px 0 0; }

.settlers h2 span { font-family: 'Alegreya Sans', system-ui, sans-serif; font-style: normal; font-weight: 400; font-size: 14px; color: var(--muted); }
.settlers p { margin: 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
.settlers ul { list-style: none; margin: 4px 0 0; padding: 0; }

.settlers li button { border: 0; border-radius: 3px; padding: 0; background: none; font-size: 15px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; }
.settlers .log p { margin-top: 3px; }

.settlers .doing { font-size: 13px; font-style: italic; }
.tree { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(6, 18, 26, 0.55); padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.tree[hidden] { display: none; }
.tree-card { width: min(1120px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; }
.tree-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 14px 18px; border-bottom: 1px solid var(--edge); }
.tree-head h2 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0; }
.tree-head p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; min-width: 12ch; }
.tree-modes { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 18px; border-bottom: 1px solid var(--edge); }
.tree-modes button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.tree-caption { margin: 0; padding: 8px 18px; border-bottom: 1px solid var(--edge); font-size: 15px; line-height: 1.4; }
.tree-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; flex: 1; }
.tree-scroll { overflow: auto; padding: 10px; min-height: 220px; }
.tree-info { border-left: 1px solid var(--edge); padding: 14px 18px 18px; overflow: auto; }
.tree-info h3 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 22px; margin: 0 0 6px; }
.tree-info p { margin: 0 0 6px; font-size: 15px; line-height: 1.45; }
.tree-info .hint { color: var(--muted); }
.tree-info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 12px 0 16px; font-size: 15px; line-height: 1.4; }
.tree-info dt { color: var(--muted); }
.tree-info dd { margin: 0; }
.tree-info dd button { border: 0; padding: 0; background: none; font-size: 15px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; border-radius: 3px; }
#treeSvg text.n { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 15px; fill: var(--ink); }
#treeSvg text.s { font-family: 'Alegreya Sans', system-ui, sans-serif; font-size: 12.5px; fill: var(--muted); }
#treeSvg .tn { cursor: pointer; }
#treeSvg .tn rect { fill: var(--node); stroke: var(--edge); stroke-width: 1; }
#treeSvg .tn.sel rect { stroke: var(--accent); stroke-width: 2.5; }
#treeSvg .tn.focus rect { stroke: var(--ink); stroke-width: 1.5; }
#treeSvg .tn.focus.sel rect { stroke: var(--accent); stroke-width: 2.5; }
#treeSvg .chip { cursor: pointer; }
#treeSvg .chip rect { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
#treeSvg .chip:focus { outline: none; }
#treeSvg .chip:focus-visible rect { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: none; }

#treeSvg .tn:focus-visible rect { stroke: var(--accent); stroke-width: 3; }

#treeSvg .heir { fill: #c9a24a; }
.tree-info .evs { margin: 0 0 14px; padding-left: 18px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.actions select { font: inherit; font-size: 15px; color: var(--ink); background: var(--node); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 10px; max-width: 100%; }
.drawer { position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 86px); width: min(420px, calc(100vw - 28px)); max-height: calc(100vh - 230px); overflow: auto; border-radius: 16px; padding: 12px 14px 16px; z-index: 6; }
.drawer[hidden] { display: none; }
.drawer .dclose { position: sticky; top: 0; float: right; }
.drawer .dh { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 22px; margin: 2px 0 6px; }
.drawer .dh3 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 18px; margin: 14px 0 4px; }
.drawer .dm { margin: 0 0 6px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.drawer .dm strong { color: var(--ink); font-weight: 600; }
.cust { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0 6px; }
.cust th, .cust td { text-align: left; vertical-align: top; padding: 6px 4px; border-top: 1px solid var(--edge); }
.cust thead th { font-weight: 600; border-top: 0; }
.cust tbody th { font-weight: 500; }
.cust td.dev { background: rgba(201, 162, 74, 0.16); }
.sbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; background: var(--edge); }
.sbar i { display: block; height: 100%; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 3px 0 6px; vertical-align: -1px; }
.mall { color: var(--muted); letter-spacing: 1px; font-size: 11px; }
.dbg-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.dbg-row button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.drawer select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); max-width: 100%; }
.dchk { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 8px 0; }
button {
  font: inherit; font-size: 15px; font-weight: 500; line-height: 1.2; color: var(--ink);
  background: transparent; border: 1px solid var(--edge); border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button[aria-pressed="false"] { color: var(--muted); }
button:disabled { opacity: 0.55; cursor: progress; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile { border-radius: 14px; padding: 10px 14px; min-width: 170px; transition: opacity 0.2s; }
.tile[hidden] { display: block; opacity: 0; pointer-events: none; }
.tile strong { display: block; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 21px; line-height: 1.1; }
.tile span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.tile .rel { margin-top: 7px; padding-top: 5px; border-top: 1px solid var(--edge); }
.tile .rel h3 { margin: 0 0 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tile .rel button { display: flex; gap: 8px; width: 100%; padding: 1px 0; border: 0; background: none; font: inherit; font-size: 13px; color: var(--ink);
  text-align: left; cursor: pointer; }
.tile .rel button i { flex: 1; font-style: normal; color: var(--muted); }
.tile .rel button b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .rel button i.give { text-align: right; }
.tile .rel button + h3 { margin-top: 8px; }
.tile .rel .pos { color: var(--good); }
.tile .rel .neg { color: var(--bad); }
.minimap { position: relative; width: 200px; border-radius: 10px; overflow: hidden; cursor: crosshair; touch-action: none; padding: 0; }
.minimap canvas { display: block; width: 100%; height: auto; }
.minimap #mmView { position: absolute; inset: 0; height: 100%; }
.genscreen { position: fixed; inset: 0; z-index: 11; display: grid; place-items: center; padding: 16px; background: var(--sea); }
.genscreen[hidden] { display: none; }
.genscreen form, .genscreen .landing { display: grid; gap: 14px; width: min(360px, 100%); padding: 20px 22px; border-radius: 16px; }
.genscreen h1 { margin: 0; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-size: 30px; }
.genscreen label { display: grid; gap: 4px; color: var(--muted); font-size: 14px; }
.genscreen input, .genscreen select { font: inherit; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); }
.genscreen .err { margin: 0; color: #b4382c; font-size: 14px !important; }
.genscreen .gen-docs { margin: 0; text-align: center; color: var(--muted); font-size: 14px; }
.genscreen .gen-docs a { color: var(--accent); }
.saves-screen { position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; padding: 16px; overflow-y: auto; background: rgba(8, 24, 36, 0.55); }
.saves-screen[hidden] { display: none; }
.saves-screen > .panel { display: grid; gap: 12px; width: min(440px, 100%); padding: 20px 22px; border-radius: 16px; }
.saves-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.saves-head h1 { margin: 0; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-size: 30px; }
.saves-body { display: grid; gap: 10px; font-size: 13px; }
.save-slot { display: grid; grid-template-columns: 3.2em 1fr; gap: 2px 8px; align-items: start; }
.save-slot b { font-weight: 600; }
.save-slot small { display: block; color: var(--muted); }
.save-slot small.save-other { color: #b4382c; }
.save-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.save-slot .save-acts { grid-column: 2; }
.save-acts button, .save-arch h3 button { min-height: 0; padding: 3px 10px; font-size: 13px; }
.save-msg { margin: 0; color: var(--muted); }
.save-arch { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--edge); }
.save-arch h3 { margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
.loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--sea); color: #e3eeea; transition: opacity 0.7s; }
.loader.done { opacity: 0; pointer-events: none; }
.loader p { margin: 0; text-align: center; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-size: 22px; }
.loader .bar { width: min(280px, 70vw); height: 3px; margin-top: 14px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, 0.16); }
.loader .bar i { display: block; height: 100%; width: 0; background: #9fd6c6; }
.err { max-width: 34ch; font-family: 'Alegreya Sans', system-ui, sans-serif !important; font-style: normal !important; font-size: 16px !important; line-height: 1.4; }
@media (prefers-reduced-motion: reduce) { .loader, .tile { transition: none; } }

/* The map stays central; panels share a predictable header and scroll area. */
[hidden] { display: none !important; }
.mobile-only { display: none; }
:root { --dock-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
button, select, input[type="search"], summary { min-height: 44px; }
button { touch-action: manipulation; }
summary { cursor: pointer; padding: 10px 0; line-height: 1.4; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select { font: inherit; color: var(--ink); }
.chart { width: 310px; }
.chart .hint { margin-bottom: 8px; }
.menu-label { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 14px 0 6px; }
.background-run { margin: 8px 0 12px; min-height: 44px; font-size: 14px; }
.background-run input, .dchk input { width: 20px; height: 20px; flex-shrink: 0; }
.clock { margin-right: 100px; max-width: 590px; }
.speed button { min-width: 44px; }
.ui-toggle { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(14px, env(safe-area-inset-right, 0px)); z-index: 8; }
.navigation { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); bottom: var(--dock-bottom); display: flex; gap: 4px;
  padding: 5px; border-radius: 18px; }
.navigation button { min-width: 90px; border: 0; border-radius: 12px; }
.navigation button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.sheet { display: flex; flex-direction: column; padding: 0; overflow: hidden; border-radius: 18px; }
.people-sheet, .drawer, .tile { position: fixed; z-index: 6; bottom: calc(var(--dock-bottom) + 68px); top: auto;
  max-height: min(65vh, calc(100dvh - 180px)); width: min(430px, calc(100vw - 28px)); }
.people-sheet, .tile { left: max(14px, env(safe-area-inset-left, 0px)); }
.drawer { left: auto; right: max(14px, env(safe-area-inset-right, 0px)); }
.sheet-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--edge); flex-shrink: 0; }
.sheet-head h2, .sheet-head strong { flex: 1; min-width: 0; margin: 0; font: italic 700 22px/1.1 'Alegreya', Georgia, serif;
  overflow-wrap: anywhere; }
.sheet-head button { padding: 6px 10px; flex-shrink: 0; }
.sheet-head .sheet-expand { font-size: 13px; color: var(--muted); }
.sheet-content { overflow: auto; overscroll-behavior: contain; min-height: 0; padding: 12px 16px 16px; scrollbar-gutter: stable; }

.collapsed .sheet-head { border-bottom: 0; }
.settlers { max-height: none; overflow: visible; border-top: 0; margin: 0; padding: 0; }
.search-label { display: block; color: var(--muted); font-size: 14px; margin-bottom: 6px; }

#peopleCount { margin: 8px 0; }
.village-block, .household-block, .fold-section { border-top: 1px solid var(--edge); }
.village-block > summary { font: italic 700 22px/1.3 'Alegreya', Georgia, serif; }
.summary-meta { display: block; margin: 2px 0 0 18px; font: 400 14px/1.4 'Alegreya Sans', sans-serif; color: var(--muted); }

.fold-section > summary { font-size: 15px; color: var(--ink); }
.selection-summary { padding: 0 16px 12px; }

.tile span { font-size: 15px; line-height: 1.4; }
#tileActivity { color: var(--ink); }
.tile .rel button { flex-wrap: wrap; align-items: center; gap: 2px 8px; padding: 8px 0; min-height: 44px; font-size: 15px; }
.tile .rel button i { flex-basis: 45%; }
#personFamily { margin: 12px 0; }
.minimap { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(var(--dock-bottom) + 68px); }
#minimapClose { position: absolute; top: 3px; right: 3px; background: var(--panel); }

/* Notifications (VB-098): toasts at the bottom centre, just above the dock, the newest lowest (Kim, 9 Nov; first built at the bottom left).
   On a window too narrow to clear an open sheet they move to the middle of what is left free (between a left sheet and the minimap, or left
   of the drawer). They hide the "painting detail" line while they are up. */
.toasts { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); bottom: calc(var(--dock-bottom) + 66px);
  width: min(380px, calc(100vw - 28px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
body:has(.toast) .lod { visibility: hidden; }
@media (min-width: 1025px) and (max-width: 1300px) {
  body:has(.people-sheet:not([hidden])):not(:has(.drawer:not([hidden]))) .toasts,
  body:has(.tile:not([hidden])):not(:has(.drawer:not([hidden]))) .toasts { left: calc(50% + 115px); width: min(380px, calc(100vw - 700px)); }
  body:has(.drawer:not([hidden])):not(:has(.people-sheet:not([hidden]))):not(:has(.tile:not([hidden]))) .toasts { left: calc(50% - 222px); }
}
.toast { pointer-events: auto; border-radius: 12px; padding: 8px 12px; text-align: left; font-size: 14px; line-height: 1.35; color: var(--ink);
  animation: toast-in 0.2s ease-out; }

button.name { display: inline; min-height: 0; padding: 0; border: 0; border-radius: 3px; background: none; font: inherit; color: var(--ink); text-align: left;

<body>
<div id="stage" aria-label="Map of the archipelago"></div>
<div class="vignette"></div>

<div class="hud top">
  <header class="chart panel">
    <h1 id="name">Archipelago</h1>
    <div id="worldMenu" class="world-menu">
      <div class="sheet-head mobile-only"><h2>Menu</h2><button id="menuClose" type="button">Close</button></div>
      <p class="meta" id="meta"></p>
      <p class="hint" id="hint"></p>

      <div class="actions">
        <button id="gridBtn" type="button" aria-keyshortcuts="g" title="Hex grid (G)" aria-pressed="true">Grid</button>
        <button id="regionBtn" type="button" aria-keyshortcuts="r" title="Regions (R)" aria-pressed="false">Regions</button>
        <button id="landBtn" type="button" aria-keyshortcuts="l" title="Land ownership (L)" aria-pressed="false">Land</button>
        <button id="minimapBtn" type="button" aria-keyshortcuts="m" title="Minimap (M)" aria-pressed="false">Minimap</button>
      </div>
      <h2 class="menu-label">Game</h2>
      <label class="background-run"><input id="backgroundRun" type="checkbox"> Keep running in background</label>
      <details class="notices"><summary>Notifications</summary><div id="noticeList"></div></details>
      <div class="actions">
        <button class="primary" id="regen" type="button">Main menu</button>
        <button id="savesBtn" type="button">Saves</button>
        <button id="debugBtn" type="button" aria-pressed="false">Debug</button>
      </div>
    </div>
  </header>
  <div class="clock panel" id="clock">
    <div class="calendar"><strong id="clockDate">Spring, day 1</strong><span id="clockYear">Year 1, 06:00</span></div>
    <button id="pauseBtn" class="mobile-only" type="button" aria-label="Pause game">Pause</button>
    <button id="speedBtn" class="mobile-only" type="button" aria-expanded="false" aria-controls="speedOptions">1×</button>

      <button type="button" data-speed="1" aria-pressed="true" aria-keyshortcuts="1" title="1× (1)">1×</button>
      <button type="button" data-speed="3" aria-pressed="false" aria-keyshortcuts="2" title="3× (2)">3×</button>
      <button type="button" data-speed="10" aria-pressed="false" aria-keyshortcuts="3" title="10× (3)">10×</button>
      <button type="button" data-speed="30" aria-pressed="false" aria-keyshortcuts="4" title="30× (4)">30×</button>
      <button type="button" data-speed="Infinity" aria-pressed="false" aria-keyshortcuts="5" title="Uncapped (5)">Uncapped</button>
    </div>
    <button id="skipBtn" type="button" aria-pressed="false" title="Run ahead to the next event that concerns your pawn" hidden>Skip to next event</button>
  </div>
</div>
<button id="uiToggle" class="panel ui-toggle" type="button" aria-pressed="false" aria-keyshortcuts="h" title="Hide or show the interface (H)">Hide UI</button>
<div class="lod" id="lod" hidden></div>
<div class="play-offer panel succession" id="succession" role="dialog" aria-label="Go on as another" hidden></div>

        viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8"
        r="4.5"/><path d="M8 0v4M8 12v4M0 8h4M12 8h4"/></svg></button>
      <button type="button" class="sheet-expand" data-sheet="tile" aria-expanded="false" aria-controls="tileDetails">Details</button>
      <button id="tileClose" type="button" aria-label="Close selection">Close</button>
    </div>
    <div class="selection-summary"><span id="tileElev"></span><span id="tileActivity" hidden></span></div>
    <div class="sheet-content" id="tileDetails">
      <div class="tabs" id="tileTabs" role="tablist" aria-label="About the selection" hidden>
        <button type="button" role="tab" id="tabFacts" data-tab="facts" aria-selected="true" aria-controls="tileFacts">Details</button>
        <button type="button" role="tab" id="tabHistory" data-tab="history" aria-selected="false" aria-controls="tileHistory" tabindex="-1">History</button>
      </div>
      <div id="tileFacts" role="tabpanel" aria-labelledby="tabFacts">
        <span id="tileCoord"></span>
        <span id="tileExtra" hidden></span>
        <span id="tileMore" hidden></span>
        <div id="tileRest"></div>
        <div id="cardPlay" class="play" hidden></div>
        <div id="tileLinks" class="links" hidden></div>
        <div id="tileList" class="roster" hidden></div>
        <button type="button" id="personFamily" hidden>View family records</button>
        <details id="relationsDetails"><summary>Relationships</summary><div class="rel" id="tileRel" hidden></div></details>
      </div>
      <div id="tileHistory" class="history" role="tabpanel" aria-labelledby="tabHistory" hidden>
        <div class="kinds" id="historyKinds" role="group" aria-label="Kinds of event"></div>
        <div id="historyList"></div>

<script>
// @sys gen/rivers: rivers traced over the generated terrain, from hills, mountains and marsh through lakes to the sea, and drawn on the map
// ===== Rivers: drainage by priority flood, catchment, sources per island, courses to the sea; their curves on the map =====
// Listed before gen.js, which calls trace; it reads no other module, so gen.js passes in the arrays, a random source and the biome codes.
VB['gen/rivers'] = (() => {

  // spacing: least steps between two sources; own: least land tiles a new river runs before it meets water or another river;
  // longEnough: a course of this many land tiles counts as long, so beyond it the noise (up to `noise`) spreads sources over the island.
  const RIVERS = { perTiles: 700, fromWater: 3, spacing: 10, own: 3, longEnough: 15, noise: 10 };
  // Fords: in stretches of `every` land tiles down each reach, the best site is a ford; a last stretch under `least` joins the one before.
  // A site's score (lower is better) is its drop to the next tile per `drop` of elevation, plus the root of its catchment per `narrow`,
  // plus up to `noise` at random: a ford is flat and narrow.
  const FORDS = { every: 10, least: 3, drop: 0.03, narrow: 10, noise: 1 };

  // A binary min-heap of tile indexes by key[i], ties broken by the lower index, so the order is the same on every run.
  function minHeap(key) {
    const a = [];
    const less = (i, j) => key[i] < key[j] || (key[i] === key[j] && i < j);
    return {
      get size() { return a.length; },
      push(i) {
        let c = a.push(i) - 1;
        while (c > 0) { const p = (c - 1) >> 1; if (!less(a[c], a[p])) break; [a[c], a[p]] = [a[p], a[c]]; c = p; }

  // order lists the tiles as the flood reached them, so a tile always comes after the tile it drains to.

// @sys sim/registry: load-time rules and ordered contributions; hot values and checked explanations
VB['sim/registry'] = (() => {
  // Code, never saved state. Nothing may register once a simulation has been seeded or loaded.
  const rules = new Map();
  let sealed = false;
  function atLoad() { if (sealed) throw new Error('Rules may only be registered at load time'); }
  function ruleOf(id) {
    const rule = rules.get(id);
    if (!rule) throw new Error('Unknown rule: ' + id);
    return rule;
  }
  const text = (s) => typeof s === 'string' && s.length > 0;
  const range = (r) => Array.isArray(r) && r.length === 2 && r.every(Number.isFinite) && r[0] <= r[1];

    atLoad();

      || !['product', 'sum'].includes(spec.combine) || (spec.clamp !== undefined && !range(spec.clamp))) {
      throw new Error('Invalid rule specification');
    }
    if (rules.has(spec.id)) throw new Error('Duplicate rule: ' + spec.id);
    const copy = Object.freeze({ ...spec, clamp: spec.clamp ? Object.freeze([...spec.clamp]) : undefined });
    rules.set(spec.id, { spec: copy, contributions: [] });
  }
  function contribute(c) {
    atLoad();
    if (!c || !text(c.source) || !text(c.key) || !text(c.label) || typeof c.value !== 'function'
      || !range(c.range) || !Array.isArray(c.tunables) || !c.tunables.every(text)
      || (c.cause !== undefined && !text(c.cause))) throw new Error('Invalid rule contribution');
    const rule = ruleOf(c.rule);
    if (rule.contributions.some((p) => p.key === c.key)) throw new Error('Duplicate contribution: ' + c.key);
    rule.contributions.push(Object.freeze({ ...c, range: Object.freeze([...c.range]), tunables: Object.freeze([...c.tunables]) }));
  }

    if (sealed) return;
    for (const rule of rules.values()) Object.freeze(rule.contributions);
    sealed = true;
  }
  const clamped = (n, bounds) => bounds ? Math.max(bounds[0], Math.min(bounds[1], n)) : n;
  // Diagnostics validate callbacks without adding checks to the simulation's hot value path.
  function checked(id, origin, n, bounds = null) {
    if (!Number.isFinite(n)) throw new Error(`Rule ${id}: ${origin} returned a non-finite number (${String(n)})`);
    if (bounds && (n < bounds[0] || n > bounds[1])) {
      throw new Error(`Rule ${id}: ${origin} returned ${n} outside [${bounds}]`);
    }
    return n;
  }
  function value(st, id, ctx) {
    VB.count.ruleValue++;
    const { spec, contributions } = ruleOf(id);
    let n = spec.base(st, ctx);
    // Fixed load-time order preserves floating-point evaluation; no array, object or callback is made here.
    if (spec.combine === 'product') {
      for (let i = 0; i < contributions.length; i++) n *= contributions[i].value(st, ctx);
    } else {
      for (let i = 0; i < contributions.length; i++) n += contributions[i].value(st, ctx);

  }
  function explain(st, id, ctx) {

      const factor = checked(id, 'contribution ' + c.key + ' (' + c.source + ')', c.value(st, ctx), c.range);
      n = checked(id, 'combined value after ' + c.key, spec.combine === 'product' ? n * factor : n + factor);
      parts.push({ key: c.key, source: c.source, label: c.label, cause: c.cause, factor });
    }
    return { value: clamped(n, spec.clamp), base, parts, combine: spec.combine,
      unclamped: n, clamp: spec.clamp ? [...spec.clamp] : null };
  }
  function list() {
    return Object.freeze([...rules.values()].map(({ spec, contributions }) => Object.freeze({
      rule: spec.id, owner: spec.owner, combine: spec.combine, clamp: spec.clamp || null,
      contributions: Object.freeze(contributions.map(({ key, source, label, cause, range, tunables }) =>
        Object.freeze({ key, source, label, cause, range, tunables }))),
    })));
  }
  return { declare, contribute, value, explain, list, seal };
})();

// @sys sim/rng: seeded random streams as plain data (mulberry32), one per system, so systems do not reshuffle each other and saves can hold them
VB['sim/rng'] = (() => {
  // A stream is { s }: a 32-bit state. next() gives exactly the sequence of gen's mulberry32 closure started from the same state, and a stream
  // copied with JSON continues identically. A test may set `fix` on a stream: next() then returns it without advancing (every chance comes up).
  function next(r) {
    if (r.fix !== undefined) return r.fix;
    r.s = (r.s + 0x6d2b79f5) | 0;
    let t = Math.imul(r.s ^ (r.s >>> 15), 1 | r.s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  const fromState = (a) => ({ s: a | 0 });

  function makeStream(seed, name) {
    let h = 0x811c9dc5;
    for (let i = 0; i < name.length; i++) h = Math.imul(h ^ name.charCodeAt(i), 0x01000193);
    return fromState(Math.imul(seed | 0, 0x9e3779b1) ^ h);

  const SYSTEMS = ['work', 'fields', 'weather', 'fences', 'births', 'deaths', 'culture', 'people', 'society', 'talk', 'herds', 'settle'];
  // While a scenario is seeded, every system draws from its one seeding stream S, in the order it always has.
  const seeding = (S) => Object.fromEntries([['seed', S], ...SYSTEMS.map((k) => [k, S])]);

  // draws does not reshuffle the others. The seeding stream is dropped.
  function splitStreams(st, seed) { st.rng = Object.fromEntries(SYSTEMS.map((k) => [k, makeStream(seed, k)])); }

  const drawer = (r) => () => next(r);
  return { next, fromState, makeStream, drawer, SYSTEMS, seeding, splitStreams };
})();

// @sys sim/hex: hex-grid search, paths and land components

  // searched the whole island from each village).
  let mark = new Int32Array(0), stamp = 0, depth = new Int32Array(0);

    if (from === to) return 0;

    const q = [from]; stamp++; mark[from] = stamp; depth[from] = 0;

        const j = w.nb[i * 6 + k];

        if (j === to) return d + 1;
        mark[j] = stamp; depth[j] = d + 1; q.push(j);
      }

  }

    const p = [to]; while (p[0] !== from) { const q = prev.get(p[0]); if (q === undefined) return null; p.unshift(q); } return p;
  };

    const ax = a % w.COLS, ay = (a / w.COLS) | 0, bx = b % w.COLS, by = (b / w.COLS) | 0;
    const aq = ax - ((ay - (ay & 1)) >> 1), bq = bx - ((by - (by & 1)) >> 1), dq = aq - bq, dr = ay - by;

})();

    woods: ['Lunden', 'Hult', 'Lid', 'Skogen', 'Rödjan', 'Bråten'],
    hills: ['Backa', 'Åsen', 'Kullen', 'Berget', 'Höjden', 'Hällen'],

  const setOwner = (st, tile, owner) => {

  // a's opinion of b, -1..1, a's tie to b being `tie`: the standing's value, plus affinity (compatibility, shown as the two grow familiar),
  // plus the memories, as they are now. Goodwill's gratitude (VB-220) is to add to the same sum.
  function opinionAt(st, a, b, tie) {

  const bandOf = (was, o) => (o >= SOCIAL.closeFriend || (was === 1 && o >= SOCIAL.closeFriend - SOCIAL.back) ? 1
    : o <= SOCIAL.enemy || (was === -1 && o <= SOCIAL.enemy + SOCIAL.back) ? -1 : 0);
  // a's opinion of b may have moved: its tie grew (a talk, a job done together, the day's hours at home, the season's kin floor), a memory
  // came, or the season's pass. The band is checked for this pair only; reaching close friends or enemies is a life event of a. A line
  // crossed lazily, as a tie or a memory fades, is told when the pair is next touched, dated then.
  function touch(st, a, b) {

  // memory counts 0 until then); the bands are checked again, those to the dead dropped.
  function fadeRelations(st) {
    for (const liveId of st.living) {
      const p = st.pawns[liveId]; if (!p.alive) continue;

  function forget(st, id) {
    const p = st.pawns[id];
    for (const m of [p.rel, p.bands, p.ties]) for (const j of m.keys()) { const q = st.pawns[j]; if (q.rel) q.rel.delete(id); if (q.bands) q.bands.delete(id); }

  // ---- talk: in each waking hour a pawn may start one talk, with a pawn in its house or near it outdoors (VB-061) ----
  const T = SOCIAL.talk;
  const young = (st, p) => p.age >= T.young[0] && p.age <= T.young[1] && spouseOf(st, p.id) === null;
  const able = (st, a) => { const p = st.pawns[a.id]; return p.alive && p.age >= T.minAge && !a.carry; };
  // Scratch for the hourly round (derived, not state): busy[id] === round marks a pawn talking this hour, seen[id] === look a pawn already

  let busy = new Int32Array(1024), seen = new Int32Array(1024), round = 0, look = 0;
  const found = [], lists = [];
  // Who a could talk with, into `found`: the housemates in the house with it; outdoors, up to T.sample pawns drawn from the cells around
  // it (`near`, from outdoors in sim/society), within near.size in x and y. Pawns talking already this hour are left out.
  function partnersOf(st, a, near) {
    found.length = 0;

      const hh = st.households[st.pawns[a.id].household];

      if (seen[b.id] === look) continue;
      seen[b.id] = look;

  // How much a would rather talk with b: more with the familiar and the liked, less with someone it dislikes. sa is a's tie scale (scaleOf).

    round++;

      }

      while (i < cand.length - 1 && (x -= wts[i]) > 0) i++;

  function makeRoom(st, a) {

    if (x === 0) return;
    dropForgotten(st, a); dropForgotten(st, b);
    const g = st.pawns[a].goodwill, e = g && g.get(b);
    if (!e) { makeRoom(st, a); makeRoom(st, b); setPair(st, a, b, x); return; }
    const v = goodwillNow(st, e) + x;

  function book(st, creditor, debtor, rations) {

  function passGoodwill(st, from, to, share) {

    return out.sort((x, y) => Math.abs(y.balance) - Math.abs(x.balance) || x.other - y.other);

  const opinionWord = (o) => (o >= SOCIAL.closeFriend ? 'close friend' : o >= SOCIAL.friend ? 'friend' : o <= SOCIAL.enemy ? 'enemy'
    : o <= SOCIAL.dislike ? 'dislikes' : 'neutral');

  function relationsOf(st, id) {
    const p = st.pawns[id], ids = new Set([...p.ties.keys(), ...p.rel.keys()]), out = [];
    for (const j of ids) {

    }

    const f = affinity(st, a, b, tieOf(st, a, b)); if (Math.abs(f) >= 0.005) out.push({ label: f > 0 ? 'Get on well' : 'Do not get on', value: f });
    out.sort((x, y) => Math.abs(y.value) - Math.abs(x.value));
    if (k) out.unshift({ label: WORDS[k][st.pawns[b].sex === 'f' ? 1 : 0], value: SOCIAL.situational[k] });
    return out;
  }
  return {
    initRelations, tieOf, addTie, raiseTie, dropTies, workedTogether, renormalise, dailyTies, floorKin, migrateTies,
    compat, standing, standingWord, memNow, opinionOf, bandOf, touch, remember, fadeRelations, forget, talkHour, talkWeight, companyFor, opinionWord,
    relationsOf, reasonsOf, ALLOWANCE_BOUND, balance, book, addGoodwill, passGoodwill, endGoodwill, goodwillOf,
  };
})();

<script>
// @sys sim/claims: claims on tiles, realised and unrealised: strength, renewal and lapse, disputes settled by custom, and the land each holds
VB['sim/claims'] = (() => {
  const Culture = VB['culture'];
  const { YEAR, CLAIMS } = VB['sim/rules'];
  const { setOwner } = VB['sim/ownership'];
  const { kinship, membersOf, voiceOf } = VB['sim/records'];
  const { tieOf } = VB['sim/relations'];
  // A claim is a wish for a tile (unrealised: a village's outland not yet its own, a household's stake before the ground is broken) or a right
  // in force that is not ownership (realised: a family's birthright on its old farm). Ownership itself is st.owner (sim/ownership).
  // @state st.claims: Map of tile to its claims [{by: {type 'pawn'|'household'|'village', id}, state 'unrealised'|'realised', why ('outland',
  //   'field', 'meadow', 'farm', 'birthright'), since, renewed (game hours), seq (order made), until (game hours: a realised claim's end, or null)}];
  //   a tile with none has no entry. sim/claims
  // @state st.claimSeq: number; counter for the claims' seq
  // @state st.landDirty: Set of tiles whose owner or claims changed; the page redraws its Land overlay there and clears it (VB-004)
  const NONE = [];
  const same = (a, b) => a.type === b.type && a.id === b.id;
  const dirty = (st, tile) => { if (st.landDirty) st.landDirty.add(tile); };
  const claimsOn = (st, tile) => st.claims.get(tile) || NONE;
  const claimOf = (st, tile, by) => claimsOn(st, tile).find((c) => same(c.by, by)) || null;
  // Strength: 1 for a realised claim; an unrealised one falls from 1 to 0 over CLAIMS.years without work or renewal (Decided, 30 Oct).
  const strength = (st, c) => (c.state === 'realised' ? 1 : Math.max(0, Math.min(1, 1 - (st.t - c.renewed) / (CLAIMS.years * YEAR))));
  // A claim by `by` on tile, or the existing one renewed (and given the new why and state). opt: {state, until}.
  function addClaim(st, tile, by, why, opt = {}) {
    let c = claimOf(st, tile, by);
    if (c) { c.renewed = st.t; c.why = why; if (opt.state) c.state = opt.state; if (opt.until !== undefined) c.until = opt.until; dirty(st, tile); return c; }
    c = { by: { type: by.type, id: by.id }, state: opt.state || 'unrealised', why, since: st.t, renewed: st.t, seq: ++st.claimSeq, until: opt.until ?? null };
    const list = st.claims.get(tile);
    if (list) list.push(c); else st.claims.set(tile, [c]);
    dirty(st, tile);
    return c;
  }
  // Work on the tile or a renewal by the claimant: the claim is at full strength again. The claim, or null.
  function renewClaim(st, tile, by) { const c = claimOf(st, tile, by); if (c) c.renewed = st.t; return c; }
  function dropClaim(st, tile, by) {
    const list = st.claims.get(tile); if (!list) return null;
    const i = list.findIndex((c) => same(c.by, by)); if (i < 0) return null;
    const [c] = list.splice(i, 1);
    if (!list.length) st.claims.delete(tile);
    dirty(st, tile);
    return c;
  }
  // Every claim on the tile is dropped (it was taken, or the dispute is settled). The dropped claims.
  function clearClaims(st, tile) {
    const list = st.claims.get(tile); if (!list) return NONE;
    st.claims.delete(tile); dirty(st, tile);
    return list;
  }
  // Every claim by `by` is dropped (a household that dissolves, sim/stakes). The number dropped.
  function dropAllOf(st, by) {
    const tiles = [];
    for (const [tile, list] of st.claims) if (list.some((c) => same(c.by, by))) tiles.push(tile);
    for (const t of tiles) dropClaim(st, t, by);
    return tiles.length;

  // The claim is realised as ownership: the claimant (a household or a village) owns the tile and the claim is dropped.
  function realise(st, tile, by) {
    if (by.type !== 'household' && by.type !== 'village') throw new Error(`realise: a ${by.type} cannot own land`);
    dropClaim(st, tile, by); setOwner(st, tile, by);
  }
  // Once a day: unrealised claims at no strength and realised claims past their end lapse. [[tile, claim]] dropped, for their owners to see.
  function lapseClaims(st) {
    const out = [];
    for (const [tile, list] of st.claims) {

// @sys sim/stakes: a household's stake on the tile of its new field or meadow (VB-158): staked when the project starts, renewed by its work,

VB['sim/stakes'] = (() => {
  const { CLAIMS } = VB['sim/rules'];

  // meadow) makes it the household's. Other households take in no staked tile (sim/territory, freeFor). The work renews the claim (the job

  // besides.

  // tile before; under `strongest` hh's fresh claim wins; under `meeting` the better supported. If hh wins, the stake is dropped and its

})();

  const { costChanged } = VB['sim/routes'];
  const { villageWood, moveWood } = VB['sim/territory'];
  const REGROW_YEARS = 30; // a partly felled tile regains its trees, linearly, in this many game years

  function stageChanged(st, tile, was) { if (treeStage(st.w, tile) !== was) st.treeDirty.add(tile); }

  // A tile with no trees left becomes meadow for good; villages that used it as their wood take the nearest forest in their own land, else the
  // nearest no other village holds (sim/territory), and their farms with it; a farm with a woodlot of its own takes the nearest forest.
  function clearTile(st, tile) {
    const w = st.w;
    w.trees[tile] = 0; w.treesMax[tile] = 0; st.regrow.delete(tile);
    setBiome(w, tile, B.MEADOW);

    for (const v of st.villages) if (v.commonsWood === tile) { const wd = villageWood(st, v); moveWood(st, v, wd); v.commonsWood = wd; }
    for (const f of st.farmsteads) {
      if (f.woodlot !== tile) continue;
      f.woodlot = st.villages[f.village].commonsWood;
    }

  // A completed firewood trip fells one tree from the farm's woodlot.
  function fellTree(st, farm) {
    const w = st.w, tile = farm.woodlot;
    if (tile < 0 || w.trees[tile] <= 0) return;
    const was = treeStage(w, tile);
    w.trees[tile] = Math.max(0, w.trees[tile] - 1);
    if (w.trees[tile] <= 0) { clearTile(st, tile); return; }
    st.regrow.add(tile); stageChanged(st, tile, was);

  function growTrees(st) {

  const { YEAR, YEAR_DAYS, TICKS, FOODS } = VB['sim/rules'];

  // VB-204: routine kinds (95% of movements) add to a yearly total per holder, kind and good instead of writing an entry each.
  const ROUTINE = ['meal', 'seedMeal', 'cooking', 'spoilage', 'thresh', 'milk', 'butter'];

  const yearNow = (st) => Math.floor(st.tick / (YEAR * TICKS)) + 1;

  function fold(holder, year, kind, good, n) {

    for (let i = T.length - 1; i >= 0 && T[i].year === year; i--) {
      const x = T[i]; if (x.kind === kind && x.good === good) { x.n += n; x.count++; return; }

    if (!holder || holder.dissolved) throw new Error('stores: missing or dissolved holder');
    return 'farmstead' in holder ? 'household' : 'center' in holder ? 'village' : 'pawn';
  }

  // two plans do not spend it twice and the holder's free stock is the rest. A count per holder, good and plan, kept on the plan (st.plans,
  // whose records sim/plans makes and drops: a reservation goes with its plan); only these operations write it.
  // @state plan.reserved: {[good]: n}: the plan's reservation of a good, as counted at its last reserve (the plan's review); plan.reasons:

  // fields as they are sown (sim/hunger). Stored counts lag a sowing or a stage change by up to an hour, and the readers of the seed

  const FOLLOWS = {};

  function reserved(st, holder, good) {

})();

// @sys sim/hunger: the daily meal shared out by custom, the larder of stored food, grain spoiling in store, each pawn's hunger level and health
VB['sim/hunger'] = (() => {
  const { HUNGER, HEALTH, HERD, HELP, DAY, YEAR_DAYS, SEASON_DAYS } = VB['sim/rules'];
  const { age, farmPractice, log, atFarm } = VB['sim/records'];
  const Stores = VB['sim/stores'];
  const Rules = VB['sim/registry'], { ALLOWANCE_BOUND } = VB['sim/relations'];
  // The seed the household's fields not yet sown this year and its land project need: the standing plan's reservation of grain (sim/plans
  // reserves it at each review; sim/stores counts it with this rule when it is read, so a field sown since counts at once). Only the day's meal
  // reaches below it, and only when the day would otherwise fall short (feedHousehold; Kim, 10 November: the hungry household eats its seed).
  function seedNeed(st, hh) {
    const f = st.farmsteads[hh.farmstead];
    let n = f.project ? 1 : 0;
    for (const fd of f.fields) if (fd.stage === 'stubble' || fd.stage === 'plowed') n++;
    return n * st.ECON.seedPerField;
  }
  Stores.follow('seed', seedNeed);
  const { reserved } = Stores;

  const seedReserve = (st, hh) => reserved(st, hh, 'grain');
  // What the household's living members eat in a day, in rations.
  function dailyNeed(st, hh) {
    const adult = st.ECON.ration.adult, child = st.ECON.ration.child;

    for (const id of hh.members) { const p = st.pawns[id]; if (p.died === null) s += age(st, p) >= 14 ? adult : child; }
    return s;
  }

  const floorOf = (st, hh) => reserved(st, hh, 'grain') + HELP.floorDays * dailyNeed(st, hh);
  // allowance's first term: the giving household's grain above its floor (sim/relations, VB-216)
  Rules.contribute({ rule: 'allowance', source: 'sim/hunger', key: 'slack', label: 'Grain above the floor', range: [0, ALLOWANCE_BOUND],
    tunables: ['HELP.floorDays'], value: (st, c) => Math.max(0, c.from.grain - floorOf(st, c.from)) });
  // ---- the larder (VB-134): lots of stored food {kind, n (rations), until (game hours)}: the foods of rules FOODS eaten as they are ----
  function addFood(st, hh, kind, n, days) { if (n > 0) hh.larder.push({ kind, n, until: st.t + days * DAY }); }
  function larderOf(hh, kind) { let s = 0; for (const l of hh.larder) s += !kind || l.kind === kind ? l.n : 0; return s; } // the review asks it hourly
  // Takes up to `want` rations from the larder, the lots that spoil first first; only those within `soon` hours of spoiling when soon is
  // given. Returns what it took.
  function takeFood(st, hh, want, soon = Infinity) {
    let got = 0;
    for (const l of [...hh.larder].sort((a, b) => a.until - b.until)) {
      if (got >= want || l.until - st.t > soon) break;
      const k = Math.min(l.n, want - got); l.n -= k; got += k;

  // the rest, or everyone together. mem: its living members, as pawns.
  function feedGroups(st, hh, mem) {
    const order = st.cenv ? farmPractice(st, st.farmsteads[hh.farmstead]).feedOrder : 'equal';
    const worker = (p) => { const a = age(st, p); return a >= 14 && a < 60 && !p.retired; };
    const first = order === 'children' ? (p) => age(st, p) < 14 : order === 'workers' ? worker : null;
    return first ? [mem.filter(first), mem.filter((p) => !first(p))] : [mem];
  }
  // The members a short meal reaches last, as pawn ids: the feed order's last group with anyone in it. Reads only.
  function servedLast(st, hh) {
    const groups = feedGroups(st, hh, hh.members.map((id) => st.pawns[id]).filter((p) => p.died === null)).filter((g) => g.length);
    return groups.length ? groups[groups.length - 1].map((p) => p.id) : [];

  // when that is not enough, what there is goes by the household's feedOrder, in groups served one after the other.

  function updateHealth(st, p, fed) {

  }
  return { feedHousehold, feedGroups, servedLast, dailyNeed, seedNeed, seedReserve, floorOf, updateHealth, addFood, larderOf, takeFood, spoilGrain };
})();

<script>
// @sys sim/exchange: deals between parties, the gift for now (VB-216): whether one goes ahead (the floor, allowance), and settling it through
// sim/stores and sim/relations, its worth booked as goodwill between the two holders (VB-217); owns no state
VB['sim/exchange'] = (() => {
  const Stores = VB['sim/stores'];
  const Rules = VB['sim/registry'];
  const { addTie, book, balance, ALLOWANCE_BOUND } = VB['sim/relations'];
  const { HELP, GOODWILL } = VB['sim/rules'];
  const { personEvent, atHousehold, holdingOf } = VB['sim/records'];
  const { floorOf, dailyNeed, servedLast } = VB['sim/hunger'];
  // allowance's goodwill term (design.md, The gift: Allowance), relations' quantity, contributed here because its limit needs the receiving
  // household's need: plus what the giver owes the receiver, minus what the receiver owes beyond GOODWILL.limitDays of its household's
  // need. 0 until slice 4 switches it on (GOODWILL.acts, VB-220).
  Rules.contribute({ rule: 'allowance', source: 'sim/relations', key: 'goodwill', label: GOODWILL.acts ? 'Goodwill' : 'Goodwill (acts from slice 4)',
    range: [-ALLOWANCE_BOUND, ALLOWANCE_BOUND], tunables: ['GOODWILL.acts', 'GOODWILL.limitDays'],
    value: (st, c) => {
      if (!GOODWILL.acts || c.giver === null || c.receiver === null) return 0;
      const owed = balance(st, c.giver, c.receiver); // > 0: the receiver owes the giver
      return owed < 0 ? -owed : -Math.max(0, owed - GOODWILL.limitDays * dailyNeed(st, c.to));
    } });

  // filling). Sizes are compared with a tolerance, since the size help asks for is reckoned apart from the allowance's sum.
  const TOLERANCE = 1e-9;

  const WORTH = { grain: 1 };

  function assessGift(st, o) {

  // the tie between the two holders, and the goodwill booked between them.

})();

// @sys sim/help: food help between households: whom a hungry household asks (kin, then the village store), for how much and when (once a
// season, until the harvest), and the village store's yearly filling; each gift is a command `give`, settled by sim/exchange (VB-216)
VB['sim/help'] = (() => {
  const issue = (st, cmd) => VB['sim/commands'].issue(st, cmd); // sim/commands loads after this module
  const { HELP, DAY, SEASON_DAYS, YEAR_DAYS, cal } = VB['sim/rules'];
  const { childrenOf, siblingsOf } = VB['sim/records'];
  const { dailyNeed } = VB['sim/hunger'], { reserved } = VB['sim/stores'];
  const Rules = VB['sim/registry'], { ALLOWANCE_BOUND } = VB['sim/relations'];
  // allowance's second term (VB-216): the holder's own reserve beyond the floor, from 0 to 40 days of the household's need, a stand-in for
  // generosity until traits; a household without a holder keeps the most, as surplus does
  Rules.contribute({ rule: 'allowance', source: 'sim/help', key: 'reserve', label: 'Own reserve', range: [-ALLOWANCE_BOUND, 0],
    tunables: ['HELP.bufferDays', 'HELP.floorDays'],
    value: (st, c) => -((c.giver !== null ? st.pawns[c.giver].buffer : HELP.bufferDays[1]) - HELP.floorDays) * dailyNeed(st, c.from) });
  // grain a household would give: what is above its holder's buffer and its seed reserve
  const surplus = (st, hh) => {
    const holder = hh.holder !== null ? st.pawns[hh.holder] : null, buffer = (holder ? holder.buffer : HELP.bufferDays[1]) * dailyNeed(st, hh);
    return Math.max(0, hh.grain - reserved(st, hh, 'grain') - buffer);

  function kinHouseholds(st, hh) {
    const rank = new Map();

      const q = st.pawns[id]; if (!q.alive || q.household === null || q.household === hh.id || st.households[q.household].dissolved) return;
      rank.set(q.household, Math.min(rank.get(q.household) ?? 9, r));
    };
    for (const id of hh.members) {
      const p = st.pawns[id];
      for (const par of [p.father, p.mother]) if (par !== null) note(par, 1);
      for (const c of childrenOf(st, id)) note(c, 1);
      for (const s of siblingsOf(st, id)) note(s, 2);

    return [...rank].sort((a, b) => a[1] - b[1] || a[0] - b[0]).map((x) => x[0]);
  }
  // A gift of n grain, as the command `give` (source 'help'): its actor is the giver's holder, or the household or village itself
  // without one; true when it was given.
  const actorOf = (x) => ('farmstead' in x ? (x.holder !== null ? x.holder : { household: x.id }) : { village: x.id });
  const give = (st, from, to, n) => issue(st, { actor: actorOf(from), verb: 'give', target: 'farmstead' in to ? to.id : { village: to.id },
    args: { good: 'grain', n }, source: 'help' }) === true;

  //   here. A household asks at most once a season (VB-222; design.md, The gift: Lumps and occasions).
  const seasonOf = (t) => Math.floor(t / (SEASON_DAYS * DAY));
  const noteAsked = (hh, season) => { hh.askedIn = season; };

  // in autumn, while the harvest comes in, a season's. From 12 days (late summer, autumn) to 36 (the start of winter).
  const AUTUMN = 2;
  function askDaysAt(st) {
    const c = cal(st.t);

    const toHarvest = c.season < AUTUMN ? AUTUMN * SEASON_DAYS - c.doy : YEAR_DAYS - c.doy + AUTUMN * SEASON_DAYS;
    return Math.max(HELP.askDays, toHarvest);
  }

  // village store, for food until the next harvest (askDaysAt); if the gifts fall short, it waits for the next season.
  function shareFood(st) {

})();

// @sys sim/deaths: causes of death, the death.hazard rule and its daily roll
VB['sim/deaths'] = (() => {
  const { next: rnd } = VB['sim/rng'];
  const { YEAR, YEAR_DAYS, hazard, HUNGER, HEALTH } = VB['sim/rules'];
  const Rules = VB['sim/registry'];
  Rules.declare({ id: 'death.hazard', owner: 'sim/deaths', combine: 'product',
    base: (st, p) => hazard((st.t - p.born) / YEAR) / YEAR_DAYS });
  Rules.contribute({ rule: 'death.hazard', source: 'sim/hunger', key: 'hunger', label: 'Hunger', cause: 'hunger',
    range: [1, 2.5], tunables: ['HUNGER.k'],
    value: (st, p) => 1 + HUNGER.k(Math.floor((st.t - p.born) / YEAR)) * p.hunger });
  Rules.contribute({ rule: 'death.hazard', source: 'sim/hunger', key: 'frailty', label: 'Poor health', cause: 'hunger',
    range: [1, 3], tunables: ['HEALTH.riskBelow', 'HEALTH.riskSlope'],
    value: (st, p) => p.health < HEALTH.riskBelow ? 1 + (HEALTH.riskBelow - p.health) / HEALTH.riskSlope : 1 });
  // Cause keys: the base hazard by age (infancy, childhood, illness, oldAge), the share added by hunger, and the causes set elsewhere.
  // `event` is the text of the pawn's life event, `log` the text of the village log ("<name> of <farm> <log>, aged <n>").
  const CAUSES = {
    infancy: { event: 'Died in infancy', log: 'died in infancy' },
    childhood: { event: 'Died of a childhood illness', log: 'died of a childhood illness' },
    illness: { event: 'Died of illness', log: 'died of illness' },
    oldAge: { event: 'Died of old age', log: 'died of old age' },
    hunger: { event: 'Died of hunger', log: 'died of hunger' },
    starvation: { event: 'Died of starvation', log: 'starved to death' },
    childbirth: { event: 'Died in childbirth', log: 'died in childbirth' },
    killed: { event: 'Killed', log: 'was killed' },
  };
  const baseCause = (a) => (a < 1 ? 'infancy' : a < 15 ? 'childhood' : a < 60 ? 'illness' : 'oldAge');
  // One pawn's death roll for the day: null or a cause key; a roll that falls in the share added by hunger is 'hunger'. One random draw.
  function deathRoll(st, p) {
    const a = (st.t - p.born) / YEAR, u = rnd(st.rng.deaths);
    if (p.health <= 0) return 'starvation';
    if (u >= Rules.value(st, 'death.hazard', p)) return null;
    return u >= hazard(a) / YEAR_DAYS ? 'hunger' : baseCause(a);
  }
  return { CAUSES, deathRoll };
})();

<script>
// @sys sim/notable: which events of the record are notable and why, and an event told in one sentence, histories and the village log; what stops a
// skip to the next event that concerns the played pawn (VB-234); queries of the record and a pawn's life (VB-199); read-only views, no state
VB['sim/notable'] = (() => {
  const { index, ancestorsOf, fullName, age, settlementIdOf } = VB['sim/records'];
  const { CAUSES } = VB['sim/deaths'];
  const { YEAR, DAY, SEASON_DAYS, WORK } = VB['sim/rules'];
  // An event of the record in full that every view reads: not a folded slot (a number, sim/records), nor a pawn's own telling of an event
  // recorded beside it (`self`), which only its life reads.
  const told = (e) => typeof e === 'object' && !e.self;
  // The events about a pawn (as pawn or other), household, farm or village, of the given kinds, with from <= t < to, in time order.
  // With {pawn, life: true}: the pawn's own events, read through its positions on the record (lifeOf).
  function recordOf(st, q = {}) {
    if (q.life) return lifeOf(st, q.pawn);
    const kinds = q.kinds ? new Set(q.kinds) : null;
    const out = st.record.filter((e) => told(e) && (q.pawn === undefined || e.pawn === q.pawn || e.other === q.pawn)
      && (q.household === undefined || e.household === q.household) && (q.farm === undefined || e.farm === q.farm)
      && (q.village === undefined || e.village === q.village) && (!kinds || kinds.has(e.kind))
      && (q.from === undefined || e.t >= q.from) && (q.to === undefined || e.t < q.to));

  // of its kind, village and year)}, with no text.

    return st.pawns[id].events.map((at) => {
      const e = st.record[at];

      if (e.kind === 'born') return { t: e.t, kind: 'born', at }; // the village's line is the mother's telling
      if (e.kind !== 'died') return { t: e.t, kind: e.kind, text: e.text, at };

  const NOTABLE = {
    family: "Births, marriages and deaths in the selected person's household or line",
    holder: 'Deaths of landholders',
    hunger: 'Deaths from hunger',
    farm: 'Farms left empty, claimed or newly built',
    custom: 'Changes of custom',

    custom: 'A change of custom in its village',
    hunger: 'Hunger in its household',
    offer: 'A marriage offer that waits for its answer',

    round: 'The eve of the moving round',

  function roundEve(t) {

// @sys sim/fields: new fields, crop lifecycle and daily growth, weeding, frost and abandonment; soil and manure
VB['sim/fields'] = (() => {
  const { B } = VB['gen'];
  const { next: rnd } = VB['sim/rng'];
  const { ECON, FIELDS, SOIL, farmable, fertility, DAY, SEASON_DAYS, YEAR_DAYS, YEAR } = VB['sim/rules'];
  const { bfs } = VB['sim/hex'];
  const { walkable } = VB['sim/routes'];
  const { age, log, atFarm } = VB['sim/records'];
  const { nextTo } = VB['sim/layout'];
  const { freeFor } = VB['sim/territory'];
  const { stake, realiseStake, contestable, contest } = VB['sim/stakes'];
  const { team } = VB['sim/herds'];
  const REACH = 4, SCRUB_HOURS = 10, STONE_HOURS = 20, BREAK_HOURS = 30, STONES_PER_LOAD = 25;
  // Rations a household eats in a full year of 48 days.
  function yearlyRations(st, hh) {
    let n = 0;
    for (const id of hh.members) { const p = st.pawns[id]; if (p.died === null) n += age(st, p) >= 14 ? ECON.ration.adult : ECON.ration.child; }
    return n * YEAR_DAYS;
  }
  // Fields its hands can till: FIELDS.perHand for each working adult, and more with a team of oxen.
  function fieldsWorkable(st, hh) {
    let hands = 0;
    for (const id of hh.members) { const p = st.pawns[id], a = age(st, p); if (p.died === null && a >= 14 && a < 60 && !p.retired) hands++; }
    return Math.floor(hands * FIELDS.perHand + (team(st, hh) ? FIELDS.oxenHands : 0));
  }
  // Fields a household wants: enough for its food (FIELDS.want of its rations at FIELDS.expect of the full yield), as many as its hands can till.
  // `workable`: fieldsWorkable(st, hh), when the caller has it (the plan's review writes both, sim/plans).
  const fieldsWanted = (st, hh, workable = fieldsWorkable(st, hh)) => Math.max(1, Math.min(workable,
    Math.ceil((FIELDS.want * yearlyRations(st, hh)) / (FIELDS.expect * ECON.fieldYield))));
  // Hours of clearing a tile: scrub, plus the stones in proportion.
  const clearHours = (st, tile) => SCRUB_HOURS + (STONE_HOURS * st.w.stones[tile]) / 255;
  // Houses and greens, standing or planned (a plot's house): no field is made next to one (VB-113).
  function builtTiles(st) {
    const out = new Set(st.villages.map((v) => v.center));
    for (const f of st.farmsteads) out.add(f.house);
    for (const v of st.villages) for (const p of v.plots || []) for (const tr of p.tiles) if (tr.kind === 'house') out.add(tr.tile);
    return out;
  }
  // The best farmable tile within reach of the house that the household may take in (its village's outland or wilderness, sim/territory),
  // not on a river and not next to a house or green: fertile (watered by one), few stones, near, and 1 better when it touches one of the
  // farm's fields, so the fields grow as one block (VB-109). Open meadow always comes first; heath, hills or marsh (poorer, by FERTILITY)

  // household may take a tile in (a stake it may contest, for sim/stakes).
  // `built`: builtTiles(st), when the caller has it (the review asks every farm in one hour, VB-227).
  function chooseTile(st, f, free = (t) => freeFor(st, t, f.village), built = builtTiles(st)) {

    let best = -1, bs = -Infinity;

      if (s > bs) { bs = s; best = t; }

  // The land step of its standing plan (sim/plans, VB-248): `wanted` is the plan's target of fields, `given` a tile the plan names in place

  function finishClear(st, f, hh) {

  // The manure is spread: each load the job carried raises the soil, as far as the heap still holds it; never below a fresh field's soil.
  function manureDone(st, fd, hh, loads) {
    const n = Math.max(0, Math.min(loads, hh.manure));

  const hoed = (fd) => { fd.stage = 'plowed'; };
  function sown(fd, c) {
    fd.stage = 'sown'; fd.sown = c.day;
    fd.weedOpen = false; fd.weedPosted = null; fd.weedMiss = 0;
  }
  function reaped(st, fd, c) {
    const E = st.ECON;
    fd.stage = 'stooks'; fd.reaped = c.day;
    fd.held = Math.round(E.fieldYield * fd.fert * fd.soil * st.weather * (0.9 + rnd(st.rng.fields) * 0.2)

  const hauled = (fd) => { fd.held = 0; fd.stage = 'stubble'; fd.sown = null; };
  function reclaimed(st, fd) {
    if (fd.stage === 'fallow' || fd.stage === 'scrub') { fd.stage = 'stubble'; st.visualDirty = true; }
  }
  const weeded = (fd) => { fd.weedOpen = false; };
  function abandoned(f) {
    for (const fd of f.fields) { if (fd.stage !== 'stubble') fd.held = 0; fd.stage = 'stubble'; fd.sown = null; }
  }

  function nearForest(w, tile) {
    for (const j of bfs(w, tile, 2, () => true).dist.keys()) if (w.biome[j] === B.FOREST || w.biome[j] === B.PINE) return true;

    manureWanted, manureDone };
})();

// @sys sim/meadows: hay meadows as built land: a tile's worth as meadow, choosing one, the meadow project, and the meadows of generated farms
VB['sim/meadows'] = (() => {
  const { next: rnd } = VB['sim/rng'];
  const { B } = VB['gen'];
  const { byRiver, SEASON_DAYS } = VB['sim/rules'];
  const { bfs } = VB['sim/hex'];
  const { walkable } = VB['sim/routes'];

  const { setOwner } = VB['sim/ownership'];
  const { nextTo } = VB['sim/layout'];
  const { winterNeed } = VB['sim/herds'];
  const { builtTiles } = VB['sim/fields'];
  const { freeFor } = VB['sim/territory'];
  const { stake, realiseStake, contestable, contest } = VB['sim/stakes'];
  // A meadow tile yields HAY × its site value a year in an ordinary year (VB-132): open meadow 1, marsh 0.8, heath 0.6, and 1.3 times that on
  // wet ground by a river or open water. A household with animals wants meadows for WANT × its winter's need, at most MAX; it looks for them
  // within REACH walking steps. Clearing takes CLEAR_HOURS and up to STONE_HOURS for the stones, down to KEEP_STONES of 255.
  const HAY = 30, WANT = 1.2, MAX = 6, START_MAX = 4, REACH = 6, CLEAR_HOURS = 4, STONE_HOURS = 10, KEEP_STONES = 80, STONES_PER_LOAD = 25;

    return false;
  }
  const meadowFert = (w, i) => (SITE[w.biome[i]] || 0) * (wetBank(w, i) ? 1.3 : 1);

  const expectedHay = (f) => f.meadows.reduce((s, m) => s + HAY * m.fert, 0);
  // The best free tile for a hay meadow within REACH of the house, or -1: open meadow, marsh or heath, not a river or water tile, its
  // village's outland or wilderness (sim/territory) and unused, not next to a house or green; by site value, near, few stones, beside the
  // farm's meadows, and away from its fields' block. `free`: whether the household may take a tile in (as for chooseTile, sim/fields).
  function chooseMeadow(st, f, free = (t) => freeFor(st, t, f.village), built = builtTiles(st)) {
    const w = st.w, own = new Set(f.meadows.map((m) => m.tile)), fields = new Set(f.fields.map((fd) => fd.tile));
    let best = -1, bs = -Infinity;

      if (nextTo(w, t, built)) continue;

  // hay that nothing would eat).

})();

  function plotProgress(st, plot) {
    let total = 0, got = 0;
    for (const tr of plot.tiles) {
      total += tr.steps.length; got += tr.i;
      if (tr.i < tr.steps.length) {
        for (const j of st.jobs.values()) if (j.tr === tr) got += Math.min(1, j.done / j.hours);
      }
    }
    return total ? got / total : 1;
  }
  // The pawn, or their spouse, is already to have a cleared plot whose cottage is not yet built.
  function awaitsCottage(st, id) {
    const sp = spouseOf(st, id);
    return st.villages.some((u) => u.plots.some((p) => building(p) && (p.holder === id || (sp !== null && p.holder === sp))));
  }
  // The village's pick among those still waiting, by `village` rule: married couples first, then by age, single adults once no couple waits.
  // A pawn with a farm already: a holder, or married to one (who lives on the spouse's farm; VB-153).
  const landed = (st, id) => { const sp = spouseOf(st, id); return isHolder(st, id) || (sp !== null && isHolder(st, sp)); };
  // A pawn who holds a cleared plot, or is meant to have another still being cleared, is not allotted a second (VB-142).
  const open = (st, id) => !landed(st, id) && !awaitsCottage(st, id) && !hasPlot(st, id);
  function byVillage(st, v, ids) {
    const live = ids.filter((id) => st.pawns[id].alive && open(st, id));
    const couple = (id) => { const sp = spouseOf(st, id); return sp !== null && st.pawns[sp].alive ? 0 : 1; };
    live.sort((a, b) => couple(a) - couple(b) || st.pawns[a].born - st.pawns[b].born || a - b);
    return live.length ? live[0] : null;
  }
  function allot(st, v, plot) {
    const waiting = st.demand.filter((id) => settlementIdOf(st, st.pawns[id]) === v.id);
    const rule = practice(st, v.id).newLand, worked = Object.keys(plot.hours).map(Number)
      .filter((id) => st.pawns[id].alive && open(st, id));
    let pick = null;
    if (rule === 'intended' && st.pawns[plot.intended].alive && open(st, plot.intended)) pick = plot.intended;
    else if (rule === 'labour' && worked.length) {
      worked.sort((a, b) => plot.hours[b] - plot.hours[a] || st.pawns[a].born - st.pawns[b].born || a - b); pick = worked[0];
    }
    if (pick === null) pick = byVillage(st, v, [plot.intended, ...waiting]);
    return pick;
  }
  // A tile's step is done: stumps stay after felling, grubbing turns the wood into meadow, clearing takes the stones, breaking turns the soil.
  function finishStep(st, j) {
    if (j.cottage) return finishCottageStage(st, j);
    const w = st.w, { plot, tr } = j, step = tr.steps[tr.i], v = st.villages[plot.village];
    if (step === 'fell') { w.trees[tr.tile] = 0; st.regrow.delete(tr.tile); st.treeDirty.add(tr.tile); }
    else if (step === 'grub') clearTile(st, tr.tile);
    else if (step === 'clear') w.stones[tr.tile] = 0;
    else if (tr.kind === 'field') { tr.fresh = !w.dev[tr.tile]; w.dev[tr.tile] = 1; } // ground never farmed starts fresh (VB-149)
    tr.i++; st.biomeDirty.add(tr.tile); st.visualDirty = true;
    if (!plot.tiles.every((q) => q.i >= q.steps.length)) return;
    plot.done = true; plot.holder = allot(st, v, plot); plot.cottage = { i: 0, done: 0 }; plot.built = false;
    if (plot.holder === null) { log(st, `${v.name} has cleared a new plot; nobody is left to claim it.`, { kind: 'plot', village: v.id }); return; }
    personEvent(st, plot.holder, 'plot', `Was allotted a cleared plot in ${v.name}`, false); // recorded below
    log(st, `${v.name} has cleared a new plot, and ${fullName(st.pawns[plot.holder])} is to have it.`, { kind: 'plot', pawn: plot.holder, village: v.id });
  }
  // A cottage stage is done: the last one hands the plot to sim/cottage, which makes the farmstead and household.
  function finishCottageStage(st, j) {
    const plot = j.plot; plot.cottage.i++; plot.cottage.done = 0; st.biomeDirty.add(plot.tiles[0].tile); st.visualDirty = true;
    if (plot.cottage.i >= COTTAGE.length) issue(st, {
      actor: null, verb: 'finishCottage', target: st.villages[plot.village].plots.indexOf(plot), args: { village: plot.village }, source: 'construction' });
  }
  // ---- the cottage of a household living in a booth (settlers, sim/settle): the same stages, as the household's own work ----
  // The open stage of farm f's cottage while f.booth stands: [key, kind, extra], or null. Hours on the stage persist while its job is dropped.
  function boothJob(st, f) {
    const k = f.booth; if (!k) return null;
    const key = `booth:f${f.id}`, live = st.jobs.get(key);
    if (live) k.done = live.done;
    return [key, COTTAGE[k.i], { farm: f, booth: true, done: k.done, hours: COTTAGE_HOURS[COTTAGE[k.i]] }];
  }
  // A stage of a booth's cottage is done; with the roof on, the household leaves the booth for its cottage.
  function finishBoothStage(st, j) {
    const f = j.farm, k = f.booth; if (!k) return;
    k.i++; k.done = 0; st.biomeDirty.add(f.house); st.visualDirty = true;
    if (k.i < COTTAGE.length) return;
    f.booth = null;
    const hh = f.household !== null ? st.households[f.household] : null;
    log(st, `The new cottage at ${f.name} in ${st.villages[f.village].name} has its roof${hh ? `; ${fullName(st.pawns[hh.holder])} leaves the booth` : ''}.`, {
      kind: 'cottage', pawn: hh ? hh.holder : null, ...atFarm(f) });
  }
  return {
    COTTAGE, building, roomAt, findSite, hasPlot, awaitsCottage, startPlots, plotJobs, plotProgress, finishStep, activePlots, boothJob,
    finishBoothStage,
  };
})();
