<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archipelago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --sea: #16395f;
  --panel: rgba(238, 245, 242, 0.88);
  --ink: #17313a;
  --muted: #526d75;
  --edge: rgba(23, 49, 58, 0.14);
  --accent: #23685a;
  --on-accent: #f2f8f6;
  --node: #fbfdfc;
  --good: #2f7a4b;
  --bad: #a8432f;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(11, 27, 34, 0.86);
    --ink: #e1ebe7;
    --muted: #93adae;
    --edge: rgba(225, 235, 231, 0.14);
    --accent: #84c9b5;
    --on-accent: #0c1f25;
    --node: #17323b;
    --good: #8fd0a2;
    --bad: #f0a08c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(11, 27, 34, 0.86);
  --ink: #e1ebe7;
  --muted: #93adae;
  --edge: rgba(225, 235, 231, 0.14);
  --accent: #84c9b5;
  --on-accent: #0c1f25;
  --node: #17323b;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; background: var(--sea); scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; overflow: hidden; background: var(--sea); color: var(--ink);
  font-family: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#stage canvas { display: block; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(5, 18, 30, 0.38) 100%); }
.hud { position: fixed; left: 0; right: 0; display: flex; justify-content: space-between; gap: 12px; padding: 14px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud.top { top: 0; align-items: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
.hud.bottom { bottom: 0; align-items: flex-end; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
.panel {
  background: var(--panel); color: var(--ink); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(3, 16, 26, 0.28);
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.lod { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); font-size: 13px; color: rgba(235, 244, 241, 0.85); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); pointer-events: none; }
.hud.top { flex-wrap: wrap; }
.clock { border-radius: 14px; padding: 8px 10px 8px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; max-width: 570px; }
/* Main menu, alone in the top-left corner; the clock and the speeds keep the top right */
.icon-btn.menu-btn { width: 52px; height: 52px; flex: none; margin-right: auto; border-radius: 14px; }
.clock strong { display: block; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 19px; line-height: 1.1; }
.clock span { display: block; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.speed { display: flex; flex-wrap: wrap; gap: 4px; }
/* The top bar's controls are icons (VB-338): pause, the speeds as one to five arrows, and at its end the eye that hides the interface. */
.clock .icon-btn { width: 44px; height: 44px; flex: none; }
.ico { display: block; flex: none; }
.ui-toggle, .ui-toggle[aria-pressed] { color: var(--ink); }
#skipBtn { padding: 5px 10px; font-size: 14px; }
#skipBtn[aria-pressed="true"], .speed button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.settlers { margin-top: 12px; max-height: min(50vh, 440px); overflow-y: auto; border-top: 1px solid var(--edge); padding: 2px 4px 0 0; }
.settlers h2 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 19px; line-height: 1.2; margin: 12px 0 2px; }
.settlers h2 span { font-family: 'Alegreya Sans', system-ui, sans-serif; font-style: normal; font-weight: 400; font-size: 14px; color: var(--muted); }
.settlers p { margin: 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
.settlers ul { list-style: none; margin: 4px 0 0; padding: 0; }
.settlers li { font-size: 14px; line-height: 1.55; color: var(--muted); }
.settlers li button { border: 0; border-radius: 3px; padding: 0; background: none; font-size: 15px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; }
.settlers .log p { margin-top: 3px; }
.settlers .jobs { color: var(--ink); opacity: 0.85; }
.settlers .doing { font-size: 13px; font-style: italic; }
.tree { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(6, 18, 26, 0.55); padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.tree[hidden] { display: none; }
.tree-card { width: min(1120px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; }
.tree-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 14px 18px; border-bottom: 1px solid var(--edge); }
.tree-head h2 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0; }
.tree-head p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; min-width: 12ch; }
.tree-modes { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 18px; border-bottom: 1px solid var(--edge); }
.tree-modes button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.tree-caption { margin: 0; padding: 8px 18px; border-bottom: 1px solid var(--edge); font-size: 15px; line-height: 1.4; }
.tree-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; flex: 1; }
.tree-scroll { overflow: auto; padding: 10px; min-height: 220px; }
.tree-info { border-left: 1px solid var(--edge); padding: 14px 18px 18px; overflow: auto; }
.tree-info h3 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 22px; margin: 0 0 6px; }
.tree-info p { margin: 0 0 6px; font-size: 15px; line-height: 1.45; }
.tree-info .hint { color: var(--muted); }
.tree-info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 12px 0 16px; font-size: 15px; line-height: 1.4; }
.tree-info dt { color: var(--muted); }
.tree-info dd { margin: 0; }
.tree-info dd button { border: 0; padding: 0; background: none; font-size: 15px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; border-radius: 3px; }
#treeSvg text.n { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 15px; fill: var(--ink); }
#treeSvg text.s { font-family: 'Alegreya Sans', system-ui, sans-serif; font-size: 12.5px; fill: var(--muted); }
#treeSvg .tn { cursor: pointer; }
#treeSvg .tn rect { fill: var(--node); stroke: var(--edge); stroke-width: 1; }
#treeSvg .tn.sel rect { stroke: var(--accent); stroke-width: 2.5; }
#treeSvg .tn.focus rect { stroke: var(--ink); stroke-width: 1.5; }
#treeSvg .tn.focus.sel rect { stroke: var(--accent); stroke-width: 2.5; }
#treeSvg .chip { cursor: pointer; }
#treeSvg .chip rect { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
#treeSvg .chip:focus { outline: none; }
#treeSvg .chip:focus-visible rect { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: none; }
#treeSvg .tn:focus { outline: none; }
#treeSvg .tn:focus-visible rect { stroke: var(--accent); stroke-width: 3; }
#treeSvg .marriage, #treeSvg .descent { fill: none; stroke: var(--muted); stroke-width: 1.5; }
#treeSvg .ring { fill: none; stroke: var(--accent); stroke-width: 1.5; }
#treeSvg .marriage.ended { stroke-dasharray: 4 3; }
#treeSvg .tn.dead rect { opacity: 0.55; }
#treeSvg .tn.dead text { opacity: 0.7; }
#treeSvg .heir { fill: #c9a24a; }
.tree-info .evs { margin: 0 0 14px; padding-left: 18px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.actions select { font: inherit; font-size: 15px; color: var(--ink); background: var(--node); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 10px; max-width: 100%; }
.drawer { position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 86px); width: min(420px, calc(100vw - 28px)); max-height: calc(100vh - 230px); overflow: auto; border-radius: 16px; padding: 12px 14px 16px; z-index: 6; }
.drawer[hidden] { display: none; }
.drawer .dclose { position: sticky; top: 0; float: right; }
.drawer .dh { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 22px; margin: 2px 0 6px; }
.drawer .dh3 { font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 18px; margin: 14px 0 4px; }
.drawer .dm { margin: 0 0 6px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.drawer .dm strong { color: var(--ink); font-weight: 600; }
.cust { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0 6px; }
.cust th, .cust td { text-align: left; vertical-align: top; padding: 6px 4px; border-top: 1px solid var(--edge); }
.cust thead th { font-weight: 600; border-top: 0; }
.cust tbody th { font-weight: 500; }
.cust td.dev { background: rgba(201, 162, 74, 0.16); }
.sbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; background: var(--edge); }
.sbar i { display: block; height: 100%; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 3px 0 6px; vertical-align: -1px; }
.mall { color: var(--muted); letter-spacing: 1px; font-size: 11px; }
.dbg-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.dbg-row button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.drawer select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); max-width: 100%; }
.dchk { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 8px 0; }
button {
  font: inherit; font-size: 15px; font-weight: 500; line-height: 1.2; color: var(--ink);
  background: transparent; border: 1px solid var(--edge); border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button[aria-pressed="false"] { color: var(--muted); }
button:disabled { opacity: 0.55; cursor: progress; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile { border-radius: 14px; padding: 10px 14px; min-width: 170px; transition: opacity 0.2s; }
.tile[hidden] { display: block; opacity: 0; pointer-events: none; }
.tile strong { display: block; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-weight: 700; font-size: 21px; line-height: 1.1; }
.tile span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.tile .rel { margin-top: 7px; padding-top: 5px; border-top: 1px solid var(--edge); }
.tile .rel h3 { margin: 0 0 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tile .rel button { display: flex; gap: 8px; width: 100%; padding: 1px 0; border: 0; background: none; font: inherit; font-size: 13px; color: var(--ink);
  text-align: left; cursor: pointer; }
.tile .rel button i { flex: 1; font-style: normal; color: var(--muted); }
.tile .rel button b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .rel button i.give { text-align: right; }
.tile .rel button + h3 { margin-top: 8px; }
.tile .rel .pos { color: var(--good); }
.tile .rel .neg { color: var(--bad); }
.minimap { position: relative; width: 216px; border-radius: 10px; overflow: hidden; cursor: crosshair; touch-action: none; padding: 0; }
.minimap canvas { display: block; width: 100%; height: auto; }
.minimap #mmView { position: absolute; inset: 0; height: 100%; }
/* The menu screens (the main menu, New archipelago, Saves) are one family: the same card, title and head row (VB-307). */
/* Behind them the stage shows through a veil of sea: the showcase island (body.demo), or the game that waits, paused. */
.genscreen { position: fixed; inset: 0; z-index: 11; display: grid; place-items: center; padding: 16px;
  background: radial-gradient(ellipse at 50% 45%, rgba(22, 57, 95, 0.22) 0%, rgba(13, 38, 66, 0.62) 100%); }
/* the interface of the stage is put away while a menu screen is up */
body:has(.genscreen:not([hidden])) .hud, body:has(.genscreen:not([hidden])) .navigation, body:has(.genscreen:not([hidden])) .sheet,
body:has(.genscreen:not([hidden])) .lod, body:has(.genscreen:not([hidden])) .toasts, body:has(.genscreen:not([hidden])) .play-offer,
body:has(.genscreen:not([hidden])) #menuBtn, body:has(.genscreen:not([hidden])) #uiToggle,
body:has(.genscreen:not([hidden])) .act-bar, body:has(.genscreen:not([hidden])) .act-menu, body:has(.genscreen:not([hidden])) .act-banner { visibility: hidden; pointer-events: none; }
/* so is it while choosing whom to play (VB-339), which is itself put away under a menu screen */
body.choosing .hud, body.choosing .navigation, body.choosing .sheet, body.choosing .lod, body.choosing .toasts, body.choosing .play-offer,
body.choosing .map-tools, body.choosing .act-bar, body.choosing .act-menu, body.choosing .act-banner, body:has(.genscreen:not([hidden])) .choose { visibility: hidden; pointer-events: none; }
.genscreen[hidden] { display: none; }
/* the open game's name, at the main menu's top left (VB-338); it is not shown in play */
/* The open game at the main menu's top left (VB-338): its name and its map; neither is shown in play.
   On a narrow screen it stands above the menu's card. */
.game-info { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px));
  width: min(360px, calc(50% - 210px)); color: #f2f8f6; text-shadow: 0 1px 3px #102b3b; }
.game-info p { margin: 0 0 4px; }
.game-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: italic 700 32px/1.1 'Alegreya', Georgia, serif;
  text-shadow: 0 1px 4px #102b3b; }
.game-info .meta { font-size: 15px; }
@media (max-width: 760px) {
  #landing:has(.game-info:not([hidden])) { grid-template-rows: auto 1fr; }
  .game-info { position: static; width: auto; justify-self: stretch; }
}
.genscreen > .panel, .saves-screen > .panel { display: grid; gap: 14px; width: min(360px, 100%); padding: 20px 22px; border-radius: 16px; }
.genscreen h1, .saves-screen h1 { margin: 0; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-size: 30px; line-height: 1.1; }
.screen-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.screen-head button { flex: none; min-height: 0; padding: 5px 14px; font-size: 14px; }
.genscreen label { display: grid; gap: 4px; color: var(--muted); font-size: 14px; }
.genscreen input, .genscreen select { font: inherit; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); }
.genscreen .err { margin: 0; color: #b4382c; font-size: 14px !important; }
#landQuick small { display: block; color: var(--muted); font-size: 13px; }
.genscreen .gen-docs { margin: 0; text-align: center; color: var(--muted); font-size: 14px; }
.genscreen .gen-docs a { color: var(--accent); }
.saves-screen { position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; padding: 16px; overflow-y: auto; background: rgba(8, 24, 36, 0.55); }
.saves-screen[hidden] { display: none; }
/* opened from the main menu, Saves takes the menu card's place on the menu's own background */
body:has(#landing:not([hidden])) .saves-screen { background: none; }
body:has(#savesScreen:not([hidden])) #landing > .panel { visibility: hidden; }
.saves-body { display: grid; gap: 12px; font-size: 14px; }
.save-slot { display: grid; grid-template-columns: 3.2em 1fr; gap: 3px 8px; align-items: start; }
.save-slot b { font-weight: 600; }
.save-slot small { display: block; color: var(--muted); font-size: 13px; }
.save-slot small.save-other { color: #b4382c; }
.save-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.save-slot .save-acts { grid-column: 2; }
.save-acts button, .save-arch h3 button { min-height: 0; padding: 3px 10px; font-size: 13px; }
.save-files { gap: 10px; }
.save-files button { flex: 1; min-height: 40px; padding: 7px 14px; font-size: 15px; }
.save-msg { margin: 0; color: var(--muted); }
.save-arch { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--edge); }
.save-arch h3 { margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 15px; }
.loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--sea); color: #e3eeea; transition: opacity 0.7s; }
.loader.done { opacity: 0; pointer-events: none; }
.loader p { margin: 0; text-align: center; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-size: 22px; }
.loader .bar { width: min(280px, 70vw); height: 3px; margin-top: 14px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, 0.16); }
.loader .bar i { display: block; height: 100%; width: 0; background: #9fd6c6; }
.err { max-width: 34ch; font-family: 'Alegreya Sans', system-ui, sans-serif !important; font-style: normal !important; font-size: 16px !important; line-height: 1.4; }
@media (prefers-reduced-motion: reduce) { .loader, .tile { transition: none; } }

/* The map stays central; panels share a predictable header and scroll area. */
[hidden] { display: none !important; }
.mobile-only { display: none; }
:root { --dock-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
button, select, input[type="search"], summary { min-height: 44px; }
button { touch-action: manipulation; }
summary { cursor: pointer; padding: 10px 0; line-height: 1.4; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select { font: inherit; color: var(--ink); }
.hud.top { justify-content: flex-end; }
.menu-label { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 14px 0 6px; }
.dchk input { width: 20px; height: 20px; flex-shrink: 0; }
.clock { max-width: 700px; } /* one row with Skip (VB-338) */
.navigation { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); bottom: var(--dock-bottom); display: flex; gap: 4px;
  padding: 5px; border-radius: 18px; }
/* The dock is icons, each with its name under it (VB-338). */
.navigation button { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 76px;
  padding: 4px 10px; border: 0; border-radius: 12px; font-size: 12px; line-height: 1.2; }
.navigation button:not([aria-pressed="true"]) { color: var(--muted); }
.navigation button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.sheet { display: flex; flex-direction: column; padding: 0; overflow: hidden; border-radius: 18px; }
.people-sheet, .drawer, .tile { position: fixed; z-index: 6; bottom: calc(var(--dock-bottom) + 68px); top: auto;
  max-height: min(65vh, calc(100dvh - 180px)); width: min(430px, calc(100vw - 28px)); }
/* The dock's panels rise from it, centred over it (VB-338); the selection card, opened from the map, keeps the bottom left. */
.people-sheet, .drawer { left: max(14px, calc(50% - 215px)); right: auto; }
.tile { left: max(14px, env(safe-area-inset-left, 0px)); }
.sheet-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--edge); flex-shrink: 0; }
.sheet-head h2, .sheet-head strong { flex: 1; min-width: 0; margin: 0; font: italic 700 22px/1.1 'Alegreya', Georgia, serif;
  overflow-wrap: anywhere; }
.sheet-head button { padding: 6px 10px; flex-shrink: 0; }
.sheet-head .sheet-expand { font-size: 13px; color: var(--muted); }
/* A panel's fold is a chevron, down while the panel is open (a press folds it) and up while it is folded (VB-338). */
.sheet-expand .ico { transition: transform 0.15s; }
.sheet-expand[aria-expanded="false"] .ico { transform: rotate(180deg); }
@media (prefers-reduced-motion: reduce) { .sheet-expand .ico { transition: none; } }
@media (pointer: coarse) { .sheet-head .icon-btn, #treeClose { width: 44px; } }
#treeClose { align-self: center; }
.sheet-content { overflow: auto; overscroll-behavior: contain; min-height: 0; padding: 12px 16px 16px; scrollbar-gutter: stable; }
.collapsed .sheet-content { display: none; }
.collapsed .sheet-head { border-bottom: 0; }
.settlers { max-height: none; overflow: visible; border-top: 0; margin: 0; padding: 0; }
.search-label { display: block; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
#peopleSearch { width: 100%; border: 1px solid var(--edge); border-radius: 12px; background: var(--node); padding: 10px 12px; font-size: 16px; }

.start h3 { margin: 4px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.start p { margin: 0; font-size: 14px; line-height: 1.4; }
.start .hint { color: var(--muted); }
.start .ico { width: 18px; height: 18px; flex: none; }
.start .ico.sug { display: inline-block; width: 15px; height: 15px; color: #b3862c; vertical-align: -1px; }
.stepno { font-size: 14px; color: var(--muted); }
.scards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.scard { display: grid; gap: 4px; padding: 0 0 8px; text-align: left; border-radius: 12px; overflow: hidden; background: var(--node); align-content: start;
  min-width: 0; color: var(--ink); }
.scard[aria-pressed="false"] { color: var(--ink); }
.scard > *:not(.cpic) { margin: 0 10px; }
.scard b { font-size: 16px; } .scard small { font-size: 13px; line-height: 1.3; color: var(--muted); }
.scard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
@media (hover: hover) { .scard:hover { background: rgba(35, 104, 90, 0.08); } }
.cpic { display: flex; align-items: flex-end; justify-content: center; gap: 0; height: 64px; padding: 0 8px 4px; overflow: hidden;
  background: linear-gradient(#bcd3e0 0 46%, #a9c48a 46% 100%); }
.cpic.founders { background: linear-gradient(#bcd3e0 0 46%, #b9c97e 46% 100%); }
.cpic.heirs { background: linear-gradient(#c8cfd6 0 46%, #9fba82 46% 100%); }
.cpic img { width: 46px; height: 46px; margin: 0 -5px; flex: none; }
.fi.gone, .cpic img.gone { filter: grayscale(0.8); opacity: 0.75; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 18px; }
.stats span { display: inline-flex; gap: 4px; align-items: center; } .stats .ico { width: 15px; height: 15px; }
.cgrid { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 5fr); gap: 12px; align-items: start; }
.start-left { display: grid; gap: 12px; min-width: 0; }
.start-view { position: relative; aspect-ratio: 16 / 10; border-radius: 16px; overflow: hidden; pointer-events: none;
  box-shadow: 0 0 0 2px var(--node), 0 10px 30px rgba(3, 16, 26, 0.28); }
.pins { position: absolute; inset: 0; }
.pin { position: absolute; left: 0; top: 0; width: 0; height: 0; font-size: 13px; color: var(--ink); white-space: nowrap; }
.pin .mk { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; }
.pin .mk > .ico, .pin .mk > .fi { position: absolute; inset: 0; width: 30px; height: 30px; padding: 4px; border-radius: 50%; background: #fbfdfc; color: #17313a;
  border: 2px solid #17313a; box-shadow: 0 2px 6px rgba(3, 16, 26, 0.4); }
.pin .mk > .fi { padding: 1px; }
.pin .mk > :nth-child(2) { display: none; }
.pin.edge .mk > :nth-child(2) { display: block; left: 7px; top: 7px; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 0; background: none;
  box-shadow: none; color: #fff; filter: drop-shadow(0 1px 2px #06202c); transform: rotate(var(--turn, 0rad)) translateX(24px); }
.pin b { position: absolute; left: 0; top: 0; font-weight: 500; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 2px 8px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.pinlist { display: none; list-style: none; margin: 0; padding: 0; font-size: 14px; }
.pinlist li { display: flex; gap: 8px; align-items: center; } .pinlist .fi, .pinlist .ico { width: 22px; height: 22px; flex: none; }
.year { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 13px; }
.year div { border-top: 3px solid var(--edge); padding-top: 5px; min-width: 0; } .year b { display: block; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 14px; }
.rows li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; } .rows .ico { color: var(--muted); margin-top: 1px; }
.start-side .stories { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.who-starts { display: grid; gap: 6px; }
.fcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.fcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 6px; align-items: center; padding: 6px 8px; border-radius: 10px;
  background: var(--node); border: 1px solid var(--edge); min-width: 0; }
.fcard.none { background: none; border-style: dashed; color: var(--muted); } .fcard.has { border-color: var(--accent); }
.fcard b { font: italic 700 15px/1.2 'Alegreya', Georgia, serif; overflow-wrap: break-word; min-width: 0; } .fcard .fi { width: 26px; height: 26px; }
.fcard .faces, .fcard small { grid-column: 1 / -1; } .fcard small { font-size: 12.5px; color: var(--muted); }
.faces { display: flex; flex-wrap: wrap; gap: 1px; align-items: flex-end; min-height: 26px; }
.faces img, .fcard .faces img { width: 26px; height: 26px; }
img.pf.off { opacity: 0.28; } img.pf.on { filter: drop-shadow(0 0 2px var(--accent)); }
.picked { display: block; height: 2.8em; overflow: hidden; font-size: 13px; color: var(--muted); line-height: 1.4; }
.pyr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 3px 6px; align-items: center; font-size: 12.5px;
  font-variant-numeric: tabular-nums; }
.pyr .lab { text-align: center; color: var(--muted); } .pyr .n { color: var(--muted); min-width: 2.2em; } .pyr .n.f { text-align: right; }
.pyr .pb { display: flex; height: 12px; } .pyr .pb.l { justify-content: flex-end; }
.pyr .pb i { display: block; border-radius: 2px; --dim: color-mix(in srgb, var(--muted) 45%, transparent);
  background: linear-gradient(to right, var(--accent) var(--on, 0%), var(--dim) var(--on, 0%)); }
.pyr .pb.l i { background: linear-gradient(to left, var(--accent) var(--on, 0%), var(--dim) var(--on, 0%)); }
.start-bar { position: sticky; bottom: 0; display: flex !important; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: max(14px, env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -6px 24px rgba(3, 16, 26, 0.18); }
.start-bar label { width: 200px; max-width: 100%; min-width: 0; } .start-bar select { width: 100%; min-width: 0; }
.start-bar .grow { flex: 1 1 0; }
.start-bar .err { flex: 1 1 220px; align-self: center; max-width: none; }
.seedrow { display: flex; gap: 6px; } .seedrow input { min-width: 0; width: 100%; } .seedrow button { flex: none; padding: 6px 12px; }
@media (max-width: 859px) {
  .cgrid { grid-template-columns: minmax(0, 1fr); }
  .start-view { pointer-events: auto; } /* on a phone the page scrolls over the picture */
}
@media (max-width: 620px) {
  .scards { grid-template-columns: minmax(0, 1fr); }
  .scard { grid-template-columns: 112px minmax(0, 1fr); padding: 0; column-gap: 10px; align-items: center; }
  .scard .cpic { grid-row: 1 / span 3; height: 100%; min-height: 70px; padding: 0 4px 4px; }
  .scard .cpic img { width: 34px; height: 34px; margin: 0 -6px; }
  .scard > *:not(.cpic) { margin: 0 10px 0 0; } .scard > b { margin-top: 8px; } .scard > .stats { margin-bottom: 8px; }
  .start-bar { gap: 8px; padding: 10px 12px; }
  .start-bar label { width: auto; flex: 1 1 140px; font-size: 13px; }
  .start-bar .grow { display: none; }
  .start-bar > button { flex: 1 1 120px; }
  .scard .cpic { align-items: center; }
}
@media (max-width: 560px) {
  .pin b { display: none; }
  .pinlist { display: grid; gap: 4px; }
}
@media (max-width: 460px) { .year { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 899px) {
  .choose { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; overflow-x: hidden; padding: 0 max(8px, env(safe-area-inset-right, 0px))
    0 max(8px, env(safe-area-inset-left, 0px)); }
  .choose > .choose-map { display: block; flex: none; height: 56svh; pointer-events: none; }
  .choose .panel { position: static; width: auto; max-height: none; overflow: visible; }
  .choose .choose-bar { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); margin-top: auto; flex: none; z-index: 1; }
  .choose::after { content: ""; flex: none; height: 1px; }
}

  .hud.top { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px));
    top: calc(env(safe-area-inset-top, 0px) + 8px); padding: 0; gap: 6px; flex-wrap: nowrap; align-items: stretch; }

  .clock span { font-size: 13px; }
  #speedBtn { color: var(--accent); }

  .speed { display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 9; flex-wrap: nowrap;

  .navigation { width: calc(100% - max(8px, env(safe-area-inset-left, 0px)) - max(8px, env(safe-area-inset-right, 0px)));

  .sheet-head { padding: 8px 10px; }

  .map-tools { right: max(8px, env(safe-area-inset-right, 0px)); bottom: calc(var(--dock-bottom) + 62px); }

  body.bar-open .people-sheet, body.bar-open .drawer, body.bar-open .tile, body.bar-open .play-offer, body.bar-open .map-tools,

  .act-menu { width: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); transform: none;
    max-height: min(56dvh, calc(100dvh - env(safe-area-inset-top, 0px) - 220px)); }
  body.bar-open .people-sheet, body.bar-open .drawer, body.bar-open .tile { max-height: min(54dvh, calc(100dvh - env(safe-area-inset-top, 0px) - 230px)); }
  .act-banner { width: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); transform: none; }
  .lod { display: none; }
  .toasts { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; transform: none;
    bottom: auto; }
  .tree { padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

  .tree-modes button { flex: none; }

  .tree-info dd button { min-height: 44px; padding: 6px 0; }
  .genscreen { padding: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px))
    max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
}
