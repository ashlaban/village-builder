</style>
</head>
<body>
<div id="stage" aria-label="Map of the archipelago"></div>
<div class="vignette"></div>

<div class="hud top">
  <div class="clock panel" id="clock">
    <div class="calendar"><strong id="clockDate">Spring, day 1</strong><span id="clockYear">Year 1, 06:00</span></div>
    <button id="pauseBtn" class="mobile-only icon-btn" type="button" aria-label="Pause game" title="Pause (Space)"></button>
    <button id="speedBtn" class="mobile-only icon-btn" type="button" aria-expanded="false" aria-controls="speedOptions"></button>
    <div class="speed" id="speedOptions" role="group" aria-label="Game speed">
      <button type="button" class="icon-btn" data-speed="0" aria-pressed="false" aria-keyshortcuts="Space" aria-label="Pause" title="Pause (Space)"></button>
      <button type="button" class="icon-btn" data-speed="1" aria-pressed="true" aria-keyshortcuts="1" aria-label="1×" title="1× (1)"></button>
      <button type="button" class="icon-btn" data-speed="3" aria-pressed="false" aria-keyshortcuts="2" aria-label="3×" title="3× (2)"></button>
      <button type="button" class="icon-btn" data-speed="10" aria-pressed="false" aria-keyshortcuts="3" aria-label="10×" title="10× (3)"></button>
      <button type="button" class="icon-btn" data-speed="30" aria-pressed="false" aria-keyshortcuts="4" aria-label="30×" title="30× (4)"></button>
      <button type="button" class="icon-btn" data-speed="Infinity" aria-pressed="false" aria-keyshortcuts="5" aria-label="Uncapped"
        title="Uncapped (5)"></button>
    </div>
    <button id="skipBtn" type="button" class="icon-btn" data-icon="skip" aria-pressed="false" aria-label="Skip to next event"
      title="Skip to next event: run ahead to the next event that concerns your pawn" hidden></button>
    <button id="uiToggle" class="icon-btn ui-toggle" type="button" aria-pressed="false" aria-keyshortcuts="h" aria-label="Hide the interface"
      title="Hide the interface (H)"></button>
    <button id="menuBtn" type="button" class="icon-btn" data-icon="menu" aria-keyshortcuts="Escape" aria-label="Main menu" title="Main menu (Esc)"></button>
  </div>
</div>
<div class="lod" id="lod" hidden></div>
<div class="play-offer panel succession" id="succession" role="dialog" aria-label="Go on as another" hidden></div>
<div class="play-offer panel" id="playOffer" hidden><span id="playOfferText"></span><button type="button" class="primary" id="playOfferYes">Play</button><button type="button" id="playOfferNo">Not now</button></div>
<div class="toasts" id="toasts" role="log" aria-live="polite" aria-label="Notifications"></div>
<nav class="navigation panel" aria-label="Game panels">
  <button id="actionsBtn" type="button" data-icon="pawn" title="Your pawn's actions" aria-pressed="false" aria-controls="actionSheet"
    hidden><span class="nav-label">Actions</span></button>
  <button id="settlersBtn" type="button" data-icon="people" aria-keyshortcuts="p" title="People and households (P)" aria-pressed="false"
    aria-controls="peopleSheet"><span class="nav-label">People</span></button>
  <button id="treeBtn" type="button" data-icon="family" aria-keyshortcuts="t" title="Family records (T)" aria-haspopup="dialog"><span
    class="nav-label">Family</span></button>
  <button id="customsBtn" type="button" data-icon="customs" aria-keyshortcuts="c" title="Customs (C)" aria-pressed="false" aria-controls="drawer"><span
    class="nav-label">Customs</span></button>
  <button id="debugBtn" type="button" data-icon="bug" title="Debug" aria-pressed="false" aria-controls="drawer"><span
    class="nav-label">Debug</span></button>
</nav>
<aside class="people-sheet sheet panel" id="actionSheet" hidden aria-labelledby="actionTitle">
  <div class="sheet-head">
    <h2 id="actionTitle">Actions</h2>
    <button type="button" class="sheet-expand icon-btn" data-icon="chevron" data-sheet="actionSheet" aria-expanded="true" aria-controls="actionContent"
      aria-label="Collapse" title="Collapse"></button>
    <button id="actionClose" type="button" class="icon-btn" data-icon="close" aria-label="Close actions" title="Close"></button>
  </div>
  <div class="sheet-content" id="actionContent">
    <div id="playBox" class="play"><div id="playTop"></div><div id="giveBox" class="give" hidden></div><div id="playRest"></div></div>
  </div>
</aside>
<aside class="people-sheet sheet panel" id="peopleSheet" hidden aria-labelledby="peopleTitle">
  <div class="sheet-head">
    <h2 id="peopleTitle">People &amp; households</h2>
    <button type="button" class="sheet-expand icon-btn" data-icon="chevron" data-sheet="peopleSheet" aria-expanded="true" aria-controls="peopleContent"
      aria-label="Collapse" title="Collapse"></button>
    <button id="peopleClose" type="button" class="icon-btn" data-icon="close" aria-label="Close people" title="Close"></button>
  </div>
  <div class="sheet-content" id="peopleContent">
    <label class="search-label" for="peopleSearch">Find a person, farm or village</label>
    <input id="peopleSearch" type="search" placeholder="Search names…" autocomplete="off">
    <p id="peopleCount" class="dm" role="status"></p>
    <section class="settlers" id="settlers" hidden aria-label="Settlers and their farms"></section>
  </div>
</aside>
<aside class="drawer sheet panel" id="drawer" hidden aria-labelledby="drawerTitle">
  <div class="sheet-head">
    <h2 id="drawerTitle">Customs</h2>
    <button type="button" class="sheet-expand icon-btn" data-icon="chevron" data-sheet="drawer" aria-expanded="true" aria-controls="drawerBody"
      aria-label="Collapse" title="Collapse"></button>
    <button id="drawerClose" type="button" class="icon-btn" data-icon="close" aria-label="Close customs" title="Close"></button>
  </div>
  <div class="sheet-content" id="drawerBody"></div>
</aside>

<div class="hud bottom">
  <aside class="tile sheet panel collapsed" id="tile" hidden aria-labelledby="tileName">
    <div class="sheet-head">
      <div id="tileBadge" hidden></div>
      <div class="sheet-title"><strong id="tileName"></strong><span id="tileKind" hidden></span></div>
      <button type="button" id="tileFocus" class="icon-btn" aria-label="Centre the map on this" aria-keyshortcuts="f" title="Centre the map on this (F)"><svg
        viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8"
        r="4.5"/><path d="M8 0v4M8 12v4M0 8h4M12 8h4"/></svg></button>
      <button type="button" class="sheet-expand icon-btn" data-icon="chevron" data-sheet="tile" aria-expanded="false" aria-controls="tileDetails"
        aria-label="Details" title="Details"></button>
      <button id="tileClose" type="button" class="icon-btn" data-icon="close" aria-label="Close selection" title="Close"></button>
    </div>
    <div class="selection-summary"><span id="tileElev"></span><span id="tileActivity" hidden></span></div>
    <div class="sheet-content" id="tileDetails">
      <div class="tabs" id="tileTabs" role="tablist" aria-label="About the selection" hidden>
        <button type="button" role="tab" id="tabFacts" data-tab="facts" aria-selected="true" aria-controls="tileFacts">Details</button>
        <button type="button" role="tab" id="tabHistory" data-tab="history" aria-selected="false" aria-controls="tileHistory" tabindex="-1">History</button>
      </div>
      <div id="tileFacts" role="tabpanel" aria-labelledby="tabFacts">
        <span id="tileCoord"></span>
        <span id="tileExtra" hidden></span>
        <span id="tileMore" hidden></span>
        <div id="tileRest"></div>
        <div id="cardPlay" class="play" hidden></div>
        <div id="tileLinks" class="links" hidden></div>
        <div id="tileList" class="roster" hidden></div>
        <button type="button" id="personFamily" hidden>View family records</button>
        <details id="relationsDetails"><summary>Relationships</summary><div class="rel" id="tileRel" hidden></div></details>
      </div>
      <div id="tileHistory" class="history" role="tabpanel" aria-labelledby="tabHistory" hidden>
        <div class="kinds" id="historyKinds" role="group" aria-label="Kinds of event"></div>
        <div id="historyList"></div>
      </div>
    </div>
  </aside>
  <div class="map-tools" id="mapTools">
    <div class="notice-pop panel" id="noticePop" role="group" aria-labelledby="noticeTitle" hidden>
      <h2 class="menu-label" id="noticeTitle">Notifications</h2><div id="noticeList"></div>
    </div>
    <div class="minimap panel" id="minimap" aria-label="Overview map, tap to jump" tabindex="0" role="group">
      <canvas id="mmBase"></canvas>
      <canvas id="mmView"></canvas>
    </div>
    <div class="map-bar panel" role="group" aria-label="Map">
      <button id="gridBtn" type="button" class="icon-btn" data-icon="grid" aria-keyshortcuts="g" aria-label="Hex grid" title="Hex grid (G)"
        aria-pressed="true"></button>
      <button id="regionBtn" type="button" class="icon-btn" data-icon="regions" aria-keyshortcuts="r" aria-label="Regions" title="Regions (R)"
        aria-pressed="false"></button>
      <button id="landBtn" type="button" class="icon-btn" data-icon="land" aria-keyshortcuts="l" aria-label="Land ownership"
        title="Land ownership (L)" aria-pressed="false"></button>
      <button id="noticeBtn" type="button" class="icon-btn" data-icon="bell" aria-label="Notifications" title="Which notifications show"
        aria-expanded="false" aria-controls="noticePop"></button>
      <button id="minimapBtn" type="button" class="icon-btn" data-icon="minimap" aria-keyshortcuts="m" aria-label="Minimap" title="Minimap (M)"
        aria-pressed="false"></button>
    </div>
  </div>
</div>

<div class="tree" id="tree" hidden role="dialog" aria-modal="true" aria-labelledby="treeTitle">
  <div class="tree-card panel">
    <header class="tree-head"><h2 id="treeTitle">Family records</h2><p id="treeSub"></p>
      <button id="treeClose" type="button" class="icon-btn" data-icon="close" aria-label="Close family records" title="Close"></button></header>
    <div class="tree-modes" id="treeModes" role="group" aria-label="What the tree shows">
      <button type="button" data-mode="line" aria-pressed="true">Ancestors</button><button type="button" data-mode="father" aria-pressed="false">Father's line</button>
      <button type="button" data-mode="mother" aria-pressed="false">Mother's line</button><button type="button" data-mode="desc" aria-pressed="false">Descendants</button>
      <button type="button" data-mode="path" aria-pressed="false">Path to…</button><button type="button" data-mode="all" aria-pressed="false">Everyone</button>
    </div>
    <p class="tree-caption" id="treeCaption" aria-live="polite" hidden></p>
    <div class="tree-body">
      <div class="tree-scroll" tabindex="0" aria-label="Scroll family tree"><svg id="treeSvg" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Family tree"></svg></div>
      <aside class="tree-info" id="treeInfo" aria-live="polite"></aside>
    </div>
  </div>
</div>

<div class="genscreen" id="landing" hidden>
  <div class="game-info" id="gameInfo" hidden>
    <p class="game-name" id="name"></p>
    <p class="meta" id="meta"></p>
  </div>
  <div class="panel landing">
    <h1>Skärgård</h1>
    <button class="primary" id="landNew" type="button">New archipelago</button>
    <button id="landLoad" type="button">Load archipelago</button>
    <button id="landBack" type="button" hidden>Back to game</button>
    <p class="gen-docs" id="genDocs"><a href="docs/roadmap.html" target="_blank" rel="noopener">Roadmap</a> ·
      <a href="BACKLOG.html" target="_blank" rel="noopener">Backlog</a> ·
      <a href="QUESTIONS.html" target="_blank" rel="noopener">Open questions</a></p>
  </div>
</div>

<div class="genscreen" id="genScreen" hidden>
  <form class="panel" id="genForm" autocomplete="off">
    <div class="screen-head"><h1>New archipelago</h1><button id="genCancel" type="button">Back</button></div>
    <label>Map size
      <select id="genSize">
        <option value="t">Tiny (120 × 85)</option><option value="s">Small (180 × 130)</option>
        <option value="m" selected>Medium (280 × 200)</option><option value="l">Large (380 × 270)</option>
      </select>
    </label>
    <label>Seed
      <input id="genSeed" type="text" inputmode="numeric" maxlength="9" pattern="[0-9]{1,9}" required>
    </label>
    <label>Starting scenario
      <select id="genScenario">
        <option value="founders">Founders</option><option value="heirs">Heirs and empty farms</option>
        <option value="populous">Populous Villages</option>
      </select>
    </label>
    <p class="err" id="genMsg" role="alert" hidden></p>
    <button class="primary" id="genGo" type="submit">Generate</button>
  </form>
</div>

<div class="saves-screen" id="savesScreen" role="dialog" aria-modal="true" aria-labelledby="savesTitle" hidden>
  <div class="panel">
    <div class="screen-head"><h1 id="savesTitle">Saves</h1><button id="savesClose" type="button">Close</button></div>
    <div class="saves-body" id="savesBody"></div>
  </div>
</div>

<div class="loader" id="loader">
  <div>
    <p id="loadText">Raising the land</p>
    <div class="bar"><i id="loadBar"></i></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.14.3/dist/pixi.min.js"></script>
<!--__MODULES__-->
<script>
(async () => {
<!--__PAGE__-->
})();
</script>
</body>
</html>
