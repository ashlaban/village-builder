</style>
</head>
<body>
<div id="stage" aria-label="Map of the archipelago"></div>
<div class="vignette"></div>

<div class="hud top">
  <header class="chart panel">
    <h1 id="name">Archipelago</h1>
    <p class="meta" id="meta"></p>
    <p class="hint" id="hint"></p>
    <div class="actions">
      <button class="primary" id="regen" type="button">New archipelago</button>
      <button id="gridBtn" type="button" aria-pressed="true">Grid</button>
      <button id="regionBtn" type="button" aria-pressed="false">Regions</button>
      <button id="settlersBtn" type="button" aria-pressed="false">Settlers</button>
      <button id="treeBtn" type="button">Family tree</button>
      <button id="customsBtn" type="button" aria-pressed="false">Customs</button>
      <button id="debugBtn" type="button" aria-pressed="false">Debug</button>
    </div>
    <section class="settlers" id="settlers" hidden aria-label="Settlers and their farms"></section>
  </header>
  <div class="clock panel" id="clock">
    <div><strong id="clockDate">Spring, day 1</strong><span id="clockYear">Year 1, 06:00</span></div>
    <div class="speed" role="group" aria-label="Game speed">
      <button type="button" data-speed="0" aria-pressed="false">Pause</button>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="3" aria-pressed="false">3×</button>
      <button type="button" data-speed="10" aria-pressed="false">10×</button>
    </div>
  </div>
</div>
<div class="lod" id="lod" hidden></div>
<aside class="drawer panel" id="drawer" hidden aria-label="Customs and debug tools">
  <button class="dclose" id="drawerClose" type="button">Close</button>
  <div id="drawerBody"></div>
</aside>

<div class="hud bottom">
  <aside class="tile panel" id="tile" hidden aria-live="polite">
    <strong id="tileName"></strong>
    <span id="tileElev"></span>
    <span id="tileCoord"></span>
    <span id="tileExtra" hidden></span>
    <span id="tileMore" hidden></span>
    <div class="rel" id="tileRel" hidden></div>
  </aside>
  <div class="minimap panel" id="minimap" aria-label="Overview map, tap to jump">
    <canvas id="mmBase"></canvas>
    <canvas id="mmView"></canvas>
  </div>
</div>

<div class="tree" id="tree" hidden role="dialog" aria-modal="true" aria-labelledby="treeTitle">
  <div class="tree-card panel">
    <header class="tree-head"><h2 id="treeTitle">Family records</h2><p id="treeSub"></p><button id="treeClose" type="button">Close</button></header>
    <div class="tree-body">
      <div class="tree-scroll"><svg id="treeSvg" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Family tree"></svg></div>
      <aside class="tree-info" id="treeInfo" aria-live="polite"></aside>
    </div>
  </div>
</div>

<div class="genscreen" id="genScreen" hidden>
  <form class="panel" id="genForm" autocomplete="off">
    <h1>New archipelago</h1>
    <label>Map size
      <select id="genSize">
        <option value="t">Tiny (120 × 85)</option><option value="s">Small (180 × 130)</option>
        <option value="m" selected>Medium (280 × 200)</option><option value="l">Large (380 × 270)</option>
      </select>
    </label>
    <label>Seed
      <input id="genSeed" type="text" inputmode="numeric" maxlength="9" pattern="[0-9]{1,9}" required>
    </label>
    <label>Starting scenario
      <select id="genScenario">
        <option value="founders">Founders</option><option value="heirs">Heirs and empty farms</option>
        <option value="populous">Populous Villages</option>
      </select>
    </label>
    <p class="err" id="genMsg" role="alert" hidden></p>
    <button class="primary" id="genGo" type="submit">Generate</button>
  </form>
</div>

<div class="loader" id="loader">
  <div>
    <p id="loadText">Raising the land</p>
    <div class="bar"><i id="loadBar"></i></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.14.3/dist/pixi.min.js"></script>
<!--__MODULES__-->
<script>
(async () => {
  const G = ArchGen, LV = G.LV, TEX = G.TEX, Rivers = VB['gen/rivers'], Paths = VB['gen/paths'];
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
  const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  $('hint').textContent = coarse ? 'Drag to explore, pinch to zoom, tap a settler or tile for details.' : 'Drag to explore, scroll to zoom, point at a settler or tile for details.';

  function failed(msg) {
    const p = $('loadText'); p.textContent = msg; p.classList.add('err');
    document.querySelector('.loader .bar').style.display = 'none';
  }
  if (!window.PIXI) { failed('The rendering library didn’t load. Check your connection and reload the page.'); return; }
  const app = new PIXI.Application();
  try {
    await app.init({ resizeTo: stage, background: '#16395f', antialias: true, autoDensity: true, resolution: Math.min(window.devicePixelRatio || 1, 2), preference: 'webgl' });
  } catch (e) { failed('This browser couldn’t start WebGL, which the map needs. Try another browser or enable hardware acceleration.'); return; }
  stage.appendChild(app.canvas);
  const texFrom = (canvas, opts = {}) => new PIXI.Texture({ source: new PIXI.CanvasSource({ resource: canvas, ...opts }) });

  // ---- layers, bottom to top ----
  const world = new PIXI.Container();
  app.stage.addChild(world);
  const L = {};
  for (const k of ['water', 'waves', 'lod2', 'lod1', 'lod0', 'fields', 'fences', 'grid', 'regions', 'objects', 'labels', 'hover', 'shadows', 'clouds']) { L[k] = new PIXI.Container(); world.addChild(L[k]); }
  const lodLayer = [L.lod0, L.lod1, L.lod2];
  L.regions.visible = false;

  // ---- static textures ----
  const SPR = G.makeSprites(makeCanvas);
  function waveCanvas(seed, n, alpha) {
    const S = 256, c = makeCanvas(S, S), g = c.getContext('2d'), r = G.mulberry32(seed);
    g.lineCap = 'round';
    for (let k = 0; k < n; k++) {
      const x = r() * S, y = r() * S, rad = 5 + r() * 9, a0 = Math.PI * (1.2 + r() * 0.1), a1 = Math.PI * (1.68 + r() * 0.12);
      g.strokeStyle = `rgba(255,255,255,${alpha * (0.5 + r() * 0.5)})`; g.lineWidth = 1 + r() * 0.7;
      for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) { g.beginPath(); g.arc(x + ox, y + oy, rad, a0, a1); g.stroke(); }
    }
    return c;
  }
  function cloudCanvas(seed) {
    const c = makeCanvas(400, 240), g = c.getContext('2d'), r = G.mulberry32(seed);
    for (let k = 0; k < 28; k++) {
      const a = r() * Math.PI * 2, d = Math.sqrt(r());
      const x = 200 + Math.cos(a) * d * 115, y = 122 + Math.sin(a) * d * 48, rad = 26 + r() * 42 * (1 - d * 0.45);
      const gr = g.createRadialGradient(x, y - rad * 0.25, 0, x, y, rad);
      gr.addColorStop(0, 'rgba(255,255,255,0.6)'); gr.addColorStop(0.55, 'rgba(255,255,255,0.28)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
    }
    return c;
  }
  const waveTexA = texFrom(waveCanvas(11, 34, 0.9), { addressMode: 'repeat' });
  const waveTexB = texFrom(waveCanvas(23, 22, 0.8), { addressMode: 'repeat' });
  const cloudTex = [1, 2, 3, 4].map((s) => texFrom(cloudCanvas(s * 97)));

  // ---- state ----
  let w = null, loc = null;
  const cam = { x: 0, y: 0, z: 0.2 };
  let zt = 0.2, anchor = { x: 0, y: 0 };
  const vel = { x: 0, y: 0 };
  let intro = null, sel = -1, hoverDirty = true, waves = [], clouds = [], regionG = null;
  const hoverG = new PIXI.Graphics();
  L.hover.addChild(hoverG);

  const zMin = () => (w ? Math.min(app.screen.width / w.W, app.screen.height / w.H) : 0.1);
  const zMax = 2.6;
  function clampCam() {
    if (!w) return;
    cam.z = clamp(cam.z, zMin(), zMax);
    const vw = app.screen.width / cam.z, vh = app.screen.height / cam.z;
    cam.x = vw >= w.W ? w.W / 2 : clamp(cam.x, vw / 2, w.W - vw / 2);
    cam.y = vh >= w.H ? w.H / 2 : clamp(cam.y, vh / 2, w.H - vh / 2);
  }
  function zoomAt(sx, sy, f) {
    const r = stage.getBoundingClientRect();
    const ox = sx - r.left - r.width / 2, oy = sy - r.top - r.height / 2;
    const wx = cam.x + ox / cam.z, wy = cam.y + oy / cam.z;
    cam.z = clamp(cam.z * f, zMin(), zMax);
    cam.x = wx - ox / cam.z; cam.y = wy - oy / cam.z;
  }
  const toWorld = (sx, sy) => {
    const r = stage.getBoundingClientRect();
    return [cam.x + (sx - r.left - r.width / 2) / cam.z, cam.y + (sy - r.top - r.height / 2) / cam.z];
  };
  const viewRect = (m = 0, c = cam) => {
    const vw = app.screen.width / c.z, vh = app.screen.height / c.z;
    return [c.x - vw / 2 - m, c.y - vh / 2 - m, c.x + vw / 2 + m, c.y + vh / 2 + m];
  };
  const stopIntro = () => { intro = null; };

  // ---- level-of-detail chunks ----
  // Level 2 covers the map in 6 chunks and is always resident; levels 1 and 0 are painted on demand.
  const chunks = new Map();
  let job = null, frameNo = 0, T = 2, pending = 0;
  const ckey = (l, cx, cy) => l * 1e6 + cy * 1000 + cx;
  const nCols = (l) => Math.ceil(w.W / LV[l].size), nRows = (l) => Math.ceil(w.H / LV[l].size);
  function rangeIn(l, r) {
    const s = LV[l].size;
    return [Math.max(0, Math.floor(r[0] / s)), Math.max(0, Math.floor(r[1] / s)), Math.min(nCols(l) - 1, Math.floor(r[2] / s)), Math.min(nRows(l) - 1, Math.floor(r[3] / s))];
  }
  const TH0 = 0.63, TH1 = 0.22, HY = 1.06;
  function levelFor(z, cur) {
    let l = z >= TH0 ? 0 : z >= TH1 ? 1 : 2;
    if (cur === 0 && l !== 0 && z >= TH0 / HY) l = 0;
    if (cur === 1 && l === 0 && z < TH0 * HY) l = 1;
    if (cur === 1 && l === 2 && z >= TH1 / HY) l = 1;
    if (cur === 2 && l === 1 && z < TH1 * HY) l = 2;
    return l;
  }
  function* chunkJob(wd, l, cx, cy, canvas) {
    const ctx = canvas.getContext('2d'), img = ctx.createImageData(TEX, TEX);
    yield* G.bakeChunk(wd, l, cx, cy, img);
    ctx.putImageData(img, 0, 0);
    yield 1;
    Rivers.drawChunk(wd, ctx, LV[l], cx, cy, l === 0);
    Paths.drawChunk(wd, ctx, LV[l], cx, cy, l);
    yield 1;
    G.decorateChunk(wd, ctx, l, cx, cy, SPR);
  }
  function addChunk(l, cx, cy, canvas) {
    const s = LV[l].size;
    const spr = new PIXI.Sprite(texFrom(canvas, { autoGenerateMipmaps: true, mipmapFilter: 'linear' }));
    spr.position.set(cx * s, cy * s); spr.scale.set(s / TEX); spr.visible = false;
    lodLayer[l].addChild(spr);
    chunks.set(ckey(l, cx, cy), { l, cx, cy, spr, canvas, seen: frameNo });
  }
  function dropChunk(k) {
    const ch = chunks.get(k);
    if (!ch) return;
    ch.spr.destroy({ texture: true, textureSource: true });
    chunks.delete(k);
  }
  // Repaint what the simulation changed on the map: tiles whose tree density stage changed or that turned to meadow.
  // Levels 0 and 1 are dropped and painted again on demand; the always-resident overview (level 2) is only recoloured, in place.
  function refreshTrees() {
    const reach = 36 + 2 * w.R;
    const overChunks = (tile, l) => {
      const [x0, y0, x1, y1] = rangeIn(l, [w.hx[tile] - reach, w.hy[tile] - reach, w.hx[tile] + reach, w.hy[tile] + reach]);
      const out = []; for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) out.push([cx, cy]);
      return out;
    };
    for (const tile of st.treeDirty) for (const l of [0, 1]) for (const [cx, cy] of overChunks(tile, l)) dropChunk(ckey(l, cx, cy));
    for (const tile of st.biomeDirty) {
      for (const [cx, cy] of overChunks(tile, 2)) {
        const ch = chunks.get(ckey(2, cx, cy));
        if (!ch) continue;
        for (const _ of chunkJob(w, 2, cx, cy, ch.canvas));
        ch.spr.texture.source.update();
      }
    }
    st.treeDirty.clear(); st.biomeDirty.clear();
  }
  // Repaint worn paths whose stage changed (sim/paths): the close levels around them are dropped and painted again on demand, within
  // the frame budget; the overview shows no paths.
  function refreshPaths() {
    const reach = 2 * w.R;
    for (const tile of st.pathDirty) for (const l of [0, 1]) {
      const [a, b, c, d] = rangeIn(l, [w.hx[tile] - reach, w.hy[tile] - reach, w.hx[tile] + reach, w.hy[tile] + reach]);
      for (let cy = b; cy <= d; cy++) for (let cx = a; cx <= c; cx++) dropChunk(ckey(l, cx, cy));
    }
    st.pathDirty.clear();
  }
  function wantedList() {
    const out = [], seen = new Set();
    const add = (l, rect, bias) => {
      if (l > 1) return;
      const [a, b, c, d] = rangeIn(l, rect), mx = (rect[0] + rect[2]) / 2, my = (rect[1] + rect[3]) / 2, s = LV[l].size;
      for (let cy = b; cy <= d; cy++) for (let cx = a; cx <= c; cx++) {
        const k = ckey(l, cx, cy);
        if (chunks.has(k) || seen.has(k)) continue;
        seen.add(k);
        out.push({ l, cx, cy, k, d: Math.hypot((cx + 0.5) * s - mx, (cy + 0.5) * s - my) + bias });
      }
    };
    if (intro) {
      // during the opening glide, paint the destination: a few mid-level chunks first as a fallback, then full detail
      if (intro.T === 0) add(1, intro.rect, 0);
      add(intro.T, intro.rect, 1e7);
    }
    else {
      add(T, viewRect(LV[T].size * 0.25), 0);
      // once the close view is done, paint the mid level under it too, so zooming out is instant
      if (T === 0) add(1, viewRect(0), 1e7);
    }
    out.sort((p, q) => p.d - q.d);
    return out;
  }
  function schedule(budget) {
    const want = wantedList();
    pending = want.length + (job ? 1 : 0);
    if (job && !want.some((q) => q.k === job.k) && job.rows < 0.5) job = null; // panned away: drop half-done work
    const t0 = performance.now();
    while (performance.now() - t0 < budget) {
      if (!job) {
        while (want.length && chunks.has(want[0].k)) want.shift();
        const nx = want.shift();
        if (!nx) break;
        const canvas = makeCanvas(TEX, TEX);
        job = { ...nx, canvas, wd: w, rows: 0, gen: chunkJob(w, nx.l, nx.cx, nx.cy, canvas) };
      }
      const r = job.gen.next();
      if (r.done) {
        if (job.wd === w) addChunk(job.l, job.cx, job.cy, job.canvas);
        job = null;
      } else job.rows = r.value;
    }
  }
  function visit(l, cx, cy, view) {
    const ch = chunks.get(ckey(l, cx, cy));
    if (ch) ch.seen = frameNo;
    if (l === T) { if (ch) { ch.spr.visible = true; return true; } return false; }
    const s = LV[l].size;
    const r = [Math.max(view[0], cx * s), Math.max(view[1], cy * s), Math.min(view[2], (cx + 1) * s - 0.01), Math.min(view[3], (cy + 1) * s - 0.01)];
    const [a, b, c, d] = rangeIn(l - 1, r);
    let all = true;
    for (let y = b; y <= d; y++) for (let x = a; x <= c; x++) if (!visit(l - 1, x, y, view)) all = false;
    if (!all && ch) ch.spr.visible = true;
    return all || !!ch;
  }
  function display() {
    for (const ch of chunks.values()) ch.spr.visible = false;
    const view = viewRect(0), [a, b, c, d] = rangeIn(2, view);
    for (let cy = b; cy <= d; cy++) for (let cx = a; cx <= c; cx++) visit(2, cx, cy, view);
    // keep memory bounded: evict the least recently seen chunks of levels 0 and 1
    for (const l of [0, 1]) {
      const [a2, b2, c2, d2] = rangeIn(l, viewRect(LV[l].size * 0.25));
      const cap = Math.ceil((c2 - a2 + 1) * (d2 - b2 + 1) * 1.6) + 8;
      const list = [...chunks.values()].filter((ch) => ch.l === l);
      if (list.length <= cap) continue;
      list.sort((p, q) => p.seen - q.seen);
      for (let k = 0; k < list.length - cap; k++) if (list[k].seen < frameNo) dropChunk(ckey(l, list[k].cx, list[k].cy));
    }
  }

  // ---- grid, built lazily in pieces of one level-1 chunk each ----
  const gridPieces = new Map();
  function gridPiece(cx, cy) {
    const k = cy * 1000 + cx;
    let g = gridPieces.get(k);
    if (g) return g;
    g = new PIXI.Graphics();
    const s = LV[1].size, R = w.R, vx = [], vy = [];
    for (let j = 0; j < 6; j++) { const a = (Math.PI / 180) * (30 + 60 * j); vx.push(Math.cos(a) * R); vy.push(Math.sin(a) * R); }
    const r0 = Math.max(0, Math.floor((cy * s - R) / (1.5 * R))), r1 = Math.min(w.ROWS - 1, Math.ceil(((cy + 1) * s - R) / (1.5 * R)));
    for (let row = r0; row <= r1; row++) for (let col = 0; col < w.COLS; col++) {
      const i = row * w.COLS + col, x = w.hx[i], y = w.hy[i];
      if (x < cx * s || x >= (cx + 1) * s || y < cy * s || y >= (cy + 1) * s) continue;
      g.moveTo(x + vx[2], y + vy[2]).lineTo(x + vx[3], y + vy[3]).lineTo(x + vx[4], y + vy[4]).lineTo(x + vx[5], y + vy[5]);
    }
    g.stroke({ width: 1, color: 0x0a2830, alpha: 0.22, pixelLine: true });
    L.grid.addChild(g); gridPieces.set(k, g);
    return g;
  }
  let gridOn = true;
  function updateGrid() {
    const a = gridOn ? clamp((w.HW * cam.z - 18) / 22, 0, 1) : 0;
    L.grid.visible = a > 0.01;
    if (!L.grid.visible) return;
    L.grid.alpha = a;
    for (const g of gridPieces.values()) g.visible = false;
    const [a1, b1, c1, d1] = rangeIn(1, viewRect(0));
    for (let cy = b1; cy <= d1; cy++) for (let cx = a1; cx <= c1; cx++) gridPiece(cx, cy).visible = true;
  }

  // ---- region borders: tile edges between different regions, where at least one side is land ----
  function buildRegions(wd) {
    const g = new PIXI.Graphics(), R = wd.R, NA = [0, -60, -120];
    for (let i = 0; i < wd.N; i++) for (let d = 0; d < 3; d++) {
      const j = wd.nb[i * 6 + d];
      if (j < 0 || wd.region[i] === wd.region[j] || (wd.water[i] && wd.water[j])) continue;
      const a0 = ((NA[d] - 30) * Math.PI) / 180, a1 = ((NA[d] + 30) * Math.PI) / 180;
      g.moveTo(wd.hx[i] + Math.cos(a0) * R, wd.hy[i] + Math.sin(a0) * R).lineTo(wd.hx[i] + Math.cos(a1) * R, wd.hy[i] + Math.sin(a1) * R);
    }
    g.stroke({ width: 1, color: 0xfff1d0, alpha: 0.75, pixelLine: true });
    return g;
  }

  // ---- loader ----
  const loader = $('loader');
  const setLoad = (text, p) => { if (text) $('loadText').textContent = text; if (p != null) $('loadBar').style.width = (p * 100).toFixed(1) + '%'; };
  async function drive(gen, onP) {
    let r, last = performance.now();
    while (!(r = gen.next()).done) {
      onP(r.value);
      if (performance.now() - last > 30) { await frame(); last = performance.now(); }
    }
    return r.value;
  }

  let building = false;
  const SIZES = { t: [120, 85], s: [180, 130], m: [280, 200], l: [380, 270] };
  let choice = { seed: (Math.random() * 1e6) | 0, scenario: 'founders', size: 'm' }; // what the generation screen shows
  function showGenScreen(msg) {
    $('genSeed').value = String(choice.seed); $('genScenario').value = choice.scenario; $('genSize').value = choice.size;
    $('genMsg').hidden = !msg; $('genMsg').textContent = msg || '';
    $('genScreen').hidden = false; loader.classList.add('done'); $('genSeed').focus();
  }
  async function build(seed, scenario, size) {
    choice = { seed, scenario, size };
    $('genScreen').hidden = true;
    building = true; $('regen').disabled = true;
    loader.classList.remove('done');
    setLoad('Raising the land', 0);
    await frame(); await frame();
    const wd = await drive(G.generate(seed, { cols: SIZES[size][0], rows: SIZES[size][1] }), (p) => setLoad(null, p * 0.5));
    setLoad('Settling the founders', 0.52); await frame();
    let sim = null;
    try { sim = Sim.seed(wd, seed, scenario); } catch (e) { console.warn('No settlement on this map for this scenario', e); }
    if (!sim) {
      building = false; $('regen').disabled = false;
      showGenScreen('This map has no room for that scenario. Pick another seed, size or scenario.');
      return;
    }
    treeSel = -1; selPawn = -1;
    setLoad('Painting the overview', 0.55); await frame();
    const wc = makeCanvas(wd.CW, wd.CH);
    G.bakeWater(wd, wc.getContext('2d'));
    const nx2 = Math.ceil(wd.W / LV[2].size), ny2 = Math.ceil(wd.H / LV[2].size), over = [];
    for (let cy = 0; cy < ny2; cy++) for (let cx = 0; cx < nx2; cx++) {
      const canvas = makeCanvas(TEX, TEX);
      await drive(chunkJob(wd, 2, cx, cy, canvas), (p) => setLoad(null, 0.55 + ((over.length + p) / (nx2 * ny2)) * 0.4));
      over.push({ cx, cy, canvas });
    }
    setLoad('Drawing the regions', 0.96); await frame();

    // swap in the new world
    job = null;
    for (const k of [...chunks.keys()]) dropChunk(k);
    for (const ch of L.water.removeChildren()) ch.destroy({ texture: true, textureSource: true });
    if (regionG) { regionG.destroy(); regionG = null; }
    w = wd; loc = G.hexLocator(wd); sel = -1; hoverDirty = true; showTile(-1);
    const water = new PIXI.Sprite(texFrom(wc));

  function renderTreeInfo() {
    const box = $('treeInfo');
    if (treeSel < 0) { box.innerHTML = '<p class="hint">Choose a person to see their family. Heirs are marked with a dot; the dead are greyed.</p>'; return; }
    const p = st.pawns[treeSel], f = farmOf(p), v = f ? st.villages[f.village].name : null, dead = p.died !== null;
    const sp = Sim.spouseOf(st, p.id), kids = Sim.childrenOf(st, p.id), sibs = Sim.siblingsOf(st, p.id);
    const nm = (id) => `<button type="button" data-pawn="${id}">${esc(Sim.fullName(st.pawns[id]))}</button>`;
    const kin = sp !== null ? Sim.kinship(st, p.id, sp) : null;
    const spouses = st.unions.filter((u) => u.a === p.id || u.b === p.id).map((u) => (u.a === p.id ? u.b : u.a));
    const evs = (p.events || []).filter((e) => e.text).slice(-8).reverse().map((e) => `<li>Year ${yearStr(Math.floor(e.t / Sim.YEAR) + 1)}: ${esc(e.text)}</li>`).join('');
    box.innerHTML = `<h3>${esc(Sim.fullName(p))}</h3>
      <p>${dead ? `Lived from year ${yearStr(Sim.birthYear(p))} to ${yearStr(deathYear(p))}.` : `${esc(roleLine(p))}, ${p.age}. Born in year ${yearStr(Sim.birthYear(p))}${p.born < 0 ? ', before the landing' : ''}.`}</p>
      ${f ? `<p>${dead ? 'Lived' : 'Lives'} at ${esc(f.name)}${v ? ` in ${esc(v)}` : ''}.</p>` : ''}
      <dl>
        <dt>Father</dt><dd>${p.father !== null ? nm(p.father) : `${esc(p.fatherName)}, known only from the patronymic`}</dd>
        <dt>Mother</dt><dd>${p.mother !== null ? nm(p.mother) : 'Not on record'}</dd>
        <dt>${dead ? 'Married' : 'Spouse'}</dt><dd>${sp !== null ? `${nm(sp)}, ${kin > 0 ? `kinship coefficient ${kin.toFixed(4)}` : 'not related by blood'}` : spouses.length ? spouses.map(nm).join(', ') + (dead ? '' : ' (widowed)') : 'Unmarried'}</dd>
        <dt>Children</dt><dd>${kids.length ? kids.map(nm).join(', ') : 'None'}</dd>
        <dt>Siblings</dt><dd>${sibs.length ? sibs.map(nm).join(', ') : p.father === null && p.mother === null ? 'Not on record' : 'None'}</dd>
      </dl>
      ${evs ? `<ul class="evs">${evs}</ul>` : ''}
      ${dead ? '' : '<button type="button" class="primary" id="treeShow">Show on the map</button>'}`;
  }
  function openTree() {
    if (!st) return;
    $('tree').hidden = false; $('treeTitle').textContent = `Family records of ${st.villages.map((v) => v.name).join(' and ')}`;
    const L2 = layoutTree(st), living = st.pawns.filter((p) => p.died === null).length;
    $('treeSub').textContent = `${living} living, ${st.pawns.length - living} dead, ${st.unions.length} marriages, ${L2.rows.length} ${L2.rows.length === 1 ? 'generation' : 'generations'}`;
    if (treeSel < 0 && selPawn >= 0) treeSel = selPawn;
    renderTree(); renderTreeInfo(); $('treeClose').focus();
  }
  const closeTree = () => { $('tree').hidden = true; $('treeBtn').focus(); };
  $('treeBtn').addEventListener('click', openTree);
  $('treeClose').addEventListener('click', closeTree);
  $('tree').addEventListener('click', (e) => {
    if (e.target === $('tree')) { closeTree(); return; }
    if (e.target.id === 'treeShow') { closeTree(); focusPawn(treeSel); return; }
    const n = e.target.closest('[data-pawn]');
    if (n) { treeSel = +n.dataset.pawn; renderTree(); renderTreeInfo(); }
  });
  $('tree').addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeTree();
    const n = e.target.closest && e.target.closest('g[data-pawn]');
    if (n && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); treeSel = +n.dataset.pawn; renderTree(); renderTreeInfo(); }
  });

  // ======== customs and debug drawer ========
  let drawerTab = null, skipping = false, drawerHTML = '';
  const drawer = $('drawer'), BAR = ['#2f7d6b', '#c9a24a', '#a8604c', '#5a72a8'];
  function openDrawer(tab) {
    drawerTab = drawerTab === tab ? null : tab;
    drawer.hidden = !drawerTab;
    $('customsBtn').setAttribute('aria-pressed', String(drawerTab === 'customs'));
    $('debugBtn').setAttribute('aria-pressed', String(drawerTab === 'debug'));
    drawerHTML = ''; if (drawerTab === 'debug') buildDebug(); renderDrawer();
  }
  $('customsBtn').addEventListener('click', () => openDrawer('customs'));
  $('debugBtn').addEventListener('click', () => openDrawer('debug'));
  $('drawerClose').addEventListener('click', () => openDrawer(drawerTab));
  const optLabel = (d, j) => Culture.DIMS[d].opts[j][1];
  const nextMeeting = () => { const c = Sim.cal(st.t), target = 2 * Sim.SEASON_DAYS + 9; let days = target - c.doy; if (days < 0 || (days === 0 && c.hour >= 12)) days += Sim.YEAR_DAYS; return days; };
  function renderDrawer() {
    if (!drawerTab || !st) return;
    if (drawerTab === 'customs') {
      const env = st.cenv; let h = '<h2 class="dh">Customs</h2>';
      const days = nextMeeting();
      h += `<p class="dm">Attitudes drift every day; a village’s practice changes only at its meeting after harvest (next in ${days} ${days === 1 ? 'day' : 'days'}), the culture’s customs only at the reckoning that follows.</p>`;
      for (const c of env.cultures) h += `<p class="dm"><strong>${esc(c.name)} culture</strong>, centred on ${esc(env.settlements[c.centres[0]].name)}${c.parent !== null ? `, split from ${esc(env.cultures[c.parent].name)}` : ''}.</p>`;
      const setts = env.settlements;
      for (const s of setts) {
        const voices = s.members().filter((p) => env.voiceOf(p, s) > 0).length;
        h += `<p class="dm">${esc(s.name)}: ${s.members().length} people, ${voices} with a voice; tie to the centre ${Math.round(s.tie * 100)}%${s.id !== env.cultures[s.culture].centres[0] ? `, ${Math.round((s.divergence || 0) * 100)}% apart in practice${s.fissionYears ? `, ${s.fissionYears} of ${Culture.P.fission.years} years towards a split` : ''}` : ''}.</p>`;
      }
      h += `<table class="cust"><thead><tr><th scope="col">Custom</th><th scope="col">Culture</th>${setts.map((s) => `<th scope="col">${esc(s.name)}</th>`).join('')}</tr></thead><tbody>`;
      const sup = setts.map((s) => Culture.support(env, s.members(), (p) => env.voiceOf(p, s)).S);
      Culture.DIMS.forEach((d, k) => {
        const c = env.cultures[setts[0].culture], dots = Math.max(1, Math.round(d.m * 5));
        h += `<tr><th scope="row">${esc(d.label)}<br><span class="mall" title="How easily it changes">${'●'.repeat(dots)}${'○'.repeat(5 - dots)}</span></th><td>${esc(optLabel(k, c.customs[k]))}</td>`;
        setts.forEach((s, si) => {
          const cc = env.cultures[s.culture], dev = s.practice[k] !== cc.customs[k], o = Culture.OFF[k];
          const segs = d.opts.map((op, j) => `<i style="width:${(sup[si][o + j] * 100).toFixed(1)}%;background:${BAR[j]}" title="${esc(op[1])}: ${Math.round(sup[si][o + j] * 100)}%"></i>`).join('');
          h += `<td class="${dev ? 'dev' : ''}">${esc(optLabel(k, s.practice[k]))}<div class="sbar" aria-hidden="true">${segs}</div></td>`;
        });
        h += '</tr>';
      });
      h += '</tbody></table><p class="dm">Bars show voice-weighted support for each option today, in the order: ' + ['first', 'second', 'third', 'fourth'].map((n, j) => `<span class="sw" style="background:${BAR[j]}"></span>${n}`).join(' ') + ' option.</p>';
      h += '<h3 class="dh3">Meetings</h3>' + (st.meetingLog.length ? st.meetingLog.slice(0, 8).map((e) => `<p class="dm">Year ${e.year}: ${esc(e.text)}</p>`).join('') : '<p class="dm">No meeting held yet.</p>');
      if (h !== drawerHTML) { drawerHTML = h; $('drawerBody').innerHTML = h; }
    } else updateDebug();
  }
  function buildDebug() {
    const dims = Culture.DIMS.map((d, k) => `<option value="${k}">${esc(d.label)}</option>`).join('');
    $('drawerBody').innerHTML = `<h2 class="dh">Debug</h2>
      <p class="dm" id="dbgWhen"></p>
      <div class="dbg-row"><button type="button" data-act="skip1">Skip a year</button><button type="button" data-act="skip10">Skip ten years</button></div>
      <div class="dbg-row"><button type="button" data-act="meet">Hold the meetings now</button><button type="button" data-act="move">Run the moving round</button></div>
      <p class="dm">Drift speed of attitudes</p>
      <div class="dbg-row" role="group" aria-label="Drift speed">${[1, 10, 100].map((m) => `<button type="button" data-drift="${m}" aria-pressed="${st.driftMul === m}">×${m}</button>`).join('')}</div>
      <label class="dchk"><input type="checkbox" id="dbgDeaths" ${st.naturalDeaths ? 'checked' : ''}> Natural deaths</label>
      <h3 class="dh3">Selected person</h3>
      <p class="dm" id="dbgSel"></p>
      <div class="dbg-row"><button type="button" data-act="kill">Kill</button><button type="button" data-act="retire">Retire and hand over</button></div>
      <div class="dbg-row"><select id="advDim" aria-label="Custom">${dims}</select><select id="advOpt" aria-label="Option"></select></div>
      <div class="dbg-row"><button type="button" data-act="advP">Make them argue for it</button><button type="button" data-act="advV">Rally a fifth of the village</button></div>
      <h3 class="dh3">Wants to move out</h3><p class="dm" id="dbgOut"></p>
      <p class="dm" id="dbgMsg" aria-live="polite"></p>`;
    const fillOpts = () => { const k = +$('advDim').value; $('advOpt').innerHTML = Culture.DIMS[k].opts.map((o, j) => `<option value="${j}">${esc(o[1])}</option>`).join(''); };
    $('advDim').addEventListener('change', fillOpts); fillOpts();
    $('dbgDeaths').addEventListener('change', (e) => { st.naturalDeaths = e.target.checked; });
    updateDebug();
  }
  const selected = () => (selPawn >= 0 ? selPawn : treeSel >= 0 ? treeSel : -1);
  function updateDebug() {
    if (!$('dbgWhen')) return;
    const c = Sim.cal(st.t), days = nextMeeting();
    $('dbgWhen').textContent = skipping ? $('dbgWhen').textContent : `Year ${c.year}, ${Sim.SEASONS[c.season]} day ${c.sday + 1}. Next meetings in ${days} ${days === 1 ? 'day' : 'days'}.`;
    const id = selected(), p = id >= 0 ? st.pawns[id] : null;
    $('dbgSel').textContent = p ? `${Sim.fullName(p)}${p.died !== null ? ' (dead)' : `, ${p.age}, ${roleLine(p)}`}${p.advocate ? `; argues for “${optLabel(p.advocate.dim, p.advocate.opt).toLowerCase()}”` : ''}` : 'Select someone on the map, in the settlers list or in the family tree.';
    const out = st.demand.filter((q) => st.pawns[q].alive);
    $('dbgOut').textContent = out.length ? out.map((q) => `${Sim.fullName(st.pawns[q])} (${st.pawns[q].age}, ${st.villages[Sim.settlementIdOf(st, st.pawns[q])].name})`).join(', ') : 'Nobody right now.';
  }
  const dmsg = (t) => { const m = $('dbgMsg'); if (m) m.textContent = t; };
  async function skipYears(n) {
    if (skipping) return;
    skipping = true;
    const days = n * Sim.YEAR_DAYS;
    for (let d = 0; d < days; d++) {
      Sim.advance(st, Sim.DAY);
      if (d % 4 === 3) { $('dbgWhen').textContent = `Skipping: day ${d + 1} of ${days}…`; await frame(); }
    }
    skipping = false; st.visualDirty = true; settlersHTML = ''; dmsg(`Skipped ${n} ${n === 1 ? 'year' : 'years'}.`); updateDebug();
  }
  drawer.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b || !st || skipping) return;
    const id = selected(), p = id >= 0 ? st.pawns[id] : null;
    if (b.dataset.drift) { st.driftMul = +b.dataset.drift; drawer.querySelectorAll('[data-drift]').forEach((x) => x.setAttribute('aria-pressed', String(+x.dataset.drift === st.driftMul))); return; }
    switch (b.dataset.act) {
      case 'skip1': skipYears(1); break;
      case 'skip10': skipYears(10); break;
      case 'meet': Sim.holdMeetings(st); dmsg(st.meetingLog[0] ? st.meetingLog[0].text : ''); break;
      case 'move': Sim.movingRound(st); dmsg(`Moving round done; ${st.demand.length} want to move out.`); break;
      case 'kill': if (p && p.died === null) { Sim.killPawn(st, id, 'killed'); dmsg(`${Sim.fullName(p)} has died.`); if (selPawn === id) { selPawn = -1; $('tile').hidden = true; } } else dmsg('Select a living person first.'); break;
      case 'retire': { const hh = p ? Sim.holdingOf(st, id) : null; if (hh && Sim.retireHolder(st, hh.id)) dmsg(`${Sim.fullName(p)} hands over ${st.farmsteads[hh.farmstead].name}.`); else dmsg('Select someone who holds a farm and has an heir.'); break; }
      case 'advP': case 'advV': {
        if (!p || p.died !== null) { dmsg('Select a living person first.'); break; }
        const dim = +$('advDim').value, opt = +$('advOpt').value, until = st.cenv.t + 10;
        if (b.dataset.act === 'advP') { p.advocate = { dim, opt, until }; dmsg(`${Sim.fullName(p)} now argues for “${optLabel(dim, opt).toLowerCase()}”.`); }
        else {
          const s = st.cenv.settlements[Sim.settlementIdOf(st, p)], voiced = s.members().filter((q) => st.cenv.voiceOf(q, s) > 0).sort((x, y) => y.prestige - x.prestige);
          const want = Math.max(1, Math.ceil(voiced.length * 0.2)); let n = 0;
          for (const q of voiced) { if (n >= want) break; q.advocate = { dim, opt, until }; n++; }
          dmsg(`${n} of ${voiced.length} voices in ${s.name} now argue for “${optLabel(dim, opt).toLowerCase()}”.`);
        }
        break;
      }
    }
    settlersHTML = ''; updateDebug();
  });

  // ---- frame loop ----
  let time = 0;
  const lodEl = $('lod');
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  let frameErrAt = -1e9;
  const onFrame = (tk) => {
    if (!w) return;
    const dt = Math.min(0.05, tk.deltaMS / 1000);
    time += dt; frameNo++;
    if (intro) {
      intro.t += dt;
      const k = ease(clamp(intro.t / intro.d, 0, 1));
      cam.x = intro.x0 + (intro.x1 - intro.x0) * k; cam.y = intro.y0 + (intro.y1 - intro.y0) * k;
      cam.z = Math.exp(Math.log(intro.z0) + (Math.log(intro.z1) - Math.log(intro.z0)) * k); zt = cam.z;
      if (intro.t >= intro.d) intro = null;
    }
    if (Math.abs(zt - cam.z) > 1e-4) zoomAt(anchor.x, anchor.y, (cam.z + (zt - cam.z) * Math.min(1, dt * 14)) / cam.z);
    if (!drag && !pinch) {
      cam.x += vel.x * dt; cam.y += vel.y * dt;
      const decay = Math.exp(-dt * 4.5); vel.x *= decay; vel.y *= decay;
    }
    if (keys.size) {
      const sp = 700 / cam.z;
      if (keys.has('arrowleft') || keys.has('a')) cam.x -= sp * dt;
      if (keys.has('arrowright') || keys.has('d')) cam.x += sp * dt;
      if (keys.has('arrowup') || keys.has('w')) cam.y -= sp * dt;
      if (keys.has('arrowdown') || keys.has('s')) cam.y += sp * dt;
    }
    clampCam();
    world.scale.set(cam.z);
    world.position.set(app.screen.width / 2 - cam.x * cam.z, app.screen.height / 2 - cam.y * cam.z);

    T = levelFor(cam.z, T);
    // paint in bigger slices while the view is still; keep frames smooth while it moves
    const busy = intro || drag || pinch || keys.size || Math.abs(vel.x) + Math.abs(vel.y) > 2 || Math.abs(zt - cam.z) > 1e-3;
    if (!building) schedule(intro ? 14 : busy ? 9 : 22);
    display();
    lodEl.hidden = pending === 0;
    if (pending) lodEl.textContent = `Painting detail, ${pending} ${pending === 1 ? 'area' : 'areas'} left`;

    // sea: wave crests only once they are big enough not to shimmer
    const wa = clamp((cam.z - 0.14) / 0.3, 0, 1);
    L.waves.visible = wa > 0.01;
    if (!reduceMotion) {
      waves[0].tilePosition.x += 6 * dt; waves[0].tilePosition.y += 2.5 * dt;
      waves[1].tilePosition.x -= 4 * dt; waves[1].tilePosition.y += 3.5 * dt;
    }
    waves[0].alpha = (0.2 + (reduceMotion ? 0 : 0.05 * Math.sin(time * 0.8))) * wa;
    waves[1].alpha = (0.12 + (reduceMotion ? 0 : 0.04 * Math.sin(time * 0.55 + 1.3))) * wa;
    // clouds: visible on the overview, thinning out as you descend
    const zm = zMin(), fade = clamp((zm * 2.3 - cam.z) / (zm * 1.3), 0, 1);
    L.clouds.visible = L.shadows.visible = fade > 0.01;
    L.clouds.alpha = 0.85 * fade; L.shadows.alpha = 0.16 * fade;
    for (const c of clouds) {
      if (!reduceMotion) { c.spr.x += c.vx * dt; c.spr.y += c.vy * dt; }
      const hw = c.spr.width / 2;
      if (c.spr.x - hw > w.W + 200 * w.KS) c.spr.x = -hw - 200 * w.KS;
      c.sh.x = c.spr.x + 120 * w.KS; c.sh.y = c.spr.y + 90 * w.KS;
    }
    updateGrid();
    updateSettlement(dt);
    L.regions.alpha = clamp(1.25 - cam.z, 0.35, 1);
    if (hoverDirty || sel >= 0) { drawHover(); hoverDirty = false; }
    drawMinimapView();
  };
  // Pixi stops its ticker for good when a frame throws; catch it, say so, and keep the game running.
  app.ticker.add((tk) => {
    try { onFrame(tk); }
    catch (e) {
      console.error(e);
      if (performance.now() - frameErrAt > 5000) { frameErrAt = performance.now(); lodEl.hidden = false; lodEl.textContent = `Something went wrong in a frame: ${e.message}`; }
    }
  });

  // The page opens on the generation screen. A hash skips it: #<scenario><size><seed>, scenario s (founders), h (heirs) or p (populous),
  // size t, s, m or l (medium if left out); e.g. #s123, #h123, #pt123 (populous, tiny). #123 is founders on a medium map.
  const hm = location.hash.match(/^#([shp]?)([tsml]?)(\d{1,9})$/);
  if (hm) build(+hm[3], { s: 'founders', h: 'heirs', p: 'populous', '': 'founders' }[hm[1]], hm[2] || 'm');
  else showGenScreen();
})();
</script>
</body>
</html>
