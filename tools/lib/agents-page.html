<style>
/* The roadmap and token use pages' own tokens and panels; a card a skill or agent. */
:root{ --bg:#f7f5f0; --panel:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --line:#e2ddd2; --s1:#2a78d6; --code:#efece5 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

:root[data-theme="dark"]{ --bg:#141413; --panel:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --line:#33312d; --s1:#3987e5; --code:#23221f; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 4px;text-wrap:balance} h2{font:600 20px/1.2 Georgia,serif;margin:30px 0 6px}

a{color:var(--s1)}

.note{color:var(--ink2);font-size:13px;margin:6px 0 12px;max-width:85ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:0 0 14px;scroll-margin-top:12px}
.card p{margin:0 0 10px;max-width:85ch}

pre.call{margin:0 0 12px;background:var(--code);border-radius:6px;padding:8px 10px;overflow-x:auto} pre.call code{padding:0;background:none;white-space:pre}
dl{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:6px 14px;margin:0 0 10px;font-size:14px}

ul{margin:0 0 10px;padding-left:20px;font-size:14px} li{margin:0 0 4px}
.facts{color:var(--ink2);font-size:12px;margin:0} .none{color:var(--ink2);font-size:14px}
