<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Action Menu Drafts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@1,500;1,700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one sea-coloured stage holding a patch of the hex map, the controls above it, the queue and the flows to try below.
   Colours and type are the game's own (src/head.html); the tile colours are this mock-up's. */
:root {
  --bg: #e6efec; --surface: #fbfdfc; --ink: #17313a; --muted: #526d75; --edge: rgba(23, 49, 58, 0.16);
  --accent: #23685a; --on-accent: #f2f8f6; --bad: #a8432f; --good: #2f7a4b;
  --sea: #16395f; --panel: rgba(244, 249, 247, 0.94); --shadow: rgba(6, 22, 38, 0.35);
  --t-w: #2a5788; --t-f: #3f7a52; --t-g: #8fb86a; --t-c: #a9c780; --t-F: #d4b86a; --t-H: #8a6a45; --t-n: #c9b677;
  --t-m: #bcd47c; --t-o: #9cc070; --t-S: #cdbd97; --t-N: #c4b692; --t-V: #7fb07a;
  --t-ink: rgba(23, 49, 58, 0.5); --t-roof: #a8432f; --t-own: #f2f8f6; --map-label: #f6faf8; --map-label-edge: rgba(10, 30, 48, 0.75);
  --display: 'Alegreya', Georgia, serif; --body: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1b22; --surface: #17323b; --ink: #e1ebe7; --muted: #93adae; --edge: rgba(225, 235, 231, 0.18);
    --accent: #84c9b5; --on-accent: #0c1f25; --bad: #f0a08c; --good: #8fd0a2;
    --sea: #0f2a47; --panel: rgba(16, 36, 44, 0.94); --shadow: rgba(0, 0, 0, 0.55);
    --t-w: #1d436d; --t-f: #2f6042; --t-g: #6c9450; --t-c: #7f9e5e; --t-F: #a8904e; --t-H: #6f5538; --t-n: #9c8d58;
    --t-m: #8fab58; --t-o: #769a52; --t-S: #9c8d6c; --t-N: #94876a; --t-V: #5f8f5e;
    --t-ink: rgba(8, 20, 25, 0.55); --t-roof: #b5543f; --t-own: #e1ebe7; --map-label: #eef5f2; --map-label-edge: rgba(4, 14, 22, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1b22; --surface: #17323b; --ink: #e1ebe7; --muted: #93adae; --edge: rgba(225, 235, 231, 0.18);
  --accent: #84c9b5; --on-accent: #0c1f25; --bad: #f0a08c; --good: #8fd0a2;
  --sea: #0f2a47; --panel: rgba(16, 36, 44, 0.94); --shadow: rgba(0, 0, 0, 0.55);
  --t-w: #1d436d; --t-f: #2f6042; --t-g: #6c9450; --t-c: #7f9e5e; --t-F: #a8904e; --t-H: #6f5538; --t-n: #9c8d58;
  --t-m: #8fab58; --t-o: #769a52; --t-S: #9c8d6c; --t-N: #94876a; --t-V: #5f8f5e;
  --t-ink: rgba(8, 20, 25, 0.55); --t-roof: #b5543f; --t-own: #e1ebe7; --map-label: #eef5f2; --map-label-edge: rgba(4, 14, 22, 0.8);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
.page { max-width: 1040px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--display); font-style: italic; font-weight: 700; font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-style: italic; font-weight: 700; font-size: 20px; line-height: 1.2; margin: 0; }
.lede { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
button { font: inherit; color: inherit; }
button:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ico { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 10px; background: var(--surface); padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 8px 14px; min-height: 40px; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

.main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .main { grid-template-columns: minmax(0, 1fr); } }
.left, .side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.side { gap: 18px; }

.stage { position: relative; background: var(--sea); border-radius: 14px; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.mapwrap { position: relative; padding: 46px 0 40px; }
.mapwrap svg { display: block; width: 100%; height: auto; }
.tile { cursor: pointer; outline: none; }
.tile polygon.hex { stroke: var(--sea); stroke-width: 1.4; }
.tile .deco { fill: none; stroke: var(--t-ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.tile .solid { fill: var(--t-ink); stroke: none; }
.tile .roof { fill: var(--t-roof); stroke: var(--t-ink); stroke-width: 1.2; }
.tile .ownline { fill: none; stroke: var(--t-own); stroke-width: 1.2; stroke-dasharray: 2 4; opacity: 0.7; pointer-events: none; }
.tile.sel polygon.hex { stroke: var(--map-label); stroke-width: 3.2; }
.tile.dim { opacity: 0.38; }
.tile.ok polygon.hex { stroke: var(--map-label); stroke-width: 2.4; stroke-dasharray: 5 4; }
.tile:focus-visible polygon.hex { stroke: var(--map-label); stroke-width: 3.2; }
.lbl { font-family: var(--body); font-weight: 700; font-size: 9.5px; text-anchor: middle; fill: var(--map-label); stroke: var(--map-label-edge); stroke-width: 2.6; paint-order: stroke; pointer-events: none; }
.mark { fill: var(--map-label); stroke: var(--map-label-edge); stroke-width: 1.2; pointer-events: none; }
.marktxt { font-family: var(--body); font-weight: 700; font-size: 9px; text-anchor: middle; fill: var(--map-label-edge); pointer-events: none; }
.ghost { fill: none; stroke: var(--map-label); stroke-width: 1.8; stroke-dasharray: 4 3; pointer-events: none; }
.ghost.live { fill: rgba(246, 250, 248, 0.3); stroke-dasharray: none; stroke-width: 2.2; }
.pawn { fill: var(--map-label); stroke: var(--map-label-edge); stroke-width: 1.4; pointer-events: none; }

.banner { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 4; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--panel); border-radius: 10px; padding: 6px 6px 6px 12px; box-shadow: 0 2px 10px var(--shadow); }
.banner .txt { flex: 1 1 140px; min-width: 0; font-weight: 500; }
.btn { border: 1px solid var(--edge); background: var(--surface); border-radius: 8px; min-height: 40px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }

/* version A: the ring */
.ring { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.ring button, .ring .hub { position: absolute; width: var(--b); height: var(--b); margin: calc(var(--b) / -2) 0 0 calc(var(--b) / -2); border-radius: 50%; pointer-events: auto; }
.ring button { border: 1px solid var(--edge); background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0;
  box-shadow: 0 2px 8px var(--shadow); }
.ring button:active, .ring button.hot { background: var(--accent); color: var(--on-accent); }
.ring button[aria-disabled="true"] { color: var(--muted); background: var(--panel); box-shadow: none; }
.ring button[aria-disabled="true"] .ico { opacity: 0.5; }
.ring button[aria-disabled="true"]::after { content: ""; position: absolute; left: 22%; right: 22%; top: 50%; border-top: 2px solid var(--bad); transform: rotate(-45deg); }
.ring button.go { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.ring button.sub::before { content: ""; position: absolute; right: 3px; bottom: 3px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.ring .lab { position: absolute; top: calc(100% + 2px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11.5px; font-weight: 700; line-height: 1.2;
  background: var(--panel); color: var(--ink); border-radius: 5px; padding: 1px 5px; pointer-events: none; }
.ring .hub { display: grid; place-items: center; text-align: center; background: var(--panel); color: var(--ink); font-weight: 700; line-height: 1.05; font-size: 15px; box-shadow: 0 2px 8px var(--shadow); pointer-events: none; }
.ring .hub small { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); }
.ring .cap { position: absolute; transform: translateX(-50%); max-width: min(260px, 92%); width: max-content; text-align: center; background: var(--panel); border-radius: 8px;
  padding: 4px 10px; font-size: 14px; font-weight: 500; box-shadow: 0 2px 8px var(--shadow); }
.ring .cap.bad { color: var(--bad); }
.ring.pop button { animation: pop 0.16s ease-out backwards; }
@keyframes pop { from { transform: scale(0.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ring.pop button { animation: none; } }

/* version B: the menu */
.dock { display: flex; gap: 6px; padding: 8px; background: var(--panel); }
.dock button { flex: 1 1 0; min-width: 0; border: 1px solid var(--edge); background: var(--surface); border-radius: 9px; min-height: 46px; padding: 6px 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 7px; font-weight: 700; }
.dock button[aria-expanded="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.menu { position: absolute; left: 8px; bottom: 70px; width: min(340px, calc(100% - 16px)); max-height: calc(100% - 86px); overflow-y: auto; z-index: 5;
  background: var(--panel); border-radius: 12px; box-shadow: 0 6px 22px var(--shadow); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.menu .mh { display: flex; align-items: center; gap: 6px; padding: 2px 2px 4px 8px; }
.menu .mh h2 { flex: 1; font-size: 19px; }
.menu .mh button { border: 0; background: none; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 7px 8px; min-height: 46px; cursor: pointer; }
.row:hover { background: var(--edge); }
.row .nm { flex: 1; min-width: 0; font-weight: 500; line-height: 1.2; }
.row .nm small { display: block; font-weight: 400; font-size: 13.5px; color: var(--muted); }
.row[aria-disabled="true"] { color: var(--muted); }
.row[aria-disabled="true"] .nm small { color: var(--bad); }
.form { display: flex; flex-direction: column; gap: 10px; padding: 4px 8px 8px; }
.form .fl { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.form .seg { flex-wrap: wrap; align-self: flex-start; }
.form .seg button { padding: 6px 10px; display: inline-flex; align-items: center; gap: 5px; }
.stepper { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.stepper b { min-width: 5.5em; text-align: center; }
.warn { color: var(--bad); font-size: 14px; }

.status { min-height: 1.4em; font-weight: 500; }
.status.bad { color: var(--bad); }
.queue { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.queue li { display: flex; align-items: center; gap: 8px; border: 1px solid var(--edge); background: var(--surface); border-radius: 9px; padding: 4px 4px 4px 10px; }
.queue li span { flex: 1; min-width: 0; }
.queue li button { border: 0; background: none; width: 36px; height: 36px; border-radius: 7px; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.empty, .note { color: var(--muted); margin: 6px 0 0; }
.try { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.try b { display: block; }
.try span { color: var(--muted); }
</style>

<div class="page">
  <header>
    <h1>Action menu drafts</h1>
    <p class="lede">You play Ingrid, head of Norrgård in the village of Björkby. Both drafts read the same list of acts and fill the same queue. Nothing here is simulated.</p>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Draft">
      <button type="button" id="vRing" aria-pressed="true">Ring on the tile</button>
      <button type="button" id="vMenu" aria-pressed="false">Menu</button>
    </div>
    <label class="check"><input type="checkbox" id="alderman" checked> Ingrid is alderman</label>
    <label class="check" id="namesWrap"><input type="checkbox" id="names"> Names on the ring</label>
  </div>

  <div class="main">
    <div class="left">
      <div class="stage" id="stage">
        <div class="mapwrap" id="mapwrap">
          <svg id="map" role="group" aria-label="A patch of the map around Björkby"></svg>
          <div class="ring" id="ring"></div>
        </div>
        <div class="banner" id="banner" hidden></div>
        <div class="menu" id="menu" hidden></div>
        <div class="dock" id="dock" hidden></div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
    <div class="side">
      <section>
        <h2 id="queueHead">Ingrid's queue</h2>
        <div id="queue"></div>
      </section>
      <section>
        <h2>Four flows to try</h2>
        <ul class="try" id="try"></ul>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
  // ---- icons: 24 by 24, stroked in currentColor, as the game's own (src/page/icons.js) ----
  const P = {
    walk: '<circle cx="13" cy="4" r="1.8"/><path d="M13 7l-3 5 3 3v5M10 12l-3 1M13 10l3 2 2-1M10 15l-2 5"/>',
    home: '<path d="M4 11l8-7 8 7M6 10v9h12v-9M10 19v-5h4v5"/>',
    idle: '<path d="M19 14.5A8 8 0 1 1 9.5 5a6.5 6.5 0 0 0 9.5 9.5z"/>',
    visit: '<path d="M4 5h16v10H10l-4 4v-4H4z"/>',
    fish: '<path d="M3 12c3-4 8-5 12-2l5-3v10l-5-3c-4 3-9 2-12-2z"/><circle cx="8" cy="11.5" r=".6"/>',
    cause: '<path d="M4 10v4h3l8 4V6l-8 4zM18 9.5a3.5 3.5 0 0 1 0 5M7 14l1 5h2.5l-1-4.5"/>',
    chop: '<path d="M5 20L14 9M12 5l7 7c-2 2-5 2-7 .5l-1.500-1.500C9 9 10 6.500 12 5z"/>',
    hoe: '<path d="M6 21L16 5M16 5l4.500 1.500-2 5-4.500-3"/>',
    sow: '<path d="M12 21v-9M12 12c0-4-3-6-7-6 0 4 3 6 7 6zM12 14c0-3 2.500-5 6.500-5 0 3.500-2.500 5-6.500 5z"/>',
    mow: '<path d="M6 21L15 4M15 4c4 0 6 3 6 7-2-3-5-4-8-3.500"/>',
    build: '<path d="M6 21l7-9M10 5l8 6-2 3-8-6z"/>',
    clear: '<path d="M12 3v10M9 3h6M7 13h10c0 5-2 8-5 8s-5-3-5-8z"/>',
    gift: '<path d="M4 10h16v10H4zM12 10v10M3 7h18v3H3zM12 7c-2-4-6-3-5 0M12 7c2-4 6-3 5 0"/>',
    feast: '<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.500 2-4.500.5 1.500 1 2 2 2.500 0-3 0-5 1-8zM5 21h14"/>',
    commons: '<path d="M4 10l8-6 8 6M6 10v7h12v-7M8 17v4M16 17v4M10 13h4"/>',
    meet: '<circle cx="12" cy="6" r="2.2"/><circle cx="6" cy="16" r="2.2"/><circle cx="18" cy="16" r="2.2"/><path d="M12 8.500v3M8 14.500l2.500-2M16 14.500l-2.500-2"/>',
    pawn: '<circle cx="12" cy="6" r="3"/><path d="M6 21c0-5 2.500-9 6-9s6 4 6 9z"/>',
    back: '<path d="M14 6l-6 6 6 6"/>', next: '<path d="M10 6l6 6-6 6"/>',
    ok: '<path d="M5 12.500l4.500 4.500L19 7"/>', no: '<path d="M6 6l12 12M18 6L6 18"/>',
    plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>',
    rotate: '<path d="M19 12a7 7 0 1 1-2.500-5.400M19 4v4h-4"/>',
    barn: '<path d="M4 20V10l8-6 8 6v10zM9 20v-6h6v6M9 14l6 6M15 14l-6 6"/>',
    store: '<path d="M3 9l9-5 9 5M6 9v11h12V9M10 20v-5h4v5"/>',
    cottage: '<path d="M4 12l8-7 8 7M6 11v9h12v-9M15 6V4h2v4M9 14h3v3H9z"/>',
    fence: '<path d="M5 6v14M12 6v14M19 6v14M3 10h18M3 16h18"/>',
    rye: '<path d="M12 21V9M12 9c-2-1-2-4 0-6 2 2 2 5 0 6zM12 13c-2 0-4-1.500-4-4M12 13c2 0 4-1.500 4-4M12 17c-2 0-4-1.500-4-4M12 17c2 0 4-1.500 4-4"/>',
    barley: '<path d="M12 21V8M12 12c-2 0-4-1.500-4-4V4M12 12c2 0 4-1.500 4-4V4M12 17c-2 0-4-1.500-4-4M12 17c2 0 4-1.500 4-4M12 8V3"/>',
    turnip: '<path d="M12 9c4 0 6 2.500 6 5 0 3-3 4-6 7-3-3-6-4-6-7 0-2.500 2-5 6-5zM12 9c-1-3-3-4-5-4M12 9c1-3 3-4 5-4M12 9V3"/>',
    sack: '<path d="M9 4h6l-1.500 3c3.500 1.500 5.500 5 5.500 8 0 3-2 5-7 5s-7-2-7-5c0-3 2-6.500 5.500-8zM9.500 7h5"/>',
    hay: '<path d="M4 20c0-8 3-14 8-14s8 6 8 14zM9 20c0-4 1-7 3-9"/>',
    wood: '<circle cx="8" cy="16" r="3.500"/><circle cx="16" cy="16" r="3.500"/><circle cx="12" cy="9.500" r="3.500"/>',
    oven: '<path d="M5 20v-8a7 7 0 0 1 14 0v8zM9 20v-4a3 3 0 0 1 6 0v4"/>',
    smithy: '<path d="M4 8h13c0 3-2 4-4 4v3h3v4H7v-4h3v-3C8 12 5 11 4 8zM17 8h3"/>',
    maypole: '<path d="M12 21V4M7 7h10M7 7v4M17 7v4M9 4h6"/>',
    ale: '<path d="M6 7h9v13H6zM15 10h3v6h-3M8 4h5"/>',
    scroll: '<path d="M6 4h10a2 2 0 0 1 2 2v12a2 2 0 0 0 2 2H8a2 2 0 0 1-2-2zM9 8h6M9 12h6"/>',
  };
  const ico = (k) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${P[k] || ''}</svg>`;

  // ---- the map: pointy hexes in offset rows; each letter a kind of tile ----
  const ROWS = ['wwfffww', 'wffoFfw', 'foSHFnw', 'fmocVcN', 'wgccnnx', 'wwNgcxw', 'wwwgfww'];
  const R = 30, HW = Math.sqrt(3) * R, M = 8, VW = M * 2 + HW * 7.5, VH = M * 2 + 2 * R + 1.5 * R * 6;
  const KIND = {
    w: 'Open water', f: 'Wood', x: 'Wood', g: 'Unclaimed grass', c: 'Common land', F: 'Field in stubble', H: 'Hoed field', n: 'Field',
    m: 'Hay meadow', o: 'Open land', S: 'Norrgård', N: '', V: 'The village green',
  };
  const tiles = [];
  ROWS.forEach((row, r) => [...row].forEach((ch, q) => {
    const type = ch === 'x' ? 'f' : ch;
    let owner = null;
    if ('SFHmo'.includes(ch) || (ch === 'f' && q <= 2 && r <= 3)) owner = 'Norrgård';
    else if (ch === 'x' || ch === 'n') owner = 'Sörgård';
    else if (ch === 'N') owner = r === 3 ? 'Sörgård' : 'Östergård';
    else if ('cVf'.includes(ch)) owner = 'Björkby';
    const t = { i: tiles.length, q, r, type, owner, x: M + HW * (q + 0.5 * (r & 1)) + HW / 2, y: M + R + 1.5 * R * r };
    t.name = type === 'N' ? `${owner}, a neighbour's farm` : type === 'S' ? 'Norrgård, your farm' : type === 'V' ? 'The village green of Björkby'
      : type === 'w' || type === 'g' ? KIND[type] : `${KIND[type]}, ${owner === 'Björkby' ? "Björkby's" : owner + "'s"}`;
    t.short = type === 'N' || type === 'S' ? owner : type === 'V' ? 'the green' : `${KIND[type].toLowerCase()} ${q + 1}·${r + 1}`;
    tiles.push(t);
  }));
  const farms = tiles.filter((t) => t.type === 'N');

      if (t.type === 'S') s += '<circle class="pawn" cx="-17" cy="-1" r="3.2"/><path class="pawn" d="M-22 10c0-5 2-7 5-7s5 2 5 7z"/>';
      if (t.type === 'S' || t.type === 'N') s += `<text class="lbl" y="25">${t.owner}</text>`;
      if (t.type === 'V') s += '<text class="lbl" y="25">Green</text>';
      if (count[t.i]) s += `<circle class="mark" cx="17" cy="-15" r="6.5"/><text class="marktxt" x="17" y="-12">${count[t.i]}</text>`;
      s += '</g>';
    }
    const svg = $('map');
    svg.setAttribute('viewBox', `0 0 ${VW.toFixed(1)} ${VH.toFixed(1)}`);
    svg.innerHTML = s;
  }
  function drawQueue() {
    $('queueHead').textContent = `Ingrid's queue, ${S.queue.length} of ${QUEUE_MAX}`;
    $('queue').innerHTML = S.queue.length ? `<ol class="queue">${S.queue.map((c, j) =>
      `<li>${ico(c.icon)}<span>${esc(c.text)}</span><button type="button" data-k="q${j}" aria-label="Remove: ${esc(c.text)}" ${h(() => { S.queue.splice(j, 1); })}>${ico('no')}</button></li>`).join('')}</ol>`
      : '<p class="empty">Empty. Commands wait here in turn, as in the game: each is checked again when its turn comes.</p>';
  }
  const TRY = {
    ring: [
      ['One tile, one tap', 'Tap a wood west of Norrgård, then the axe. Tap Sörgård\'s wood in the east to see a refusal.'],
      ['A kind and a place', 'Tap the open land beside Norrgård, then Build. A second ring holds the kinds, a third turns and places the foundation.'],
      ['A neighbour and an amount', 'Tap Sörgård, then Give. The ring becomes the goods, then a counter around the amount.'],
      ['The village', 'Tap the green. Building commons from there asks for the site next. Untick alderman to see what a villager is told.'],
    ],
    menu: [
      ['One verb, many tiles', 'Household, Chop wood, then tap wood after wood. The tool stays in hand until Done.'],
      ['A kind and a place', 'Household, Build, Barn. The map lights the land that will take it. Tap, turn, place.'],
      ['A neighbour and an amount', 'Household, Give. One form holds who, what and how much, with the warning beside it.'],
      ['The village', 'Village lists the alderman\'s acts with no tile needed. Untick alderman and each row says why not.'],
    ],
  };
  function render() {
    const act = document.activeElement, keep = act && act.dataset ? act.dataset.k : null;
    H = [];
    drawMap(); drawBanner(); drawDock(); drawRing(); drawQueue();
    $('vRing').setAttribute('aria-pressed', S.version === 'ring');
    $('vMenu').setAttribute('aria-pressed', S.version === 'menu');
    $('namesWrap').hidden = S.version !== 'ring';
    $('names').checked = S.names;
    const st = $('status'), idle = S.version === 'ring' ? 'Tap a tile to see what Ingrid may do there.' : 'Open a group under the map, or tap a tile to read it.';
    st.textContent = S.msg ? S.msg.text : S.sel ? S.sel.name : idle;
    st.classList.toggle('bad', !!(S.msg && S.msg.bad));
    $('try').innerHTML = TRY[S.version].map(([b, t]) => `<li><b>${b}</b><span>${t}</span></li>`).join('');
    if (keep) { const el = document.querySelector(`[data-k="${keep}"]`); if (el && el.focus) el.focus({ preventScroll: true }); }
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-h]');
    if (el) { const fn = H[+el.dataset.h]; S.msg = null; S.cap = null; if (fn) fn(); render(); return; }
    if (e.target.closest('#mapwrap')) {   // the sea: put the ring away, unless the map waits for a tile
      if (S.flow && (S.flow.stage === 'tool' || S.flow.stage === 'pick' || S.flow.stage === 'confirm')) return;
      S.sel = null; S.flow = null; S.menu = null; S.msg = null; render();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { S.flow = null; S.menu = null; S.sel = null; S.msg = null; render(); }
    else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tile')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  const setVersion = (v) => { S.version = v; S.flow = null; S.menu = null; S.sel = null; S.msg = null; render(); };
  $('vRing').addEventListener('click', () => setVersion('ring'));
  $('vMenu').addEventListener('click', () => setVersion('menu'));
  $('alderman').addEventListener('change', (e) => { S.alderman = e.target.checked; S.flow = null; S.msg = null; render(); });
  $('names').addEventListener('change', (e) => { S.names = e.target.checked; render(); });
  window.addEventListener('resize', render);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  render();
})();
</script>
