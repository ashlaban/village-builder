<!doctype html>
<!-- Mock, fourth round (16 Nov 2026; earlier rounds: supply-meter.html, supply-seasons.html). Throwaway: the numbers are invented, nothing
     here is game code. Settled with Kim: season by season; the frame rolls forward a season at a time and starts at the season we are in
     (no history); hay, and what else is needed in one season only, is one wide cell for that season; an i opens the numbers; firewood's
     "still to come" is the household plan's goal. This round: the weakest-season chips in a village's farm rows, beside today's dot, and
     three ways to show the head's doubt (principle 14: what is ahead is a pawn's estimate, a centre and a range). -->
<html lang="en">
<meta charset="utf-8">
<title>Supply component: chips in the farm rows, and the head's doubt three ways</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@1,700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #17313a; --muted: #526d75; --edge: rgba(23, 49, 58, 0.14); --accent: #23685a; --good: #2f7a4b; --bad: #a8432f; --gold: #b3862c;
    --panel: #eef5f2; --track: rgba(23, 49, 58, 0.13); }
  body { margin: 0; padding: 28px; background: #6f9a7c; font: 15px/1.4 'Alegreya Sans', 'Gill Sans', system-ui, sans-serif; color: var(--ink); }
  .wrap { display: grid; grid-template-columns: repeat(2, 520px); gap: 24px; align-items: start; }
  .card { background: var(--panel); border-radius: 16px; padding: 16px 18px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); }
  h1 { margin: 0 0 2px; font: italic 700 22px/1.2 'Alegreya', Georgia, serif; }
  .sub { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .whose { margin: 10px 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .row { display: grid; grid-template-columns: 22px 62px 216px 1fr 26px; gap: 7px; align-items: center; min-height: 40px; }
  svg.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: var(--accent); }
  .name { color: var(--muted); font-size: 13px; line-height: 1.15; }
  .state { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .state.safe { color: var(--good); } .state.warn { color: var(--gold); } .state.bad { color: var(--bad); }
  .state svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .more { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--edge); background: #fbfdfc; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
  .more svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  svg.bar { width: 216px; display: block; overflow: visible; }
  .key { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; padding-top: 9px; border-top: 1px solid var(--edge); font-size: 12.5px; color: var(--muted); }
  .key span { display: inline-flex; align-items: center; gap: 5px; } .key svg { width: 26px; height: 12px; overflow: visible; }
  .note { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  h2 { margin: 14px 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .farm { display: flex; align-items: center; gap: 8px; min-height: 42px; border-top: 1px solid var(--edge); }
  .farm:first-of-type { border-top: 0; }
  .farm .who { flex: 1; line-height: 1.2; } .farm .who i { display: block; font-style: normal; font-size: 13px; color: var(--muted); }
  .farm .st { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; } .dot.warn { background: var(--gold); } .dot.bad { background: var(--bad); }
  .chip { display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px 1px 4px; border-radius: 99px; border: 1.5px solid; }
  .chip svg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .two { display: grid; grid-template-columns: 1fr; gap: 4px; }
</style>
<body>
<div class="wrap" id="wrap"></div>
<script>
// Time in seasons from the start of the season we are in (0) to the frame's end (6). own: how long the store lasts on its own. in: when
// more is laid in. with: [low, centre, high], how long store and intake last together, spoilage off; lost: the time spoilage takes off
// the end of that run. A one-season supply (hay) is one wide cell: its numbers are shares of that season's need.
const N = 4, W = 216, CW = W / N, FIRST = 1; // four seasons ahead (Kim, 16 Nov: will they make it through the year); the frame starts in summer
const ICON = {
  food: '<path d="M4 11h16a8 8 0 0 1-16 0zM9 19.5V21h6v-1.5M12 3v5M8.5 5v3M15.5 5v3"/>',
  wood: '<circle cx="7" cy="16" r="3.5"/><circle cx="17" cy="16" r="3.5"/><circle cx="12" cy="8.5" r="3.5"/>',
  hay: '<path d="M4 20c0-8 3-14 8-14s8 6 8 14zM9 20c0-4 1-7 3-9"/>',
  farm: '<path d="M4 11l8-7 8 7M6 10v9h12v-9M10 19v-5h4v5"/>',
};
// Spoilage is inside the projection (Kim, 16 Nov): the run "with" is net of it, and its doubt is part of the head's range; the amount
// is among the numbers behind the i. "with" counts every intake the plan expects within the frame.
const SURE = [
  { name: 'Food', icon: ICON.food, own: 2.3, in: [1.1, 1.5], with: [3.3, 3.7, 4.3], lost: 0, state: ['warn', 'short in spring'] },
  { name: 'Firewood', icon: ICON.wood, own: 1.8, in: [0, 1.7], with: [3.7, 4.6, 5], lost: 0, state: ['safe', 'safe'] },
  { name: 'Hay', icon: ICON.hay, one: 2, own: 0.3, in: [0.1, 0.3], with: [0.7, 0.85, 0.95], lost: 0, state: ['bad', 'short in winter'] },
];
// the same household under a poorer head: the same centres, a wider range
const UNSURE = SURE.map((r) => ({ ...r, with: r.one !== undefined ? [0.45, 0.85, 1.2] : r.name === 'Food' ? [2.5, 3.7, 4.6] : [2.8, 4.6, 5] }));
const SEASON = [
  '<path d="M7 13V6M7 8C5 8 3.5 6.5 3.5 4.5 5.5 4.5 7 6 7 8zM7 6.5c0-2 1.5-3.5 3.5-3.5 0 2-1.5 3.5-3.5 3.5z"/>',
  '<circle cx="7" cy="7" r="2.6"/><path d="M7 1v1.5M7 11.5V13M1 7h1.5M11.500 7H13M2.8 2.8l1 1M10.2 10.2l1 1M11.2 2.8l-1 1M3.8 10.2l-1 1"/>',
  '<path d="M3 11c0-5 3-8 8-8 0 5-3 8-8 8zM3 11l5-5M2 12l1-1"/>',
  '<path d="M7 1v12M1.8 4l10.4 6M12.2 4L1.8 10M5.5 2L7 3.5 8.5 2M5.5 12L7 10.5 8.5 12"/>',
];
const sIcon = (k, x0, y0, o = 1) => `<g transform="translate(${x0} ${y0})" fill="none" stroke="#526d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="${o}">${SEASON[(k + FIRST) % 4]}</g>`;
const defs = `<defs>
  <pattern id="spoil" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#eef5f2"/><rect width="2.4" height="5" fill="#a8432f"/></pattern>
  <pattern id="come" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#dfeae6"/><rect width="2.2" height="6" fill="#23685a" opacity=".75"/></pattern>
  <pattern id="thin" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#e6efec"/><rect width=".9" height="6" fill="#23685a" opacity=".6"/></pattern>
  <linearGradient id="fadeout" x1="0" x2="1"><stop offset="0" stop-color="#eef5f2" stop-opacity="0"/><stop offset="1" stop-color="#e1e9e6" stop-opacity="1"/></linearGradient>
</defs>`;
// The cells a row is drawn in: six a season's wide, or one wide cell for a one-season supply (after that season's icon).
const cellsOf = (r) => (r.one !== undefined ? [{ k: 0, x0: 22, cw: W - 24 }] : [0, 1, 2, 3].map((k) => ({ k, x0: k * CW + 2, cw: CW - 4 })));
// A stretch of time t0 to t1 drawn in every cell it crosses.
const span = (r, t0, t1, attrs, h = 18, y = 0) => cellsOf(r).map(({ k, x0, cw }) => {
  const a = Math.max(0, Math.min(1, t0 - k)), b = Math.max(0, Math.min(1, t1 - k));
  return b - a > 0.005 ? `<rect x="${x0 + cw * a}" y="${y}" width="${cw * (b - a)}" height="${h}" ${attrs}/>` : '';
}).join('');
const xAt = (r, t) => { const c = cellsOf(r), k = Math.min(c.length - 1, Math.max(0, Math.floor(t))); return c[k].x0 + c[k].cw * Math.max(0, Math.min(1, t - k)); };
const end = (r) => (r.one !== undefined ? 1 : N);
// The base every idea shares: the track (red-framed where the centre does not cover it), the store solid, and the bracket of the intake.
function base(r, upto) {
  const short = (k) => upto + r.lost < k + 0.98;
  return cellsOf(r).map(({ k, x0, cw }) => `<rect x="${x0}" y="0" width="${cw}" height="18" rx="4" fill="${short(k) ? '#f6e4de' : 'var(--track)'}" stroke="${short(k) ? '#a8432f' : 'none'}" stroke-width="1.3"/>`).join('');
}
const own = (r) => span(r, 0, r.own, 'rx="4" fill="#23685a"');
const spoil = (r, at) => span(r, at, at + r.lost, 'fill="url(#spoil)"');
const comes = (r) => `<path d="M${xAt(r, r.in[0])} -2v-4H${xAt(r, r.in[1])}v4" fill="none" stroke="#17313a" stroke-width="1.3"/>`;
const lead = (r) => (r.one !== undefined ? sIcon(r.one, 0, 2) : '');
const svg = (body, h = 38, top = -12) => `<svg class="bar" viewBox="0 ${top} ${W} ${h}" height="${h}">${defs}${body}</svg>`;

// 0. No doubt shown (as settled): the centre only.
const plain = (r) => svg(lead(r) + base(r, r.with[1]) + span(r, 0, r.with[1], 'rx="4" fill="url(#come)"') + spoil(r, r.with[1]) + own(r) + comes(r));
// 1. A soft end: the striped run is firm as far as the head is sure of, and fades out over its doubt. No new mark to learn.
const soft = (r) => {
  const [lo, mid, hi] = r.with, x0 = xAt(r, lo), x1 = xAt(r, Math.min(hi, end(r)));
  return svg(lead(r) + base(r, mid) + span(r, 0, Math.min(hi, end(r)), 'rx="4" fill="url(#come)"') + spoil(r, mid) +
    `<rect x="${x0}" y="-1" width="${Math.max(0, x1 - x0)}" height="20" fill="url(#fadeout)"/>` + own(r) + comes(r));
};
// 2. A whisker: a line under the cells from the worst the head expects to the best, a dot at the likeliest.
const whisker = (r) => {
  const [lo, mid, hi] = r.with;
  return svg(lead(r) + base(r, mid) + span(r, 0, mid, 'rx="4" fill="url(#come)"') + spoil(r, mid) + own(r) + comes(r) +
    `<line x1="${xAt(r, lo)}" x2="${xAt(r, Math.min(hi, end(r)))}" y1="23" y2="23" stroke="#17313a" stroke-width="1.5"/>
     <path d="M${xAt(r, lo)} 20v6M${xAt(r, Math.min(hi, end(r)))} 20v6" stroke="#17313a" stroke-width="1.5"/><circle cx="${xAt(r, Math.min(mid, end(r)))}" cy="23" r="3" fill="#17313a"/>`);
};
// 3. Three weights: dense stripes for what holds even in a bad year, thin stripes for what is likely, an outline for what a good year adds.
const weights = (r) => {
  const [lo, mid, hi] = r.with;
  return svg(lead(r) + base(r, mid) + span(r, 0, lo, 'rx="4" fill="url(#come)"') + span(r, lo, mid, 'fill="url(#thin)"') + spoil(r, mid) +
    span(r, mid + r.lost, Math.min(hi, end(r)), 'fill="none" stroke="#23685a" stroke-width="1.2" stroke-dasharray="2 2"', 14, 2) + own(r) + comes(r));
};
const header = `<div class="row" style="min-height:22px"><i></i><i></i>${svg([0, 1, 2, 3].map((k) => sIcon(k, k * CW + CW / 2 - 7, -8)).join(''), 20, -10)}<i></i><i></i></div>`;
const CHECK = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>', WARN = '<svg viewBox="0 0 16 16"><path d="M8 3v6M8 12.5v.01"/></svg>';
const state = (s) => `<span class="state ${s[0]}">${s[0] === 'safe' ? CHECK : WARN}${s[1]}</span>`;
const more = '<span class="more" title="The numbers"><svg viewBox="0 0 16 16"><path d="M8 7.2v4.3M8 4.4v.01"/></svg></span>';
const row = (r, draw) => `<div class="row"><svg class="ico" viewBox="0 0 24 24">${r.icon}</svg><span class="name">${r.name}</span>${draw(r)}${state(r.state)}${more}</div>`;
const block = (title, rows, draw) => `<p class="whose">${title}</p>${header}${rows.map((r) => row(r, draw)).join('')}`;

// ---- the farm rows: today's dot, and the weakest-season chips ----
const chip = (icon, k, tone) => { const col = k === null ? '#2f7a4b' : tone === 'bad' ? '#a8432f' : '#b3862c';
  return `<span class="chip" style="color:${col}"><svg viewBox="0 0 24 24" width="15" height="15" stroke-width="1.9">${icon}</svg>${k === null
    ? '<svg viewBox="0 0 16 16" width="12" height="12" stroke-width="2.4"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>'
    : `<svg viewBox="0 0 14 14" width="14" height="14" stroke-width="1.4">${SEASON[k]}</svg>`}</span>`; };
const FARMS = [
  ['Mellangården', 'Held by Gunnar Håkansson', 3, ['', 'Fed'], [[ICON.food, 1, 'warn'], [ICON.wood, null], [ICON.hay, 3, 'bad']]],
  ['Norrgården', 'Held by Torsten Olofsson', 7, ['', 'Fed'], [[ICON.food, null], [ICON.wood, null], [ICON.hay, null]]],
  ['Östergården', 'Held by Sven Ivarsson', 9, ['warn', 'Short of food'], [[ICON.food, 0, 'bad'], [ICON.wood, 3, 'warn'], [ICON.hay, null]]],
  ['Lunden', 'Held by Jöns Eriksson', 6, ['', 'Fed'], [[ICON.food, null], [ICON.wood, 3, 'bad'], [ICON.hay, 3, 'warn']]],
];
const PEOPLE = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2.5-7 6-7s6 3 6 7M15.5 5.5a2.5 2.5 0 1 1 0 5M17.5 13.5c2 .7 3.5 3 3.5 6.5"/></svg>';
// with the chips: the people as an icon and a number; a chip only for a supply about to fall short, none for one that is safe
const farm = (f, chips) => `<div class="farm"><svg class="ico" viewBox="0 0 24 24">${ICON.farm}</svg><span class="who">${f[0]}<i>${f[1]}</i></span>
  <span class="st">${chips ? `${f[4].filter((c) => c[1] !== null).map((c) => chip(...c)).join('')}<span style="display:inline-flex;align-items:center;gap:3px;margin-left:4px" title="${f[2]} people">${PEOPLE}${f[2]}</span>`
    : `<i class="dot ${f[3][0]}"></i>${f[2]} people · ${f[3][1]}`}</span></div>`;

const K = {
  own: '<span><svg viewBox="0 0 26 12"><rect y="1" width="26" height="10" rx="4" fill="#23685a"/></svg>the store</span>',
  come: `<span><svg viewBox="0 0 26 12">${defs}<rect y="1" width="26" height="10" rx="4" fill="url(#come)"/></svg>still to come</span>`,
  spoil: `<span><svg viewBox="0 0 26 12">${defs}<rect y="1" width="26" height="10" fill="url(#spoil)"/></svg>lost to spoilage</span>`,
  short: '<span><svg viewBox="0 0 26 12"><rect x=".7" y="1.7" width="24.6" height="8.6" rx="3" fill="#f6e4de" stroke="#a8432f" stroke-width="1.3"/></svg>not covered</span>',
  when: '<span><svg viewBox="0 0 26 12"><path d="M4 10V6h18v4" fill="none" stroke="#17313a" stroke-width="1.3"/></svg>when it is laid in</span>',
};
const ideas = (title, sub, draw, key, note) => `<div class="card"><h1>${title}</h1><p class="sub">${sub}</p>
  ${block('Gunnar, a good head: sure of it', SURE, draw)}${block('The same farm under a poor head: unsure', UNSURE, draw)}
  <div class="key">${key}</div><p class="note">${note}</p></div>`;
const whiskerKey = '<span><svg viewBox="0 0 26 12"><path d="M2 6h22M2 3v6M24 3v6" stroke="#17313a" stroke-width="1.5" fill="none"/><circle cx="13" cy="6" r="3" fill="#17313a"/></svg>worst, likeliest, best</span>';
const softKey = `<span><svg viewBox="0 0 26 12">${defs}<rect y="1" width="26" height="10" fill="url(#come)"/><rect y="0" width="26" height="12" fill="url(#fadeout)"/></svg>the head's doubt</span>`;
document.getElementById('wrap').innerHTML = `
  ${ideas('The supply component', 'Four seasons ahead, from the season we are in: will they make it through the year. Spoilage is inside the projection; the line under the cells is the head\'s doubt about the outcome.', whisker,
    [K.own, K.come, K.short, K.when, whiskerKey].join(''), 'A red frame is a season the likeliest outcome does not cover. Where the whisker reaches into a red cell, a good year would cover it; where it stops short of a full one, a bad year would not.')}
  ${ideas('The same, with a soft end', 'For comparison: the doubt as a fade at the end of the striped run, with no line under the cells.', soft,
    [K.own, K.come, K.short, K.when, softKey].join(''), 'A row lower in height. The poor head\'s doubt is a long fade; the good head\'s is easy to miss.')}
  <div class="card" style="grid-column: 1 / -1; max-width: 520px"><h1>The farm rows</h1><p class="sub">The people as an icon and a number. A chip only for a supply about to fall short: the supply and the first season it is short in (gold: a little; red: badly). A farm with nothing to worry about shows no chip.</p>
    <div class="two"><div><h2>Today</h2>${FARMS.map((f) => farm(f, false)).join('')}</div>
    <div><h2>With the chips</h2>${FARMS.map((f) => farm(f, true)).join('')}</div></div></div>`.replace(/(\.\d)00\b/g, '$1');
</script>
</body>
</html>
