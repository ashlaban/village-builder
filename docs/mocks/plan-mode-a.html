<!doctype html>
<!-- Mock (17 Nov 2026), plan mode, variation A of three: a screen of its own, the season as a board of hands. For VB-1026, after Kim's
     answers of 17 November; it supersedes plan-mode.html on two points: hands are shown member by member, and icons and the one meter
     stand where that mock had sentences. Throwaway: the numbers are invented and nothing here is game code. The icons' paths are copied
     from src/page/icons.js and the meter from src/page/meter.js; one glyph is new (a tick, for a window kept), and the five diamonds
     of a made good's grade.
     The form: the game's map is left behind for a full screen. The middle is the season, a lane a member: the grey band at a lane's
     foot is the share of each day the chores take, the bars above are the routines in those hands, a dashed line is a window's end.
     Under each lane, a card a routine: the member who has it (skill on the meter, striped for what the season adds, the days of work)
     and, faded, what it would be in the other's hands, with the arrow that moves it. What does not fit is the one red box, with why
     and what to change. Left: the head's changes against the custom's plan, the targets, what came of the last plan. Right: the land,
     as an inset of the map and a list. Every estimate carries the wits icon: it is Torsten's, by his judgement (principle 14).
     Same household in all three (Norrgården, year 3, spring: Torsten 32 and Märta 29, four fields, six meadows, the maid gone in
     winter). Switch between "The custom's plan" and "Your plan" at the top; ?view=custom opens on the first. Drawn for 1440 by 900. -->
<html lang="en">
<meta charset="utf-8">
<title>Plan mode A: a screen of its own, the season as a board of hands</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@1,700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>

<script>

const PEOPLE = {
  a: `<span class="who off">${face('a')}Astrid<small>left in ${seasonIc(3, 13)}winter</small></span>`,
  k: `<span class="who off">${face('k')}Karin, 14<small>joins in ${seasonIc(1, 13)}summer</small></span>`,
  round: `<span class="who link">${face('ask')}${ic('round', 16)}Ask for a hand<small>the moving round, ${seasonIc(2, 13)}autumn</small></span>`,
  match: `<span class="who off">${face('ask')}${ic('married', 16)}A match<small>no one here unwed</small></span>`,
};
// the top bar's pieces: whose estimates these are, the reminder's switch, the two plans, the way out
const whoseHTML = () => `<span class="whose">${est(14)}marks what Torsten reckons<small>· his judgement</small>${meter({ value: 58, title: 'his judgement (wits)' })}</span>`;
const segHTML = () => `<span class="seg" role="group" aria-label="Which plan"><button type="button" data-view="custom">The custom’s plan</button><button type="button" data-view="mine">Your plan</button></span>`;
const bellHTML = () => `<button type="button" class="icon" title="Remind me when a plan is due: on" aria-pressed="true" style="color:var(--accent)">${bellIc(18)}</button>`;
// the switch between the custom's plan and the head's: `draw(view)` is each variation's own
function start(draw) {
  const show = (view) => {
    document.body.className = view;
    draw(view);
    document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
  };
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) show(b.dataset.view); });
  show(new URLSearchParams(location.search).get('view') === 'custom' ? 'custom' : 'mine');
}
// ======== this variation's own drawing ========
document.getElementById('top').innerHTML = `<div><h1>The spring plan at Norrgården</h1><div class="when">${seasonIc(0)}Year 3, spring, day 1 · paused</div></div>` +
  whoseHTML() + segHTML() + bellHTML() + `<button type="button" class="primary">${ic('tick', 15)}Go on with this plan</button>`;
document.getElementById('chgH').innerHTML = `${ic('plan', 15)}Your changes to the custom’s plan`;
document.getElementById('tgtH').innerHTML = `${ic('sack', 15)}Targets`;
document.getElementById('lastH').innerHTML = `${seasonIc(3)}What came of the winter’s plan`;
document.getElementById('last').innerHTML = lastHTML();
const STATE = { ok: (w) => `<span class="st good">${ic('tick', 14)}</span>`, late: (w) => `<span class="st bad">${w}</span>`, short: (w) => `<span class="st bad">${w}</span>`,
  slip: (w) => `<span class="st bad">${w}</span>`, none: (w) => `<span class="st bad">${w}</span>` };
function card(view, k, m) {
  const V = PLAN[view], [st, w] = V.state[k], o = m === 't' ? 'm' : 't';
  return `<div class="card${V.changed[k] ? ' mine' : ''}${st !== 'ok' ? ' bad' : ''}"><div class="ct">${ic(JOB[k].ic, 18)}${JOB[k].n}${STATE[st](w)}</div>${hand(k, m, true)}` +
    `<div class="alt">${hand(k, o, false)}<button type="button" class="icon" title="give it to ${MEM[o].n}">${ic('next', 13)}</button></div></div>`;
}
function member(view, m) {
  const order = ['manure', 'sow', 'brew', 'rake', 'clear', 'fish'].filter((k) => PLAN[view].who[k] === m);
  return `<div><div class="mh">${face(m)}<b class="n">${MEM[m].n}</b><span class="muted">${MEM[m].age}</span>${budget(view, m)}</div>${lane(view, m, 66, true)}` +
    `<div class="cards">${order.map((k) => card(view, k, m)).join('')}</div></div>`;
}
function draw(view) {
  document.getElementById('changes').innerHTML = changesHTML(view);
  document.getElementById('targets').innerHTML = targetsHTML(view);
  document.getElementById('board').innerHTML =
    `<div class="bh"><h1>The season, hand by hand</h1><div class="key"><span><u class="fill"></u>skill</span><span><u class="grow"></u>grows to</span>` +
    `<span><u class="ch"></u>daily chores</span><span>${est()}work, in days</span></div></div>` +
    `<div class="days12">${Array.from({ length: 12 }, (_, k) => `<span>${k + 1}</span>`).join('')}</div>` +
    member(view, 't') + member(view, 'm') + unfitHTML(view) +
    `<div><h2>${ic('people', 15)}The household’s hands</h2><div class="people">${PEOPLE.a}${PEOPLE.k}${PEOPLE.round}${PEOPLE.match}</div></div>`;
  const M = drawMap(view, { big: true }), mine = view === 'mine';
  const tl = (k, n, w, pick) => { const L = LAND[k]; return `<div class="tl${pick ? ' pick' : ''}"><span class="sw" style="background:${L.fill.replace(/,\.\d+\)/, ',.9)')}"></span>` +
    `<span class="c">${ic('soil', 14)}${meter({ value: L.soil })}</span><span class="c">${est(11)}${ic('grain', 14)}${range(L)}</span><b>${L.y}</b><span class="c muted">${ic('walk', 13)}${w}</span></div>`; };
  document.getElementById('land').innerHTML = `<h2>${ic('field', 15)}The land: where a field could go</h2>` +
    `<div class="inset"><div class="in"><svg class="map" viewBox="0 0 1440 900">${M.svg}</svg></div></div>` + tileKey() +
    tl('best', 2, '3–4', mine) + tl('fair', 8, '1–4') + tl('poor', 3, '3–4') +
    REFUSED.map(([, , why]) => `<div class="tl no">${ic('no', 13)}<span>${why}: no field here</span></div>`).join('') +
    `<h2 class="only-mine">${ic('tile', 15)}Field 5, chosen</h2><div class="only-mine">${chosenHTML()}</div>` +
    `<h2>${ic('home', 15)}Norrgården’s land</h2><div class="lands"><span>4 ${ic('field', 17)}${ic('hoe', 15)}${ic('sow', 15)}${mini(view, 'sow')}</span><span>6 ${ic('meadow', 17)}${ic('rake', 15)}${mini(view, 'rake')}</span></div>`;
}
start(draw);
</script>
</body>
</html>
