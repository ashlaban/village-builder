<!doctype html>
<!-- Mock (16 Nov 2026, after VB-664): the supply component, three variations. Throwaway: the numbers are invented, nothing here is game code.
     One scale for every supply: years of the household's need. Three parts: in store now, what the head expects to lose to spoilage,
     and what the head expects to hold after the next harvest (principle 14: the future is the head's estimate, so it has a range). -->
<html lang="en">
<meta charset="utf-8">
<title>Supply component: three variations</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@1,700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #17313a; --muted: #526d75; --edge: rgba(23, 49, 58, 0.14); --accent: #23685a; --good: #2f7a4b; --bad: #a8432f; --gold: #b3862c;
    --panel: #eef5f2; --track: rgba(23, 49, 58, 0.13); }
  body { margin: 0; padding: 28px; background: #6f9a7c; font: 15px/1.4 'Alegreya Sans', 'Gill Sans', system-ui, sans-serif; color: var(--ink); }
  .wrap { display: grid; grid-template-columns: repeat(3, 440px); gap: 24px; align-items: start; }
  .card { background: var(--panel); border-radius: 16px; padding: 16px 18px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); }
  h1 { margin: 0 0 2px; font: italic 700 22px/1.2 'Alegreya', Georgia, serif; }
  .sub { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  .whose { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .row { display: grid; grid-template-columns: 22px 66px 1fr 74px; gap: 8px; align-items: center; min-height: 40px; margin-bottom: 4px; }
  .row svg.ico { width: 20px; height: 20px; color: var(--accent); fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .row.warn svg.ico { color: var(--gold); } .row.bad svg.ico { color: var(--bad); }
  .name { color: var(--muted); font-size: 13px; }
  .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .val small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  svg.bar { width: 100%; display: block; overflow: visible; }
  .axis { display: grid; grid-template-columns: 22px 66px 1fr 74px; gap: 8px; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .axis div { position: relative; height: 14px; } .axis span { position: absolute; transform: translateX(-50%); }
  .key { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--edge); font-size: 12.5px; color: var(--muted); }
  .key span { display: inline-flex; align-items: center; gap: 5px; } .key svg { width: 26px; height: 10px; }
  .note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
</style>
<body>
<div class="wrap" id="wrap"></div>
<script>
// Years of the household's need. now: in store. loss: [low, centre, high] the head expects to spoil before the next harvest.
// after: [low, centre, high] what the head expects to hold just after the next harvest (now, less what is eaten and spoilt, plus the crop).
// eaten: years of need used up before that harvest comes in. mark: the head's target.
const ROWS = [
  { key: 'food', name: 'Food', now: 1.7, loss: [0.1, 0.18, 0.3], eaten: 0.5, after: [1.7, 2.1, 2.5], mark: 1.5, tone: '', icon: '<path d="M4 11h16a8 8 0 0 1-16 0zM9 19.5V21h6v-1.5M12 3v5M8.5 5v3M15.5 5v3"/>' },
  { key: 'wood', name: 'Firewood', now: 0.6, loss: [0, 0, 0], eaten: 0.45, after: [0.9, 1.1, 1.3], mark: 1, tone: 'warn', icon: '<circle cx="7" cy="16" r="3.5"/><circle cx="17" cy="16" r="3.5"/><circle cx="12" cy="8.5" r="3.5"/>' },
  { key: 'hay', name: 'Hay', now: 0.35, loss: [0.02, 0.05, 0.1], eaten: 0.3, after: [0.7, 1.05, 1.4], mark: 1, tone: 'bad', icon: '<path d="M4 20c0-8 3-14 8-14s8 6 8 14zM9 20c0-4 1-7 3-9"/>' },
];
const MAX = 3, W = 220; // the scale: 0 to 3 years of need
const x = (v) => (Math.min(MAX, Math.max(0, v)) / MAX) * W;
const col = (r) => (r.tone === 'bad' ? 'var(--bad)' : r.tone === 'warn' ? 'var(--gold)' : 'var(--accent)');
const defs = `<defs>
  <pattern id="spoil" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#eef5f2"/><rect width="2.4" height="5" fill="#a8432f"/></pattern>
  <pattern id="ghost" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="none"/><rect width="1.6" height="6" fill="#23685a" opacity=".55"/></pattern>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#a8432f" stop-opacity=".9"/><stop offset="1" stop-color="#a8432f" stop-opacity=".15"/></linearGradient>
</defs>`;
const ticks = (h, y0 = 0) => [1, 2].map((t) => `<line x1="${x(t)}" x2="${x(t)}" y1="${y0 - 3}" y2="${y0 + h + 3}" stroke="#526d75" stroke-width="1" opacity=".55"/>`).join('');
const mark = (r, h, y0 = 0) => `<path d="M${x(r.mark) - 4} ${y0 - 6}h8l-4 5z" fill="#17313a"><title>The head's target: ${r.mark} years</title></path>`;
const yrs = (v) => `${v.toFixed(1)} y`;

// A: one bar. Solid: in store now. Hatched red at its end: what the head expects to spoil, fading over the range. Striped outline beyond:
// what the head expects to hold after the next harvest, with a whisker for its range.
function barA(r) {
  const h = 10, keep = r.now - r.loss[1];
  return `<svg class="bar" viewBox="-2 -8 ${W + 4} 30" height="30">${defs}
    <rect x="0" y="0" width="${W}" height="${h}" rx="5" fill="var(--track)"/>
    <rect x="0" y="0" width="${x(r.after[1])}" height="${h}" rx="5" fill="url(#ghost)" stroke="#23685a" stroke-opacity=".55" stroke-dasharray="3 2"/>
    <rect x="0" y="0" width="${x(r.now)}" height="${h}" rx="5" fill="${col(r)}"/>
    ${r.loss[2] ? `<rect x="${x(r.now - r.loss[2])}" y="0" width="${x(r.loss[2])}" height="${h}" fill="url(#spoil)" opacity=".35"/>
    <rect x="${x(keep)}" y="0" width="${x(r.loss[1])}" height="${h}" fill="url(#spoil)"/>` : ''}
    <line x1="${x(r.after[0])}" x2="${x(r.after[2])}" y1="${h + 6}" y2="${h + 6}" stroke="#23685a" stroke-width="1.5"/>
    <circle cx="${x(r.after[1])}" cy="${h + 6}" r="2.6" fill="#23685a"/>
    ${ticks(h)}${mark(r, h)}</svg>`;
}
// B: two lanes. Above, the store now, with the spoilage the head expects cut out of its end. Below, thinner, what the head expects after
// the next harvest: a band over its range and a dot at its centre. Now and then are read against each other.
function barB(r) {
  const h = 9, keep = r.now - r.loss[1];
  return `<svg class="bar" viewBox="-2 -8 ${W + 4} 34" height="34">${defs}
    <rect x="0" y="0" width="${W}" height="${h}" rx="4.5" fill="var(--track)"/>
    <rect x="0" y="0" width="${x(keep)}" height="${h}" rx="4.5" fill="${col(r)}"/>
    ${r.loss[1] ? `<rect x="${x(keep)}" y="0" width="${x(r.loss[1])}" height="${h}" fill="url(#spoil)"/>
    <line x1="${x(r.now - r.loss[2])}" x2="${x(r.now - r.loss[0])}" y1="${h + 3}" y2="${h + 3}" stroke="#a8432f" stroke-width="1.5"/>` : ''}
    <rect x="0" y="16" width="${W}" height="5" rx="2.5" fill="var(--track)"/>
    <rect x="0" y="16" width="${x(r.after[0])}" height="5" rx="2.5" fill="#23685a" opacity=".5"/>
    <rect x="${x(r.after[0])}" y="16" width="${x(r.after[2] - r.after[0])}" height="5" rx="2.5" fill="#23685a" opacity=".22"/>
    <circle cx="${x(r.after[1])}" cy="18.5" r="3.4" fill="#23685a" stroke="#eef5f2" stroke-width="1.2"/>
    ${ticks(21)}${mark(r, h)}</svg>`;
}
// C: the year ahead. Time runs to the right, one year; height is years of need in store. The line falls as the store is eaten, the red
// wedge under the dashed line is what spoils, the harvest lifts it, and the band is how sure the head is. Where it meets the floor, it runs out.
function barC(r) {
  const H = 48, T = W, top = 2.4, y = (v) => H - (Math.min(top, Math.max(0, v)) / top) * H, th = T * 0.55; // the harvest at 55% of the year
  const before = r.now - r.eaten, kept = Math.max(0, before - r.loss[1]), end = (v) => Math.max(0, v - 0.45);
  return `<svg class="bar" viewBox="-2 -6 ${W + 4} ${H + 12}" height="${H + 12}">${defs}
    <line x1="0" x2="${T}" y1="${H}" y2="${H}" stroke="#17313a" stroke-width="1"/>
    <line x1="0" x2="${T}" y1="${y(1)}" y2="${y(1)}" stroke="#526d75" stroke-dasharray="2 3" opacity=".7"/>
    <line x1="${th}" x2="${th}" y1="0" y2="${H}" stroke="#526d75" stroke-width="1" opacity=".4"/>
    <path d="M${th} ${y(r.after[2])}L${T} ${y(end(r.after[2]))}L${T} ${y(end(r.after[0]))}L${th} ${y(r.after[0])}z" fill="#23685a" opacity=".2"/>
    ${r.loss[1] ? `<path d="M0 ${y(r.now)}L${th} ${y(before)}L${th} ${y(kept)}z" fill="url(#spoil)"/>` : ''}
    <path d="M0 ${y(r.now)}L${th} ${y(before)}" stroke="#526d75" stroke-dasharray="3 2" fill="none"/>
    <path d="M0 ${y(r.now)}L${th} ${y(kept)}L${th} ${y(r.after[1])}L${T} ${y(end(r.after[1]))}" stroke="${col(r)}" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <circle cx="0" cy="${y(r.now)}" r="3.4" fill="${col(r)}"/>
    <text x="${th}" y="${H + 10}" font-size="9.5" fill="#526d75" text-anchor="middle">harvest</text>
    <text x="${T}" y="${y(1) - 2}" font-size="9.5" fill="#526d75" text-anchor="end">1 year</text></svg>`;
}
const row = (r, bar) => `<div class="row ${r.tone}"><svg class="ico" viewBox="0 0 24 24">${r.icon}</svg><span class="name">${r.name}</span>${bar(r)}
  <span class="val">${yrs(r.now)}<small>${r.loss[1] ? `−${r.loss[1].toFixed(1)} · ` : ''}→ ${r.after[1].toFixed(1)}</small></span></div>`;
const axis = `<div class="axis"><i></i><i></i><div><span style="left:0">0</span><span style="left:33.3%">1</span><span style="left:66.6%">2</span><span style="left:100%">3</span></div><i></i></div>`;
const K = {
  now: '<span><svg viewBox="0 0 26 10"><rect width="26" height="10" rx="5" fill="#23685a"/></svg>in store now</span>',
  spoil: `<span><svg viewBox="0 0 26 10">${defs}<rect width="26" height="10" fill="url(#spoil)"/></svg>expected to spoil</span>`,
  after: `<span><svg viewBox="0 0 26 10">${defs}<rect width="26" height="10" rx="5" fill="url(#ghost)" stroke="#23685a" stroke-opacity=".55" stroke-dasharray="3 2"/></svg>after the next harvest</span>`,
  range: '<span><svg viewBox="0 0 26 10"><line x1="2" x2="24" y1="5" y2="5" stroke="#23685a" stroke-width="1.5"/><circle cx="13" cy="5" r="2.6" fill="#23685a"/></svg>how sure the head is</span>',
  mark: '<span><svg viewBox="0 0 26 10"><path d="M9 1h8l-4 6z" fill="#17313a"/></svg>the head\'s target</span>',
};
const CARDS = [
  ['A. One bar', 'Everything on one line: the store, the bite spoilage takes out of it, and the outline of what comes after the harvest.', barA, true,
    [K.now, K.spoil, K.after, K.range, K.mark], 'Smallest. Reads at a glance; the range is the least visible of the three.'],
  ['B. Two lanes', 'Now above, after the harvest below: the two are compared by eye, and each has its own doubt.', barB, true,
    [K.now, K.spoil, K.after.replace('after the next harvest', 'after the next harvest (band: range)'), K.mark], 'A little taller. Now and later never overlap, so a store that will shrink is as clear as one that will grow.'],
  ['C. The year ahead', 'A small graph: the store over the coming year. It shows when, not only how much: where the line meets the floor, it runs out.', barC, false,
    [K.now.replace('in store now', 'the store, eaten down'), K.spoil, '<span><svg viewBox="0 0 26 10"><rect width="26" height="10" fill="#23685a" opacity=".2"/></svg>how sure the head is</span>'], 'Largest, and the only one that shows time. Hay runs out before haymaking here; A and B cannot say that.'],
];
document.getElementById('wrap').innerHTML = CARDS.map(([t, sub, bar, ax, key, note]) => `<div class="card"><h1>${t}</h1><p class="sub">${sub}</p>
  <p class="whose">Supplies in years of need, by Gunnar's reckoning</p>${ROWS.map((r) => row(r, bar)).join('')}${ax ? axis : ''}
  <div class="key">${key.join('')}</div><p class="note">${note}</p></div>`).join('');
</script>
</body>
</html>
