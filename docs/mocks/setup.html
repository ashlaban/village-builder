<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Skärgård Setup Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@1,500;1,700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: the game's menu card (src/head.html: .panel, .genscreen) over a picture of the chosen scenario, as the main menu lies over its showcase island. */
/* Step 1 comes in three layouts, chosen in the mock's bar: a, the menu card; b, picture cards; c, the annotated picture. */
/* Tokens are the game's own (src/head.html), with a few added for the status tags and the chart. */
:root {
  --sea: #16395f; --sea-deep: #0d2642;
  --panel: rgba(238, 245, 242, 0.88); --ink: #17313a; --muted: #526d75; --edge: rgba(23, 49, 58, 0.14);
  --accent: #23685a; --on-accent: #f2f8f6; --node: #fbfdfc; --good: #2f7a4b; --bad: #a8432f;
  --pick: rgba(35, 104, 90, 0.10); --sketch: #7a5a1e;
  --display: 'Alegreya', Georgia, serif; --body: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(11, 27, 34, 0.86); --ink: #e1ebe7; --muted: #93adae; --edge: rgba(225, 235, 231, 0.14);
    --accent: #84c9b5; --on-accent: #0c1f25; --node: #17323b; --good: #8fd0a2; --bad: #f0a08c;
    --pick: rgba(132, 201, 181, 0.13); --sketch: #e0bd77; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(11, 27, 34, 0.86); --ink: #e1ebe7; --muted: #93adae; --edge: rgba(225, 235, 231, 0.14);
  --accent: #84c9b5; --on-accent: #0c1f25; --node: #17323b; --good: #8fd0a2; --bad: #f0a08c;
  --pick: rgba(132, 201, 181, 0.13); --sketch: #e0bd77; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--sea); }
body {
  margin: 0; min-height: 100%; color: var(--ink); font: 16px/1.4 var(--body); -webkit-font-smoothing: antialiased;
  background: var(--sea-deep);
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; font-size: 15px; font-weight: 500; line-height: 1.2; border: 1px solid var(--edge); background: transparent; border-radius: 999px; padding: 7px 14px; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button:disabled { opacity: 0.5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1 { font: italic 700 30px/1.1 var(--display); text-wrap: balance; }
h2 { font: italic 700 22px/1.15 var(--display); text-wrap: balance; }
h3 { font-size: 13px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
small, .muted { color: var(--muted); font-size: 14px; }

.sheet { max-width: 1080px; margin: 0 auto; background: var(--panel); border-radius: 16px; padding: 20px 22px; display: grid; gap: 16px;
  box-shadow: 0 10px 30px rgba(3, 16, 26, 0.28); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); position: relative; z-index: 1; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.head h1 { flex: 1 1 auto; }
.steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--muted); }
.steps li { padding: 3px 10px; border-radius: 99px; border: 1px solid var(--edge); }
.steps li[aria-current] { background: var(--ink); color: var(--panel); border-color: transparent; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px;
  border: 1px solid currentColor; white-space: nowrap; vertical-align: 1px; }
.tag.built { color: var(--good); } .tag.designed { color: var(--accent); border-style: dashed; } .tag.sketch { color: var(--sketch); border-style: dotted; }

.panes { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; align-items: start; }
.panes > * { min-width: 0; display: grid; gap: 12px; }
@media (max-width: 760px) { .panes { grid-template-columns: minmax(0, 1fr); } }

/* choices: one row each; the picked one is tinted, nothing else is boxed */
.choices { display: grid; gap: 4px; }
.choice { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; padding: 9px 12px; border-color: transparent; background: none; }
.choice:hover { background: var(--pick); }
.choice[aria-pressed="true"] { background: var(--pick); border-color: var(--accent); }
.choice b { font-size: 17px; } .choice small { grid-column: 1 / -1; }
.choice .tag { align-self: center; }

.detail { border-left: 1px solid var(--edge); padding-left: 18px; }
@media (max-width: 760px) { .detail { border-left: 0; padding-left: 0; border-top: 1px solid var(--edge); padding-top: 14px; } }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 15px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 15px; }
.year { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 13.5px; }
.year div { border-top: 3px solid var(--edge); padding-top: 5px; } .year b { display: block; }
@media (max-width: 460px) { .year { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.lives { display: flex; flex-wrap: wrap; gap: 6px; }
.lives button { padding: 4px 11px; font-size: 14px; border-radius: 99px; }
.lives button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: transparent; }

.mapform { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 12px; align-items: start; }
.mapform label { display: grid; gap: 3px; font-size: 14px; color: var(--muted); }
.mapform input, .mapform select { padding: 6px 9px; border-radius: 10px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); min-width: 0; width: 100%; }
.seedrow { display: flex; gap: 6px; } .seedrow button { flex: none; padding: 6px 10px; }
canvas.chart { width: 100%; height: auto; border-radius: 10px; display: block; background: #16395f; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; border-top: 1px solid var(--edge); padding-top: 14px; }
.foot .muted { flex: 1 1 240px; }

/* step 2 */
.villages { display: flex; flex-wrap: wrap; gap: 6px; }
.villages button { padding: 5px 12px; font-size: 14px; text-align: left; }
.villages button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: transparent; }
.farm { display: grid; gap: 2px; padding-top: 8px; border-top: 1px solid var(--edge); }
.farm > header { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.farm > header b { font: italic 700 18px var(--display); }
.pawn { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; text-align: left; padding: 5px 8px; border-color: transparent; background: none; }
.pawn:hover:not(:disabled) { background: var(--pick); }
.pawn[aria-pressed="true"] { background: var(--pick); border-color: var(--accent); }
.pawn.dim { opacity: 0.38; }
.pawn small { display: block; }
.face { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #f2f8f6; }
.face.big { width: 56px; height: 56px; font-size: 20px; }
.who { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; }
.scroll { max-height: 560px; overflow-y: auto; padding-right: 4px; display: grid; gap: 10px; }
@media (max-width: 760px) { .scroll { max-height: none; } }
.loading { text-align: center; padding: 70px 0; display: grid; gap: 14px; justify-items: center; }
.bar { width: min(280px, 100%); height: 6px; border-radius: 3px; background: var(--edge); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.9s ease-out; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
.toast { background: var(--ink); color: var(--panel); border-radius: 12px; padding: 12px 16px; }

/* the stage behind the panel, under the menu's veil of sea */
.stage { position: fixed; inset: 0; background: var(--sea) center / cover no-repeat; transition: background-image 0.4s; }
.stage::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(22, 57, 95, 0.22) 0%, rgba(13, 38, 66, 0.62) 100%); }
.stage.far::after { background: rgba(13, 38, 66, 0.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
@media (prefers-reduced-motion: reduce) { .stage { transition: none; } }
.mockbar { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  font-size: 13px; color: var(--muted); background: var(--panel); border: 1px dashed var(--edge); border-radius: 12px; padding: 7px 12px; }
.mockbar button { padding: 3px 11px; font-size: 13px; }
.mockbar button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: transparent; }
.mockbar .legend { margin-left: auto; }
.choice, .pawn { border-radius: 12px; }
label .tag { justify-self: start; }
.sheet.a { max-width: 384px; margin-left: max(0px, 5vw); gap: 14px; }
.sheet.c { max-width: 1180px; }
@media (max-width: 760px) { .sheet.a { margin-left: auto; } }
.sheet.a label, .land2 label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.sheet select, .sheet input { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); min-width: 0; width: 100%; }
.sheet.a button.primary { min-height: 44px; }
.land2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stepper { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; text-align: center; }
.stepper button { width: 38px; height: 38px; padding: 0; font-size: 18px; }
.stepper b { display: block; font: italic 700 22px/1.15 var(--display); }
.dots { display: flex; justify-content: center; gap: 5px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--edge); } .dots i.on { background: var(--accent); }
/* who starts, drawn: one mark a person, one underline a farm */
.strip { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; }
.strip .vl { flex-basis: 100%; font-size: 12px; color: var(--muted); margin-bottom: -4px; }
.hh { display: inline-flex; gap: 3px; align-items: flex-end; padding: 0 2px 4px; border-bottom: 2px solid var(--edge); min-height: 18px; }
.hh.none { border: 1.5px dashed var(--muted); border-radius: 3px; width: 26px; height: 16px; padding: 0; opacity: 0.7; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.h { background: var(--accent); width: 12px; height: 12px; } .dot.c { width: 6px; height: 6px; opacity: 0.75; }
.dot.s { background: none; border: 2px solid var(--muted); }
.strip.tiny { gap: 6px 8px; } .strip.tiny .hh { gap: 2px; padding: 4px; border: 0; border-radius: 5px; background: var(--pick); min-height: 0; flex-wrap: wrap; align-items: center; max-width: 86px; }
.strip.tiny .dot { width: 4px; height: 4px; } .strip.tiny .dot.h { width: 5px; height: 5px; } .strip.tiny .dot.c { width: 3px; height: 3px; }
.key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); align-items: center; }
.key span { display: inline-flex; gap: 5px; align-items: center; }
/* b: picture cards */
.cards { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 10px; overflow-x: auto; padding: 2px 2px 8px; }
.card { display: grid; gap: 4px; padding: 0 0 8px; text-align: left; border-radius: 12px; overflow: hidden; background: var(--node); align-content: start; }
.card img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
.card > *:not(img) { margin: 0 9px; } .card b { font-size: 15px; } .card small { font-size: 12.5px; line-height: 1.3; }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.card.sk img { filter: saturate(0.35) sepia(0.25); }
/* c: the annotated picture */
.cgrid { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 5fr); gap: 18px; align-items: start; }
.cgrid > * { min-width: 0; display: grid; gap: 12px; }
@media (max-width: 860px) { .cgrid { grid-template-columns: minmax(0, 1fr); } }
.figure { position: relative; margin: 0; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; background: var(--sea); }
.figure img { display: block; width: 100%; height: 100%; object-fit: cover; }
.figure.sk img { filter: saturate(0.35) sepia(0.25); }
.pin { position: absolute; transform: translate(-9px, -50%); display: flex; align-items: center; gap: 6px; font-size: 13px; }
.pin i { flex: none; width: 18px; height: 18px; border-radius: 50%; background: #fbfdfc; color: #17313a; border: 2px solid #17313a; font-style: normal; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.pin b { white-space: nowrap; font-weight: 500; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 2px 8px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.pin.left { transform: translate(calc(-100% + 9px), -50%); flex-direction: row-reverse; }
.pinlist { display: none; margin: 0; padding-left: 20px; font-size: 14px; }
@media (max-width: 560px) { .pin b { display: none; } .pinlist { display: grid; gap: 2px; } }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: transparent; }
.tabs button.sk { border-style: dotted; }
.seen { position: fixed; z-index: 1; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(340px, 40vw); margin: 0; font-size: 14px;
  background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 8px 12px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
@media (max-width: 760px) { .seen { position: static; max-width: none; margin: 12px auto 0; } }
.inset { position: absolute; right: 10px; bottom: 10px; width: 32%; display: grid; border-radius: 9px; overflow: hidden; border: 2px solid var(--node); background: var(--node); box-shadow: 0 4px 14px rgba(3, 16, 26, 0.35); }
.inset img { aspect-ratio: 16 / 10; } .inset small { padding: 3px 7px; font-size: 12px; line-height: 1.25; color: var(--ink); }
@media (max-width: 560px) { .inset { width: 42%; } }
/* icons, and the pins that carry them */
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ic.dash { stroke-dasharray: 2.6 2.6; }
.pin { transform: translate(-14px, -50%); }
.pin.left { transform: translate(calc(-100% + 14px), -50%); }
.pin > .ic { width: 28px; height: 28px; padding: 4px; border-radius: 50%; background: #fbfdfc; color: #17313a; border: 2px solid #17313a; box-shadow: 0 2px 6px rgba(3, 16, 26, 0.4); }
.pinlist { list-style: none; padding: 0; } .pinlist li { display: flex; gap: 8px; align-items: center; }
.inset small { display: flex; gap: 5px; align-items: center; } .inset .ic { width: 15px; height: 15px; }
.cards { grid-auto-columns: minmax(136px, 1fr); }
/* who starts: farm cards */
.fcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.fcard { display: grid; gap: 2px; align-content: start; padding: 6px 8px; border-radius: 10px; background: var(--node); border: 1px solid var(--edge); min-width: 0; }
.fcard.none { background: none; border-style: dashed; color: var(--muted); }
.fcard b { font: italic 700 15px/1.2 var(--display); overflow-wrap: anywhere; } .fcard small { font-size: 12px; line-height: 1.3; }
.figs { display: flex; gap: 2px; align-items: flex-end; min-height: 21px; flex-wrap: wrap; }
.fig { width: auto; flex: none; fill: var(--muted); } .fig.h { fill: var(--accent); } .fig.c { opacity: 0.8; }
.fig.s { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.key .fig { height: 13px !important; }
.houses { display: flex; flex-wrap: wrap; gap: 1px; color: var(--accent); } .houses .ic { width: 13px; height: 13px; stroke-width: 2.2; }
/* who starts: by generation, and the age pyramid */
.gens { display: grid; gap: 3px 4px; align-items: center; font-size: 12px; }
.gens .fn { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
.gens .lab { color: var(--muted); padding-right: 4px; white-space: nowrap; }
.gens .cell { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; align-items: center; min-height: 20px; padding: 3px 1px; border-radius: 5px; background: var(--pick); }
.gens .cell.none { background: none; outline: 1.5px dashed var(--edge); outline-offset: -2px; }
.dot.d { background: none; border: 1.5px dotted var(--muted); }
.pyr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 3px 6px; align-items: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.pyr .lab { text-align: center; color: var(--muted); } .pyr .n { color: var(--muted); min-width: 2.2em; } .pyr .n.f { text-align: right; }
.pyr .pb { display: flex; height: 12px; } .pyr .pb.l { justify-content: flex-end; }
.pyr .pb i { background: var(--accent); border-radius: 2px; } .pyr .pb i.c { background: var(--muted); opacity: 0.7; }
/* lives: cards and the ladder */
.lcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.lcard { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; text-align: left; border-radius: 12px; padding: 8px 10px; background: var(--node); }
.lcard small { grid-column: 1 / -1; font-size: 12.5px; line-height: 1.3; } .lcard small.n { opacity: 0.8; }
.lcard[aria-pressed="true"], .rung[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--pick); }
.lcard .ic, .rung .ic { width: 22px; height: 22px; color: var(--accent); }
.ladder { display: grid; gap: 0; border-left: 2px solid var(--edge); margin-left: 10px; }
.rung { display: grid; grid-template-columns: auto minmax(0, 1fr) 64px; gap: 10px; align-items: center; text-align: left; border-radius: 10px; border-color: transparent; padding: 6px 8px; margin-left: -1px; }
.rung small { display: block; font-size: 12.5px; line-height: 1.3; }
.rung .cnt { display: grid; gap: 1px; } .rung .cnt i { display: block; height: 6px; border-radius: 3px; background: var(--muted); } .rung .cnt small { text-align: left; }
/* the chosen life, picked out among the figures and in the pyramid */
.fig.off { opacity: 0.32; } .fig.on { fill: var(--accent); opacity: 1; } .fig.s.on { fill: var(--accent); stroke: var(--accent); }
.fcard.has { border-color: var(--accent); }
.pyr .pb i { display: flex; background: var(--muted); opacity: 1; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--muted) 45%, transparent); }
.pyr .pb.l i { justify-content: flex-end; } .pyr .pb i b { background: var(--accent); }
.sw { width: 12px; height: 8px; border-radius: 2px; background: color-mix(in srgb, var(--muted) 45%, transparent); } .sw.on { background: var(--accent); }
.lives button { display: inline-flex; gap: 5px; align-items: center; } .lives .ic { width: 15px; height: 15px; }
/* step 2 */
.cards.v { grid-auto-columns: minmax(124px, 1fr); } .cards.few { grid-auto-columns: 200px; justify-content: start; } .cards.v .card { padding-top: 8px; } .card .houses { margin-top: 2px; }
.fp { border: 0; background: none; padding: 0; border-radius: 0; font-size: 13px; }
.fp b { display: none; } .fp.on b, .fp:hover b, .fp:focus-visible b { display: block; }
.fp.on > .ic { background: #23685a; color: #f2f8f6; border-color: #f2f8f6; } .fp.on { z-index: 2; }
.fp:disabled > .ic { background: #c9cfcb; } .fp:disabled { opacity: 1; }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; align-items: start; }
.pcard { display: grid; gap: 1px; padding: 8px; border-radius: 12px; background: var(--node); border: 1px solid var(--edge); min-width: 0; }
.pcard.none { background: none; border-style: dashed; color: var(--muted); } .pcard.cur { border-color: var(--accent); }
.pcard header { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; padding: 0 6px 3px; } .pcard header b { font: italic 700 17px var(--display); }
.pcard > small { padding: 0 6px; } .pcard > small .ic { vertical-align: -4px; }
.pawn { grid-template-columns: 22px minmax(0, 1fr) auto; padding: 4px 6px; } .av { display: grid; place-items: end center; height: 22px; }
.posline { display: inline-flex; gap: 6px; align-items: center; } .posline .ic { color: var(--accent); }

ICON.empty = ICON.house;
const star = () => `<svg class="ic sug" viewBox="0 0 24 24" role="img" aria-label="Suggested by the scenario"><title>Suggested by the scenario</title><path d="${ICON.star}"/></svg>`;
const GENS = { founders: 1, heirs: 3, populous: 2, service: 2, outland: 3, alderman: 3, market: 4 };
// How a life stands, in three measures of 0 to 3 (a sketch): security, say, freedom.
const METER = { holder: [3, 3, 1], widow: [2, 3, 1], bachelor: [3, 3, 1], spouse: [3, 1, 1], heir: [2, 1, 1], heiress: [2, 1, 1], child: [1, 1, 3], servant: [0, 0, 3] };
const MEASURE = [['shield', 'Security'], ['voice', 'Say'], ['road', 'Freedom']];
const meters = (k, words) => `<span class="meters" title="${esc(HARD[k])}">${METER[k].map((v, i) => `<span title="${MEASURE[i][1]}: ${v} of 3">${icon(MEASURE[i][0])}${words ? MEASURE[i][1] : ''}<span class="pips">${[0, 1, 2].map((j) => `<i class="${j < v ? 'on' : ''}"></i>`).join('')}</span></span>`).join('')}</span>`;
// What a position can do and what lies ahead, as an icon and a few words; the full sentences are POS.
const CAN = {
  holder: [['field', 'Places fields'], ['sun', 'Sets the work'], ['rings', 'Arranges marriages'], ['voice', 'Speaks at the meeting']],
  widow: [['field', 'Places fields'], ['sun', 'Sets the work'], ['rings', 'Arranges marriages'], ['voice', 'Speaks at the meeting']],
  bachelor: [['field', 'Places fields'], ['sun', 'Sets the work'], ['voice', 'Speaks at the meeting']],
  spouse: [['sickle', 'Own work'], ['voice', 'Argues a cause']], heir: [['sickle', 'Own work'], ['rings', 'Own marriage']], heiress: [['sickle', 'Own work'], ['rings', 'Own marriage']],
  child: [['sickle', 'Own work'], ['road', 'May leave'], ['flag', 'May claim a farm']], servant: [['sickle', 'Serves the farm'], ['road', 'May move'], ['flag', 'May claim a farm']], minor: [],
};
const NEXT = {
  holder: [['key', 'Hands over when the heir marries']], widow: [['shield', 'The farm for life'], ['key', 'Then her child']], bachelor: [['key', 'No child: kin inherit']],
  spouse: [['shield', 'As widow, keeps the farm']], heir: [['house', 'The farm, on marriage'], ['sack', 'Buys out siblings']], heiress: [['house', 'Inherits: no son'], ['rings', 'Husband moves in']],
  child: [['sack', 'Bought out, no land']], servant: [['sack', 'Keep only'], ['house', 'Land: the long goal']], minor: [],
};
const chips = (list, full) => `<div class="chips" title="${esc(full.join('. '))}">${list.map(([ic, t]) => `<span class="chip">${icon(ic)}${t}</span>`).join('')}</div>`;
const icon = (k) => `<svg class="ic${k === 'empty' ? ' dash' : ''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[k]}"/></svg>`;
const LIFE_ICON = { holder: 'house', widow: 'house', bachelor: 'house', spouse: 'rings', heir: 'key', heiress: 'key', child: 'road', servant: 'sickle' };
const HARD = { holder: 'Secure. The most to decide from the first day.', widow: 'Secure while she lives; the line hangs on one child.', bachelor: 'Secure, and a dead end unless he marries.',
  spouse: 'Secure, with little formal say. Influence runs through ties and prestige.', heir: 'A waiting game: nothing is his until he marries.',
  heiress: 'Sought after. The marriage decides everything.', child: 'Open and insecure: every road leads away from home.', servant: 'The hardest start. Nothing to lose.' };
const RANK = ['holder', 'widow', 'bachelor', 'heiress', 'heir', 'spouse', 'child', 'servant']; // standing, from the most to the least

// ---- pictures: real screenshots of the game (seed 7, tiny map), a close one for each built scenario ----
const PIC = { founders: 'founders', heirs: 'heirs', populous: 'populous', service: 'populous', outland: 'founders', alderman: 'populous', market: 'populous' };
const pic = (k, far) => `img/${PIC[k]}-${far ? 'island' : 'close'}.jpg`;
const PINS = { // x and y in hundredths of the close picture, an icon, the words; the last flag puts the label to the left
  founders: [[61, 47, 'house', 'The houses stand ready'], [49, 51, 'well', 'One well between them', 1], [75, 70, 'field', 'No field broken yet'], [22, 30, 'tree', 'Forest to clear for hay meadows']],
  heirs: [[42, 50, 'empty', 'Empty for six years: no smoke, no fence', 1], [59, 47, 'house', 'Three farms lived in'], [76, 39, 'field', 'Fields three generations old', 1], [56, 15, 'meadow', 'Hay meadows in flower']],
  populous: [[52, 46, 'village', 'Ekinge: six farms round a green'], [63, 22, 'field', 'Every farm has its fields'], [29, 46, 'field', 'More fields across the river', 1]],
};
const INSET = { heirs: ['img/heirs-inset.jpg', 'ruin', 'The far shore: a ruin, 15 years empty'], populous: ['img/populous-island.jpg', 'village', 'Six villages on the smallest map'] };
const VARIANTS = { lives: [['pills', 'Pills'], ['cards', 'Cards'], ['ladder', 'Ladder']] };

// The stand-in world of a scenario, for the summaries of step 1 (the same one step 2 opens).
const worlds = new Map();
function worldOf(key) { const k = `${key}|${S.seed}|${S.size}`; if (!worlds.has(k)) worlds.set(k, makeWorld(key, S.seed, S.size)); return worlds.get(k); }
const kind = (p) => (p.a < ADULT ? 'c' : p.r === 'servant' ? 's' : ['holder', 'widow', 'bachelor'].includes(p.r) ? 'h' : 'a');
const isLife = (k, p) => k === 'all' || p.r === k || (k === 'holder' && p.r === 'bachelor');
const fig = (p, cls) => `<svg class="fig ${kind(p)} ${cls || ''}" viewBox="0 0 10 15" style="height:${p.a < 6 ? 9 : p.a < 13 ? 12 : p.a < ADULT ? 15 : 19}px" aria-hidden="true"><title>${esc(`${p.n}, ${p.a}`)}</title><circle cx="5" cy="3" r="2.7"/><path d="M1 15c0-6 2-8 4-8s4 2 4 8z"/></svg>`;
const figKey = () => `<div class="key"><span>${fig({ n: '', a: 40, r: 'holder' })}holder</span><span>${fig({ n: '', a: 40, r: 'spouse' })}adult</span><span>${fig({ n: '', a: 8, r: 'minor' })}child</span><span>${fig({ n: '', a: 20, r: 'servant' })}servant</span></div>`;

// Who starts: every farm as a card where they are few, an age pyramid where they are many. The life chosen below is picked out.
function households(s) {
  const w = worldOf(s.key), big = w.length > 3, all = w.flatMap((v) => v.farms.flatMap((f) => f.people || [])), nf = w.reduce((n, v) => n + v.farms.length, 0);
  const cur = S.hover || S.peek, label = cur ? s.lives.find((x) => x[0] === cur)[1] : '', on = (p) => !!cur && p.a >= ADULT && isLife(cur, p);
  if (!big) {
    return `<div class="fcards">${w.map((v) => v.farms.map((f) => (f.empty ? `<div class="fcard none" title="${esc(f.empty)}"><b>${esc(f.name)}</b><span class="figs">${icon(/ruin/.test(f.empty) ? 'ruin' : 'empty')}</span></div>`
      : `<div class="fcard${f.people.some(on) ? ' has' : ''}" title="${esc(f.tests || '')}"><b>${esc(f.name)}</b><span class="figs">${f.people.map((p) => fig(p, cur ? (on(p) ? 'on' : 'off') : '')).join('')}</span></div>`)).join('')).join('')}</div>
      ${figKey()}${cur ? `<small>${all.filter(on).length} of ${all.length}: ${esc(label.toLowerCase())}</small>` : ''}`;
  }
  const bands = [[60, 200, '60 and over'], [45, 59, '45 to 59'], [30, 44, '30 to 44'], [18, 29, '18 to 29'], [10, 17, '10 to 17'], [0, 9, 'Under 10']];
  const rows = bands.map(([a, b, l]) => { const g = all.filter((p) => p.a >= a && p.a <= b), f = g.filter((p) => p.s === 'f'), m = g.filter((p) => p.s === 'm'); return [l, f.length, f.filter(on).length, m.length, m.filter(on).length]; })
    .filter((x) => x[1] + x[3] > 0);
  const max = Math.max(...rows.flatMap((x) => [x[1], x[3]])), grown = w.flatMap((v) => v.farms).filter((f) => f.people.slice(2).some((p) => p.a >= ADULT && p.r !== 'servant')).length;
  const bar = (n, k, left) => `<span class="pb${left ? ' l' : ''}"><i style="width:${(n / max) * 100}%"><b style="width:${n ? (k / n) * 100 : 0}%"></b></i></span>`;
  return `<div class="pyr">${rows.map(([l, f, fk, m, mk]) => `<span class="n f">${f}</span>${bar(f, fk, 1)}<span class="lab">${l}</span>${bar(m, mk)}<span class="n">${m}</span>`).join('')}</div>
    <div class="key"><span>women · men</span>${cur ? `<span><i class="sw on"></i>${esc(label.toLowerCase())}: ${all.filter(on).length}</span><span><i class="sw"></i>everyone else</span>` : ''}</div>
    <small>${all.length} people, ${nf} farms, ${w.length} villages</small>`;
}

// Lives, in three forms, for both steps: looked at on step 1 (data-life), a filter on step 2 (data-only).
function livesUI(items, attr, cur) {
  const list = S.lives === 'ladder' ? [...items].sort((a, b) => RANK.indexOf(a.k) - RANK.indexOf(b.k)) : items, max = Math.max(1, ...list.filter((x) => x.k !== 'all').map((x) => x.n));
  const ic = (k) => icon(k === 'all' ? 'people' : LIFE_ICON[k]), at = (x) => `type="button" ${attr}="${x.k}" aria-pressed="${cur === x.k}"`;
  if (S.lives === 'pills') return `<div class="lives">${list.map((x) => `<button ${at(x)}>${ic(x.k)}${esc(x.label)}${x.sug ? star() : ''}</button>`).join('')}</div>`;
  if (S.lives === 'cards') return `<div class="lcards">${list.map((x) => `<button class="lcard" ${at(x)}>${ic(x.k)}<b>${esc(x.label)}</b>${x.sug ? star() : '<span></span>'}
    ${x.k === 'all' ? '<span class="meters"></span>' : meters(x.k)}<small class="n">${fig({ n: '', a: 30, r: 'spouse' })}${x.n}</small></button>`).join('')}</div>`;
  return `<div class="ladder">${list.map((x) => `<button class="rung" ${at(x)}>${ic(x.k)}<span><b>${esc(x.label)}</b>${x.sug ? star() : ''}${x.k === 'all' ? '' : meters(x.k)}</span>
    <span class="cnt"><i style="width:${x.k === 'all' ? 100 : Math.max(4, (x.n / max) * 100)}%"></i><small>${x.n}</small></span></button>`).join('')}</div>`;
}
const meterKey = () => `<div class="key">${MEASURE.map(([ic, t]) => `<span>${icon(ic)}${t.toLowerCase()}</span>`).join('')}<span>${star()}suggested</span></div>`;

const sizeField = () => `<label for="size">Map size<select id="size">${Object.entries(SIZES).map(([k, v]) => `<option value="${k}"${k === S.size ? ' selected' : ''}>${v.name} (${v.tiles})</option>`).join('')}</select></label>`;
const seedField = () => `<label for="seed">Seed<span class="seedrow"><input id="seed" inputmode="numeric" maxlength="9" value="${S.seed}"><button type="button" id="reroll">Another</button></span></label>`;

// Step 1: the scenarios as picture cards; below, the chosen one read off the land, with who starts and the lives it offers.
function step1() {
  const s = scen(), pins = PINS[s.key] || [], ins = INSET[s.key], all = worldOf(s.key).flatMap((v) => v.farms.flatMap((f) => f.people || []));
  const items = s.lives.map(([k, label, sug]) => ({ k, label, sug, n: all.filter((p) => p.a >= ADULT && isLife(k, p)).length }));
  const rows = [['sack', s.stores], ['scroll', s.customs]].filter((x) => x[1] !== 'What each farm has laid by');
  $('app').innerHTML = `${headBar('New archipelago')}
    <div class="cards">${SCENARIOS.map((x) => `<button type="button" class="card${x.status === 'sketch' ? ' sk' : ''}" data-sc="${x.key}" aria-pressed="${x === s}" title="${esc(x.line)}">
      <img src="${pic(x.key, PIC[x.key] === 'populous')}" alt=""><b>${esc(x.name)} ${tag(x.status)}</b>
      <span class="stats"><span title="People at the start">${icon('people')}${esc(x.people(S.size))}</span><span title="Generations on record">${icon('gens')}${GENS[x.key]}</span></span></button>`).join('')}</div>
    <div class="cgrid">
      <section>
        <figure class="figure${s.status === 'sketch' ? ' sk' : ''}"><img src="${pic(s.key)}" alt="The land as this scenario begins">
          ${pins.map(([x, y, ic, t, left]) => `<span class="pin${left ? ' left' : ''}" style="left:${x}%;top:${y}%">${icon(ic)}<b>${esc(t)}</b></span>`).join('')}
          ${ins ? `<span class="inset"><img src="${ins[0]}" alt=""><small>${icon(ins[1])}${esc(ins[2])}</small></span>` : ''}</figure>
        ${pins.length ? `<ul class="pinlist">${pins.map((x) => `<li>${icon(x[2])}${esc(x[3])}</li>`).join('')}</ul>` : '<small>A stand-in picture.</small>'}
        <div class="year">${s.year.map(([a, b]) => `<div><b>${esc(a)}</b>${esc(b)}</div>`).join('')}</div>
        <ul class="rows">${rows.map(([ic, t]) => `<li>${icon(ic)}<span>${esc(t)}</span></li>`).join('')}</ul>
      </section>
      <section><h2>${esc(s.name)}</h2><p title="${esc(s.explores)}">${esc(s.line)}</p>
        <h3>Who starts ${tag(s.status === 'sketch' ? 'sketch' : 'built')}</h3><div class="who-starts" id="who">${households(s)}</div>
        <h3>Lives ${tag('sketch')}</h3><div class="peekable">${livesUI(items, 'data-life', S.peek)}</div>${S.lives === 'pills' ? '' : meterKey()}
        <small>Point or tap to see who. You choose once the land is raised.</small>
        <div class="land2">${sizeField()}${seedField()}</div></section>
    </div>
    <div class="foot"><button type="button" id="back1">Back</button><button type="button" class="primary" id="go">Raise the land</button></div>`;
}

function loading() {
  $('app').innerHTML = `<div class="loading"><h2 id="lt">Raising the land</h2><div class="bar"><i id="lb"></i></div></div>`;
  requestAnimationFrame(() => { $('lb').style.width = '100%'; });
  setTimeout(() => { if ($('lt')) $('lt').textContent = scen().key === 'founders' ? 'Settling the founders' : 'Waking the villages'; }, 450);
  setTimeout(() => {
    S.world = worldOf(S.sc); S.step = 2; S.done = false;
    const want = scen().lives[0][0], all = pawns().filter((p) => p.a >= ADULT);
    const p = all.find((x) => x.r === want) || all.find((x) => x.r === 'widow' && want === 'widow') || all.find((x) => x.r === 'holder') || all[0];
    S.suggested = (all.find((x) => x.r === scen().lives[0][0]) || all[0]).id; S.pawn = p.id; S.village = p.village; S.only = 'all'; draw();
  }, 1000);
}

// ---- step 2: whom to play. The villages as cards; the chosen village as a picture with a pin a farm; its people on farm cards. ----
const LIFE_NAME = { all: 'Everyone', holder: 'Holders', widow: 'Widows', heiress: 'Heiresses', heir: 'Heirs', spouse: 'Wives', child: 'Younger children', servant: 'Servants' };
const VIEW = { // a village's picture and where its farms stand in it, in hundredths
  founders: [{ img: 'img/founders-close.jpg', pos: [[59, 50], [54, 62], [50, 74]] }],
  heirs: [{ img: 'img/heirs-close.jpg', pos: [[58, 50], [46, 61], [42, 50], [58, 72]] }, { img: 'img/heirs-close2.jpg', pos: [[58, 49], [53.5, 64], [45.5, 60]] }],
  populous: [{ img: 'img/populous-close.jpg', pos: [[52, 43], [58, 43], [45, 50], [52, 57], [58, 57], [45, 64]], standin: true }],
};
const viewOf = (vi) => { const a = VIEW[PIC[S.sc]]; return a[Math.min(vi, a.length - 1)]; };

function step2() {
  const s = scen(), v = S.world[S.village], p = pawns().find((x) => x.id === S.pawn), pos = POS[p.r], f = p.farm, view = viewOf(S.village);
  const sketch = s.status === 'sketch' || view.standin, kin = f.people.filter((x) => x !== p), grown = kin.filter((x) => x.a >= ADULT), next = grown.find((x) => x.r === 'heir' || x.r === 'heiress') || grown[0];
  const here = v.farms.flatMap((x) => x.people || []).filter((x) => x.a >= ADULT), count = (vl) => vl.farms.reduce((n, x) => n + (x.people || []).length, 0);
  const items = ['all', ...new Set(s.lives.map((x) => x[0]))].map((k) => ({ k, label: LIFE_NAME[k], n: here.filter((x) => isLife(k, x)).length }));
  if (S.done) {
    $('app').innerHTML = `${headBar('Whom to play')}<div class="toast"><b>The game would begin here,</b> at ${esc(f.name)} in ${esc(S.world[p.village].name)}, as ${esc(p.n)}.</div>
      <div class="foot"><button type="button" id="again">Choose someone else</button><button type="button" id="restart">Start over</button></div>`;
    return;
  }
  $('app').innerHTML = `${headBar('Whom to play')}
    ${S.world.length > 1 ? `<div class="cards${S.world.length > 3 ? ' v' : ' few'}">${S.world.map((x, i) => `<button type="button" class="card" data-v="${i}" aria-pressed="${i === S.village}">
      ${S.world.length > 3 ? '' : `<img src="${viewOf(i).img}" alt="">`}<b>${esc(x.name)}</b><span class="houses">${x.farms.map((fm) => icon(fm.empty ? 'empty' : 'house')).join('')}</span>
      <span class="stats"><span title="People">${icon('people')}${count(x)}</span></span></button>`).join('')}</div>` : ''}
    <div class="cgrid">
      <section>
        <figure class="figure${s.status === 'sketch' ? ' sk' : ''}"><img src="${view.img}" alt="${esc(v.name)} from above">
          ${v.farms.slice(0, view.pos.length).map((fm, i) => `<button type="button" class="pin fp${view.pos[i][0] < 50 ? ' left' : ''}${fm === f ? ' on' : ''}" data-farm="${i}" style="left:${view.pos[i][0]}%;top:${view.pos[i][1]}%"
            aria-label="${esc(fm.name)}" ${fm.empty ? 'disabled' : ''}>${icon(fm.empty ? (/ruin/.test(fm.empty) ? 'ruin' : 'empty') : 'house')}<b>${esc(fm.name)}${fm.empty ? ', empty' : ''}</b></button>`).join('')}</figure>
        <ul class="rows"><li>${icon('scroll')}<span><b>${esc(v.name)}.</b> ${esc(v.note)}${sketch ? ' <span class="muted">A stand-in picture.</span>' : ''}</span></li></ul>
        ${livesUI(items, 'data-only', S.only)}
        <div class="pcards">${v.farms.map((fm) => `<div class="pcard${fm.empty ? ' none' : ''}${fm === f ? ' cur' : ''}" title="${esc(fm.tests || '')}"><header>${icon(fm.empty ? (/ruin/.test(fm.empty) ? 'ruin' : 'empty') : 'house')}<b>${esc(fm.name)}</b></header>
          ${fm.empty ? `<small>${esc(fm.empty.split('.')[0])}.</small>` : fm.people.map((x) => `
            <button type="button" class="pawn${isLife(S.only, x) && x.a >= ADULT ? '' : ' dim'}" data-p="${x.id}" aria-pressed="${x.id === S.pawn}" ${x.a < ADULT ? 'disabled' : ''}>
              <span class="av">${fig(x)}</span><span>${esc(x.n)}<small>${x.a} · ${esc(POS[x.r].name.toLowerCase())}</small></span>${x.id === S.suggested ? star() : ''}</button>`).join('')}</div>`).join('')}</div>
      </section>
      <section class="stick">
        <div class="who">${face(p, true)}<div><h2>${esc(p.n)}${p.id === S.suggested ? ' ' + star() : ''}</h2><span class="posline">${icon(LIFE_ICON[p.r])}${p.a} · ${esc(pos.name.toLowerCase())} · ${esc(f.name)}</span></div></div>
        ${p.note ? `<p>${esc(p.note)}</p>` : ''}
        ${meters(p.r, true)}
        <h3>Household ${tag('built')}</h3>
        <div class="figs lg" title="${esc(f.people.map((x) => `${x.n.split(' ')[0]} ${x.a}`).join(', '))}">${f.people.map((x) => fig(x, x === p ? 'on' : 'off')).join('')}</div>
        <ul class="rows"><li title="Food laid by, in days of the household's need">${icon('sack')}<span>${f.food} days of food</span></li>
          <li title="Whom you go on as when ${p.s === 'm' ? 'he' : 'she'} dies">${icon('next')}<span>${next ? `Then ${esc(next.n.split(' ')[0])}${next.r === 'heir' || next.r === 'heiress' ? ', the heir' : ''}` : 'No one after: the line breaks'}</span></li></ul>
        <h3>Can ${tag('designed')}</h3>${chips(CAN[p.r], pos.commands)}
        <h3>Ahead ${tag('designed')}</h3>${chips(NEXT[p.r], pos.ahead)}
      </section>
    </div>
    <div class="foot"><button type="button" id="back2">Back</button><button type="button" id="watch">Watch only</button><button type="button" class="primary" id="play">Play as ${esc(p.n.split(' ')[0])}</button></div>`;
}
function draw() {
  $('app').className = 'sheet c';
  $('stage').className = 'stage far'; $('stage').style.backgroundImage = `url(${pic(S.sc, S.step === 2)})`;
  const sw = (k, label) => `<span>${label}:</span>${VARIANTS[k].map(([v, l]) => `<button type="button" data-var="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${l}</button>`).join('')}`;
  $('mockbar').innerHTML = `<b>Mock</b>${sw('lives', 'Lives')}
    <span class="legend"><span>${tag('built')} in the game</span><span>${tag('designed')} in design.md</span><span>${tag('sketch')} an idea</span></span>`;
  if (S.step === 1) step1(); else step2();
}
$('mockbar').addEventListener('click', (e) => { const b = e.target.closest('[data-var]'); if (b) { S[b.dataset.var] = b.dataset.v; draw(); } });

$('app').addEventListener('click', (e) => {
  const b = e.target.closest('button, canvas'); if (!b) return;
  const d = b.dataset;
  if (b.id === 'chart2') {
    const q = b.getBoundingClientRect(), x = (e.clientX - q.left) / q.width, y = (e.clientY - q.top) / q.height;
    let best = 0, bd = 9; S.spots.forEach(([sx, sy], i) => { const dd = Math.hypot(sx - x, sy - y); if (dd < bd) { bd = dd; best = i; } });
    S.village = best; draw(); return;
  }
  if (d.sc) { S.sc = d.sc; S.peek = S.hover = null; }
  else if (d.life) S.peek = S.peek === d.life ? null : d.life;
  else if (d.v) { S.village = +d.v; const a = S.world[S.village].farms.flatMap((x) => x.people || []).filter((x) => x.a >= ADULT); S.pawn = (a.find((x) => isLife(S.only, x)) || a[0]).id; }
  else if (d.farm) { const a = S.world[S.village].farms[+d.farm].people.filter((x) => x.a >= ADULT); S.pawn = (a.find((x) => S.only !== 'all' && isLife(S.only, x)) || a[0]).id; }
  else if (d.only) S.only = d.only;
  else if (d.p) S.pawn = +d.p;
  else if (b.id === 'reroll') S.seed = (Math.random() * 1e6) | 0;
  else if (b.id === 'go') { loading(); return; }
  else if (b.id === 'back1') return;
  else if (b.id === 'back2' || b.id === 'restart') { S.step = 1; S.done = false; }
  else if (b.id === 'play') S.done = true;
  else if (b.id === 'again') S.done = false;
  else if (b.id === 'watch') { $('app').innerHTML = `${headBar('Whom to play')}<div class="toast"><b>The game would begin with no one played,</b> as it does today after "Not now".</div><div class="foot"><button type="button" id="again">Choose someone</button></div>`; return; }
  else return;
  draw();
});
// Pointing at a life shows who they are, in "Who starts" only; nothing is chosen by it.
const look = (k) => { if (S.step !== 1 || S.hover === k) return; S.hover = k; const w = $('who'); if (w) w.innerHTML = households(scen()); };
$('app').addEventListener('mouseover', (e) => { const b = e.target.closest('[data-life]'); if (b) look(b.dataset.life); });
$('app').addEventListener('mouseout', (e) => { const b = e.target.closest('[data-life]'); if (b && !b.contains(e.relatedTarget)) look(null); });
$('app').addEventListener('change', (e) => {
  if (e.target.id === 'size') S.size = e.target.value;
  else if (e.target.id === 'seed') S.seed = +String(e.target.value).replace(/\D/g, '').slice(0, 9) || 0;
  else return;
  draw();
});
draw();
</script>
