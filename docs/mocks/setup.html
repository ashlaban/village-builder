<style>
/* Layout: the game's menu card (src/head.html: .panel, .genscreen) over a picture of the chosen scenario. Step 1 is a sheet: scenario cards,
   then the chosen scenario read off an annotated picture. Step 2 is the game itself: the map to drag, a farm to click, its people in a panel. */
:root {
  --sea: #16395f; --sea-deep: #0d2642;
  --panel: rgba(238, 245, 242, 0.9); --ink: #17313a; --muted: #526d75; --edge: rgba(23, 49, 58, 0.14);
  --accent: #23685a; --on-accent: #f2f8f6; --node: #fbfdfc; --good: #2f7a4b; --bad: #a8432f;
  --pick: rgba(35, 104, 90, 0.10); --sketch: #7a5a1e;
  --display: 'Alegreya', Georgia, serif; --body: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(11, 27, 34, 0.88); --ink: #e1ebe7; --muted: #93adae; --edge: rgba(225, 235, 231, 0.14);
    --accent: #84c9b5; --on-accent: #0c1f25; --node: #17323b; --good: #8fd0a2; --bad: #f0a08c;
    --pick: rgba(132, 201, 181, 0.13); --sketch: #e0bd77; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(11, 27, 34, 0.88); --ink: #e1ebe7; --muted: #93adae; --edge: rgba(225, 235, 231, 0.14);
  --accent: #84c9b5; --on-accent: #0c1f25; --node: #17323b; --good: #8fd0a2; --bad: #f0a08c;
  --pick: rgba(132, 201, 181, 0.13); --sketch: #e0bd77; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--sea-deep); }
body { margin: 0; min-height: 100%; color: var(--ink); font: 16px/1.4 var(--body); -webkit-font-smoothing: antialiased; background: var(--sea-deep);
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; font-size: 15px; font-weight: 500; line-height: 1.2; border: 1px solid var(--edge); background: transparent; border-radius: 999px; padding: 7px 14px; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button:disabled { opacity: 0.5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p, figure { margin: 0; }
h1 { font: italic 700 30px/1.1 var(--display); text-wrap: balance; }
h2 { font: italic 700 22px/1.15 var(--display); text-wrap: balance; }
h3 { font-size: 13px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
small, .muted { color: var(--muted); font-size: 14px; }
select, input { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); min-width: 0; width: 100%; }
.panel { background: var(--panel); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(3, 16, 26, 0.28); border-radius: 16px; }

.stage { position: fixed; inset: 0; background: var(--sea) center / cover no-repeat; }
.stage::after { content: ""; position: absolute; inset: 0; background: rgba(13, 38, 66, 0.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.mockbar { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  font-size: 13px; color: var(--muted); background: var(--panel); border: 1px dashed var(--edge); border-radius: 12px; padding: 7px 12px; }
.legend { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 12px; } .legend span { display: inline-flex; gap: 5px; align-items: center; }
.st { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: 1px; border: 1.5px solid currentColor; }
.st.built { color: var(--good); background: var(--good); } .st.designed { color: var(--accent); } .st.sketch { color: var(--sketch); border-style: dotted; }

.sheet { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 20px 22px; display: grid; gap: 16px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.stepno { font-size: 14px; color: var(--muted); }

/* icons: one stroke, drawn for this page; people and farms use the game's own graphics */
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ic.dash { stroke-dasharray: 2.6 2.6; }
.ic.sug { width: 15px; height: 15px; color: var(--sketch); fill: currentColor; stroke-width: 1; vertical-align: -2px; }
.pf { width: 26px; height: 26px; flex: none; image-rendering: auto; } .pf.c { width: 20px; height: 20px; }
.pf.off { opacity: 0.28; } .pf.on { filter: drop-shadow(0 0 0 var(--accent)) drop-shadow(0 0 2px var(--accent)); }
.fi { width: 30px; height: 30px; flex: none; object-fit: contain; } .fi.gone { filter: grayscale(0.8); opacity: 0.75; }

/* scenario cards */
.cards { display: grid; gap: 10px; }
.cards.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cards.row { grid-auto-flow: column; grid-auto-columns: minmax(150px, 220px); justify-content: start; overflow-x: auto; padding: 2px 2px 8px; margin-top: 8px; }
.card { display: grid; gap: 4px; padding: 0 0 8px; text-align: left; border-radius: 12px; overflow: hidden; background: var(--node); align-content: start; }
.card img { display: block; width: 100%; aspect-ratio: 16 / 6; object-fit: cover; }
.card > *:not(img) { margin: 0 9px; }
.card b { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.card small { font-size: 13px; line-height: 1.3; }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.card.sk img { filter: saturate(0.35) sepia(0.25); aspect-ratio: 16 / 9; }
.stats { display: flex; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; } .stats span { display: inline-flex; gap: 4px; align-items: center; } .stats .ic { width: 14px; height: 14px; }
.more summary { cursor: pointer; font-size: 14px; color: var(--muted); }
@media (max-width: 620px) { .cards.three { grid-template-columns: minmax(0, 1fr); } .cards.three .card { grid-template-columns: 110px minmax(0, 1fr); padding: 0; column-gap: 9px; align-items: center; }
  .cards.three .card img { grid-row: 1 / span 3; height: 100%; aspect-ratio: auto; } .cards.three .card > *:not(img) { margin: 0 9px 0 0; } }

/* the annotated picture */
.cgrid { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 5fr); gap: 18px; align-items: start; }
.cgrid > * { min-width: 0; display: grid; gap: 12px; }
@media (max-width: 860px) { .cgrid { grid-template-columns: minmax(0, 1fr); } }
.figure { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; background: var(--sea); }
.figure > img { display: block; width: 100%; height: 100%; object-fit: cover; }
.figure.sk > img { filter: saturate(0.35) sepia(0.25); }
.pin { position: absolute; transform: translate(-14px, -50%); display: flex; align-items: center; gap: 6px; font-size: 13px; }
.pin.left { transform: translate(calc(-100% + 14px), -50%); flex-direction: row-reverse; }
.pin > .ic, .pin > .fi { width: 28px; height: 28px; padding: 4px; border-radius: 50%; background: #fbfdfc; color: #17313a; border: 2px solid #17313a; box-shadow: 0 2px 6px rgba(3, 16, 26, 0.4); }
.pin > .fi { padding: 2px; }
.pin b { white-space: nowrap; font-weight: 500; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 2px 8px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.pinlist { display: none; list-style: none; margin: 0; padding: 0; font-size: 14px; } .pinlist li { display: flex; gap: 8px; align-items: center; } .pinlist .fi { width: 20px; height: 20px; }
@media (max-width: 560px) { .pin b { display: none; } .pinlist { display: grid; gap: 3px; } }
.inset { position: absolute; right: 10px; bottom: 10px; width: 32%; display: grid; border-radius: 9px; overflow: hidden; border: 2px solid var(--node); background: var(--node); box-shadow: 0 4px 14px rgba(3, 16, 26, 0.35); }
.inset img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; } .inset small { display: flex; gap: 5px; align-items: center; padding: 3px 7px; font-size: 12px; line-height: 1.25; color: var(--ink); } .inset .ic { width: 15px; height: 15px; }
@media (max-width: 560px) { .inset { width: 42%; } }
.year { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 13px; }
.year div { border-top: 3px solid var(--edge); padding-top: 5px; } .year b { display: block; }
@media (max-width: 460px) { .year { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 14.5px; } .rows li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; } .rows .ic { color: var(--muted); margin-top: 1px; }

/* who starts */
.who-starts { display: grid; gap: 8px; }
.groups { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; }
.group { display: inline-flex; gap: 1px; align-items: flex-end; padding: 0 3px 3px; border-bottom: 2px solid var(--edge); }
.fcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; }
.fcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 6px; align-items: center; padding: 6px 8px; border-radius: 10px; background: var(--node); border: 1px solid var(--edge); min-width: 0; }
.fcard.none { background: none; border-style: dashed; color: var(--muted); } .fcard.has { border-color: var(--accent); }
.fcard b { font: italic 700 15px/1.2 var(--display); overflow-wrap: anywhere; } .fcard .fi { width: 24px; height: 24px; }
.fcard .faces, .fcard small { grid-column: 1 / -1; } .faces { display: flex; flex-wrap: wrap; gap: 1px; align-items: flex-end; min-height: 26px; }
.fcard small { font-size: 12.5px; }
.picked { min-height: 1.4em; display: block; }
.pyr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 3px 6px; align-items: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.pyr .lab { text-align: center; color: var(--muted); } .pyr .n { color: var(--muted); min-width: 2.2em; } .pyr .n.f { text-align: right; }
.pyr .pb { display: flex; height: 12px; } .pyr .pb.l { justify-content: flex-end; }
.pyr .pb i { display: flex; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--muted) 45%, transparent); } .pyr .pb.l i { justify-content: flex-end; } .pyr .pb i b { background: var(--accent); }

/* story starts: the same cards on both steps */
.stories { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.story { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 3px 8px; align-items: center; text-align: left; border-radius: 12px; padding: 8px 10px; background: var(--node); }
.story > .ic { width: 22px; height: 22px; color: var(--accent); } .story b { font-size: 15px; }
.story small { grid-column: 1 / -1; font-size: 12.5px; line-height: 1.3; }
.story .few { grid-column: 1 / -1; display: flex; align-items: flex-end; gap: 0; font-size: 12.5px; color: var(--muted); min-height: 22px; } .story .few .pf { width: 20px; height: 20px; margin-right: -3px; } .story .few span { margin-left: 8px; }
.story:hover { background: var(--pick); }
.story[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--pick); }

.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; border-top: 1px solid var(--edge); padding-top: 14px; }
.foot label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); width: 190px; max-width: 100%; } .foot .grow { flex: 1 1 0; }
.seedrow { display: flex; gap: 6px; } .seedrow button { flex: none; padding: 6px 10px; }
.loading { text-align: center; padding: 70px 0; display: grid; gap: 14px; justify-items: center; }
.bar { width: min(280px, 100%); height: 6px; border-radius: 3px; background: var(--edge); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.9s ease-out; }
.toast { background: var(--ink); color: var(--panel); border-radius: 12px; padding: 12px 16px; }

/* step 2: the game. The map is dragged; a farm is clicked; its people are in the panel. */
.game { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; aspect-ratio: 16 / 10; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(3, 16, 26, 0.28); background: var(--sea); }
.view { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.view.drag { cursor: grabbing; }
.map { position: absolute; left: 0; top: 0; will-change: transform; } .map.glide { transition: transform 0.5s ease; }
.map > img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
.fpin { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; padding: 0; border: 0; background: none; border-radius: 0; font-size: 13px; }
.fpin .fi { width: 34px; height: 34px; padding: 2px; border-radius: 50%; background: #fbfdfc; border: 2px solid #17313a; box-shadow: 0 2px 6px rgba(3, 16, 26, 0.45); }
.fpin b { position: absolute; top: 100%; margin-top: 3px; white-space: nowrap; font-weight: 500; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 1px 8px; display: none; }
.fpin:hover b, .fpin.on b { display: block; } .fpin:hover { z-index: 3; }
.fpin.on { z-index: 2; } .fpin.on .fi { border-color: #f6e7a8; box-shadow: 0 0 0 3px #23685a, 0 2px 8px rgba(3, 16, 26, 0.5); }
.fpin.hit .fi { box-shadow: 0 0 0 3px #f6e7a8, 0 2px 8px rgba(3, 16, 26, 0.5); }
.vname { position: absolute; transform: translate(-50%, -100%); font: italic 700 20px var(--display); color: #fff; text-shadow: 0 1px 3px #06202c, 0 0 8px #06202c; pointer-events: none; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .map.glide, .bar i { transition: none; } }
.gp { position: absolute; padding: 14px 16px; display: grid; gap: 10px; align-content: start; }
.list-p { left: 12px; top: 12px; width: 300px; max-height: calc(100% - 24px); overflow-y: auto; }
.card-p { right: 12px; top: 12px; width: 300px; max-height: calc(100% - 92px); overflow-y: auto; }
.offer { right: 12px; bottom: 12px; display: flex; gap: 8px; padding: 10px 12px; border-radius: 999px; }
.gp h2 { font-size: 20px; } .list-p .stories { grid-template-columns: minmax(0, 1fr); }
.villages { display: flex; flex-wrap: wrap; gap: 6px; } .villages button { padding: 4px 12px; font-size: 14px; }
.villages button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: transparent; }
.hhead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; } .hhead .fi { width: 44px; height: 44px; grid-row: 1 / span 2; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 4px; }
.person { display: grid; justify-items: center; gap: 0; padding: 4px 2px; border-radius: 10px; border-color: transparent; font-size: 12.5px; line-height: 1.2; text-align: center; }
.person .pf { width: 40px; height: 40px; } .person small { font-size: 11.5px; }
.person:hover:not(:disabled) { background: var(--pick); } .person[aria-pressed="true"] { background: var(--pick); border-color: var(--accent); }
.person.hit .pf { filter: drop-shadow(0 0 2px var(--sketch)); }
.detail { display: grid; gap: 8px; border-top: 1px solid var(--edge); padding-top: 10px; }
.posline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; } .posline .ic { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 99px; background: var(--pick); font-size: 14px; } .chip .ic { width: 16px; height: 16px; color: var(--accent); }
@media (max-width: 900px) {
  .game { aspect-ratio: auto; overflow: visible; box-shadow: none; display: grid; gap: 12px; border-radius: 0; background: none; }
  .view { position: relative; aspect-ratio: 4 / 3; border-radius: 16px; }
  .gp { position: static; width: auto; max-height: none; } .list-p .stories { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .offer { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); justify-content: flex-end; z-index: 3; order: 9; }
  .card-p { order: 1; } .list-p { order: 2; }
}
</style>

  setTimeout(() => { if ($('lt')) $('lt').textContent = scen().key === 'founders' ? 'Settling the founders' : 'Waking the villages'; }, 450);
  setTimeout(() => {
    const w = worldOf(S.sc), p = w.people.find((x) => isLife(scen().lives[0][0], x)) || w.people.find((x) => x.a >= ADULT);
    S.step = 2; S.done = false; S.story = null; S.suggested = p.id; choose(p); draw();
  }, 1000);

  $('app').innerHTML = `
    <div class="view" id="view"><div class="map" id="map" style="width:${w.map.w * K}px;height:${w.map.h * K}px"><img src="${w.map.src}" alt="The map" draggable="false">
      ${w.farms.map((x) => `<button type="button" class="fpin${x === f ? ' on' : ''}${x.people.some(hit) ? ' hit' : ''}" data-farm="${x.id}" style="left:${x.px}%;top:${x.py}%" aria-label="${esc(x.name)}, ${esc(x.village.name)}">${farmImg(x)}<b>${esc(x.name)}</b></button>`).join('')}</div></div>
    <section class="gp list-p panel">
      <div class="head"><h2>Whom to play</h2><span class="stepno">Step 2 of 2</span></div>
      <small>Drag the map and click a farm, or begin from an archetype.</small>
      ${w.villages.length > 1 ? `<div class="villages">${w.villages.map((v) => `<button type="button" data-v="${v.id}" aria-pressed="${v === f.village}">${esc(v.name)}</button>`).join('')}</div>` : ''}
      <h3>Story archetypes ${tag('sketch')}</h3>${stories(s, S.story)}
    </section>
    <section class="gp card-p panel">
      <div class="hhead">${farmImg(f)}<h2>${esc(f.name)}</h2><span class="muted">${esc(f.village.name)}${f.people.length ? ` · ${f.food} days of food` : ''}</span></div>
      <small>${esc(f.people.length ? f.village.note : f.empty + ' No one to play here; a younger child or a servant may claim it at the moving round.')}</small>
      <div class="people">${f.people.map((x) => `<button type="button" class="person${hit(x) ? ' hit' : ''}" data-p="${x.id}" aria-pressed="${x === p}" ${x.a < ADULT ? 'disabled' : ''}>${face(x)}${esc(x.n.split(' ')[0])}<small>${x.a}</small></button>`).join('')}</div>
      ${p ? `<div class="detail"><div><h2>${esc(p.n)}${p.id === S.suggested ? ' ' + star() : ''}</h2><span class="posline">${icon(LIFE_ICON[p.r])}${p.a} · ${esc(POS[p.r].name.toLowerCase())}</span></div>
        <p class="muted">${HARD[p.r]}</p>
        <ul class="rows"><li>${icon('next')}<span>${next ? `After ${p.s === 'm' ? 'him' : 'her'}, you go on as ${esc(next.n.split(' ')[0])}${next.r === 'heir' || next.r === 'heiress' ? ', the heir' : ''}` : 'No one after: the line would break'}</span></li></ul>
        <h3>Can ${tag('designed')}</h3>${chips(canOf(p))}
        <h3>Ahead ${tag('designed')}</h3>${chips(NEXT[p.r])}</div>` : ''}
    </section>
    <div class="gp offer panel"><button type="button" id="back2">Back</button><button type="button" id="watch">Watch only</button><button type="button" class="primary" id="play" ${p ? '' : 'disabled'}>${p ? `Play as ${esc(p.n.split(' ')[0])}` : 'No one here'}</button></div>`;
  place(f);
}
// The map's place under the view: where it was dragged to, or gliding to the chosen farm, kept clear of the panels on a wide page.
function clampPan(x, y) { const v = $('view'), m = $('map'); return { x: Math.min(0, Math.max(v.clientWidth - m.offsetWidth, x)), y: Math.min(0, Math.max(v.clientHeight - m.offsetHeight, y)) }; }
function place(f) {
  const v = $('view'), m = $('map'), old = S.pan;
  if (!S.pan || S.center) S.pan = clampPan(v.clientWidth / 2 - (f.px / 100) * m.offsetWidth, v.clientHeight * 0.5 - (f.py / 100) * m.offsetHeight);
  if (S.center && old) { m.style.transform = `translate(${S.last ? S.last.x : old.x}px, ${S.last ? S.last.y : old.y}px)`; m.getBoundingClientRect(); m.classList.add('glide'); }
  S.center = false; S.last = S.pan; m.style.transform = `translate(${S.pan.x}px, ${S.pan.y}px)`;
}
let drag = null, dragged = false;
$('app').addEventListener('pointerdown', (e) => { const v = e.target.closest('#view'); if (!v || !S.pan) return; drag = { x: e.clientX, y: e.clientY, px: S.pan.x, py: S.pan.y, id: e.pointerId }; dragged = false; });
window.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (!dragged && Math.hypot(dx, dy) < 5) return;
  dragged = true; $('view').classList.add('drag'); $('map').classList.remove('glide');
  S.pan = S.last = clampPan(drag.px + dx, drag.py + dy); $('map').style.transform = `translate(${S.pan.x}px, ${S.pan.y}px)`;
});
window.addEventListener('pointerup', () => { if (drag && $('view')) $('view').classList.remove('drag'); drag = null; });
$('app').addEventListener('wheel', (e) => { if (!e.target.closest('#view') || !S.pan) return; e.preventDefault(); $('map').classList.remove('glide');
  S.pan = S.last = clampPan(S.pan.x - e.deltaX, S.pan.y - e.deltaY); $('map').style.transform = `translate(${S.pan.x}px, ${S.pan.y}px)`; }, { passive: false });

function draw() {
  const game = S.step === 2 && !S.done;
  $('app').className = game ? 'game' : 'sheet panel';
  $('stage').style.backgroundImage = `url(${pic(S.sc)})`;
  $('mockbar').innerHTML = `<b>Mock</b><span>${game ? 'The game after the land is raised. The map is a picture of the game\'s; people, portraits and farm icons are the game\'s own.' : 'People, portraits and pictures are the game\'s, for seed 7 on a tiny map, whatever is set below.'}</span>
    <span class="legend"><span>${tag('built')} in the game</span><span>${tag('designed')} in design.md</span><span>${tag('sketch')} an idea</span></span>`;
  if (S.step === 1) step1(); else step2();
}

$('app').addEventListener('click', (e) => {
  if (dragged) { dragged = false; e.preventDefault(); return; }
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset, w = worldOf(S.sc), go = (p) => { choose(p); S.pan = S.last; S.center = true; };
  if (d.sc) { S.sc = d.sc; S.peek = S.hover = null; }
  else if (d.story && S.step === 1) S.peek = S.peek === d.story ? null : d.story;
  else if (d.story) { const who = w.people.filter((p) => isLife(d.story, p)), i = S.story === d.story ? who.findIndex((p) => p.id === S.pawn) : -1; S.story = d.story; go(who[(i + 1) % who.length]); }
  else if (d.v) go(w.villages[+d.v].farms.flatMap((x) => x.people).find((p) => p.a >= ADULT))
  else if (d.farm) { const f = w.farms.find((x) => x.id === +d.farm), p = f.people.find((x) => S.story && isLife(S.story, x)) || f.people.find((x) => x.a >= ADULT); S.farm = f.id; S.pawn = p ? p.id : -1; S.pan = S.last; S.center = true; }
  else if (d.p) S.pawn = +d.p;
  else if (b.id === 'reroll') S.seed = (Math.random() * 1e6) | 0;
  else if (b.id === 'go') { loading(); return; }
  else if (b.id === 'back2' || b.id === 'restart') { S.step = 1; S.done = false; }
  else if (b.id === 'play') S.done = true;
  else if (b.id === 'again') S.done = false, S.pan = null;
  else if (b.id === 'watch') { $('app').className = 'sheet panel'; $('app').innerHTML = `${headBar('Whom to play')}<div class="toast"><b>The game goes on with no one played,</b> as it does today after "Not now".</div><div class="foot"><span class="grow"></span><button type="button" id="again">Choose someone</button></div>`; return; }
  else return;
  draw();
});
// Pointing at a story archetype shows who they are, in "Who starts" only; nothing is chosen by it, and nothing moves.
const look = (k) => { if (S.step !== 1 || S.hover === k) return; S.hover = k; const el = $('who'); if (el) el.innerHTML = households(scen()); };
$('app').addEventListener('mouseover', (e) => { const b = e.target.closest('[data-story]'); if (b) look(b.dataset.story); });
$('app').addEventListener('mouseout', (e) => { const b = e.target.closest('[data-story]'); if (b && !b.contains(e.relatedTarget)) look(null); });
$('app').addEventListener('change', (e) => {
  if (e.target.id === 'size') S.size = e.target.value;
  else if (e.target.id === 'seed') S.seed = +String(e.target.value).replace(/\D/g, '').slice(0, 9) || 0;
  else return;
  draw();
});
draw();
</script>
