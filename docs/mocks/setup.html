<title>Skärgård Setup Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: the game's menu card (src/head.html: .panel, .genscreen) over a picture of the chosen scenario, as the main menu lies over its showcase island. */
/* Step 1 comes in three layouts, chosen in the mock's bar: a, the menu card; b, picture cards; c, the annotated picture. */
/* Tokens are the game's own (src/head.html), with a few added for the status tags and the chart. */
:root {
  --sea: #16395f; --sea-deep: #0d2642;
  --panel: rgba(238, 245, 242, 0.88); --ink: #17313a; --muted: #526d75; --edge: rgba(23, 49, 58, 0.14);
  --accent: #23685a; --on-accent: #f2f8f6; --node: #fbfdfc; --good: #2f7a4b; --bad: #a8432f;
  --pick: rgba(35, 104, 90, 0.10); --sketch: #7a5a1e;
  --display: 'Alegreya', Georgia, serif; --body: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(11, 27, 34, 0.86); --ink: #e1ebe7; --muted: #93adae; --edge: rgba(225, 235, 231, 0.14);
    --accent: #84c9b5; --on-accent: #0c1f25; --node: #17323b; --good: #8fd0a2; --bad: #f0a08c;
    --pick: rgba(132, 201, 181, 0.13); --sketch: #e0bd77; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(11, 27, 34, 0.86); --ink: #e1ebe7; --muted: #93adae; --edge: rgba(225, 235, 231, 0.14);
  --accent: #84c9b5; --on-accent: #0c1f25; --node: #17323b; --good: #8fd0a2; --bad: #f0a08c;
  --pick: rgba(132, 201, 181, 0.13); --sketch: #e0bd77; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--sea); }
body {
  margin: 0; min-height: 100%; color: var(--ink); font: 16px/1.4 var(--body); -webkit-font-smoothing: antialiased;
  background: var(--sea-deep);
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; font-size: 15px; font-weight: 500; line-height: 1.2; border: 1px solid var(--edge); background: transparent; border-radius: 999px; padding: 7px 14px; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button:disabled { opacity: 0.5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1 { font: italic 700 30px/1.1 var(--display); text-wrap: balance; }
h2 { font: italic 700 22px/1.15 var(--display); text-wrap: balance; }
h3 { font-size: 13px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
small, .muted { color: var(--muted); font-size: 14px; }

.sheet { max-width: 1080px; margin: 0 auto; background: var(--panel); border-radius: 16px; padding: 20px 22px; display: grid; gap: 16px;
  box-shadow: 0 10px 30px rgba(3, 16, 26, 0.28); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); position: relative; z-index: 1; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.head h1 { flex: 1 1 auto; }
.steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--muted); }
.steps li { padding: 3px 10px; border-radius: 99px; border: 1px solid var(--edge); }
.steps li[aria-current] { background: var(--ink); color: var(--panel); border-color: transparent; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px;
  border: 1px solid currentColor; white-space: nowrap; vertical-align: 1px; }
.tag.built { color: var(--good); } .tag.designed { color: var(--accent); border-style: dashed; } .tag.sketch { color: var(--sketch); border-style: dotted; }

.panes { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; align-items: start; }
.panes > * { min-width: 0; display: grid; gap: 12px; }
@media (max-width: 760px) { .panes { grid-template-columns: minmax(0, 1fr); } }

/* choices: one row each; the picked one is tinted, nothing else is boxed */
.choices { display: grid; gap: 4px; }
.choice { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; padding: 9px 12px; border-color: transparent; background: none; }
.choice:hover { background: var(--pick); }
.choice[aria-pressed="true"] { background: var(--pick); border-color: var(--accent); }
.choice b { font-size: 17px; } .choice small { grid-column: 1 / -1; }
.choice .tag { align-self: center; }

.detail { border-left: 1px solid var(--edge); padding-left: 18px; }
@media (max-width: 760px) { .detail { border-left: 0; padding-left: 0; border-top: 1px solid var(--edge); padding-top: 14px; } }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 15px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 15px; }
.year { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 13.5px; }
.year div { border-top: 3px solid var(--edge); padding-top: 5px; } .year b { display: block; }
@media (max-width: 460px) { .year { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.lives { display: flex; flex-wrap: wrap; gap: 6px; }
.lives button { padding: 4px 11px; font-size: 14px; border-radius: 99px; }
.lives button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: transparent; }

.mapform { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 12px; align-items: start; }
.mapform label { display: grid; gap: 3px; font-size: 14px; color: var(--muted); }
.mapform input, .mapform select { padding: 6px 9px; border-radius: 10px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); min-width: 0; width: 100%; }
.seedrow { display: flex; gap: 6px; } .seedrow button { flex: none; padding: 6px 10px; }
canvas.chart { width: 100%; height: auto; border-radius: 10px; display: block; background: #16395f; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; border-top: 1px solid var(--edge); padding-top: 14px; }
.foot .muted { flex: 1 1 240px; }

/* step 2 */
.villages { display: flex; flex-wrap: wrap; gap: 6px; }
.villages button { padding: 5px 12px; font-size: 14px; text-align: left; }
.villages button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: transparent; }
.farm { display: grid; gap: 2px; padding-top: 8px; border-top: 1px solid var(--edge); }
.farm > header { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.farm > header b { font: italic 700 18px var(--display); }
.pawn { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; text-align: left; padding: 5px 8px; border-color: transparent; background: none; }
.pawn:hover:not(:disabled) { background: var(--pick); }
.pawn[aria-pressed="true"] { background: var(--pick); border-color: var(--accent); }
.pawn.dim { opacity: 0.38; }
.pawn small { display: block; }
.face { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #f2f8f6; }
.face.big { width: 56px; height: 56px; font-size: 20px; }
.who { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; }
.scroll { max-height: 560px; overflow-y: auto; padding-right: 4px; display: grid; gap: 10px; }
@media (max-width: 760px) { .scroll { max-height: none; } }
.loading { text-align: center; padding: 70px 0; display: grid; gap: 14px; justify-items: center; }
.bar { width: min(280px, 100%); height: 6px; border-radius: 3px; background: var(--edge); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.9s ease-out; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
.toast { background: var(--ink); color: var(--panel); border-radius: 12px; padding: 12px 16px; }

/* the stage behind the panel, under the menu's veil of sea */
.stage { position: fixed; inset: 0; background: var(--sea) center / cover no-repeat; transition: background-image 0.4s; }
.stage::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(22, 57, 95, 0.22) 0%, rgba(13, 38, 66, 0.62) 100%); }
.stage.far::after { background: rgba(13, 38, 66, 0.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
@media (prefers-reduced-motion: reduce) { .stage { transition: none; } }
.mockbar { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  font-size: 13px; color: var(--muted); background: var(--panel); border: 1px dashed var(--edge); border-radius: 12px; padding: 7px 12px; }
.mockbar button { padding: 3px 11px; font-size: 13px; }
.mockbar button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: transparent; }
.mockbar .legend { margin-left: auto; }
.choice, .pawn { border-radius: 12px; }
label .tag { justify-self: start; }
.sheet.a { max-width: 384px; margin-left: max(0px, 5vw); gap: 14px; }
.sheet.c { max-width: 1180px; }
@media (max-width: 760px) { .sheet.a { margin-left: auto; } }
.sheet.a label, .land2 label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.sheet select, .sheet input { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); min-width: 0; width: 100%; }
.sheet.a button.primary { min-height: 44px; }
.land2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stepper { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; text-align: center; }
.stepper button { width: 38px; height: 38px; padding: 0; font-size: 18px; }
.stepper b { display: block; font: italic 700 22px/1.15 var(--display); }
.dots { display: flex; justify-content: center; gap: 5px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--edge); } .dots i.on { background: var(--accent); }
/* who starts, drawn: one mark a person, one underline a farm */
.strip { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; }
.strip .vl { flex-basis: 100%; font-size: 12px; color: var(--muted); margin-bottom: -4px; }
.hh { display: inline-flex; gap: 3px; align-items: flex-end; padding: 0 2px 4px; border-bottom: 2px solid var(--edge); min-height: 18px; }
.hh.none { border: 1.5px dashed var(--muted); border-radius: 3px; width: 26px; height: 16px; padding: 0; opacity: 0.7; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.h { background: var(--accent); width: 12px; height: 12px; } .dot.c { width: 6px; height: 6px; opacity: 0.75; }
.dot.s { background: none; border: 2px solid var(--muted); }
.strip.tiny { gap: 6px 8px; } .strip.tiny .hh { gap: 2px; padding: 4px; border: 0; border-radius: 5px; background: var(--pick); min-height: 0; flex-wrap: wrap; align-items: center; max-width: 86px; }
.strip.tiny .dot { width: 4px; height: 4px; } .strip.tiny .dot.h { width: 5px; height: 5px; } .strip.tiny .dot.c { width: 3px; height: 3px; }
.key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); align-items: center; }
.key span { display: inline-flex; gap: 5px; align-items: center; }
/* b: picture cards */
.cards { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 10px; overflow-x: auto; padding: 2px 2px 8px; }
.card { display: grid; gap: 4px; padding: 0 0 8px; text-align: left; border-radius: 12px; overflow: hidden; background: var(--node); align-content: start; }
.card img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
.card > *:not(img) { margin: 0 9px; } .card b { font-size: 15px; } .card small { font-size: 12.5px; line-height: 1.3; }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.card.sk img { filter: saturate(0.35) sepia(0.25); }
/* c: the annotated picture */
.cgrid { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 5fr); gap: 18px; align-items: start; }
.cgrid > * { min-width: 0; display: grid; gap: 12px; }
@media (max-width: 860px) { .cgrid { grid-template-columns: minmax(0, 1fr); } }
.figure { position: relative; margin: 0; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; background: var(--sea); }
.figure img { display: block; width: 100%; height: 100%; object-fit: cover; }
.figure.sk img { filter: saturate(0.35) sepia(0.25); }
.pin { position: absolute; transform: translate(-9px, -50%); display: flex; align-items: center; gap: 6px; font-size: 13px; }
.pin i { flex: none; width: 18px; height: 18px; border-radius: 50%; background: #fbfdfc; color: #17313a; border: 2px solid #17313a; font-style: normal; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.pin b { white-space: nowrap; font-weight: 500; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 2px 8px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.pin.left { transform: translate(calc(-100% + 9px), -50%); flex-direction: row-reverse; }
.pinlist { display: none; margin: 0; padding-left: 20px; font-size: 14px; }
@media (max-width: 560px) { .pin b { display: none; } .pinlist { display: grid; gap: 2px; } }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: transparent; }
.tabs button.sk { border-style: dotted; }
.seen { position: fixed; z-index: 1; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(340px, 40vw); margin: 0; font-size: 14px;
  background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 8px 12px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
@media (max-width: 760px) { .seen { position: static; max-width: none; margin: 12px auto 0; } }
.inset { position: absolute; right: 10px; bottom: 10px; width: 32%; display: grid; border-radius: 9px; overflow: hidden; border: 2px solid var(--node); background: var(--node); box-shadow: 0 4px 14px rgba(3, 16, 26, 0.35); }
.inset img { aspect-ratio: 16 / 10; } .inset small { padding: 3px 7px; font-size: 12px; line-height: 1.25; color: var(--ink); }
@media (max-width: 560px) { .inset { width: 42%; } }
</style>

<div class="stage" id="stage"></div>
<div class="mockbar" id="mockbar"></div>
<p class="seen" id="seen" hidden></p>
<main class="sheet" id="app"></main>

<script>
// A clickable mock of the screens after "New archipelago". Nothing here reads the game: the people are invented from design.md, section 14.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mulberry32 = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const TAG = { built: 'Built', designed: 'Designed', sketch: 'Sketch' };
const tag = (k) => `<span class="tag ${k}">${TAG[k]}</span>`;
const ADULT = 18;

const SIZES = {
  t: { name: 'Tiny', tiles: '120 × 85', pop: '130–170', note: 'A handful of villages; quick to learn on.' },
  s: { name: 'Small', tiles: '180 × 130', pop: '320–380', note: 'Room for a second culture across the water.' },
  m: { name: 'Medium', tiles: '280 × 200', pop: '800–950', note: 'The reference: about 1,000 living late in the game.' },

  { key: 'heirs', name: 'Heirs and empty farms', status: 'built', line: 'Two old villages, three generations, and more heirs than farms.',

  { key: 'populous', name: 'Populous Villages', status: 'built', line: 'A settled archipelago, already full of neighbours.',

];

// ---- positions: what each commands and what lies ahead, from design 1, 5, 10 and 15 ----
const POS = {
  holder: { name: 'Holder', commands: ['Directs the household: places the next field, meadow or building and sets the season\'s work',

      let age = Math.min(26, ha - 22), son = false; const kids = [];
      while (age > 0 && kids.length < 6) { const s = r() < 0.5 ? 'm' : 'f'; kids.push([s, age]); age -= 2 + ((r() * 2) | 0); }
      kids.forEach(([s, a], k) => {

}

// ---- the chart: a stand-in island from the seed (the game would show its own minimap) ----
function drawChart(cv, seed, marks, sel) {
  const W = 66, H = 46, c = cv.getContext('2d'), r = mulberry32(seed + 1), blobs = [];
  cv.width = W * 4; cv.height = H * 4;
  for (let i = 0; i < 7; i++) blobs.push([10 + r() * (W - 20), 9 + r() * (H - 18), 7 + r() * 10]);
  const hgt = (x, y) => { let h = 0; for (const [bx, by, br] of blobs) { const d = Math.hypot(x - bx, y - by) / br; h = Math.max(h, 1 - d); } return h > 0 ? h + Math.sin(x * 1.3 + seed) * Math.cos(y * 1.1 - seed) * 0.1 : h; };
  const land = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const h = hgt(x + (y % 2) * 0.5, y);
    c.fillStyle = h > 0.86 ? '#8c9186' : h > 0.5 ? '#4f7b4c' : h > 0.14 ? '#86a65e' : h > 0.05 ? '#d9cfa0' : h > -0.1 ? '#2a5d86' : '#16395f';
    c.fillRect(x * 4 + (y % 2) * 2, y * 4, 4, 4);
    if (h > 0.16 && h < 0.5) land.push([x, y]);
  }
  const spots = [];
  for (let i = 0; i < marks && land.length; i++) {
    let best = null, bd = -1;
    for (let k = 0; k < 30; k++) { const p = land[(r() * land.length) | 0], d = Math.min(99, ...spots.map((s) => Math.hypot(s[0] - p[0], s[1] - p[1]))); if (d > bd) { bd = d; best = p; } }
    spots.push(best);
  }
  spots.forEach(([x, y], i) => {
    c.beginPath(); c.arc(x * 4 + 2, y * 4 + 2, i === sel ? 7 : 4.5, 0, 7);
    c.fillStyle = i === sel ? '#f6e7a8' : '#fbfdfc'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#17313a'; c.stroke();
  });
  return spots.map(([x, y]) => [(x * 4 + 2) / cv.width, (y * 4 + 2) / cv.height]);
}

    return;
  }
  $('app').innerHTML = `${headBar('Whom to play')}
  <div class="panes">
    <section>
      <div class="mapform">
        <div style="display:grid;gap:6px"><h2>${esc(scen().name)}</h2>
          <small>Seed ${S.seed}, ${SIZES[S.size].name.toLowerCase()} map. ${living} living in ${S.world.length} village${S.world.length > 1 ? 's' : ''}${S.sc === 'populous' && S.size !== 't' ? ' shown here; the game would list them all' : ''}.</small></div>
        <canvas class="chart" id="chart2" aria-label="The villages on the chart; click one to choose it" style="cursor:pointer"></canvas>
      </div>
      <div class="villages">${S.world.map((x, i) => `<button type="button" data-v="${i}" aria-pressed="${i === S.village}">${esc(x.name)} <small style="color:inherit;opacity:.7">${x.farms.length} farms</small></button>`).join('')}</div>
      <small>${esc(v.note)} ${tag('built')}</small>
      <div class="lives">${FILTERS.map(([k, l]) => `<button type="button" data-only="${k}" aria-pressed="${S.only === k}">${l}</button>`).join('')}</div>
      <div class="scroll">${v.farms.map((fm) => `<div class="farm"><header><b>${esc(fm.name)}</b>${fm.tests ? `<small>${esc(fm.tests)}</small>` : ''}</header>
        ${fm.empty ? `<small>${esc(fm.empty)} No one to play here, but a younger child or a servant may claim it at the moving round.</small>` : fm.people.map((x) => `
          <button type="button" class="pawn${inFilter(x) && x.a >= ADULT ? '' : ' dim'}" data-p="${x.id}" aria-pressed="${x.id === S.pawn}" ${x.a < ADULT ? 'disabled' : ''}>
            ${face(x)}<span>${esc(x.n)}<small>${x.a}, ${esc(POS[x.r].name.toLowerCase())}${x.a < ADULT ? ', too young to play' : ''}</small></span>${x.id === S.suggested ? '<span class="tag built">Suggested</span>' : ''}</button>`).join('')}</div>`).join('')}</div>
    </section>
    <section class="detail">
      <div class="who">${face(p, true)}<div><h2>${esc(p.n)}</h2><span>${p.a}, ${esc(pos.name.toLowerCase())} at ${esc(f.name)}, ${esc(S.world[p.village].name)}</span></div></div>
      ${p.note ? `<p>${esc(p.note)}</p>` : ''}
      <h3>What this position commands ${tag('designed')}</h3>
      <ul class="plain">${pos.commands.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <h3>What lies ahead ${tag('designed')}</h3>
      <ul class="plain">${pos.ahead.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <h3>The household ${tag('built')}</h3>
      <dl class="facts">
        <dt>Under one roof</dt><dd>${kin.length ? kin.map((x) => `${esc(x.n.split(' ')[0])} (${x.a})`).join(', ') : 'No one else'}</dd>
        <dt>Food laid by</dt><dd>${days} days of need${days >= 365 ? ', and seed' : ''}</dd>
        <dt>If ${p.s === 'm' ? 'he' : 'she'} dies</dt><dd>You go on as ${next ? esc(next.n.split(' ')[0]) + (next.r === 'heir' || next.r === 'heiress' ? ', the heir' : '') + ', or another of the household or its kin' : 'any adult, and the chronicle marks the break in the line'}</dd>
      </dl>
      <h3>How hard a life ${tag('sketch')}</h3>
      <p class="muted">${{ holder: 'Secure. The most to decide from the first day.', widow: 'Secure while she lives; the line hangs on one child.', bachelor: 'Secure, and a dead end unless he marries.',
        spouse: 'Secure, with little formal say. Influence runs through ties and prestige.', heir: 'A waiting game: nothing is his until he marries.',
        heiress: 'Sought after. The marriage decides everything.', child: 'Open and insecure: every road leads away from home.', servant: 'The hardest start. Nothing to lose.' }[p.r]}</p>
    </section>
  </div>
  <div class="foot"><span class="muted">You can change your mind later: the pawn panel lets you play any living adult.</span>
    <button type="button" id="back2">Back</button><button type="button" id="watch">Watch without playing</button><button type="button" class="primary" id="play">Play as ${esc(p.n.split(' ')[0])}</button></div>`;
  S.spots = drawChart($('chart2'), S.seed, S.world.length, S.village);
}
function draw() {
  $('app').className = 'sheet ' + (S.step === 1 ? S.lay : 'wide');
  const far = S.step === 2 || S.lay !== 'a';
  $('stage').className = 'stage' + (far ? ' far' : ''); $('stage').style.backgroundImage = `url(${pic(S.sc, S.step === 2)})`;
  $('mockbar').innerHTML = `<b>Mock</b>${S.step === 1 ? `<span>Layout of this step:</span>${LAYS.map(([k, l]) => `<button type="button" data-lay="${k}" aria-pressed="${S.lay === k}">${l}</button>`).join('')}` : '<span>Step 2 keeps one layout for now.</span>'}
    <span class="legend">${tag('built')} in the game ${tag('designed')} in design.md ${tag('sketch')} an idea</span>`;
  const see = SEE[S.sc];
  $('seen').hidden = !(S.step === 1 && S.lay === 'a'); $('seen').textContent = see ? see.text : 'A stand-in picture: this scenario is a sketch.';
  if (S.step === 1) step1(); else step2();
}
$('mockbar').addEventListener('click', (e) => { const b = e.target.closest('[data-lay]'); if (b) { S.lay = b.dataset.lay; draw(); } });

$('app').addEventListener('click', (e) => {
  const b = e.target.closest('button, canvas'); if (!b) return;
  const d = b.dataset;
  if (b.id === 'chart2') {
    const q = b.getBoundingClientRect(), x = (e.clientX - q.left) / q.width, y = (e.clientY - q.top) / q.height;
    let best = 0, bd = 9; S.spots.forEach(([sx, sy], i) => { const dd = Math.hypot(sx - x, sy - y); if (dd < bd) { bd = dd; best = i; } });
    S.village = best; draw(); return;
  }
  if (d.sc) { S.sc = d.sc; S.life = null; }
  else if (d.life) S.life = d.life;
  else if (d.v) S.village = +d.v;
  else if (d.only) S.only = d.only;
  else if (d.p) S.pawn = +d.p;
  else if (b.id === 'reroll') S.seed = (Math.random() * 1e6) | 0;
  else if (b.id === 'go') { loading(); return; }
  else if (b.id === 'back1') return;
  else if (b.id === 'back2' || b.id === 'restart') { S.step = 1; S.done = false; }
  else if (b.id === 'play') S.done = true;
  else if (b.id === 'again') S.done = false;
  else if (b.id === 'watch') { $('app').innerHTML = `${headBar('Whom to play')}<div class="toast"><b>The game would begin with no one played,</b> as it does today after "Not now".</div><div class="foot"><button type="button" id="again">Choose someone</button></div>`; return; }
  else return;
  draw();
});
$('app').addEventListener('change', (e) => {
  if (e.target.id === 'size') S.size = e.target.value;
  else if (e.target.id === 'life') S.life = e.target.value;
  else if (e.target.id === 'seed') S.seed = +String(e.target.value).replace(/\D/g, '').slice(0, 9) || 0;
  else return;
  draw();
});
draw();
</script>
