<style>
/* Layout: the game's menu card (src/head.html: .panel, .genscreen) over a picture of the chosen scenario, as the main menu lies over its showcase island. */
/* Step 1 comes in three layouts, chosen in the mock's bar: a, the menu card; b, picture cards; c, the annotated picture. */
/* Tokens are the game's own (src/head.html), with a few added for the status tags and the chart. */
:root {
  --sea: #16395f; --sea-deep: #0d2642;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(11, 27, 34, 0.86); --ink: #e1ebe7; --muted: #93adae; --edge: rgba(225, 235, 231, 0.14);
    --accent: #84c9b5; --on-accent: #0c1f25; --node: #17323b; --good: #8fd0a2; --bad: #f0a08c;
    --pick: rgba(132, 201, 181, 0.13); --sketch: #e0bd77; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(11, 27, 34, 0.86); --ink: #e1ebe7; --muted: #93adae; --edge: rgba(225, 235, 231, 0.14);
  --accent: #84c9b5; --on-accent: #0c1f25; --node: #17323b; --good: #8fd0a2; --bad: #f0a08c;
  --pick: rgba(132, 201, 181, 0.13); --sketch: #e0bd77; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--sea); }
body {
  margin: 0; min-height: 100%; color: var(--ink); font: 16px/1.4 var(--body); -webkit-font-smoothing: antialiased;
  background: var(--sea-deep);
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; font-size: 15px; font-weight: 500; line-height: 1.2; border: 1px solid var(--edge); background: transparent; border-radius: 999px; padding: 7px 14px; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }

h1 { font: italic 700 30px/1.1 var(--display); text-wrap: balance; }

.sheet { max-width: 1080px; margin: 0 auto; background: var(--panel); border-radius: 16px; padding: 20px 22px; display: grid; gap: 16px;
  box-shadow: 0 10px 30px rgba(3, 16, 26, 0.28); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); position: relative; z-index: 1; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.head h1 { flex: 1 1 auto; }
.steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--muted); }
.steps li { padding: 3px 10px; border-radius: 99px; border: 1px solid var(--edge); }
.steps li[aria-current] { background: var(--ink); color: var(--panel); border-color: transparent; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }

.tag.built { color: var(--good); } .tag.designed { color: var(--accent); border-style: dashed; } .tag.sketch { color: var(--sketch); border-style: dotted; }

.panes { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; align-items: start; }

.choice, .pawn { border-radius: 12px; }
label .tag { justify-self: start; }

.sheet.c { max-width: 1180px; }

.sheet.a label, .land2 label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.sheet select, .sheet input { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--edge); background: var(--node); color: var(--ink); min-width: 0; width: 100%; }

.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.h { background: var(--accent); width: 12px; height: 12px; } .dot.c { width: 6px; height: 6px; opacity: 0.75; }

.key span { display: inline-flex; gap: 5px; align-items: center; }

.cgrid > * { min-width: 0; display: grid; gap: 12px; }

.figure img { display: block; width: 100%; height: 100%; object-fit: cover; }
.figure.sk img { filter: saturate(0.35) sepia(0.25); }
.pin { position: absolute; transform: translate(-9px, -50%); display: flex; align-items: center; gap: 6px; font-size: 13px; }
.pin i { flex: none; width: 18px; height: 18px; border-radius: 50%; background: #fbfdfc; color: #17313a; border: 2px solid #17313a; font-style: normal; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.pin b { white-space: nowrap; font-weight: 500; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 2px 8px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.pin.left { transform: translate(calc(-100% + 9px), -50%); flex-direction: row-reverse; }
.pinlist { display: none; margin: 0; padding-left: 20px; font-size: 14px; }
@media (max-width: 560px) { .pin b { display: none; } .pinlist { display: grid; gap: 2px; } }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: transparent; }
.tabs button.sk { border-style: dotted; }
.seen { position: fixed; z-index: 1; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(340px, 40vw); margin: 0; font-size: 14px;
  background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 8px 12px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

.inset img { aspect-ratio: 16 / 10; } .inset small { padding: 3px 7px; font-size: 12px; line-height: 1.25; color: var(--ink); }

/* icons, and the pins that carry them */
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.pin { transform: translate(-14px, -50%); }
.pin.left { transform: translate(calc(-100% + 14px), -50%); }

.pinlist { list-style: none; padding: 0; } .pinlist li { display: flex; gap: 8px; align-items: center; }
.inset small { display: flex; gap: 5px; align-items: center; } .inset .ic { width: 15px; height: 15px; }
.cards { grid-auto-columns: minmax(136px, 1fr); }

<script>
// A clickable mock of the screens after "New archipelago". Nothing here reads the game: the people are invented from design.md, section 14.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mulberry32 = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const TAG = { built: 'Built', designed: 'Designed', sketch: 'Sketch' };
const tag = (k) => `<span class="tag ${k}">${TAG[k]}</span>`;
const ADULT = 18;

const SIZES = {
  t: { name: 'Tiny', tiles: '120 × 85', pop: '130–170', note: 'A handful of villages; quick to learn on.' },
  s: { name: 'Small', tiles: '180 × 130', pop: '320–380', note: 'Room for a second culture across the water.' },
  m: { name: 'Medium', tiles: '280 × 200', pop: '800–950', note: 'The reference: about 1,000 living late in the game.' },
  l: { name: 'Large', tiles: '380 × 270', pop: '800–950', note: 'May reach about 2,000 living, at half the speed.' },
};

// ---- scenarios: three from design.md section 14, four sketches drawn from later slices ----
const SCENARIOS = [
  { key: 'founders', name: 'Founders', status: 'built', line: 'Ten strangers, a few houses, and land no one has broken.',
    start: '10 unrelated founders: four couples, a farmhand and a maid', gens: 'None on record', people: () => '10',
    land: 'Houses standing; next to no fields or meadows', stores: 'A year\'s food and seed; hay for one winter',
    customs: 'Old Nordic, but first cousins may marry: the founders\' grandchildren are mostly cousins',
    explores: 'The normal game. A frontier that grows faster than a settled society would.',
    year: [['Spring', 'Claim and break the first fields before the sowing window closes'], ['Summer', 'Find and clear hay meadows; make hay'],
      ['Autumn', 'A small first harvest; decide how many animals to keep'], ['Winter', 'Live on what you brought']],
    lives: [['holder', 'A founding holder', true], ['spouse', 'A founder\'s wife'], ['servant', 'The farmhand or the maid']] },

// ---- the chart: a stand-in island from the seed (the game would show its own minimap) ----
function drawChart(cv, seed, marks, sel) {
  const W = 66, H = 46, c = cv.getContext('2d'), r = mulberry32(seed + 1), blobs = [];
  cv.width = W * 4; cv.height = H * 4;
  for (let i = 0; i < 7; i++) blobs.push([10 + r() * (W - 20), 9 + r() * (H - 18), 7 + r() * 10]);
  const hgt = (x, y) => { let h = 0; for (const [bx, by, br] of blobs) { const d = Math.hypot(x - bx, y - by) / br; h = Math.max(h, 1 - d); } return h > 0 ? h + Math.sin(x * 1.3 + seed) * Math.cos(y * 1.1 - seed) * 0.1 : h; };
  const land = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const h = hgt(x + (y % 2) * 0.5, y);
    c.fillStyle = h > 0.86 ? '#8c9186' : h > 0.5 ? '#4f7b4c' : h > 0.14 ? '#86a65e' : h > 0.05 ? '#d9cfa0' : h > -0.1 ? '#2a5d86' : '#16395f';
    c.fillRect(x * 4 + (y % 2) * 2, y * 4, 4, 4);
    if (h > 0.16 && h < 0.5) land.push([x, y]);
  }
  const spots = [];
  for (let i = 0; i < marks && land.length; i++) {
    let best = null, bd = -1;
    for (let k = 0; k < 30; k++) { const p = land[(r() * land.length) | 0], d = Math.min(99, ...spots.map((s) => Math.hypot(s[0] - p[0], s[1] - p[1]))); if (d > bd) { bd = d; best = p; } }
    spots.push(best);
  }
  spots.forEach(([x, y], i) => {
    c.beginPath(); c.arc(x * 4 + 2, y * 4 + 2, i === sel ? 7 : 4.5, 0, 7);
    c.fillStyle = i === sel ? '#f6e7a8' : '#fbfdfc'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#17313a'; c.stroke();
  });
  return spots.map(([x, y]) => [(x * 4 + 2) / cv.width, (y * 4 + 2) / cv.height]);
}

      <small>${v.farms.length} farms, ${v.farms.reduce((n, f) => n + f.people.length, 0)} people</small></div>`).join('')}</div>${count}`;
    return `<div class="fcards">${w.map((v) => v.farms.map((f) => (f.empty ? `<div class="fcard none"><b>${esc(f.name)}</b><span class="figs">${icon(/ruin/.test(f.empty) ? 'ruin' : 'empty')}</span><small>${esc(f.empty.split('.')[0])}</small></div>`
      : `<div class="fcard"><b>${esc(f.name)}</b><span class="figs">${f.people.map(fig).join('')}</span>
        <small>${f.people.map((x) => x.a).join(' · ')}${f.tests && f.tests !== 'No field yet' ? `<br>${esc(f.tests)}` : ''}</small></div>`)).join('')).join('')}</div>
      <div class="key"><span>${fig({ n: '', a: 40, r: 'holder' })}holder</span><span>${fig({ n: '', a: 40, r: 'spouse' })}adult</span><span>${fig({ n: '', a: 8, r: 'minor' })}child</span><span>${fig({ n: '', a: 20, r: 'servant' })}servant</span></div>${w.length > 1 ? '' : count}`;
  }
  if (big) { // an age pyramid: women to the left, men to the right
    const bands = [[60, 200, '60 and over'], [45, 59, '45 to 59'], [30, 44, '30 to 44'], [18, 29, '18 to 29'], [10, 17, '10 to 17'], [0, 9, 'Under 10']];
    const rows = bands.map(([a, b, l]) => [l, a, all.filter((p) => p.a >= a && p.a <= b && p.s === 'f').length, all.filter((p) => p.a >= a && p.a <= b && p.s === 'm').length]).filter((x) => x[2] + x[3] > 0);
    const max = Math.max(...rows.flatMap((x) => [x[2], x[3]])), grown = w.flatMap((v) => v.farms).filter((f) => f.people.slice(2).some((p) => p.a >= ADULT && p.r !== 'servant')).length;
    return `<div class="pyr">${rows.map(([l, a, f, m]) => `<span class="n f">${f}</span><span class="pb l"><i class="${a < ADULT ? 'c' : ''}" style="width:${(f / max) * 100}%"></i></span><span class="lab">${l}</span>
      <span class="pb"><i class="${a < ADULT ? 'c' : ''}" style="width:${(m / max) * 100}%"></i></span><span class="n">${m}</span>`).join('')}</div>
      <div class="key"><span>women to the left, men to the right</span></div><small>${all.length} people. In ${grown} of ${nf} households a child is 18 or more.</small>`;
  }
  const farms = w.flatMap((v) => v.farms.map((f) => ({ ...f, v: v.name }))), rows = [['50 and over', (p) => p.a >= 50], ['18 to 49', (p) => p.a >= ADULT && p.a < 50], ['Under 18', (p) => p.a < ADULT]];
  const dead = key === 'heirs' || key === 'outland';
  return `<div class="gens" style="grid-template-columns:auto repeat(${farms.length}, minmax(0, 1fr))"><span></span>${farms.map((f) => `<span class="fn" title="${esc(f.name)}, ${esc(f.v)}">${esc(f.name)}</span>`).join('')}
    ${dead ? `<span class="lab">Dead, on record</span>${farms.map((f) => `<span class="cell">${f.empty ? '' : '<i class="dot d"></i><i class="dot d"></i>'}</span>`).join('')}` : ''}
    ${rows.map(([l, t]) => `<span class="lab">${l}</span>${farms.map((f) => `<span class="cell${f.empty ? ' none' : ''}">${(f.people || []).filter(t).map(dot).join('')}</span>`).join('')}`).join('')}</div>
    ${keyHTML(false)}<small>${dead ? 'Three generations on record: the founding grandparents are dead.' : 'One generation: no one here has kin on the island yet.'}</small>`;
}

// Lives to try, in three ways. A life is a position; the count is how many hold it as the scenario starts.
function lives(s) {
  const all = worldOf(s.key).flatMap((v) => v.farms.flatMap((f) => f.people || [])), cur = S.life || s.lives[0][0];
  const n = (k) => all.filter((p) => p.r === k || (k === 'holder' && p.r === 'bachelor')).length;
  const list = S.lives === 'ladder' ? [...s.lives].sort((a, b) => RANK.indexOf(a[0]) - RANK.indexOf(b[0])) : s.lives;
  const head = `<h3>Lives to try ${tag('sketch')}</h3>`;
  if (S.lives === 'pills') return `${head}<div class="lives">${list.map(([k, label, sug]) => `<button type="button" data-life="${k}" aria-pressed="${cur === k}">${esc(label)}${sug ? ' · suggested' : ''}</button>`).join('')}</div>`;
  if (S.lives === 'cards') return `${head}<div class="lcards">${list.map(([k, label, sug]) => `<button type="button" class="lcard" data-life="${k}" aria-pressed="${cur === k}">
    ${icon(LIFE_ICON[k])}<b>${esc(label)}</b>${sug ? '<span class="tag built">Suggested</span>' : '<span></span>'}<small>${esc(HARD[k])}</small><small class="n">${n(k)} to choose from</small></button>`).join('')}</div>`;
  const max = Math.max(1, ...list.map((x) => n(x[0])));
  return `${head}<div class="ladder">${list.map(([k, label, sug]) => `<button type="button" class="rung" data-life="${k}" aria-pressed="${cur === k}">
    ${icon(LIFE_ICON[k])}<span><b>${esc(label)}</b>${sug ? ' <span class="tag built">Suggested</span>' : ''}<small>${esc(POS[k].commands[0])}</small></span>
    <span class="cnt"><i style="width:${Math.max(4, (n(k) / max) * 100)}%"></i><small>${n(k)}</small></span></button>`).join('')}</div>
    <small>From the most standing to the least; the bar is how many hold the position as the scenario starts.</small>`;
}

const facts = (s, keys) => `<dl class="facts">${[['Who starts', s.start], ['People', `${s.people(S.size)} on a ${SIZES[S.size].name.toLowerCase()} map`], ['Generations', s.gens],
  ['Land', s.land], ['Stores', s.stores], ['Customs', s.customs]].filter((x) => !keys || keys.includes(x[0])).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
const sizeField = () => `<label for="size">Map size<select id="size">${Object.entries(SIZES).map(([k, v]) => `<option value="${k}"${k === S.size ? ' selected' : ''}>${v.name} (${v.tiles})</option>`).join('')}</select></label>`;
const seedField = () => `<label for="seed">Seed<span class="seedrow"><input id="seed" inputmode="numeric" maxlength="9" value="${S.seed}"><button type="button" id="reroll">Another</button></span></label>`;
const yearHTML = (s) => `<h3>${s.key === 'founders' ? 'The first year' : 'What is waiting'} ${s.status === 'sketch' ? '' : tag(s.key === 'founders' ? 'designed' : 'sketch')}</h3>
  <div class="year">${s.year.map(([a, b]) => `<div><b>${esc(a)}</b>${esc(b)}</div>`).join('')}</div>`;

// Step 1: the scenarios as picture cards; below, the chosen one read off the land, with who starts and the lives to try.
function step1() {
  const s = scen(), pins = PINS[s.key] || [], ins = INSET[s.key];
  $('app').innerHTML = `${headBar('New archipelago')}
    <div class="cards">${SCENARIOS.map((x) => `<button type="button" class="card${x.status === 'sketch' ? ' sk' : ''}" data-sc="${x.key}" aria-pressed="${x === s}">
      <img src="${pic(x.key, PIC[x.key] === 'populous')}" alt=""><b>${esc(x.name)}</b><small>${esc(x.line)}</small><span>${tag(x.status)}</span></button>`).join('')}</div>
    <div class="cgrid">
      <section>
        <figure class="figure${s.status === 'sketch' ? ' sk' : ''}"><img src="${pic(s.key)}" alt="The land as this scenario begins">
          ${pins.map(([x, y, ic, t, left]) => `<span class="pin${left ? ' left' : ''}" style="left:${x}%;top:${y}%">${icon(ic)}<b>${esc(t)}</b></span>`).join('')}
          ${ins ? `<span class="inset"><img src="${ins[0]}" alt=""><small>${icon(ins[1])}${esc(ins[2])}</small></span>` : ''}</figure>
        ${pins.length ? `<ul class="pinlist">${pins.map((x) => `<li>${icon(x[2])}${esc(x[3])}</li>`).join('')}</ul>` : '<small>A stand-in picture: this scenario is a sketch.</small>'}
        ${yearHTML(s)}
        ${facts(s, ['Land', 'Stores', 'Customs'])}
      </section>
      <section><h2>${esc(s.name)} ${tag(s.status)}</h2><p>${esc(s.line)} <span class="muted">${esc(s.explores)}</span></p>
        <h3>Who starts ${tag(s.status === 'sketch' ? 'sketch' : 'built')}</h3>${households(s.key)}
        ${lives(s)}
        <div class="land2">${sizeField()}${seedField()}</div></section>
    </div>
    <div class="foot"><span class="muted">${s.status === 'sketch' ? 'This scenario is a sketch, shown with a stand-in picture and a stand-in world.' : 'You choose the person after the land is raised, from those who live there.'}</span>
      <button type="button" id="back1">Back</button><button type="button" class="primary" id="go">Raise the land</button></div>`;
}

function loading() {
  $('app').innerHTML = `<div class="loading"><h2 id="lt">Raising the land</h2><div class="bar"><i id="lb"></i></div></div>`;
  requestAnimationFrame(() => { $('lb').style.width = '100%'; });
  setTimeout(() => { if ($('lt')) $('lt').textContent = scen().key === 'founders' ? 'Settling the founders' : 'Waking the villages'; }, 450);
  setTimeout(() => {
    S.world = worldOf(S.sc); S.step = 2; S.only = 'all'; S.done = false;
    const want = S.life || scen().lives[0][0], all = pawns().filter((p) => p.a >= ADULT);
    const p = all.find((x) => x.r === want) || all.find((x) => x.r === 'widow' && want === 'widow') || all.find((x) => x.r === 'holder') || all[0];
    S.suggested = (all.find((x) => x.r === scen().lives[0][0]) || all[0]).id; S.pawn = p.id; S.village = p.village; draw();
  }, 1000);
}

const FILTERS = [['all', 'Everyone'], ['holder', 'Holders'], ['heir', 'Heirs'], ['child', 'Younger children'], ['servant', 'Servants']];
const inFilter = (p) => S.only === 'all' || (S.only === 'holder' ? ['holder', 'widow', 'bachelor'].includes(p.r) : S.only === 'heir' ? ['heir', 'heiress'].includes(p.r) : p.r === S.only);

function step2() {
  const v = S.world[S.village], p = pawns().find((x) => x.id === S.pawn), pos = POS[p.r], f = p.farm;
  const living = pawns().length, kin = f.people.filter((x) => x !== p);
  const days = f.food || 0, grown = kin.filter((x) => x.a >= ADULT), next = grown.find((x) => x.r === 'heir' || x.r === 'heiress') || grown[0];
  if (S.done) {
    $('app').innerHTML = `${headBar('Whom to play')}<div class="toast"><b>The game would begin here.</b> The camera glides down to ${esc(f.name)} in ${esc(v.name)}, and you are
      ${esc(p.n)}, ${p.a}, ${esc(pos.name.toLowerCase())}. The world goes on without you; when ${p.s === 'm' ? 'he' : 'she'} dies you go on as an heir, a relative or someone close.</div>
      <div class="foot"><button type="button" id="again">Choose someone else</button><button type="button" id="restart">Start over</button></div>`;
    return;
  }
  $('app').innerHTML = `${headBar('Whom to play')}
  <div class="panes">
    <section>
      <div class="mapform">
        <div style="display:grid;gap:6px"><h2>${esc(scen().name)}</h2>
          <small>Seed ${S.seed}, ${SIZES[S.size].name.toLowerCase()} map. ${living} living in ${S.world.length} village${S.world.length > 1 ? 's' : ''}.</small></div>
        <canvas class="chart" id="chart2" aria-label="The villages on the chart; click one to choose it" style="cursor:pointer"></canvas>
      </div>
      <div class="villages">${S.world.map((x, i) => `<button type="button" data-v="${i}" aria-pressed="${i === S.village}">${esc(x.name)} <small style="color:inherit;opacity:.7">${x.farms.length} farms</small></button>`).join('')}</div>
      <small>${esc(v.note)} ${tag('built')}</small>
      <div class="lives">${FILTERS.map(([k, l]) => `<button type="button" data-only="${k}" aria-pressed="${S.only === k}">${l}</button>`).join('')}</div>
      <div class="scroll">${v.farms.map((fm) => `<div class="farm"><header><b>${esc(fm.name)}</b>${fm.tests ? `<small>${esc(fm.tests)}</small>` : ''}</header>
        ${fm.empty ? `<small>${esc(fm.empty)} No one to play here, but a younger child or a servant may claim it at the moving round.</small>` : fm.people.map((x) => `
          <button type="button" class="pawn${inFilter(x) && x.a >= ADULT ? '' : ' dim'}" data-p="${x.id}" aria-pressed="${x.id === S.pawn}" ${x.a < ADULT ? 'disabled' : ''}>
            ${face(x)}<span>${esc(x.n)}<small>${x.a}, ${esc(POS[x.r].name.toLowerCase())}${x.a < ADULT ? ', too young to play' : ''}</small></span>${x.id === S.suggested ? '<span class="tag built">Suggested</span>' : ''}</button>`).join('')}</div>`).join('')}</div>
    </section>
    <section class="detail">
      <div class="who">${face(p, true)}<div><h2>${esc(p.n)}</h2><span>${p.a}, ${esc(pos.name.toLowerCase())} at ${esc(f.name)}, ${esc(S.world[p.village].name)}</span></div></div>
      ${p.note ? `<p>${esc(p.note)}</p>` : ''}
      <h3>What this position commands ${tag('designed')}</h3>
      <ul class="plain">${pos.commands.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <h3>What lies ahead ${tag('designed')}</h3>
      <ul class="plain">${pos.ahead.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <h3>The household ${tag('built')}</h3>
      <dl class="facts">
        <dt>Under one roof</dt><dd>${kin.length ? kin.map((x) => `${esc(x.n.split(' ')[0])} (${x.a})`).join(', ') : 'No one else'}</dd>
        <dt>Food laid by</dt><dd>${days} days of need${days >= 365 ? ', and seed' : ''}</dd>
        <dt>If ${p.s === 'm' ? 'he' : 'she'} dies</dt><dd>You go on as ${next ? esc(next.n.split(' ')[0]) + (next.r === 'heir' || next.r === 'heiress' ? ', the heir' : '') + ', or another of the household or its kin' : 'any adult, and the chronicle marks the break in the line'}</dd>
      </dl>
      <h3>How hard a life ${tag('sketch')}</h3>
      <p class="muted">${HARD[p.r]}</p>
    </section>
  </div>
  <div class="foot"><span class="muted">You can change your mind later: the pawn panel lets you play any living adult.</span>
    <button type="button" id="back2">Back</button><button type="button" id="watch">Watch without playing</button><button type="button" class="primary" id="play">Play as ${esc(p.n.split(' ')[0])}</button></div>`;
  S.spots = drawChart($('chart2'), S.seed, S.world.length, S.village);
}
function draw() {
  $('app').className = 'sheet ' + (S.step === 1 ? 'c' : 'wide');
  $('stage').className = 'stage far'; $('stage').style.backgroundImage = `url(${pic(S.sc, S.step === 2)})`;
  const sw = (k, label) => `<span>${label}:</span>${VARIANTS[k].map(([v, l]) => `<button type="button" data-var="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${l}</button>`).join('')}`;
  $('mockbar').innerHTML = `<b>Mock</b>${S.step === 1 ? sw('hh', 'Who starts') + sw('lives', 'Lives to try') : '<span>Step 2 keeps one layout for now.</span>'}
    <span class="legend">${tag('built')} in the game ${tag('designed')} in design.md ${tag('sketch')} an idea</span>`;
  if (S.step === 1) step1(); else step2();
}
$('mockbar').addEventListener('click', (e) => { const b = e.target.closest('[data-var]'); if (b) { S[b.dataset.var] = b.dataset.v; draw(); } });

$('app').addEventListener('click', (e) => {
  const b = e.target.closest('button, canvas'); if (!b) return;
  const d = b.dataset;
  if (b.id === 'chart2') {
    const q = b.getBoundingClientRect(), x = (e.clientX - q.left) / q.width, y = (e.clientY - q.top) / q.height;
    let best = 0, bd = 9; S.spots.forEach(([sx, sy], i) => { const dd = Math.hypot(sx - x, sy - y); if (dd < bd) { bd = dd; best = i; } });
    S.village = best; draw(); return;
  }
  if (d.sc) { S.sc = d.sc; S.life = null; }
  else if (d.life) S.life = d.life;
  else if (d.v) S.village = +d.v;
  else if (d.only) S.only = d.only;
  else if (d.p) S.pawn = +d.p;
  else if (b.id === 'reroll') S.seed = (Math.random() * 1e6) | 0;
  else if (b.id === 'go') { loading(); return; }
  else if (b.id === 'back1') return;
  else if (b.id === 'back2' || b.id === 'restart') { S.step = 1; S.done = false; }
  else if (b.id === 'play') S.done = true;
  else if (b.id === 'again') S.done = false;
  else if (b.id === 'watch') { $('app').innerHTML = `${headBar('Whom to play')}<div class="toast"><b>The game would begin with no one played,</b> as it does today after "Not now".</div><div class="foot"><button type="button" id="again">Choose someone</button></div>`; return; }
  else return;
  draw();
});
$('app').addEventListener('change', (e) => {
  if (e.target.id === 'size') S.size = e.target.value;
  else if (e.target.id === 'life') S.life = e.target.value;
  else if (e.target.id === 'seed') S.seed = +String(e.target.value).replace(/\D/g, '').slice(0, 9) || 0;
  else return;
  draw();
});
draw();
</script>
