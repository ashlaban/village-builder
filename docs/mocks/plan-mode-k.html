<!doctype html>
<!-- Mock (18 Nov 2026), plan mode, variation K: J with the flow of replacing an action, as Kim set it. For VB-1123. Throwaway: the
     numbers are invented and nothing here is game code. The icons' paths are copied from src/page/icons.js and the meter from
     src/page/meter.js; new glyphs as in J, and a jar (pottery).
     The case: Märta is given pottery in place of her raking. Two frames of one screen, ?step=1 (the default) and ?step=2.
     The rules drawn:
     1. A click on an action's bar selects it (the dark frame; its tiles are ringed on the map). With a bar selected, the action
        chosen next takes its place. Frame 1: "Rake meadows" is selected, the house is clicked, and its menu says what it replaces.
     2. A selected bar has a delete button at its corner; Backspace or Delete does the same.
     3. Taking an action away moves the estimates, and it shows on the head's estimate of the outcome. Frame 2: with no one
        raking, the hay's bar has lost a part (drawn hatched red, where it stood before), its poor year's pointer has moved back,
        and the row is marked as changed; the meadows carry a problem's mark.
     4. A member's bar shows where more would fit: the free stretch is a dashed box with the days of work it holds.
     5. An action whose needs are not met can still be placed, and warns: pottery with no clay in store has the red mark in the
        menu, with what is missing and where it is got, and after it is placed on its bar and on the house.
     Also changed from J: no action is in hand for a tile, so the fertility overlay is off and the map is at rest; the day's
     pointer is gone, since a new action goes to the bar selected or to the first free stretch.
     Same household (Norrgården, year 3, spring: Torsten 32 and Märta 29, four fields, six meadows; Karin, hired at the moving
     round, comes on the first day of summer). Drawn for 1440 by 900. -->

  lg(`<span class="sw" style="background:rgba(47,122,75,.08);border:2px dashed var(--good)"></span>`, 'room for more work') +
  lg(`<span class="sw" style="background:repeating-linear-gradient(-45deg,rgba(168,67,47,.75) 0 2.5px,rgba(255,255,255,.7) 2.5px 5px)"></span>`, 'lost by the last change') +
  lg(est(15), 'an estimate, the head’s') +
  lg(`<span class="sw" style="background:rgba(8,18,22,.5)"></span>`, 'dimmed: not the farm’s land');
const key = document.getElementById('keyBtn'), legend = document.getElementById('legend');
const showKey = (on) => { legend.hidden = !on; key.setAttribute('aria-pressed', String(on)); };
key.addEventListener('click', () => showKey(legend.hidden));
// ---- draw ----
document.body.className = 'mine';
const M = mapHTML();
document.getElementById('map').innerHTML = M.svg;
document.getElementById('chips').innerHTML = M.chips;
document.getElementById('menu').innerHTML = menu();
document.getElementById('rgt').innerHTML = `<h2>${ic('sack', 15)}To get through the year</h2>${needsHTML()}<h2>${seasonIc(3)}What came of the winter’s plan</h2>${lastHTML()}`;
document.getElementById('strip').innerHTML = `<div></div>` +
  `<div class="hdr">${tl(`<div class="d12">${Array.from({ length: 12 }, (_, k) => `<span>${k + 1}</span>`).join('')}</div>`, `<div class="s3">${[1, 2, 3].map((q) => `<span>${seasonIc(q)}</span>`).join('')}</div>`)}</div>` +
  member('t') + member('m') +
  `<div class="mhw kn"><div class="mh kn" data-tip="Hired at the moving round; comes on the first day of summer">${face('k')}<b class="n">Karin</b><span class="muted">14</span><small>comes in summer</small></div>${pills('k')}</div>` +
  `<div class="row kn">${tl('<div class="lane ghost" style="height:26px"></div>', ahead('k'))}</div>`;
showKey(new URLSearchParams(location.search).get('legend') === '1');
// toggles change nothing else's place: the key and the breakdown lie over the map, a problem's mark has its slot whether shown or not
const foodI = document.getElementById('foodI'), brk = document.getElementById('brk');
foodI.addEventListener('click', () => { brk.hidden = !brk.hidden; foodI.setAttribute('aria-expanded', String(!brk.hidden)); });
// a click on a member opens the card; ?pawn=1 draws Märta's, with the tile's menu shut
const card = document.getElementById('card'), showCard = (m) => { card.innerHTML = m ? cardHTML(m) : ''; document.getElementById('menu').hidden = !!m; };
document.addEventListener('click', (e) => { const p = e.target.closest('[data-pawn]'); if (p) showCard(card.innerHTML ? null : 'm'); });
if (new URLSearchParams(location.search).get('pawn') === '1') showCard('m');
foodI.click(); // the breakdown is shut in these frames; the i opens it
if (false) { foodI.click(); document.querySelectorAll('.bang').forEach((b) => (b.style.visibility = 'hidden')); }
</script>
